<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Direktmix · Küchenstudio</title><style>body{margin:0;font:16px/1.5 Arial,sans-serif;background:#fff;color:#132238}.loading{width:min(90%,750px);margin:15vh auto;padding:26px;border:1px solid #dbe5e9;border-radius:18px}</style></head><body><div class="loading" id="loading"><strong>Direktmix</strong><p>Die Gesprächsinhalte werden geladen …</p></div><script>
(async()=>{try{const path='../../merchant-kompass/';const response=await fetch(path+'hotel-direktmix-inhalt-basis.html',{cache:'no-store'});if(!response.ok)throw Error('Inhalte nicht erreichbar.');const doc=new DOMParser().parseFromString(await response.text(),'text/html');const sections=doc.querySelectorAll('.wrap > section.card.section');if(sections.length!==7||!doc.querySelector('#totalRevenue')||!doc.querySelector('#leverTotal'))throw Error('Gesprächsinhalte unvollständig.');doc.querySelector('.top')?.remove();doc.querySelector('#totalPdfAnchor')?.remove();doc.querySelectorAll('.actions,#embeddedPdfMount,script[src]').forEach(s=>s.remove());const base=doc.createElement('base');base.href=new URL(path,location.href).href;doc.head.prepend(base);doc.title='Direktmix · Küchenstudio';
const sync=doc.createElement('script');sync.textContent=`(()=>{'use strict';let observer;function done(){if(!document.getElementById('kitchenChannelMix'))return;observer?.disconnect();const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let node;while((node=walker.nextNode())){if(/^(SCRIPT|STYLE)$/.test(node.parentElement?.tagName||'')||node.parentElement?.closest('[hidden]'))continue;node.nodeValue=node.nodeValue.replace(/OTA-Provisionen/g,'Vermittlungskosten').replace(/OTA-Provision/g,'Vermittlungskosten').replace(/OTA/g,'Vertriebspartner').replace(/Booking\\.com/g,'externe Anbieter');}document.getElementById('guestAccesses')?.dispatchEvent(new Event('input',{bubbles:true}));document.getElementById('offerValue')?.dispatchEvent(new Event('input',{bubbles:true}));}function init(){observer=new MutationObserver(done);observer.observe(document.body,{subtree:true,childList:true});done()}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();})();`;doc.body.appendChild(sync);
document.open();document.write('<!doctype html>\n'+doc.documentElement.outerHTML);document.close();}catch(error){document.getElementById('loading').innerHTML='<strong>Direktmix konnte nicht geladen werden.</strong><p>Bitte die Seite erneut öffnen.</p>';console.error('[Küchenstudio Direktmix]',error)}})();
</script></body></html>
