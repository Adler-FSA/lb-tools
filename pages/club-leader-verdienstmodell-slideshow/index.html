<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#132238">
<title>ClubLeader · Teil 2 · Verdienstmodell & Tragfähigkeit | LiquidityBooster</title>
<meta name="description" content="ClubLeader-Präsentation mit umschaltbaren Beispielmixen Einstieg, Ausbau und Top für BusinessBooster und Unternehmer-Hörsaal.">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#edf3f5}
iframe{display:block;width:100%;height:100%;border:0;background:#edf3f5}
</style>
</head>
<body>
<iframe id="deck" title="ClubLeader Verdienstmodell und Tragfähigkeit" allow="fullscreen"></iframe>
<script>
(function(){
  const deck=document.getElementById('deck');
  const initialHash=location.hash||'#1';
  deck.src='presentation-base.html'+initialHash;

  const scenarios={
    entry:{
      label:'Einstieg',
      bbName:'2 × BusinessBooster Small',bbInfo:'499 € netto / Monat · 499 € Setup',
      hallName:'2 × Unternehmer-Hörsaal Basis',hallInfo:'399 € netto / Monat · 990 € Setup',
      monthly:'359,20 €',setup:'595,60 €',
      m3:'1.673,20 €',m3Run:'1.077,60 €',
      m6:'2.750,80 €',m6Run:'2.155,20 €',
      m9:'3.828,40 €',m9Run:'3.232,80 €',
      m12:'4.906,00 €',m12Run:'4.310,40 €',
      y1:'4.310,40 €',y2:'8.620,80 €',y3:'12.931,20 €',
      e1:'359,20 €',e2:'269,40 €',e3:'179,60 €',levelsTotal:'808,20 €',levels12:'9.698,40 €',
      setupLevels:'1.340,10 €',setupParts:'595,60 € aus E1 + 446,70 € aus E2 + 297,80 € aus E3'
    },
    growth:{
      label:'Ausbau',
      bbName:'2 × BusinessBooster Premium',bbInfo:'999 € netto / Monat · 999 € Setup',
      hallName:'2 × Unternehmer-Hörsaal Plus',hallInfo:'649 € netto / Monat · 1.490 € Setup',
      monthly:'659,20 €',setup:'995,60 €',
      m3:'2.973,20 €',m3Run:'1.977,60 €',
      m6:'4.950,80 €',m6Run:'3.955,20 €',
      m9:'6.928,40 €',m9Run:'5.932,80 €',
      m12:'8.906,00 €',m12Run:'7.910,40 €',
      y1:'7.910,40 €',y2:'15.820,80 €',y3:'23.731,20 €',
      e1:'659,20 €',e2:'494,40 €',e3:'329,60 €',levelsTotal:'1.483,20 €',levels12:'17.798,40 €',
      setupLevels:'2.240,10 €',setupParts:'995,60 € aus E1 + 746,70 € aus E2 + 497,80 € aus E3'
    },
    top:{
      label:'Top',
      bbName:'2 × BusinessBooster Enterprise',bbInfo:'1.999 € netto / Monat · 1.999 € Setup',
      hallName:'2 × Unternehmer-Hörsaal Pro',hallInfo:'899 € netto / Monat · 1.990 € Setup',
      monthly:'1.159,20 €',setup:'1.595,60 €',
      m3:'5.073,20 €',m3Run:'3.477,60 €',
      m6:'8.550,80 €',m6Run:'6.955,20 €',
      m9:'12.028,40 €',m9Run:'10.432,80 €',
      m12:'15.506,00 €',m12Run:'13.910,40 €',
      y1:'13.910,40 €',y2:'27.820,80 €',y3:'41.731,20 €',
      e1:'1.159,20 €',e2:'869,40 €',e3:'579,60 €',levelsTotal:'2.608,20 €',levels12:'31.298,40 €',
      setupLevels:'3.590,10 €',setupParts:'1.595,60 € aus E1 + 1.196,70 € aus E2 + 797,80 € aus E3'
    }
  };
  let currentScenario='entry';

  function qs(doc,title){return doc.querySelector('.slide[data-title="'+title+'"]')}
  function setText(el,text){if(el)el.textContent=text}
  function setHTML(el,html){if(el)el.innerHTML=html}

  function inject(doc){
    if(doc.getElementById('scenarioChooser')) return;
    const style=doc.createElement('style');
    style.textContent=`
      .scenarioChooser{position:absolute;top:18px;left:50%;transform:translateX(-50%);z-index:75;display:none;align-items:center;gap:6px;padding:6px;background:rgba(255,255,255,.96);border:1px solid #dce8ec;border-radius:999px;box-shadow:0 8px 24px rgba(19,34,56,.12);backdrop-filter:blur(8px)}
      .scenarioChooser .scLabel{padding:0 7px 0 9px;color:#687789;font-size:9px;font-weight:950;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
      .scenarioChooser button{border:1px solid transparent;background:#f4f8f9;color:#132238;border-radius:999px;padding:7px 11px;font-size:10px;font-weight:950;cursor:pointer;white-space:nowrap}
      .scenarioChooser button.active{background:#132238;color:#fff;box-shadow:0 3px 10px rgba(19,34,56,.18)}
      .scenarioChooser button[data-scenario="growth"].active{background:#00a7ad}
      .scenarioChooser button[data-scenario="top"].active{background:#c6006f}
      @media(max-width:760px){.scenarioChooser{top:11px;padding:4px;gap:3px}.scenarioChooser .scLabel{display:none}.scenarioChooser button{padding:6px 8px;font-size:8px}}
    `;
    doc.head.appendChild(style);
    const chooser=doc.createElement('div');
    chooser.id='scenarioChooser';chooser.className='scenarioChooser';
    chooser.innerHTML='<span class="scLabel">Beispielmix</span><button type="button" data-scenario="entry">Einstieg</button><button type="button" data-scenario="growth">Ausbau</button><button type="button" data-scenario="top">Top</button>';
    doc.getElementById('stage').appendChild(chooser);
    chooser.addEventListener('click',e=>{const b=e.target.closest('button[data-scenario]');if(!b)return;currentScenario=b.dataset.scenario;applyScenario(doc)});

    const slide3=qs(doc,'Das Ziel: ein Kunde pro Woche');
    if(slide3){const lead=slide3.querySelector('.lead');setText(lead,'Für die Euro-Beispiele kannst du zwischen drei festen 2+2-Szenarien wechseln. Die Aktivität bleibt gleich – nur der Produktmix verändert sich.');}

    function visibility(){
      const active=doc.querySelector('.slide.active');
      const relevant=active&&['Das Ziel: ein Kunde pro Woche','Was vier Kunden monatlich bewirken','Jahr 2 beginnt nicht bei null','Wenn drei Ebenen aktiv arbeiten'].includes(active.dataset.title);
      chooser.style.display=relevant?'flex':'none';
    }
    new MutationObserver(visibility).observe(doc.getElementById('stage'),{subtree:true,attributes:true,attributeFilter:['class']});
    visibility();applyScenario(doc);
  }

  function applyScenario(doc){
    const d=scenarios[currentScenario];
    doc.querySelectorAll('#scenarioChooser button').forEach(b=>{const active=b.dataset.scenario===currentScenario;b.classList.toggle('active',active);b.setAttribute('aria-pressed',active?'true':'false')});

    const s3=qs(doc,'Das Ziel: ein Kunde pro Woche');
    if(s3){
      setText(s3.querySelector('.mixCard.mint strong'),d.bbName);setText(s3.querySelector('.mixCard.mint span'),d.bbInfo);
      setText(s3.querySelector('.mixCard.mag strong'),d.hallName);setText(s3.querySelector('.mixCard.mag span'),d.hallInfo);
      const dis=s3.querySelector('.disclaimer');setText(dis,'Gewähltes Szenario: '+d.label+'. Feste Modellannahme: vier neue Kunden pro Monat, alle bestehenden Fullservice-Verträge werden jährlich fortgeführt. Preise und Vergütungen gemäß dem dargestellten Modell; maßgeblich bleiben die jeweils aktuellen Leistungs- und Vertragsunterlagen.');
    }

    const s4=qs(doc,'Was vier Kunden monatlich bewirken');
    if(s4){
      const boxes=s4.querySelectorAll('.moneyBox');setText(boxes[0]?.querySelector('b'),d.monthly);setText(boxes[1]?.querySelector('b'),d.setup);
      if(boxes[0])setText(boxes[0].querySelector('span'),d.bbName.replace('2 × ','')+' + '+d.hallName.replace('2 × ','')+' · direkte Ebene 1 mit 20 %');
      const pts=s4.querySelectorAll('.moneyPoint');
      const vals=[[d.m3,d.m3Run],[d.m6,d.m6Run],[d.m9,d.m9Run],[d.m12,d.m12Run]];
      pts.forEach((p,i)=>{setText(p.querySelector('strong'),vals[i][0]);setText(p.querySelector('span'),vals[i][1]+' laufend + '+d.setup+' neue Setups')});
      setText(s4.querySelector('.disclaimer'),'Beispielrechnung · Szenario '+d.label+'. Vier neue Kunden pro Monat im festen 2+2-Produktmix. Keine Einkommenszusage; alle Werte setzen vollständig bezahlte, provisionsfähige und wirksam zugeordnete Umsätze voraus.');
    }

    const s5=qs(doc,'Jahr 2 beginnt nicht bei null');
    if(s5){
      const years=s5.querySelectorAll('.year em');[d.y1,d.y2,d.y3].forEach((v,i)=>setText(years[i],v+' laufende Monatsbasis'));
      setText(s5.querySelector('.statement'),'Monat 13 ist der Wendepunkt: Max startet nicht wieder bei null, sondern mit 48 aufgebauten Kunden und '+d.y1+' rechnerischer laufender Monatsbasis im Szenario '+d.label+'.');
      setText(s5.querySelector('.disclaimer'),'Die Beträge zeigen ausschließlich die laufende Ebene-1-Provision des aktuell gewählten 2+2-Beispielmixes '+d.label+'. Setup-Provisionen sind hier bewusst nicht enthalten. Die jährliche Verlängerung aller Verträge ist eine feste Modellannahme, keine Garantie über reales Kundenverhalten.');
    }

    const s7=qs(doc,'Wenn drei Ebenen aktiv arbeiten');
    if(s7){
      const levels=s7.querySelectorAll('.levelCard strong');[d.e1,d.e2,d.e3].forEach((v,i)=>setText(levels[i],v));
      setText(s7.querySelector('.totalLine strong'),d.levelsTotal+' / Monat');
      const nums=s7.querySelectorAll('.number');
      if(nums[0])setHTML(nums[0],d.levels12+'<small>rechnerische laufende Monatsbasis für Max</small>');
      if(nums[1])setHTML(nums[1],d.setupLevels+'<small>Setup-Provision aus den drei Ebenen</small>');
      const cards=s7.querySelectorAll('.grid.two .card');if(cards[1])setText(cards[1].querySelector('p'),d.setupParts+'. Setup bleibt einmalig und wird nicht in den laufenden Bestand eingerechnet.');
      setText(s7.querySelector('.disclaimer'),'Vereinfachtes Parallelmodell · Szenario '+d.label+'. Es setzt voraus, dass alle drei Ebenen bereits aktiv sind, denselben 2+2-Beispielmix erzeugen und die Umsätze provisionsfähig sowie vollständig bezahlt sind. Keine Einkommensprognose.');
    }
  }

  deck.addEventListener('load',()=>{
    try{inject(deck.contentDocument);}catch(e){console.error(e)}
  });

  setInterval(()=>{
    try{
      const h=deck.contentWindow.location.hash||'#1';
      if(h!==location.hash) history.replaceState(null,'',h);
    }catch(_){ }
  },250);
})();
</script>
</body>
</html>
