<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mission Dorade – Best of Week</title><style>:root{--navy:#132238;--mint:#00a7ad;--magenta:#c6006f;--line:#dfe5ea;--soft:#f5f7f9;--muted:#667085}*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#1f2937;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{padding:18px}.wrap{max-width:1100px;margin:auto}.hero,.card,.winners{border:1px solid var(--line);border-radius:20px;background:#fff}.hero{padding:24px}.eyebrow{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mint)}h1{margin:6px 0;color:var(--navy);font-size:clamp(30px,5vw,54px)}.sub,small{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.stat{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--soft)}.stat b{display:block;font-size:28px;color:var(--navy)}.jackpot b{color:var(--magenta)}.grid{display:grid;grid-template-columns:1.45fr .75fr;gap:16px;margin-top:16px}.card h2{margin:0;padding:18px 20px;border-bottom:1px solid var(--line);font-size:19px;color:var(--navy)}.list,.rank{padding:8px 16px 16px}.row{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;padding:14px 4px;border-bottom:1px solid #edf1f4}.person strong,.sponsor strong{display:block;color:var(--navy)}.arrow{color:var(--mint);font-size:22px}.rankrow{display:flex;gap:10px;align-items:center;padding:12px 4px;border-bottom:1px solid #edf1f4}.ranknum{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:#fff;font-weight:800}.rankname{flex:1}.rankcount{font-weight:800;color:var(--mint)}.empty{padding:25px;text-align:center;color:var(--muted)}.winners{display:none;margin-top:16px;padding:18px}.winners.show{display:block}.winnergrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.winner{padding:14px;border:1px solid var(--line);border-radius:14px}.winner b{display:block;color:var(--navy)}.foot{text-align:right;color:var(--muted);font-size:12px;margin-top:12px}@media(max-width:780px){.stats,.grid,.winnergrid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><section class="hero"><div class="eyebrow">Mission Dorade</div><h1>Best of Week</h1><p class="sub">Unsere neuen Club Partner und die Menschen, die sie mitgebracht haben.</p><div class="stats"><div class="stat"><span>Neue Club Partner diese Woche</span><b id="weekCount">0</b></div><div class="stat"><span>Neue Club Partner diesen Monat</span><b id="monthCount">0</b></div><div class="stat jackpot"><span>Aktueller Monats-Jackpot</span><b id="jackpot">0,00 €</b></div></div></section><div class="grid"><section class="card"><h2>Neu dabei – diese Woche</h2><div class="list" id="weekList"></div></section><section class="card"><h2>Monats-Rangliste</h2><div class="rank" id="ranking"></div></section></div><section class="winners" id="winners"><h3>Jackpot-Gewinner</h3><div class="winnergrid"><div class="winner"><small>Platz 1 · 66 %</small><b id="winner1">–</b><div id="share1"></div></div><div class="winner"><small>Platz 2 · 34 %</small><b id="winner2">–</b><div id="share2"></div></div></div></section><div class="foot" id="updated"></div></div><script>const DATA_URL='/data/mission-dorade.json';let state={entries:[],winners:{}};const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function name(e,p=''){const f=p?e[p+'FirstName']:e.firstName,l=p?e[p+'LastName']:e.lastName;return [f,l].filter(Boolean).join(' ')}function mk(d=new Date()){return d.toISOString().slice(0,7)}function weekStart(){const x=new Date();x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}function money(v){return new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(v)}function render(){const now=new Date(),month=mk(now),ws=weekStart(),all=[...(state.entries||[])].filter(e=>e?.createdAt).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)),me=all.filter(e=>e.createdAt.slice(0,7)===month),we=all.filter(e=>new Date(e.createdAt)>=ws&&new Date(e.createdAt)<=now);$('#weekCount').textContent=we.length;$('#monthCount').textContent=me.length;$('#jackpot').textContent=money(me.length*10);$('#weekList').innerHTML=we.length?we.map(e=>`<div class="row"><div class="person"><small>Neuer Club Partner</small><strong>${esc(name(e))}</strong><small>${new Date(e.createdAt).toLocaleDateString('de-DE')}</small></div><div class="arrow">→</div><div class="sponsor"><small>gebracht von</small><strong>${esc(name(e,'sponsor'))}</strong></div></div>`).join(''):'<div class="empty">Noch keine Einträge in dieser Woche.</div>';const c=new Map;me.forEach(e=>{const n=name(e,'sponsor');if(n)c.set(n,(c.get(n)||0)+1)});const r=[...c].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));$('#ranking').innerHTML=r.length?r.map(([n,v],i)=>`<div class="rankrow"><span class="ranknum">${i+1}</span><span class="rankname">${esc(n)}</span><span class="rankcount">${v}</span></div>`).join(''):'<div class="empty">Noch keine Monatswertung.</div>';const w=state.winners?.[month];if(w?.place1&&w?.place2){$('#winners').classList.add('show');$('#winner1').textContent=w.place1;$('#winner2').textContent=w.place2;const j=Number(w.jackpot??me.length*10);$('#share1').textContent=money(j*.66);$('#share2').textContent=money(j*.34)}else $('#winners').classList.remove('show');$('#updated').textContent='Stand: '+new Date().toLocaleString('de-DE')}async function load(){const r=await fetch(DATA_URL+'?v='+Date.now(),{cache:'no-store'});if(r.ok){state=await r.json();render()}}load();setInterval(load,60000);</script></body></html>
