<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hall of Fame</title>
<style>
:root{--navy:#132238;--mint:#00a7ad;--magenta:#c6006f;--gold:#bd8b18;--silver:#8296a6;--line:#dfe5ea}
*{box-sizing:border-box}html,body{margin:0;background:#5b6570;color:var(--navy);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{padding:24px}.wrap{position:relative;max-width:1180px;margin:auto;border:10px solid #e4d2a4;background:#f7f2e7;box-shadow:0 0 0 2px #9b711f,0 0 0 15px #f6ead0,0 0 0 17px #b5892e,0 35px 100px rgba(19,34,56,.4);isolation:isolate;overflow:hidden}.wall{position:absolute;inset:0;width:100%;height:100%;z-index:-2}.shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.52) 22%,rgba(247,242,231,.82))}.topbar{display:flex;justify-content:space-between;gap:12px;padding:18px 24px}.back,.yearBtn{display:inline-flex;align-items:center;border:1px solid rgba(19,34,56,.16);border-radius:999px;background:rgba(255,255,255,.9);color:var(--navy);padding:10px 15px;text-decoration:none;font-weight:800}.years{display:flex;gap:7px;flex-wrap:wrap}.yearBtn{padding:8px 13px}.yearBtn.active{background:var(--navy);color:#fff}.hero{position:relative;margin:0 28px 20px;padding:28px 50px;text-align:center;border:1px solid #c99b2d;border-radius:16px;background:linear-gradient(145deg,rgba(255,255,255,.97),rgba(251,244,225,.95));box-shadow:0 16px 34px rgba(88,62,12,.14)}.hero:before{content:'';position:absolute;inset:11px 17px;border:1px solid rgba(201,155,45,.26);border-radius:11px}.seal{position:relative;width:72px;height:72px;margin:auto}.kicker{position:relative;color:#8c6007;text-transform:uppercase;letter-spacing:.27em;font-size:11px;font-weight:900}.hero h1{position:relative;font:700 clamp(36px,5vw,58px) Georgia,serif;margin:7px 0;color:var(--navy)}.accent{position:relative;width:140px;height:4px;margin:14px auto 0;border-radius:999px;background:linear-gradient(90deg,var(--mint),#d3a536,var(--magenta))}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;padding:0 28px 25px}.stat{border:1px solid rgba(19,34,56,.12);border-radius:14px;background:rgba(255,255,255,.82);padding:13px;text-align:center;box-shadow:0 9px 24px rgba(19,34,56,.09)}.stat span{display:block;color:#667085;font-size:11px}.stat b{display:block;font-size:23px;margin-top:3px}.gallery{position:relative;margin:18px;padding:24px;border:1px solid rgba(19,34,56,.12);border-radius:20px;box-shadow:0 18px 38px rgba(19,34,56,.11)}.gallery.gold{background:linear-gradient(145deg,rgba(255,249,230,.96),rgba(255,255,255,.93));border-top:5px solid #d7a729}.gallery.silver{background:linear-gradient(145deg,rgba(239,250,250,.97),rgba(255,255,255,.94));border-top:5px solid var(--mint)}.gallery.gold:before,.gallery.silver:before{content:'';position:absolute;left:18px;right:18px;top:-5px;height:5px}.gallery.gold:before{background:linear-gradient(90deg,#d7a729,transparent 35%,var(--magenta))}.gallery.silver:before{background:linear-gradient(90deg,var(--mint),transparent 45%,#b9c6d2)}.galleryHead{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:17px}.galleryHead h2{margin:0;font:700 30px Georgia,serif}.galleryHead span{font-size:12px;color:#667085}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{position:relative;overflow:hidden;min-height:230px;border-radius:18px;padding:18px;text-align:center;background:linear-gradient(145deg,#fff,#f2f5f7);box-shadow:0 13px 28px rgba(19,34,56,.13)}.card.gold{border:1px solid #d3a337}.card.silver{border:1px solid #9db2c1}.card:after{content:'';position:absolute;width:120px;height:120px;border-radius:50%;right:-45px;top:-55px;background:linear-gradient(135deg,rgba(0,167,173,.12),rgba(198,0,111,.08))}.medal{position:relative;width:48px;height:48px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;font:bold 25px Georgia,serif}.gold .medal{background:linear-gradient(145deg,#ffe7a0,#a76a08);color:#493000;border:2px solid #f6d273}.silver .medal{background:linear-gradient(145deg,#fff,#8393a4);color:#263746;border:2px solid #edf4fa}.month{position:relative;text-transform:uppercase;letter-spacing:.12em;font-size:10px;font-weight:900;color:#687589}.card h3{position:relative;font:700 23px Georgia,serif;margin:8px 0 4px}.result{position:relative;font-size:12px;color:#667085}.payout{position:relative;font-size:25px;font-weight:900;margin-top:12px}.gold .payout{color:#a06d00}.silver .payout{color:#16747a}.empty{grid-column:1/-1;border:1px dashed rgba(19,34,56,.22);border-radius:16px;padding:34px;text-align:center;color:#667085;background:rgba(255,255,255,.6)}.annual{margin:18px;padding:27px;border:1px solid rgba(0,167,173,.23);border-radius:20px;background:linear-gradient(135deg,rgba(255,255,255,.96),rgba(242,250,250,.95));box-shadow:0 18px 38px rgba(19,34,56,.1)}.annual h2{text-align:center;font:700 30px Georgia,serif;margin:0 0 18px}.annualGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.annualCard{border:1px solid rgba(19,34,56,.12);border-radius:16px;background:#fff;padding:16px;box-shadow:0 10px 24px rgba(19,34,56,.09)}.annualCard strong{font:700 20px Georgia,serif}.annualMeta{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.annualMeta span{border-radius:10px;background:#eef7f7;padding:9px 5px;text-align:center;color:#4c5b6d;font-size:11px}.annualMeta b{display:block;color:#008d94;font-size:17px}.annualCard .payout{color:#a06d00;font-size:21px}.status{text-align:center;padding:20px;color:#667085}@media(max-width:850px){body{padding:13px}.wrap{border-width:6px}.stats{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{margin:0 14px 18px;padding:26px 20px}.gallery,.annual{margin:11px;padding:20px 15px}.galleryHead{align-items:start;flex-direction:column;gap:4px}}@media(max-width:540px){.cards{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.topbar{padding:14px;flex-direction:column}.yearBtn{justify-content:center}.galleryHead h2{font-size:25px}}
</style>
</head>
<body>
<main class="wrap">
<svg class="wall" viewBox="0 0 1200 1700" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><pattern id="stone" width="180" height="78" patternUnits="userSpaceOnUse"><rect width="180" height="78" fill="#ded8cb"/><path d="M0 1h180M0 77h180M90 1v76" stroke="#bcb3a3" stroke-width="2"/><path d="M2 5h174v68H2z" fill="none" stroke="#f5f0e8" stroke-width="2" opacity=".75"/></pattern><radialGradient id="light"><stop stop-color="#fff" stop-opacity=".92"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="1700" fill="url(#stone)"/><ellipse cx="600" cy="190" rx="520" ry="350" fill="url(#light)"/></svg><div class="shade"></div>
<nav class="topbar"><a class="back" href="index.html">Zurück zu Best of Week</a><div class="years" id="years"></div></nav>
<header class="hero"><svg class="seal" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="#fffaf0" stroke="#c99b2d" stroke-width="5"/><circle cx="50" cy="50" r="37" fill="none" stroke="#00a7ad" stroke-width="2"/><path d="M37 31h26v34H37z" fill="#132238"/><path d="M42 37h16M42 44h16M42 51h11" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M50 65v10" stroke="#c6006f" stroke-width="3"/></svg><div class="kicker">Jahresarchiv</div><h1 id="title">Hall of Fame</h1><div class="accent"></div></header>
<section class="stats"><div class="stat"><span>Neue Club Partner</span><b id="partners">0</b></div><div class="stat"><span>Gold-Auszeichnungen</span><b id="goldCount">0</b></div><div class="stat"><span>Silber-Auszeichnungen</span><b id="silverCount">0</b></div><div class="stat"><span>Jackpot ausgeschüttet</span><b id="jackpot">0,00 €</b></div></section>
<section class="gallery gold"><div class="galleryHead"><h2>Platz 1 · Gold-Galerie</h2><span>Alle Erstplatzierten des Jahres</span></div><div class="cards" id="gold"></div></section>
<section class="gallery silver"><div class="galleryHead"><h2>Platz 2 · Silber-Galerie</h2><span>Alle Zweitplatzierten des Jahres</span></div><div class="cards" id="silver"></div></section>
<section class="annual"><h2 id="annualTitle">Jahresbilanz</h2><div class="annualGrid" id="annual"></div></section>
<div class="status" id="updated"></div>
</main>
<script>
const DATA_URL='https://raw.githubusercontent.com/Adler-FSA/lb-tools/main/data/mission-dorade.json';let state={entries:[],winners:{}};const $=s=>document.querySelector(s),arr=v=>Array.isArray(v)?v:(v?[v]:[]),money=v=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(v),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function monthName(key){const [y,m]=key.split('-').map(Number);return new Intl.DateTimeFormat('de-DE',{month:'long'}).format(new Date(y,m-1,15))}function availableYears(){const ys=new Set(Object.entries(state.winners||{}).filter(([,w])=>w?.published===true).map(([k])=>Number(k.slice(0,4))));if(!ys.size)ys.add(new Date().getFullYear());return [...ys].sort((a,b)=>b-a)}function selectedYear(){const q=Number(new URLSearchParams(location.search).get('year'));const ys=availableYears();return ys.includes(q)?q:ys[0]}function records(year){return Object.entries(state.winners||{}).filter(([k,w])=>k.startsWith(year+'-')&&w?.published===true&&arr(w.place1).length).sort((a,b)=>a[0].localeCompare(b[0]))}function card(x,place){return '<article class="card '+(place===1?'gold':'silver')+'"><span class="medal">'+place+'</span><div class="month">'+monthName(x.month)+' '+x.year+'</div><h3>'+esc(x.name)+'</h3><div class="result">'+x.count+' neue Club Partner</div><div class="payout">'+money(x.payout)+'</div></article>'}function render(){const year=selectedYear(),rs=records(year),gold=[],silver=[],people=new Map;let jackpot=0;for(const [month,w] of rs){const firsts=arr(w.place1),seconds=arr(w.place2),j=Number(w.jackpot||0),fp=firsts.length?j*(seconds.length?.66:1)/firsts.length:0,sp=seconds.length?j*.34/seconds.length:0;jackpot+=j;firsts.forEach(name=>{gold.push({month,year,name,count:Number(w.firstCount||0),payout:fp});const p=people.get(name)||{name,gold:0,silver:0,count:0,payout:0};p.gold++;p.count+=Number(w.firstCount||0);p.payout+=fp;people.set(name,p)});seconds.forEach(name=>{silver.push({month,year,name,count:Number(w.secondCount||0),payout:sp});const p=people.get(name)||{name,gold:0,silver:0,count:0,payout:0};p.silver++;p.count+=Number(w.secondCount||0);p.payout+=sp;people.set(name,p)})}const released=new Set(rs.map(x=>x[0]));$('#title').textContent='Hall of Fame '+year;$('#annualTitle').textContent='Jahresbilanz '+year;$('#partners').textContent=(state.entries||[]).filter(e=>released.has(e.createdAt?.slice(0,7))).length;$('#goldCount').textContent=gold.length;$('#silverCount').textContent=silver.length;$('#jackpot').textContent=money(jackpot);$('#years').innerHTML=availableYears().map(y=>'<a class="yearBtn '+(y===year?'active':'')+'" href="?year='+y+'">'+y+'</a>').join('');$('#gold').innerHTML=gold.length?gold.map(x=>card(x,1)).join(''):'<div class="empty">Noch keine Gold-Auszeichnungen.</div>';$('#silver').innerHTML=silver.length?silver.map(x=>card(x,2)).join(''):'<div class="empty">Noch keine Silber-Auszeichnungen.</div>';const list=[...people.values()].sort((a,b)=>b.count-a.count||b.gold-a.gold||a.name.localeCompare(b.name));$('#annual').innerHTML=list.length?list.map(x=>'<article class="annualCard"><strong>'+esc(x.name)+'</strong><div class="annualMeta"><span><b>'+x.gold+'×</b>Gold</span><span><b>'+x.silver+'×</b>Silber</span><span><b>'+x.count+'</b>Club Partner</span></div><div class="payout">'+money(x.payout)+' Jackpot</div></article>').join(''):'<div class="empty">Die Jahresbilanz beginnt mit dem ersten Monatsabschluss.</div>';$('#updated').textContent='Stand: '+new Date().toLocaleString('de-DE')}async function load(){const r=await fetch(DATA_URL+'?v='+Date.now(),{cache:'no-store'});if(r.ok){state=await r.json();render()}}load();setInterval(load,60000);
</script>
</body>
</html>
