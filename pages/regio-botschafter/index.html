 's4.k':'DIE EIGENE MEDIENWELT','s4.h':'Sie führen das Magazin. Die Grundlage ist schon da.','s4.lead':'Ein eigener digitaler Medienauftritt mit Werkzeugen für redaktionelle Inhalte, Präsentation und Weiterentwicklung – ergänzt durch Einarbeitung in das System.','s4.f1h':'Eigenes Magazin','s4.f1p':'Eine regionale oder branchenspezifische redaktionelle Ausrichtung.','s4.f2h':'Werkzeuge & Inhalte','s4.f2p':'Unterstützung beim Erstellen, Aufbereiten und Veröffentlichen von Beiträgen.','s4.f3h':'Einarbeitung','s4.f3p':'Einführung in Bedienung, Medienabläufe und eigenständige Nutzung.','s4.note':'Sie betreiben das Mediengeschäft selbst. Der Regio-Botschafter ist kein Fullservice-Angebot.','s4.value':'Sie müssen nicht die komplette technische Medieninfrastruktur selbst entwickeln. Der Leistungsumfang der bereitgestellten Werkzeuge und Einarbeitung richtet sich nach den vereinbarten Produktleistungen.','s4.question':'Welche Aufgaben würden Sie gerne selbst übernehmen – und bei welchen hilft Ihnen eine vorbereitete Infrastruktur?',

const t=(key,tag='span',cls='')=>`<${tag} data-i18n="${esc(key)}"${cls?` class="${esc(cls)}"`:''}>${esc(get(key))}</${tag}>`;
const iconFeature=(num,icon)=>`<div class="feature">${I(icon)}${t(`s${state.slide+1}.f${num}h`,'strong')}${t(`s${state.slide+1}.f${num}p`,'p')}</div>`;
const title=(i,type='h2')=>`<div class="slide-topline">${t('s'+i+'.k','span','eyebrow')}<span class="slide-index">${String(i).padStart(2,'0')} / 10</span></div>${t('s'+i+'.h',type)}${t('s'+i+'.lead','p','lead')}`;
const magazineGraphic=()=>`<div class="visual"><svg viewBox="0 0 550 445" role="img" aria-label="Online-Magazin mit Unternehmensporträts und regionalen Geschichten"><defs><linearGradient id="mg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c9f9e3"/><stop offset="1" stop-color="#0ab68f"/></linearGradient></defs><rect x="62" y="42" width="427" height="352" rx="18" fill="#0a3129" stroke="#7df4c6" stroke-width="2" transform="rotate(-5 270 220)"/><rect x="95" y="21" width="400" height="353" rx="16" fill="#f5fffa"/><rect x="95" y="21" width="400" height="58" rx="16" fill="#dff9eb"/><text x="120" y="57" font-size="21" font-family="Arial,sans-serif" font-weight="800" fill="#0d5747">REGION MAGAZIN</text><circle cx="457" cy="49" r="8" fill="#1abf99"/><rect x="118" y="100" width="354" height="155" rx="9" fill="url(#mg)"/><path d="M118 219 178 168 232 203 301 132 375 196 433 151 472 192v63H118Z" fill="#076f5a" opacity=".65"/><circle cx="400" cy="131" r="25" fill="#d9ffb3"/><rect x="118" y="272" width="164" height="16" rx="7" fill="#104b3d"/><rect x="118" y="301" width="274" height="10" rx="5" fill="#a8d4c1"/><rect x="118" y="320" width="333" height="10" rx="5" fill="#a8d4c1"/><rect x="118" y="342" width="196" height="9" rx="4" fill="#c3e4d3"/><circle cx="79" cy="331" r="42" fill="#c12a79"/><path d="M64 332h30m-15-15v30" stroke="white" stroke-width="5" stroke-linecap="round"/><circle cx="470" cy="353" r="41" fill="#12c5a0"/><path d="m453 355 11 11 22-25" fill="none" stroke="#063628" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;
const audienceIcons=['building','chart','store','heart','sun','briefcase','newspaper','graduate'];
const makeSlide=()=>{
const i=state.slide+1;
if(i===1)return `<div class="two-col"><div><div class="slide-topline">${t('s1.k','span','eyebrow')}<span class="slide-index">01 / 10</span></div>${t('s1.h','h1','hero-title')}${t('s1.lead','p','lead')}${t('s1.note','p','primary-note')}</div>${magazineGraphic()}</div>`;
if(i===2)return `${title(2)}<div class="section-grid">${[1,2,3].map((n)=>`<div class="feature">${I(['store','book','network'][n-1])}${t(`s2.c${n}h`,'strong')}${t(`s2.c${n}p`,'p')}</div>`).join('')}</div>`;
if(i===3)return `${title(3)}<div class="card-grid">${audienceIcons.map((ic,j)=>`<button class="audience-card" data-audience="${j+1}" type="button">${I(ic)}${t(`s3.g${j+1}`,'strong')}<span class="card-tip" data-i18n="s3.tip">${esc(get('s3.tip'))}</span></button>`).join('')}</div>`;
if(i===4)return `${title(4)}<div class="section-grid">${[1,2,3].map((n)=>iconFeature(n,['newspaper','list','graduate'][n-1])).join('')}</div>${t('s4.note','p','model-note')}`;
if(i===5)return `${title(5)}<div class="card-grid">${[1,2,3,4].map((n)=>`<div class="feature">${I(['book','megaphone','newspaper','hand'][n-1])}${t(`s5.f${n}h`,'strong')}${t(`s5.f${n}p`,'p')}</div>`).join('')}</div>${t('s5.note','p','model-note')}`;
if(i===6)return `${title(6)}<div class="section-grid">${[1,2,3].map((n)=>iconFeature(n,['megaphone','network','hand'][n-1])).join('')}</div>${t('s6.note','p','model-note')}`;
if(i===7)return `${title(7)}<div class="business-path">${[1,2,3,4].map((n)=>`<div class="path-node">${I(['users','mail','play','check'][n-1])}${t(`s7.p${n}h`,'strong')}${t(`s7.p${n}p`,'small')}</div>`).join('')}</div>${t('s7.note','p','model-note')}`;
if(i===8)return `${title(8)}<div class="section-grid">${[1,2,3].map((n)=>iconFeature(n,['list','briefcase','chart'][n-1])).join('')}</div><div class="model-panel">${t('s8.model','h3')}${[20,15,10].map((v,j)=>`<div class="ratio-line">${t(`s8.l${j+1}`)}<div class="bar-track"><div class="bar-fill" style="width:${v*5}%"></div></div><span>${v} %</span></div>`).join('')}</div>${t('s8.note','p','model-note')}`;
if(i===9)return `${title(9)}<div class="estimate-area"><div class="estimate-field"><label for="estimate" data-i18n="s9.label">${esc(get('s9.label'))}</label><div class="money-input"><input id="estimate" type="number" inputmode="numeric" min="1" max="9999999" step="1" placeholder="—" aria-describedby="estimateError" value="${state.estimate??''}"><span>€</span></div><div id="estimateError" role="alert" style="min-height:22px;font-size:13px;color:#b02160;margin:7px 0"></div><button class="estimate-action" id="reveal" type="button" data-i18n="s9.action">${esc(get('s9.action'))}</button></div><div class="price-reveal" id="priceReveal" ${state.revealed?'':'hidden'}><div class="eyebrow" data-i18n="s9.priceLabel">${esc(get('s9.priceLabel'))}</div><strong>999 €</strong> <span data-i18n="s9.month">${esc(get('s9.month'))}</span>${t('s9.included','p')}</div>${t('s9.terms','p','price-disclaimer')}</div>`;
if(i===10)return `${title(10)}<div class="choice-grid"><div class="choice-card">${t('s10.yesTitle','h3')}${t('s10.yesText','p')}<button class="choice-button" id="chooseYes" type="button">${I('check')}<span data-i18n="yes">${esc(get('yes'))}</span></button></div><div class="choice-card">${t('s10.noTitle','h3')}${t('s10.noText','p')}<button class="choice-button no" id="chooseNo" type="button"><span data-i18n="no">${esc(get('no'))}</span></button></div></div><div id="decisionResult" aria-live="polite">${decisionHTML()}</div>`;
return '';
};
function decisionHTML(){if(state.decision==='yes')return `<div class="decision-result">${t('s10.yesResultTitle','h3')}<ol>${[1,2,3,4].map(x=>`<li data-i18n="s10.step${x}">${esc(get('s10.step'+x))}</li>`).join('')}</ol></div>`;if(state.decision==='no')return `<div class="decision-result">${t('s10.noResultTitle','h3')}${t('s10.noResultText','p')}</div>`;return ''}
function setTitle(){document.title=state.lang==='de'?'Regio-Botschafter · Ihre eigene Medienwelt | LiquidityBooster':'Regional Ambassador · Your own media world | LiquidityBooster';document.documentElement.lang=state.lang;document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===state.lang)));document.getElementById('fullScreen').title=get(document.fullscreenElement?'exitFullscreen':'fullscreen');document.getElementById('fullScreen').setAttribute('aria-label',get(document.fullscreenElement?'exitFullscreen':'fullscreen'));}
function render(){const n=state.slide;stage.className='slide'+([0,5].includes(n)?' dark':n===9?' magenta':'');area.innerHTML=makeSlide();document.getElementById('topCount').textContent=String(n+1).padStart(2,'0')+' / 10';document.getElementById('bottomCount').textContent=String(n+1).padStart(2,'0')+' / 10';document.querySelectorAll('[data-i18n]').forEach(el=>{const txt=get(el.dataset.i18n);if(txt)el.textContent=txt});document.getElementById('prev').disabled=n===0;document.getElementById('next').disabled=n===9||n===8&&!state.revealed;const bar=document.getElementById('progress');bar.innerHTML=Array.from({length:10},(_,j)=>`<button type="button" data-slide="${j}" ${j===n?'aria-current="step"':''} aria-label="${j+1} / 10"></button>`).join('');bar.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>navigate(+b.dataset.slide)));area.querySelectorAll('[data-audience]').forEach(b=>b.addEventListener('click',()=>showModal('audience',+b.dataset.audience)));if(n===8)document.getElementById('reveal').addEventListener('click',reveal);if(n===9){document.getElementById('chooseYes').addEventListener('click',()=>decide('yes'));document.getElementById('chooseNo').addEventListener('click',()=>decide('no'))}setTitle();}
function reveal(){const el=document.getElementById('estimate');const val=Number(el.value);if(!Number.isFinite(val)||val<1||val>9999999||!Number.isInteger(val)){document.getElementById('estimateError').textContent=get('s9.error');el.focus();return}state.estimate=val;state.revealed=true;render();document.getElementById('priceReveal').scrollIntoView({behavior:'smooth',block:'nearest'});}
function decide(choice){state.decision=choice;document.getElementById('decisionResult').innerHTML=decisionHTML();document.getElementById('decisionResult').scrollIntoView({behavior:'smooth',block:'nearest'});}
function navigate(dest){if(dest<0||dest>9)return;if(dest===9&&!state.revealed){state.slide=8;render();document.getElementById('estimate').focus();return}state.slide=dest;render();window.scrollTo(0,0);}
function showModal(kind,num){let kicker,title,body;if(kind==='audience'){kicker=get('s3.g'+num);title=get('benefitHeading');body=get(`s3.g${num}v`);const q=get(`s3.g${num}q`);body+='\n\n'+get('questionHeading')+': '+q;}else{kicker=get(kind==='value'?'moreValue':'reflection');title=get(kind==='value'?'benefitHeading':'questionHeading');body=get('s'+(state.slide+1)+(kind==='value'?'.value':'.question'));}document.getElementById('modalKicker').textContent=kicker;document.getElementById('modalTitle').textContent=title;document.getElementById('modalText').textContent=body;document.getElementById('modalText').style.whiteSpace='pre-line';if(typeof modal.showModal==='function')modal.showModal();else modal.setAttribute('open','');}
function closeModal(){modal.close?.();modal.removeAttribute('open')}
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{state.lang=b.dataset.lang;render()}));document.getElementById('prev').addEventListener('click',()=>navigate(state.slide-1));document.getElementById('next').addEventListener('click',()=>navigate(state.slide+1));document.getElementById('benefitBtn').addEventListener('click',()=>showModal('value'));document.getElementById('reflectionBtn').addEventListener('click',()=>showModal('question'));document.getElementById('modalX').addEventListener('click',closeModal);document.getElementById('modalDone').addEventListener('click',closeModal);modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});document.addEventListener('keydown',e=>{if(modal.open||['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();navigate(state.slide+1)}else if(e.key==='ArrowLeft'){e.preventDefault();navigate(state.slide-1)}});document.getElementById('fullScreen').addEventListener('click',()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.()});document.addEventListener('fullscreenchange',setTitle);
const h=location.hash.match(/^#(?:slide-)?(\d+)$/);if(h){const n=+h[1]-1;if(n>=0&&n<9)state.slide=n;}render();
})();
</script>
</body>
</html>
