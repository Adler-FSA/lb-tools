function decide(choice){state.decision=choice;render();window.scrollTo(0,0);}
function navigate(dest){if(dest===10)dest=0;if(dest<0||dest>9)return;if(dest===9&&!state.revealed){state.slide=8;render();document.getElementById('estimate').focus();return}state.slide=dest;render();window.scrollTo(0,0);}
function showModal(kind,num){let kicker,title,body;if(kind==='audience'){kicker=get('s3.g'+num);title=get('benefitHeading');body=get(`s3.g${num}v`);const q=get(`s3.g${num}q`);body+='\n\n'+get('questionHeading')+': '+q;}else if(kind==='cost'){kicker=get('s8.b'+num);title=get('benefitHeading');body=get('s8.v'+num)}else if(kind==='sources'){kicker=get('s8.sourceButton');title=get('s8.tableHead');body=get('s8.sources')}else{kicker=get(kind==='value'?'moreValue':'reflection');title=get(kind==='value'?'benefitHeading':'questionHeading');body=get('s'+(state.slide+1)+(kind==='value'?'.value':'.question'));}document.getElementById('modalKicker').textContent=kicker;document.getElementById('modalTitle').textContent=title;document.getElementById('modalText').textContent=body;document.getElementById('modalText').style.whiteSpace='pre-line';if(typeof modal.showModal==='function')modal.showModal();else modal.setAttribute('open','');}
function closeModal(){modal.close?.();modal.removeAttribute('open')}
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{state.lang=b.dataset.lang;render()}));document.getElementById('prev').addEventListener('click',()=>navigate(state.slide-1));document.getElementById('next').addEventListener('click',()=>navigate(state.slide+1));document.getElementById('benefitBtn').addEventListener('click',()=>showModal('value'));document.getElementById('reflectionBtn').addEventListener('click',()=>showModal('question'));document.getElementById('modalX').addEventListener('click',closeModal);document.getElementById('modalDone').addEventListener('click',closeModal);modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});document.addEventListener('keydown',e=>{if(modal.open||['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();navigate(state.slide+1)}else if(e.key==='ArrowLeft'){e.preventDefault();navigate(state.slide-1)}});document.getElementById('fullScreen').addEventListener('click',()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.()});document.addEventListener('fullscreenchange',setTitle);
const h=location.hash.match(/^#(?:slide-)?(\d+)$/);if(h){const n=+h[1]-1;if(n>=0&&n<9)state.slide=n;}render();
})();
</script>
</body>
