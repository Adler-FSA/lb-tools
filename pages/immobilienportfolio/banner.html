<!doctype html>
<!--
GitHub-Pfad: pages/immobilienportfolio/banner.html
Zweck: Kompaktes, iFrame-faehiges XXL.IMMO-Dashboard-Banner (DE/EN).
Datenbasis: lokales Portfolio des Immobilienrechners, gleiche Origin und Browser.
Hinweis: Eine kontogebundene Einbindung bei XXL.immo erfordert eine authentifizierte Schnittstelle.
-->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>XXL.IMMO · Mein Immobilienportfolio</title>
<style>
:root{--blue:#166db7;--green:#63c900;--ink:#283a4b;--muted:#596d7b;--border:#d4e3ef;--soft:#eff6fd}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
.banner{border:1px solid var(--border);border-top:4px solid var(--blue);background:#fff;border-radius:12px;padding:15px 18px 12px;max-width:100%;overflow:hidden}
.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:13px}
.heading h1{margin:0;color:var(--blue);font-size:20px;line-height:1.25}
.date{font-size:12px;color:var(--muted);white-space:nowrap}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.metric{border:1px solid var(--border);border-radius:9px;background:var(--soft);padding:11px 12px;min-width:0}
.label{display:block;color:var(--muted);font-size:12px;line-height:1.3;margin-bottom:7px}
.metric strong{display:block;color:var(--blue);font-size:clamp(17px,2.1vw,25px);letter-spacing:-.025em;line-height:1.18;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.metric.gain strong{color:#347d07}
.meta{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;margin-top:11px;font-size:11px;color:var(--muted);line-height:1.4}
.meta a{color:var(--blue);font-weight:700;text-decoration:underline;text-underline-offset:2px}
.empty{background:var(--soft);padding:19px 14px;border-radius:9px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
.empty a{color:var(--blue);font-weight:700}
[hidden]{display:none!important}
@media(max-width:650px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.banner{padding:13px}.heading h1{font-size:18px}.metric strong{font-size:clamp(17px,4vw,22px)}}
@media(max-width:355px){.heading{align-items:flex-start;flex-direction:column}.metrics{gap:7px}.metric{padding:10px 8px}.metric strong{font-size:17px}}
</style>
</head>
<body>
<section class="banner" aria-label="XXL.IMMO Immobilienportfolio">
  <div class="heading">
    <h1 data-i18n="title">Mein Immobilienportfolio</h1>
    <span class="date" id="dateText" aria-live="off">–</span>
  </div>
  <div class="metrics" id="metrics">
    <div class="metric"><span class="label" data-i18n="count">Immobilien</span><strong id="countValue">0</strong></div>
    <div class="metric"><span class="label" data-i18n="base">Startwert bei Erfassung</span><strong id="baseValue">0 €</strong></div>
    <div class="metric"><span class="label" data-i18n="current">Aktueller Modellwert</span><strong id="currentValue">0 €</strong></div>
    <div class="metric gain"><span class="label" data-i18n="gain">Wertzuwachs seit Erfassung</span><strong id="gainValue">+0 €</strong></div>
  </div>
  <div class="empty" id="emptyState" hidden>
    <span data-i18n="empty">Noch keine Immobilie erfasst.</span>
    <a href="./rechner.html" target="_blank" rel="noopener" data-i18n="first">Immobilienrechner öffnen</a>
  </div>
  <div class="meta">
    <span data-i18n="notice">Tägliche Modellrechnung auf Grundlage Ihrer Angaben · keine Marktwertermittlung.</span>
    <a href="./rechner.html" target="_blank" rel="noopener" data-i18n="manage">Immobilien bearbeiten</a>
  </div>
</section>
<script>
(function(){
  "use strict";
  var STORAGE_KEY="xxl-immo-portfolio-v1";
  var translations={
    de:{title:"Mein Immobilienportfolio",asOf:"Stand",count:"Immobilien",base:"Startwert bei Erfassung",current:"Aktueller Modellwert",gain:"Wertzuwachs seit Erfassung",empty:"Noch keine Immobilie erfasst.",unavailable:"Der lokale Immobilienbestand ist in dieser Einbindung nicht zugänglich.",first:"Immobilienrechner öffnen",notice:"Tägliche Modellrechnung auf Grundlage Ihrer Angaben · keine Marktwertermittlung.",manage:"Immobilien bearbeiten"},
    en:{title:"My property portfolio",asOf:"As of",count:"Properties",base:"Value when recorded",current:"Current model value",gain:"Growth since recorded",empty:"No properties recorded yet.",unavailable:"The local portfolio cannot be accessed from this embed.",first:"Open property calculator",notice:"Daily calculation based on your inputs · not a market valuation.",manage:"Edit properties"}
  };
  var $=function(id){return document.getElementById(id)};
  function validNum(value){var n=Number(String(value==null?"":value).replace(",","."));return Number.isFinite(n)?n:0}
  function rate(property){var n=validNum(property.annualRate);return Math.min(10,Math.max(1,n||5))}
  function dateOnly(value){
    var raw=String(value||"");
    if(/^\d{4}-\d{2}-\d{2}$/.test(raw))return raw;
    var dt=new Date(raw);
    if(!Number.isFinite(dt.getTime()))return null;
    return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
  }
  function utcDay(value){
    var str=dateOnly(value);
    if(!str)return NaN;
    var part=str.split("-").map(Number);
    var dt=new Date(Date.UTC(part[0],part[1]-1,part[2]));
    if(dt.getUTCFullYear()!==part[0]||dt.getUTCMonth()!==part[1]-1||dt.getUTCDate()!==part[2])return NaN;
    return dt.getTime()/86400000;
  }
  function startDate(property){return dateOnly(property.modelStartDate)||dateOnly(property.createdAt)||dateOnly(new Date())}
  function monthsUntil(purchase,until){
    var a=dateOnly(purchase),b=dateOnly(until);
    if(!a||!b||utcDay(a)>utcDay(b))return 0;
    var pa=a.split("-").map(Number),pb=b.split("-").map(Number);
    return Math.max(0,(pb[0]-pa[0])*12+pb[1]-pa[1]-(pb[2]<pa[2]?1:0));
  }
  function baseline(property){
    var start=validNum(property.modelStartValue);
    if(start>0)return start;
    var price=validNum(property.purchasePrice);
    return price+price*rate(property)/1200*monthsUntil(property.purchaseDate,startDate(property));
  }
  function localToday(){return dateOnly(new Date())}
  function value(property,today){
    var base=baseline(property);
    var days=Math.max(0,utcDay(today)-utcDay(startDate(property)));
    if(!Number.isFinite(days))days=0;
    return base+base*rate(property)/100*days/365;
  }
  function money(amount,lang){
    return new Intl.NumberFormat(lang==="en"?"en-IE":"de-DE",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(amount);
  }
  function read(){
    try{
      var raw=localStorage.getItem(STORAGE_KEY),parsed=raw?JSON.parse(raw):null;
      return {properties:parsed&&Array.isArray(parsed.properties)?parsed.properties:[],lang:parsed&&parsed.lang==="en"?"en":"de",available:true};
    }catch(e){return {properties:[],lang:"de",available:false}}
  }
  function render(){
    var data=read(),lang=data.lang,dict=translations[lang],today=localToday();
    document.documentElement.lang=lang;
    document.querySelectorAll("[data-i18n]").forEach(function(node){
      var key=node.getAttribute("data-i18n");
      if(dict[key])node.textContent=dict[key];
    });
    $("dateText").textContent=dict.asOf+": "+new Intl.DateTimeFormat(lang==="en"?"en-GB":"de-DE",{dateStyle:"medium"}).format(new Date());
    var props=data.properties.filter(function(p){return p&&p.purchaseDate&&validNum(p.purchasePrice)>0});
    $("metrics").hidden=!props.length;
    $("emptyState").hidden=Boolean(props.length);
    if(!props.length){
      $("emptyState").querySelector("span").textContent=data.available?dict.empty:dict.unavailable;
      return;
    }
    var start=0,current=0;
    props.forEach(function(item){start+=baseline(item);current+=value(item,today)});
    $("countValue").textContent=new Intl.NumberFormat(lang==="en"?"en-GB":"de-DE").format(props.length);
    $("baseValue").textContent=money(start,lang);
    $("currentValue").textContent=money(current,lang);
    $("gainValue").textContent=(current-start>=0?"+":"")+money(current-start,lang);
  }
  render();
  window.addEventListener("storage",function(event){if(event.key===STORAGE_KEY||event.key===null)render()});
  window.addEventListener("pageshow",render);
  document.addEventListener("visibilitychange",function(){if(!document.hidden)render()});
  window.setInterval(function(){if(!document.hidden)render()},60000);
})();
</script>
</body>
</html>
