<!doctype html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Demo-Haus Lindenblick · Nebenkosten Premium</title>
<meta name="description" content="Geführte Demo und Lernreise für Nebenkosten Premium">
<link rel="stylesheet" href="assets/css/demo.css">
</head><body>
<div class="demo-shell" data-demo-shell>
<header class="demo-top">
  <div class="demo-brand"><div class="demo-mark">D</div><div><strong>Demo-Haus Lindenblick</strong><span>Geführte Lernreise · alle Personen, Adressen und Belege sind fiktiv</span></div></div>
  <span class="demo-badge">DEMO · keine echten Daten</span>
  <div class="demo-actions">
    <button class="demo-btn primary" type="button" data-toggle-mode>Frei erkunden</button>
    <button class="demo-btn" type="button" data-reset-demo>Demo zurücksetzen</button>
    <button class="demo-btn danger" type="button" data-exit-demo>Demo verlassen</button>
  </div>
</header>
<div class="demo-body">
  <aside class="demo-guide">
    <div class="guide-eyebrow">Akademie-Lernreise</div>
    <div class="guide-step" data-guide-step></div>
    <h1 class="guide-title" data-guide-title></h1>
    <p class="guide-copy" data-guide-copy></p>
    <div class="guide-why"><strong>Warum ist das wichtig?</strong><span data-guide-why></span></div>
    <div class="guide-facts" data-guide-facts></div>
    <div class="guide-nav"><button class="secondary" type="button" data-prev>← Zurück</button><button type="button" data-next>Weiter →</button></div>
    <div class="guide-list" data-guide-list></div>
  </aside>
  <main class="demo-stage">
    <iframe data-demo-frame title="Nebenkosten Premium Demo"></iframe>
    <div class="demo-toast" data-demo-toast hidden></div>
  </main>
</div>
</div>
<script type="module" src="assets/js/demo-shell.js"></script>
</body></html>
