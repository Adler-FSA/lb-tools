<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Head Control 2 · Teststrecke</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#f5fafb;overflow:hidden}
#control2Base{display:block;width:100%;height:100dvh;border:0;background:#f5fafb}
#bootError{display:none;position:fixed;inset:20px;z-index:10;align-items:center;justify-content:center;padding:24px;border:1px solid #efc2c2;border-radius:18px;background:#fff5f5;color:#8d2020;font:700 15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;text-align:center}
#bootError.show{display:flex}
</style>
</head>
<body>
<iframe id="control2Base" title="Head Control 2 – Teststrecke" src="../head-control.html?headcontrol2base=1"></iframe>
<div id="bootError">Die Head-Control-2-Teststrecke konnte nicht geladen werden.</div>
<script>
(()=>{
  'use strict';
  const frame=document.getElementById('control2Base');
  const errorBox=document.getElementById('bootError');

  function start(){
    try{
      const d=frame.contentDocument;
      if(!d||!d.body)throw new Error('frame');
      const style=d.createElement('style');
      style.id='headcontrol2-task-archive-style';
      style.textContent=`
        .hc2-task-notice{margin:0 0 14px;padding:10px 13px;border:1px solid #cdebed;border-radius:12px;background:#eefafa;color:#075d61;font-size:13px;font-weight:800;line-height:1.45}
        .hc2-task-archive{margin-top:18px;padding-top:18px;border-top:1px solid #e5ecee}
        .hc2-task-archive-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.hc2-task-archive-head h3{margin:0;color:var(--navy);font-size:17px}.hc2-task-archive-head span{color:var(--muted);font-size:11px;font-weight:800}
        .hc2-archive-person{margin-top:12px;border:1px solid #d9e6e8;border-radius:15px;background:#fbfcfc;overflow:hidden}.hc2-archive-person:first-child{margin-top:0}.hc2-archive-person-head{display:flex;justify-content:space-between;gap:12px;padding:10px 13px;background:#f3f6f7;color:var(--navy);font-size:13px;font-weight:900}.hc2-archive-person-head small{color:var(--muted);font-size:11px}
        .hc2-archive-card{position:relative;padding:13px 14px 13px 18px;border-top:1px solid #e6ecee;background:#fff}.hc2-archive-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#9aa7b2}.hc2-archive-title{color:var(--navy);font-weight:900;font-size:14px;line-height:1.35}.hc2-archive-url{margin-top:4px;color:var(--muted);font-size:12px;overflow-wrap:anywhere}.hc2-archive-note{margin-top:6px;color:var(--text);font-size:13px;line-height:1.45;white-space:pre-wrap}.hc2-archive-meta{margin-top:7px;color:var(--muted);font-size:11px;font-weight:800}.hc2-archive-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.hc2-archive-empty{border:1px dashed #cfdadd;border-radius:14px;padding:18px;text-align:center;color:var(--muted);background:#fbfdfd;font-size:13px}
        .task-card.done-preview{background:#fbfdfd}.task-actions .btn.done-task{background:var(--mint);color:#fff;border-color:var(--mint)}
      `;
      d.head.appendChild(style);

      const script=d.createElement('script');
      script.textContent=`
        (()=>{
          const hc2Lang=typeof lang==='string'?lang:'de';
          const hc2Text={de:{notice:'Aufgaben werden ausschließlich nach vorheriger Absprache im Headteam zugeordnet.',done:'Erledigt',archive:'Aufgabenarchiv',archiveHint:'Erledigte Aufgaben bleiben der ursprünglichen Person zugeordnet.',completed:'Erledigt am',empty:'Noch keine erledigten Aufgaben archiviert.',confirmDone:n=>'Aufgabe „'+n+'“ als erledigt markieren und archivieren?',doneSaved:'Aufgabe wurde als erledigt archiviert.',confirmDelete:n=>'Archivierte Aufgabe „'+n+'“ endgültig löschen? Dieser Vorgang kann nicht rückgängig gemacht werden.',archiveDeleted:'Archivierte Aufgabe wurde endgültig gelöscht.'},en:{notice:'Tasks are assigned only after prior agreement within the Headteam.',done:'Done',archive:'Task archive',archiveHint:'Completed tasks remain assigned to the original person.',completed:'Completed on',empty:'No completed tasks archived yet.',confirmDone:n=>'Mark task “'+n+'” as completed and archive it?',doneSaved:'Task was archived as completed.',confirmDelete:n=>'Permanently delete archived task “'+n+'”? This action cannot be undone.',archiveDeleted:'Archived task was permanently deleted.'}}[hc2Lang]||null;
          function archiveList(){if(!Array.isArray(state.taskArchive))state.taskArchive=[];return state.taskArchive}
          function hc2Date(v){if(!v)return'–';try{return new Intl.DateTimeFormat(hc2Lang==='de'?'de-DE':'en-GB',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v))}catch(e){return v}}
          function hc2Name(p){return p.title||p.url||recipientLabel(p.recipient)}
          function ensureNotice(){
            const body=document.querySelector('#panel-tasks .card .body');if(!body||body.querySelector('.hc2-task-notice'))return;
            const n=document.createElement('div');n.className='hc2-task-notice';n.textContent=hc2Text.notice;body.insertBefore(n,body.firstChild);
          }
          function renderActiveTasks2(){
            const el=document.getElementById('personalRows');if(!el)return;
            const order={alexander:0,oliver:1,peter:2,daniel:3};
            const links=state.personalLinks.map((p,index)=>({p,index})).sort((a,b)=>(order[a.p.recipient]??99)-(order[b.p.recipient]??99)||(b.p.updatedAt||b.p.createdAt||'').localeCompare(a.p.updatedAt||a.p.createdAt||''));
            el.innerHTML=links.length?links.map(({p,index})=>'<article class="task-card person-'+esc(p.recipient||'unknown')+' '+(linkEditIndex===index?'editing':'')+'"><div class="task-top"><div class="task-main"><span class="task-person">'+esc(recipientLabel(p.recipient))+'</span><div class="task-title">'+esc(p.title||'–')+'</div><div class="task-link-label">'+esc(t('personalLink'))+'</div><div class="task-link">'+esc(p.url||'–')+'</div><div class="task-note-label">'+esc(t('note'))+'</div><div class="task-note">'+esc(p.note||'–')+'</div></div><div class="task-actions"><button class="btn light" onclick="editPersonalLink('+index+')">'+esc(t('edit'))+'</button><button class="btn done-task" onclick="completePersonalLink2('+index+')">'+esc(hc2Text.done)+'</button><button class="btn danger" onclick="deletePersonalLink('+index+')">'+esc(t('remove'))+'</button></div></div></article>').join(''):'<div class="task-empty">'+esc(t('personalEmpty'))+'</div>';
          }
          function ensureArchiveContainer(){
            const rows=document.getElementById('personalRows');if(!rows)return null;
            let wrap=document.getElementById('hc2TaskArchive');if(wrap)return wrap;
            wrap=document.createElement('section');wrap.id='hc2TaskArchive';wrap.className='hc2-task-archive';wrap.innerHTML='<div class="hc2-task-archive-head"><h3>'+esc(hc2Text.archive)+'</h3><span>'+esc(hc2Text.archiveHint)+'</span></div><div id="hc2TaskArchiveRows"></div>';
            rows.parentNode.appendChild(wrap);return wrap;
          }
          function renderArchive2(){
            ensureArchiveContainer();const el=document.getElementById('hc2TaskArchiveRows');if(!el)return;
            const list=archiveList().map((p,index)=>({p,index})).sort((a,b)=>(b.p.completedAt||'').localeCompare(a.p.completedAt||''));
            if(!list.length){el.innerHTML='<div class="hc2-archive-empty">'+esc(hc2Text.empty)+'</div>';return}
            const people=['alexander','oliver','peter','daniel'];
            const groups=people.map(person=>({person,items:list.filter(x=>x.p.recipient===person)})).filter(g=>g.items.length);
            const other=list.filter(x=>!people.includes(x.p.recipient));if(other.length)groups.push({person:'',items:other});
            el.innerHTML=groups.map(g=>'<section class="hc2-archive-person"><div class="hc2-archive-person-head"><span>'+esc(recipientLabel(g.person))+'</span><small>'+g.items.length+'</small></div>'+g.items.map(({p,index})=>'<article class="hc2-archive-card"><div class="hc2-archive-title">'+esc(p.title||p.url||'–')+'</div>'+(p.url?'<div class="hc2-archive-url">'+esc(p.url)+'</div>':'')+(p.note?'<div class="hc2-archive-note">'+esc(p.note)+'</div>':'')+'<div class="hc2-archive-meta">'+esc(hc2Text.completed)+': '+esc(hc2Date(p.completedAt||p.archivedAt))+'</div><div class="hc2-archive-actions">'+(p.url?'<a class="btn light" href="'+esc(p.url)+'" target="_blank" rel="noopener" style="text-decoration:none">'+(hc2Lang==='de'?'Öffnen':'Open')+'</a>':'')+'<button class="btn danger" onclick="deleteArchivedTask2('+index+')">'+esc(t('remove'))+'</button></div></article>').join('')+'</section>').join('');
          }
          window.completePersonalLink2=async i=>{
            const p=state.personalLinks[i];if(!p||!confirm(hc2Text.confirmDone(hc2Name(p))))return;
            const now=new Date().toISOString(),arch=archiveList(),archived={...p,completedAt:now};
            state.personalLinks.splice(i,1);arch.push(archived);
            const oldEdit=linkEditIndex;if(linkEditIndex===i)resetTask();else if(linkEditIndex!==null&&linkEditIndex>i)linkEditIndex--;
            if(await saveState('Complete Headteam task for '+recipientLabel(p.recipient))){render();showSuccess(hc2Text.doneSaved)}else{arch.pop();state.personalLinks.splice(i,0,p);linkEditIndex=oldEdit;render()}
          };
          window.deleteArchivedTask2=async i=>{
            const arch=archiveList(),p=arch[i];if(!p||!confirm(hc2Text.confirmDelete(hc2Name(p))))return;
            arch.splice(i,1);
            if(await saveState('Permanently remove completed Headteam task for '+recipientLabel(p.recipient))){render();showSuccess(hc2Text.archiveDeleted)}else{arch.splice(i,0,p);render()}
          };
          const baseRender2=render;
          render=function(){archiveList();baseRender2();ensureNotice();renderActiveTasks2();renderArchive2()};
          archiveList();ensureNotice();renderActiveTasks2();renderArchive2();
        })();
      `;
      d.body.appendChild(script);
    }catch(e){errorBox.classList.add('show')}
  }

  frame.addEventListener('load',start,{once:true});
})();
</script>
</body>
</html>
