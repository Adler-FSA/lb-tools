<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Head Control 2 · Teststrecke</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#f5fafb;overflow:hidden}
#control2Base{display:block;width:100%;height:100dvh;border:0;background:#f5fafb}
#bootError{display:none;position:fixed;inset:20px;z-index:10;align-items:center;justify-content:center;padding:24px;border:1px solid #efc2c2;border-radius:18px;background:#fff5f5;color:#8d2020;font:700 15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;text-align:center}
#bootError.show{display:flex}
</style>
</head>
<body>
<iframe id="control2Base" title="Head Control 2 – Teststrecke" src="../head-control.html?headcontrol2base=1"></iframe>
<div id="bootError">Die Head-Control-2-Teststrecke konnte nicht geladen werden.</div>
<script>
(()=>{
  'use strict';
  const frame=document.getElementById('control2Base');
  const errorBox=document.getElementById('bootError');

  function start(){
    try{
      const d=frame.contentDocument;
      if(!d||!d.body)throw new Error('frame');
      const style=d.createElement('style');
      style.id='headcontrol2-task-archive-style';
      style.textContent=`
        .hc2-task-notice{margin:0 0 14px;padding:10px 13px;border:1px solid #cdebed;border-radius:12px;background:#eefafa;color:#075d61;font-size:13px;font-weight:800;line-height:1.45}
        .hc2-task-archive{margin-top:18px;padding-top:18px;border-top:1px solid #e5ecee}
        .hc2-task-archive-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.hc2-task-archive-head h3{margin:0;color:var(--navy);font-size:17px}.hc2-task-archive-head span{color:var(--muted);font-size:11px;font-weight:800}
        .hc2-archive-person{margin-top:12px;border:1px solid #d9e6e8;border-radius:15px;background:#fbfcfc;overflow:hidden}.hc2-archive-person:first-child{margin-top:0}.hc2-archive-person-head{display:flex;justify-content:space-between;gap:12px;padding:10px 13px;background:#f3f6f7;color:var(--navy);font-size:13px;font-weight:900}.hc2-archive-person-head small{color:var(--muted);font-size:11px}
        .hc2-archive-card{position:relative;padding:13px 14px 13px 18px;border-top:1px solid #e6ecee;background:#fff}.hc2-archive-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#9aa7b2}.hc2-archive-title{color:var(--navy);font-weight:900;font-size:14px;line-height:1.35}.hc2-archive-url{margin-top:4px;color:var(--muted);font-size:12px;overflow-wrap:anywhere}.hc2-archive-note{margin-top:6px;color:var(--text);font-size:13px;line-height:1.45;white-space:pre-wrap}.hc2-archive-meta{margin-top:7px;color:var(--muted);font-size:11px;font-weight:800}.hc2-archive-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.hc2-archive-empty{border:1px dashed #cfdadd;border-radius:14px;padding:18px;text-align:center;color:var(--muted);background:#fbfdfd;font-size:13px}
        .task-card.done-preview{background:#fbfdfd}.task-actions .btn.done-task{background:var(--mint);color:#fff;border-color:var(--mint)}
        .hc2-source{margin-top:8px;display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:5px 8px;background:#f0f6f7;color:#46606b;font-size:10px;font-weight:900;line-height:1.2}
        .hc2-transfer{background:var(--mint)!important;color:#fff!important;border-color:var(--mint)!important}.hc2-transfer:hover{filter:brightness(.96)}
        .hc2-modal-backdrop{position:fixed;inset:0;z-index:1000;display:none;align-items:flex-start;justify-content:center;padding:28px 16px;background:rgba(19,34,56,.58);overflow:auto}.hc2-modal-backdrop.show{display:flex}.hc2-modal{width:min(880px,100%);margin:auto;border-radius:20px;background:#fff;box-shadow:0 24px 70px rgba(19,34,56,.28);overflow:hidden}.hc2-modal-head{padding:18px 20px;border-bottom:1px solid #dfe8ea;background:linear-gradient(90deg,#fff,#f6fdfd)}.hc2-modal-head h2{margin:0;color:var(--navy);font-size:22px}.hc2-modal-head p{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.45}.hc2-modal-body{padding:18px 20px}.hc2-project-box{padding:13px 14px;border:1px solid #d9e6e8;border-radius:14px;background:#fbfdfd}.hc2-project-box strong{display:block;color:var(--navy);font-size:16px}.hc2-project-box span{display:block;margin-top:4px;color:var(--muted);font-size:12px;overflow-wrap:anywhere}.hc2-people{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.hc2-person-assign{border:1px solid #d9e6e8;border-radius:14px;padding:12px;background:#fff}.hc2-person-check{display:flex;align-items:center;gap:9px;color:var(--navy);font-weight:900}.hc2-person-check input{width:auto}.hc2-person-assign textarea{min-height:78px;margin-top:9px;font-size:13px}.hc2-person-assign textarea:disabled{background:#f5f7f8;color:#8b959e}.hc2-modal-actions{display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap;padding:15px 20px;border-top:1px solid #dfe8ea;background:#fbfcfc}.hc2-modal-error{display:none;margin-top:12px;padding:9px 11px;border-radius:10px;background:#fff3f3;color:#9b1c1c;font-size:12px;font-weight:800}.hc2-modal-error.show{display:block}
        @media(max-width:720px){.hc2-people{grid-template-columns:1fr}.hc2-modal-backdrop{padding:10px}.hc2-modal{margin:0 auto}}
      `;
      d.head.appendChild(style);

      const script=d.createElement('script');
      script.textContent=`
        (()=>{
          const hc2Lang=typeof lang==='string'?lang:'de';
          const hc2People=['alexander','oliver','peter','daniel','mike'];
          const hc2BaseRecipientLabel=recipientLabel;
          recipientLabel=function(v){return v==='mike'?'Mike':hc2BaseRecipientLabel(v)};
          const hc2Text={de:{notice:'Aufgaben werden ausschließlich nach vorheriger Absprache im Headteam zugeordnet.',done:'Erledigt',archive:'Aufgabenarchiv',archiveHint:'Erledigte Aufgaben bleiben der ursprünglichen Person zugeordnet.',completed:'Erledigt am',empty:'Noch keine erledigten Aufgaben archiviert.',confirmDone:n=>'Aufgabe „'+n+'“ als erledigt markieren und archivieren?',doneSaved:'Aufgabe wurde als erledigt archiviert.',confirmDelete:n=>'Archivierte Aufgabe „'+n+'“ endgültig löschen? Dieser Vorgang kann nicht rückgängig gemacht werden.',archiveDeleted:'Archivierte Aufgabe wurde endgültig gelöscht.',toImplementation:'Zur Umsetzung',modalTitle:'Freigegeben → finale Umsetzung',modalHint:'Projekt aus dem 14-Tage-Vorlauf an die zuständigen Bereiche übergeben. Projektname und Arbeitslink werden automatisch übernommen.',assignHint:'Für jede ausgewählte Person kann eine eigene konkrete Aufgabe ergänzt werden.',assign:'Freigeben & zuweisen',cancel:'Abbrechen',needPerson:'Bitte mindestens eine Person auswählen.',transferred:'Projekt wurde aus dem 14-Tage-Vorlauf in die Aufgabenverteilung übergeben.',source:'Aus 14-Tage-Vorlauf',defaultTask:'Finale Umsetzung nach Freigabe im Headteam.'},en:{notice:'Tasks are assigned only after prior agreement within the Headteam.',done:'Done',archive:'Task archive',archiveHint:'Completed tasks remain assigned to the original person.',completed:'Completed on',empty:'No completed tasks archived yet.',confirmDone:n=>'Mark task “'+n+'” as completed and archive it?',doneSaved:'Task was archived as completed.',confirmDelete:n=>'Permanently delete archived task “'+n+'”? This action cannot be undone.',archiveDeleted:'Archived task was permanently deleted.',toImplementation:'To implementation',modalTitle:'Approved → final implementation',modalHint:'Hand the project from the 14-day lead time to the responsible people. Project name and work link are carried over automatically.',assignHint:'A separate concrete task can be added for each selected person.',assign:'Approve & assign',cancel:'Cancel',needPerson:'Please select at least one person.',transferred:'Project was moved from the 14-day lead time into task assignment.',source:'From 14-day lead time',defaultTask:'Final implementation after Headteam approval.'}}[hc2Lang]||null;
          function archiveList(){if(!Array.isArray(state.taskArchive))state.taskArchive=[];return state.taskArchive}
          function hc2Date(v){if(!v)return'–';try{return new Intl.DateTimeFormat(hc2Lang==='de'?'de-DE':'en-GB',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v))}catch(e){return v}}
          function hc2Name(p){return p.title||p.url||recipientLabel(p.recipient)}
          function ensureMikeOption(){const sel=document.getElementById('linkRecipient');if(sel&&!sel.querySelector('option[value="mike"]')){const o=document.createElement('option');o.value='mike';o.textContent='Mike';sel.appendChild(o)}}
          function ensureNotice(){
            const body=document.querySelector('#panel-tasks .card .body');if(!body||body.querySelector('.hc2-task-notice'))return;
            const n=document.createElement('div');n.className='hc2-task-notice';n.textContent=hc2Text.notice;body.insertBefore(n,body.firstChild);
          }
          function sourceBadge(p){return p.sourceProjectId?'<div class="hc2-source">'+esc(hc2Text.source)+(p.sourceCategory?' · '+esc(categoryLabel(p.sourceCategory)):'')+'</div>':''}
          function renderActiveTasks2(){
            const el=document.getElementById('personalRows');if(!el)return;
            const order={alexander:0,oliver:1,peter:2,daniel:3,mike:4};
            const links=state.personalLinks.map((p,index)=>({p,index})).sort((a,b)=>(order[a.p.recipient]??99)-(order[b.p.recipient]??99)||(b.p.updatedAt||b.p.createdAt||'').localeCompare(a.p.updatedAt||a.p.createdAt||''));
            el.innerHTML=links.length?links.map(({p,index})=>'<article class="task-card person-'+esc(p.recipient||'unknown')+' '+(linkEditIndex===index?'editing':'')+'"><div class="task-top"><div class="task-main"><span class="task-person">'+esc(recipientLabel(p.recipient))+'</span><div class="task-title">'+esc(p.title||'–')+'</div>'+sourceBadge(p)+'<div class="task-link-label">'+esc(t('personalLink'))+'</div><div class="task-link">'+esc(p.url||'–')+'</div><div class="task-note-label">'+esc(t('note'))+'</div><div class="task-note">'+esc(p.note||'–')+'</div></div><div class="task-actions"><button class="btn light" onclick="editPersonalLink('+index+')">'+esc(t('edit'))+'</button><button class="btn done-task" onclick="completePersonalLink2('+index+')">'+esc(hc2Text.done)+'</button><button class="btn danger" onclick="deletePersonalLink('+index+')">'+esc(t('remove'))+'</button></div></div></article>').join(''):'<div class="task-empty">'+esc(t('personalEmpty'))+'</div>';
          }
          function ensureArchiveContainer(){
            const rows=document.getElementById('personalRows');if(!rows)return null;
            let wrap=document.getElementById('hc2TaskArchive');if(wrap)return wrap;
            wrap=document.createElement('section');wrap.id='hc2TaskArchive';wrap.className='hc2-task-archive';wrap.innerHTML='<div class="hc2-task-archive-head"><h3>'+esc(hc2Text.archive)+'</h3><span>'+esc(hc2Text.archiveHint)+'</span></div><div id="hc2TaskArchiveRows"></div>';
            rows.parentNode.appendChild(wrap);return wrap;
          }
          function renderArchive2(){
            ensureArchiveContainer();const el=document.getElementById('hc2TaskArchiveRows');if(!el)return;
            const list=archiveList().map((p,index)=>({p,index})).sort((a,b)=>(b.p.completedAt||'').localeCompare(a.p.completedAt||''));
            if(!list.length){el.innerHTML='<div class="hc2-archive-empty">'+esc(hc2Text.empty)+'</div>';return}
            const groups=hc2People.map(person=>({person,items:list.filter(x=>x.p.recipient===person)})).filter(g=>g.items.length);
            const other=list.filter(x=>!hc2People.includes(x.p.recipient));if(other.length)groups.push({person:'',items:other});
            el.innerHTML=groups.map(g=>'<section class="hc2-archive-person"><div class="hc2-archive-person-head"><span>'+esc(recipientLabel(g.person))+'</span><small>'+g.items.length+'</small></div>'+g.items.map(({p,index})=>'<article class="hc2-archive-card"><div class="hc2-archive-title">'+esc(p.title||p.url||'–')+'</div>'+sourceBadge(p)+(p.url?'<div class="hc2-archive-url">'+esc(p.url)+'</div>':'')+(p.note?'<div class="hc2-archive-note">'+esc(p.note)+'</div>':'')+'<div class="hc2-archive-meta">'+esc(hc2Text.completed)+': '+esc(hc2Date(p.completedAt||p.archivedAt))+'</div><div class="hc2-archive-actions">'+(p.url?'<a class="btn light" href="'+esc(p.url)+'" target="_blank" rel="noopener" style="text-decoration:none">'+(hc2Lang==='de'?'Öffnen':'Open')+'</a>':'')+'<button class="btn danger" onclick="deleteArchivedTask2('+index+')">'+esc(t('remove'))+'</button></div></article>').join('')+'</section>').join('');
          }
          function ensureTransferModal(){
            if(document.getElementById('hc2TransferModal'))return;
            const back=document.createElement('div');back.id='hc2TransferModal';back.className='hc2-modal-backdrop';
            back.innerHTML='<div class="hc2-modal" role="dialog" aria-modal="true"><div class="hc2-modal-head"><h2>'+esc(hc2Text.modalTitle)+'</h2><p>'+esc(hc2Text.modalHint)+'</p></div><div class="hc2-modal-body"><div class="hc2-project-box"><strong id="hc2TransferProjectTitle">–</strong><span id="hc2TransferProjectMeta"></span></div><p class="hint" style="margin-top:13px">'+esc(hc2Text.assignHint)+'</p><div class="hc2-people">'+hc2People.map(person=>'<div class="hc2-person-assign"><label class="hc2-person-check"><input type="checkbox" data-hc2-person="'+person+'"> <span>'+esc(recipientLabel(person))+'</span></label><textarea data-hc2-note="'+person+'" disabled placeholder="'+esc(hc2Text.defaultTask)+'"></textarea></div>').join('')+'</div><div class="hc2-modal-error" id="hc2TransferError"></div></div><div class="hc2-modal-actions"><button type="button" class="btn light" id="hc2TransferCancel">'+esc(hc2Text.cancel)+'</button><button type="button" class="btn mint" id="hc2TransferSave">'+esc(hc2Text.assign)+'</button></div></div>';
            document.body.appendChild(back);
            back.querySelectorAll('[data-hc2-person]').forEach(cb=>cb.addEventListener('change',()=>{const ta=back.querySelector('[data-hc2-note="'+cb.dataset.hc2Person+'"]');if(ta)ta.disabled=!cb.checked}));
            document.getElementById('hc2TransferCancel').onclick=()=>closeImplementation2();
            document.getElementById('hc2TransferSave').onclick=submitImplementation2;
            back.addEventListener('click',e=>{if(e.target===back)closeImplementation2()});
          }
          let hc2TransferProjectId=null;
          window.openImplementation2=i=>{
            const p=state.projects[i];if(!p)return;ensureTransferModal();hc2TransferProjectId=p.id;
            document.getElementById('hc2TransferProjectTitle').textContent=p.title||'Projekt';
            document.getElementById('hc2TransferProjectMeta').textContent=[categoryLabel(p.category),p.releaseDate,p.url].filter(Boolean).join(' · ');
            document.querySelectorAll('[data-hc2-person]').forEach(cb=>{cb.checked=false;const ta=document.querySelector('[data-hc2-note="'+cb.dataset.hc2Person+'"]');if(ta){ta.value='';ta.disabled=true}});
            const er=document.getElementById('hc2TransferError');er.textContent='';er.classList.remove('show');document.getElementById('hc2TransferModal').classList.add('show');
          };
          window.closeImplementation2=()=>{const m=document.getElementById('hc2TransferModal');if(m)m.classList.remove('show');hc2TransferProjectId=null};
          window.submitImplementation2=async()=>{
            const index=state.projects.findIndex(x=>x.id===hc2TransferProjectId),p=state.projects[index];if(!p)return closeImplementation2();
            const chosen=Array.from(document.querySelectorAll('[data-hc2-person]:checked')).map(cb=>cb.dataset.hc2Person);
            if(!chosen.length){const er=document.getElementById('hc2TransferError');er.textContent=hc2Text.needPerson;er.classList.add('show');return}
            const now=new Date().toISOString(),created=[];
            chosen.forEach(person=>{const ta=document.querySelector('[data-hc2-note="'+person+'"]');created.push({id:newId(),recipient:person,title:p.title||'Projekt',url:p.url||'',note:(ta&&ta.value.trim())||hc2Text.defaultTask,sourceProjectId:p.id,sourceProjectTitle:p.title||'',sourceCategory:p.category||'',createdAt:now,updatedAt:now})});
            const archived={...p,archivedAt:now,implementationAt:now,assignedTo:chosen,history:[...(p.history||[]),{at:now,event:'released_to_implementation',assignedTo:chosen}]};
            state.projects.splice(index,1);state.archive.push(archived);state.personalLinks.push(...created);
            if(await saveState('Release Headteam project to implementation '+(p.title||'without title'))){closeImplementation2();if(editIndex===index)resetProject();else if(editIndex!==null&&editIndex>index)editIndex--;render();setPanel('tasks');showSuccess(hc2Text.transferred)}else{state.personalLinks.splice(state.personalLinks.length-created.length,created.length);state.archive.pop();state.projects.splice(index,0,p);render()}
          };
          function decorateProjectActions(){
            document.querySelectorAll('#rows tr').forEach(row=>{if(row.querySelector('.hc2-transfer'))return;const edit=row.querySelector('button[onclick^="editProject("]');if(!edit)return;const m=(edit.getAttribute('onclick')||'').match(/editProject\\((\\d+)\\)/);if(!m)return;const index=Number(m[1]);const b=document.createElement('button');b.type='button';b.className='btn hc2-transfer';b.textContent=hc2Text.toImplementation;b.onclick=()=>openImplementation2(index);const actions=edit.parentElement;if(actions)actions.insertBefore(b,edit.nextSibling)});
          }
          window.completePersonalLink2=async i=>{
            const p=state.personalLinks[i];if(!p||!confirm(hc2Text.confirmDone(hc2Name(p))))return;
            const now=new Date().toISOString(),arch=archiveList(),archived={...p,completedAt:now};
            state.personalLinks.splice(i,1);arch.push(archived);
            const oldEdit=linkEditIndex;if(linkEditIndex===i)resetTask();else if(linkEditIndex!==null&&linkEditIndex>i)linkEditIndex--;
            if(await saveState('Complete Headteam task for '+recipientLabel(p.recipient))){render();showSuccess(hc2Text.doneSaved)}else{arch.pop();state.personalLinks.splice(i,0,p);linkEditIndex=oldEdit;render()}
          };
          window.deleteArchivedTask2=async i=>{
            const arch=archiveList(),p=arch[i];if(!p||!confirm(hc2Text.confirmDelete(hc2Name(p))))return;
            arch.splice(i,1);
            if(await saveState('Permanently remove completed Headteam task for '+recipientLabel(p.recipient))){render();showSuccess(hc2Text.archiveDeleted)}else{arch.splice(i,0,p);render()}
          };
          const baseRender2=render;
          render=function(){archiveList();baseRender2();ensureMikeOption();ensureNotice();renderActiveTasks2();renderArchive2();ensureTransferModal();decorateProjectActions()};
          archiveList();ensureMikeOption();ensureNotice();renderActiveTasks2();renderArchive2();ensureTransferModal();decorateProjectActions();
        })();
      `;
      d.body.appendChild(script);
    }catch(e){errorBox.classList.add('show')}
  }

  frame.addEventListener('load',start,{once:true});
})();
</script>
</body>
</html>
