<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Voucher Currency verstehen | Voucher Business Kompass</title>
<style>
:root{--navy:#132238;--mint:#00a7ad;--line:#dbe5e9;--bg:#f2f6f7;--muted:#667587;--shadow:0 10px 28px rgba(19,34,56,.10)}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--navy);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.shell{width:min(94vw,1600px);margin:auto;padding:12px 0 28px}.returnbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;padding:11px 13px;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.back{display:inline-flex;align-items:center;gap:9px;text-decoration:none;background:var(--navy);color:#fff;padding:11px 15px;border-radius:12px;font-weight:900;font-size:15px}.back:hover{transform:translateY(-1px)}.where{min-width:0;text-align:right}.where strong{display:block;font-size:14px}.where span{display:block;color:var(--muted);font-size:12px}.frame{width:100%;border:0;background:#fff;border-radius:18px;box-shadow:var(--shadow);min-height:1100px;display:block}.bottomBack{display:flex;justify-content:center;margin-top:14px}.bottomBack .back{background:#fff;color:var(--navy);border:1px solid var(--line)}@media(max-width:620px){.shell{width:min(calc(100% - 12px),1600px);padding-top:6px}.returnbar{align-items:flex-start;flex-direction:column}.where{text-align:left}.back{width:100%;justify-content:center}.frame{min-height:900px}}
</style>
</head>
<body>
<div class="shell">
  <div class="returnbar">
    <a class="back" id="backTop" href="./">← Zurück zum Business-Kompass</a>
    <div class="where"><strong>Voucher Currency verstehen</strong><span id="whereText">Systemwissen im Voucher Business Kompass</span></div>
  </div>
  <iframe class="frame" id="contentFrame" src="voucher-currency-content.html" title="Voucher Currency verstehen"></iframe>
  <div class="bottomBack"><a class="back" id="backBottom" href="./">← Zurück zum Business-Kompass</a></div>
</div>
<script>
(()=>{
  const p=new URLSearchParams(location.search),from=p.get('from');
  let back='./',label='← Zurück zum Business-Kompass',context='Systemwissen im Voucher Business Kompass';
  if(from==='hotel'){back='hotel.html';label='← Zurück zur Hotel-Seite';context='Technische Vertiefung aus der Hotel-Seite'}
  if(from==='handel'){back='handel.html';label='← Zurück zu Handel & Produktverkauf';context='Technische Vertiefung aus Handel & Produktverkauf'}
  ['backTop','backBottom'].forEach(id=>{const a=document.getElementById(id);a.href=back;a.textContent=label});
  document.getElementById('whereText').textContent=context;
  const f=document.getElementById('contentFrame');let wired=false;
  function tune(){try{const d=f.contentDocument;if(!d)return;const top=d.querySelector('.top');if(top)top.style.display='none';const page=d.querySelector('.page');if(page){page.style.paddingTop='10px';page.style.paddingBottom='18px'}if(!wired){wired=true;d.querySelectorAll('a[href^="./"],a[href="vtravel.html"],a[href="voucher-currency.html"]').forEach(a=>{a.target='_top';if(from==='hotel'&&a.getAttribute('href')==='vtravel.html')a.href='vtravel.html?from=hotel'})}const h=Math.max(900,d.documentElement.scrollHeight,d.body?.scrollHeight||0);f.style.height=h+'px'}catch(e){}}
  f.addEventListener('load',()=>{wired=false;tune();setTimeout(tune,250);setTimeout(tune,900)});
  window.addEventListener('resize',()=>setTimeout(tune,120));
  setInterval(tune,1200);
})();
</script>
<script src="./hotel-storage-voucher-wrapper.js?v=1"></script>
</body>
</html>
