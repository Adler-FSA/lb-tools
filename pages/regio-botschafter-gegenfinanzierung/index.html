{tag:'POTENTIAL COST OFFSET · CLUBLEADER',title:'Your magazine is not your only business opportunity.',lead:'The included ClubLeader services also support approved referrals from paid, correctly attributed and commissionable revenue.',cards:[['01','BusinessBooster','Example: One eligible Premium contract at €999 net per month could yield €199.80 in monthly first-level commission at 20%.'],['02','Memberships & education','Approved paid club memberships and lecture hall products may also qualify for commission.'],['03','Three commission levels','The general rates are 20% / 15% / 10%, subject to the product and applicable commission rules.']],note:'No eligible paid sale means no commission. Media turnover and ClubLeader commissions must be accounted for separately.'},
{tag:'POTENTIAL COST OFFSET · EXAMPLE',title:'How might you offset your monthly costs?',lead:'A simple hypothetical monthly example – neither an income forecast nor a promise:',rows:[['Four media advertising agreements at €250','€1,000.00'],['One eligible BusinessBooster commission (20% of €999)','€199.80'],['Combined media revenue and commission','€1,199.80']],note:'Compare this with the planned €999 monthly fee plus operating expenses, time and taxes. €1,000 media revenue is not profit. Neither contracts nor recurring commissions are guaranteed.'}

let lang='de',idx=0;

function back(){if(idx===0){if(document.referrer.includes('/pages/regio-botschafter/'))history.back();else location.href='../regio-botschafter/#9';return}idx--;render()}
function next(){if(idx===3){if(document.referrer.includes('/pages/regio-botschafter/'))history.back();else location.href='../regio-botschafter/#9';return}idx++;render()}
$('prev').addEventListener('click',back);$('next').addEventListener('click',next);$('lang').addEventListener('click',()=>{lang=lang==='de'?'en':'de';render()});document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){back()}else if(e.key==='ArrowRight'){next()}});
