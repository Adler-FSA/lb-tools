"use strict";
const GUIDES={"business":{"de":[{"title":"BusinessBooster Premium – Auftakt","goal":"Die Zielgruppe abholen und den Rahmen der Präsentation eröffnen.","core":"Sichtbarkeit, Vernetzung und Wachstum stehen im Mittelpunkt; es geht um einen betreuten Marketing-Fullservice.","explain":"Begrüßen Sie die Unternehmer und benennen Sie, was sie in den nächsten Minuten kennenlernen. Verkaufen Sie noch keine Einzelleistung. Setzen Sie die Erwartung eines nachvollziehbaren Gesamtbildes.","question":"Welche Rolle spielt Sichtbarkeit aktuell in Ihrem Unternehmen?","transition":"Leiten Sie von der Zielsetzung zur Realität im Unternehmeralltag über.","note":"Keine Erfolgsgarantie oder Reichweitenzusage geben."},{"title":"Ihr Arbeitstag ist voll. Ihr Marketingkalender auch?","goal":"Der Zuhörer soll sich in Zeitdruck, Komplexität und unregelmäßigem Marketing wiederfinden.","core":"Operative Aufgaben benötigen Aufmerksamkeit; Marketing braucht Kontinuität.","explain":"Gehen Sie die drei Herausforderungen ruhig durch. Es geht nicht um Kritik am Unternehmer, sondern um das Spannungsfeld zwischen Tagesgeschäft und dauerhafter Präsenz. Nutzen Sie Vertiefungen nur bei erkennbarem Bedarf.","question":"Wie regelmäßig schaffen Sie es heute, neue Kunden auf Ihr Unternehmen aufmerksam zu machen?","transition":"Von der erkannten Herausforderung zum veränderten Kommunikationsumfeld führen.","note":"Nicht unterstellen, dass jedes Unternehmen dieselben Probleme hat."},{"title":"Der Markt wartet nicht, bis Zeit für Werbung bleibt.","goal":"Den Unterschied zwischen Einzelaktionen und einer planbaren Routine verständlich machen.","core":"Nicht einfach mehr Werbung, sondern kontinuierliche Sichtbarkeit als System.","explain":"Stellen Sie einzelne Werbeaktionen einer fortlaufenden Kommunikation gegenüber. Empfehlungen und bisherige Maßnahmen werden nicht abgewertet; sie können durch regelmäßige Impulse ergänzt werden.","question":"Was passiert zwischen Ihren bisherigen Marketingaktionen?","transition":"Führen Sie zum konkreten Jahresrhythmus mit zwölf Impulsen.","note":"Keine Aussage, dass dauernde Präsenz automatisch Kunden schafft."},{"title":"Ein Impuls vergeht. Regelmäßige Impulse bleiben in Bewegung.","goal":"Den geplanten Jahresablauf anschaulich machen.","core":"Zwölf Monate und zwölf vorgesehene Marketingimpulse schaffen wiederkehrende Kontaktanlässe.","explain":"Erläutern Sie die Monatsfolge als organisatorischen Rhythmus. Nicht jeder einzelne Impuls führt unmittelbar zu einer Anfrage. Die Wiederholung soll Wahrnehmung und Erinnerbarkeit unterstützen.","question":"Wäre ein monatlich geplanter Marketinganlass für Ihr Unternehmen hilfreich?","transition":"Überleiten: Wie lässt sich dieser Rhythmus praktisch umsetzen?","note":"Die grafische Entwicklung ist schematisch, keine Reichweitenprognose."},{"title":"Sie führen Ihr Unternehmen. Der BusinessBooster bringt Struktur.","goal":"Das Lösungssystem als zusammenhängenden Fullservice vorstellen.","core":"Marketingimpulse, Presse und Magazine, Unternehmensprofil, CRM und Marktplatz greifen ineinander.","explain":"Erklären Sie die zentrale Rolle des BusinessBoosters und die verbundenen Bestandteile. Ein roter Faden ist wichtiger als technische Detailtiefe. Die Unternehmer führen ihr Geschäft weiter, während strukturierte Marketingprozesse unterstützt werden.","question":"Welcher der gezeigten Bereiche würde Ihr bisheriges Marketing besonders ergänzen?","transition":"Vom Überblick zum konkret definierten Leistungsumfang wechseln.","note":"Nicht behaupten, sämtliche Arbeit entfalle für das Unternehmen."},{"title":"Ein Fullservice. Ein gemeinsames System.","goal":"Den tatsächlichen Leistungsumfang nachvollziehbar machen.","core":"Impulsmarketing, redaktionelle Sichtbarkeit, Profil, Kundenkommunikation, Angebote und Einarbeitung bilden ein Gesamtpaket.","explain":"Benennen Sie die sechs Bausteine einschließlich zwölf geplanter Impulse, monatlichem Pressebericht, passenden Themenmagazinen und den vorgesehenen Werkzeugen. Erklären Sie Vertiefungen nur dort, wo Fragen entstehen. Angaben und Freigaben des Unternehmens bleiben erforderlich.","question":"Welche dieser Leistungen haben Sie heute bereits organisiert und welche fehlen?","transition":"Vom enthaltenen Leistungspaket zu dessen möglichem Nutzen wechseln.","note":"Leistungsumfang genau wie in der aktuellen Originalpräsentation darstellen."},{"title":"Entscheidend ist, was der Fullservice verändert.","goal":"Den möglichen organisatorischen Nutzen für den Unternehmer herausarbeiten.","core":"Regelmäßigkeit, Entlastung, Kontaktmöglichkeiten, Kundenpflege und Planbarkeit sind mögliche Mehrwerte.","explain":"Führen Sie durch die fünf Nutzenfelder und verbinden Sie sie bei Bedarf mit dem Alltag der Zuhörer. Nicht nur Funktionen aufzählen: Zeigen Sie den zusammenhängenden Ablauf von Planung bis Auswertung.","question":"Wo würde ein verlässlicher Marketingprozess in Ihrem Unternehmen am meisten entlasten?","transition":"Zur wirtschaftlichen Einordnung vergleichbarer Einzelleistungen überleiten.","note":"Ergebnisse hängen von Branche, Zielgruppe, Markt und Umsetzung ab."},{"title":"Was kostet ein vergleichbarer Marketing-Mix?","goal":"Die Größenordnung separat eingekaufter Leistungen veranschaulichen.","core":"Die Folie rechnet mit Beispielpreisen und einer Vergleichssumme; kein allgemeingültiger Marktpreis.","explain":"Erklären Sie die fünf Positionen und den Unterschied zwischen beispielhafter Vergleichsrechnung, zusätzlichem Anzeigenbudget und angenommenem eigenem Zeitaufwand. Die Summe von 2.412 € netto monatlich ist ein Modell, kein Angebot eines bestimmten Wettbewerbers.","question":"Welche Leistungen kaufen Sie heute separat zu und welcher Abstimmungsaufwand entsteht dabei?","transition":"Vom Vergleich zur persönlichen Werteinschätzung des konkreten Pakets führen.","note":"Beispielpreise, Werbebudget und Zeitannahmen nicht als garantierte Ersparnis darstellen."},{"title":"Was wäre dieser Fullservice monatlich wert?","goal":"Eine eigene Preiseinschätzung ermöglichen, bevor die tatsächlichen Konditionen erscheinen.","core":"BusinessBooster Premium: 999 € netto pro Monat, 999 € netto einmaliges Setup und zwölf Monate Vertragslaufzeit.","explain":"Lassen Sie zuerst die persönliche Schätzung zu. Decken Sie den Preis erst danach auf und erläutern Sie Monatsbetrag, Setup und Laufzeit vollständig. Lassen Sie Raum für Verständnisfragen, ohne die Entscheidung vorwegzunehmen.","question":"Wie ordnen Sie das Verhältnis zwischen Leistungsumfang und diesen Konditionen für Ihr Unternehmen ein?","transition":"Die Entscheidung auf der folgenden Folie sachlich vorbereiten.","note":"Keine Preisbestandteile auslassen und keine individuellen Ergebnisse versprechen."},{"title":"Sie kennen das Angebot. Jetzt entscheiden Sie.","goal":"Eine freie und informierte Ja/Nein-Entscheidung ermöglichen.","core":"Bei Ja folgt nach Vertragsabschluss ein vierstufiger Umsetzungsablauf; Nein bleibt eine respektierte Entscheidung.","explain":"Erklären Sie die Ja- und Nein-Optionen ohne Druck. Bei Ja: Business-Interview, Projekt-Setup, Mitarbeiterschulung und Livegang. Die optionale Gegenfinanzierungsvertiefung nur öffnen, wenn hierzu Interesse besteht. Bei Nein kann freiwillig ein Grund genannt werden.","question":"Passt BusinessBooster Premium aktuell zu Ihrem Unternehmen?","transition":"Den gewählten nächsten Schritt bestätigen und das Gespräch wertschätzend beenden.","note":"Keine Bewerbung erfinden; Ja ist nicht gleich sofortiger Livegang. Vertragsabschluss geht voraus."}],"en":[{"title":"BusinessBooster Premium – opening","goal":"Welcome the audience and frame the presentation.","core":"Visibility, connections and growth are the focus of a managed marketing service.","explain":"Greet the business owners and explain what they will see. Do not attempt to sell individual features immediately. Establish the expectation of a complete, coherent overview.","question":"How important is visibility to your business today?","transition":"Move from the objective to the realities of running a business.","note":"Do not promise reach or business results."},{"title":"Your working day is full. Is your marketing calendar?","goal":"Help the audience recognise time pressure, complexity and inconsistent marketing.","core":"Daily operations take time; visibility requires regular attention.","explain":"Explain the three challenges without blaming business owners. Show the tension between day-to-day demands and consistent communication. Open additional details only when useful.","question":"How regularly can you attract the attention of potential new customers today?","transition":"Move from the challenge to changing communication habits.","note":"Do not assume every company faces the same problems."},{"title":"The market does not wait for spare marketing time.","goal":"Explain the difference between isolated campaigns and a planned routine.","core":"A structured system for ongoing visibility, not simply more advertising.","explain":"Compare occasional activity with a recurring schedule. Existing referrals and conventional marketing still have value; regular impulses can complement them.","question":"What happens between your current marketing campaigns?","transition":"Introduce the annual schedule of twelve impulses.","note":"Continuous visibility does not guarantee customers."},{"title":"One impulse fades. Regular impulses keep moving.","goal":"Make the annual rhythm understandable.","core":"Twelve months and twelve planned marketing impulses create repeated opportunities to connect.","explain":"Describe the monthly sequence as an organisational plan. Individual activities may or may not trigger inquiries. Repetition is intended to support awareness and recall.","question":"Would a planned monthly marketing touchpoint help your business?","transition":"Explain how the schedule can be delivered in practice.","note":"The graphic is illustrative, not a reach forecast."},{"title":"You run your business. BusinessBooster adds structure.","goal":"Introduce the complete service as a connected system.","core":"Marketing impulses, press and magazines, company profile, CRM and marketplace work together.","explain":"Explain the core offer and connected elements. Maintain a clear storyline instead of delving into technical details. The business remains responsible for running its operations.","question":"Which of these areas would best complement your current marketing?","transition":"Move from the overview to the defined service components.","note":"Do not imply the business has no responsibilities."},{"title":"One full service. One connected system.","goal":"Make the defined scope of services transparent.","core":"Impulse marketing, editorial visibility, profile, communication, offers and training form the package.","explain":"Explain all six elements, including twelve planned impulses, a monthly press article, relevant themed magazines and the available tools. Expand only when questions arise. The company's information and approvals remain necessary.","question":"Which of these services do you already use, and which are missing?","transition":"Move from features to their potential benefits.","note":"Describe deliverables consistently with the current original deck."},{"title":"What matters is what the service changes.","goal":"Highlight possible operational benefits for the company.","core":"Consistency, relief, contact opportunities, customer care and planning are possible advantages.","explain":"Discuss the five benefit areas and relate them to business operations. Explain the continuous process from planning through evaluation rather than listing features alone.","question":"Where would a reliable marketing process save your team the most effort?","transition":"Move to an economic comparison of purchased services.","note":"Results depend on industry, audience, market and implementation."},{"title":"What does a comparable marketing mix cost?","goal":"Illustrate the cost of separately purchased services.","core":"The example calculation is a model, not a universal market rate.","explain":"Explain the five example items, the comparison total and the separately illustrated advertising budget and assumed internal effort. The figure of EUR 2,412 net per month represents an example, not a competitor's quotation.","question":"Which services do you buy separately, and how much coordination do they require?","transition":"Move to the audience's own assessment of value.","note":"Do not present example costs or time estimates as guaranteed savings."},{"title":"What would the full service be worth monthly?","goal":"Let the audience estimate value before the real price is shown.","core":"BusinessBooster Premium: EUR 999 net per month, EUR 999 net one-off setup and a 12-month term.","explain":"Allow the audience to estimate first, then reveal the price. Explain monthly fees, setup and term in full. Make space for questions without pressuring anyone into a decision.","question":"How do the service scope and terms compare with your business needs?","transition":"Prepare the following decision slide.","note":"Never omit price components or promise specific returns."},{"title":"You know the offer. Now you decide.","goal":"Enable a free and informed yes/no decision.","core":"A yes leads to four implementation steps after contracting; a no is respected.","explain":"Explain both options without pressure. For yes: business interview, project setup, staff training and go-live. Open the optional cost-offset information only on request. A reason for no is entirely voluntary.","question":"Is BusinessBooster Premium a good fit for your company right now?","transition":"Confirm the selected next step and close respectfully.","note":"Do not replace the contracting process with an application."}]},"world":{"de":[{"title":"Eine Leistungswelt. Viele Möglichkeiten.","goal":"Die unternehmerische Perspektive der Leistungswelt eröffnen.","core":"Eine Ausstattung verbindet Wissen, Geschäftswerkzeuge und Netzwerk.","explain":"Begrüßen Sie die Zuhörer und ordnen Sie das Angebot als unternehmerische Leistungswelt ein. Es geht um nutzbare Leistungen, nicht um Kapitalanlagen oder passives Einkommen.","question":"Was müsste eine unternehmerische Plattform für Sie leisten?","transition":"Zum Ablauf und den Fragen des Webinars führen.","note":"Keine Investmentversprechen und keine pauschalen Einkommenszusagen."},{"title":"Was erwartet dich in diesem Webinar?","goal":"Orientierung über Ablauf und Themen geben.","core":"Leistungen, Mehrwerte und Aufbau von Kundenbeziehungen werden systematisch erklärt.","explain":"Stellen Sie die drei Leitfragen vor: Was bietet die Leistungswelt, wem nützt sie und wie kann ein eigener Kundenbestand entstehen? Erläutern Sie den informativen Charakter der Präsentation.","question":"Welche der drei Fragen ist für Sie besonders interessant?","transition":"Die Entstehungsidee und die Verbindung der Angebote vorstellen.","note":"Bildung und Geschäftsmöglichkeiten klar von Kapitalanlagen abgrenzen."},{"title":"Warum gibt es den LiquidityBooster?","goal":"Die gemeinsame Idee hinter den Angeboten verständlich machen.","core":"Menschen, Unternehmer und Experten sollen einfacher zueinanderfinden.","explain":"Stellen Sie die unterschiedlichen Bedürfnisse dar: Orientierung für Menschen, Sichtbarkeit für Unternehmen und Reichweite für Experten. Verweisen Sie auf Akademie, BusinessBooster, Hörsaal, Marktplatz und Netzwerk als Bausteine.","question":"In welchem dieser Bereiche sehen Sie heute den größten Bedarf?","transition":"Von der Idee zu den zwei möglichen Einstiegswegen überleiten.","note":"Nicht alle Bereiche als sofortige Umsatzerlöse darstellen."},{"title":"Dein bestehendes Business – oder ein neuer Anfang.","goal":"Zwei mögliche berufliche Ausgangssituationen unterscheiden.","core":"Bestehendes Geschäft erweitern oder eine neue Tätigkeit aufbauen; eine ClubLeader-Ausstattung pro Unternehmer.","explain":"Erläutern Sie, dass der direkte Einstieg und der Einstieg über BusinessBooster beziehungsweise Hörsaal zur gleichen Ausstattung führen. Zusätzliche Produkte ergänzen das Modell, erzeugen aber keine zweite Mitgliedschaft.","question":"Geht es Ihnen eher um die Erweiterung Ihres Geschäfts oder einen neuen Start?","transition":"Das gemeinsame technische Fundament beider Wege zeigen.","note":"Unternehmerische Ergebnisse erfordern Nachfrage, Aktivität und passende Verträge."},{"title":"Dein Geschäft braucht ein verlässliches Fundament.","goal":"Die Infrastruktur als Arbeitsgrundlage sichtbar machen.","core":"Persönliches KMS, eigene Präsenz, Werkzeuge und Begleitung unterstützen den Geschäftsaufbau.","explain":"Zeigen Sie die schematische KMS-Ansicht mit Kontakten, Gruppen, Kommunikation und Organisation. Erklären Sie den Nutzen für kontinuierliche Betreuung. Die angezeigten Kennzahlen sind keine echten Live-Daten.","question":"Wie organisieren Sie derzeit Kontakte und Nachfassaktionen?","transition":"Vom Fundament zum ersten konkreten Produktbeispiel wechseln.","note":"KMS-Demo-Zahlen nicht als echte Leistungsnachweise darstellen."},{"title":"Sichtbarkeit entsteht nicht durch Zufall.","goal":"Das Impulsmarketing als eigenständige Produktleistung erklären.","core":"Der BusinessBooster kombiniert wiederkehrende Impulse mit passenden Kommunikationswegen.","explain":"Nutzen Sie die Jahresgrafik und vertiefenden Felder, um geplante Wiederholung, Zielgruppenbezug und Wiedererkennung zu erläutern. Bei einem Ersteinstieg ist die ClubLeader-Ausstattung enthalten.","question":"Welche wiederkehrenden Themen könnten Ihr Unternehmen sichtbar machen?","transition":"Vom Marketingangebot zum Wissens- und Expertenangebot führen.","note":"Keine garantierten Marketingergebnisse suggerieren."},{"title":"Aus Fachwissen wird verständliche Orientierung.","goal":"Den Unternehmer-Hörsaal als eigenes Angebot verständlich machen.","core":"Expertise kann strukturiert erklärt und für Interessenten zugänglich gemacht werden.","explain":"Unterscheiden Sie den Mehrwert für Unternehmen, Interessenten und ClubLeader. Erläutern Sie, dass neue Hörsaal-Kunden ClubLeader inklusive erhalten und bestehende ClubLeader den Hörsaal ergänzen können.","question":"Welches Fachthema Ihres Unternehmens verdient eine verständliche Darstellung?","transition":"Vom Wissensangebot zu eigenen Produkten und Empfehlungen überleiten.","note":"Provisionsaussagen nur im Rahmen berechtigter Umsätze und geltender Produktregeln."},{"title":"Eigene Angebote. Neue Empfehlungswege.","goal":"Die Trennung von Anbieterleistung und Empfehlungsweg zeigen.","core":"Anbieter stellen Leistungen bereit; die Community kann geeignete Angebote empfehlen.","explain":"Erklären Sie die beispielhafte 80/20-Aufteilung beim freigegebenen Marktplatzangebot. Die eigene Anbieterleistung bleibt verantwortlich beim Anbieter; die Empfehlungsvergütung bezieht sich auf den vorgesehenen Plattformanteil.","question":"Welche Ihrer Leistungen könnten sich für einen Marktplatz eignen?","transition":"Von der einzelnen Angebotsmöglichkeit zu unterschiedlichen Branchen wechseln.","note":"80/20 ist eine Modellaufteilung, nicht der Nettoertrag jedes Beteiligten."},{"title":"Eine Leistungswelt. Unternehmerische Möglichkeiten.","goal":"Die Branchenvielfalt verständlich machen.","core":"BusinessBooster, Hörsaal, Marktplatz und Netzwerk können je nach Branche unterschiedliche Bedürfnisse bedienen.","explain":"Zeigen Sie die vier Bereiche anhand nachvollziehbarer Unternehmenstypen. Wichtig ist nicht, jede Leistung jedem zu verkaufen, sondern Bedarf zu erkennen und passende Menschen zu verbinden.","question":"Wo sehen Sie in Ihrer Branche die größte ungenutzte Möglichkeit?","transition":"Von praktischen Einsatzgebieten zum Vertriebsportfolio führen.","note":"Nicht behaupten, dass jede Branche jeden Baustein gleichermaßen benötigt."},{"title":"Sechs Produkte. Ein wachsendes Geschäft.","goal":"Die Produktarchitektur ohne Doppelzählungen erklären.","core":"Drei BusinessBooster- und drei Hörsaal-Varianten bilden das Vertriebsportfolio; ergänzende Angebote gelten nach eigenen Regeln.","explain":"Erläutern Sie die jeweils drei Varianten und die ergänzenden Möglichkeiten über Marktplatz und Akademie. ClubLeader ist die gemeinsame Ausstattung; zusätzliche Produktbuchungen lösen nicht automatisch eine zweite Mitgliedschaft aus.","question":"Welche Produktfamilie würden Sie zuerst gründlich kennenlernen wollen?","transition":"Vom Portfolio zum Prinzip persönlicher Empfehlungen überleiten.","note":"Vergütung und Produktpreise nicht pauschal zwischen Varianten gleichsetzen."},{"title":"Kennst du jemanden, für den das passen könnte?","goal":"Die Bedeutung persönlicher Kontakte veranschaulichen.","core":"Empfehlungen entstehen von Mensch zu Mensch; drei Ebenen sind ein Modell, kein Automatismus.","explain":"Nutzen Sie das Gedankenexperiment mit den drei Vergütungsstufen 20, 15 und 10 Prozent als Illustration. Rechnen Sie nicht mit sicheren Zusagen, sondern sprechen Sie über tatsächliche Entscheidungen, bezahlte Umsätze und aktive Betreuung.","question":"Welche Menschen kennen Sie, für die eine dieser Leistungen sinnvoll sein könnte?","transition":"Vom Netzwerkgedanken zum Kundenbestandsmodell überleiten.","note":"Modellannahmen niemals als prognostizierte Partnerzahlen darstellen."},{"title":"Ein Kunde. Dann weitere. Bestand wächst.","goal":"Wiederkehrende Produktabrechnungen rechnerisch erklären.","core":"Der Simulator zeigt Szenarien unter ausdrücklich angenommenen Fortführungen.","explain":"Demonstrieren Sie den Unterschied zwischen monatlichen Neuabschlüssen und fortbestehendem Kundenbestand. Die Darstellung verwendet BusinessBooster Premium und Hörsaal Plus; Ergebnisse sind Modellprovisionen, weder Gewinn noch Einkommenszusage.","question":"Welche Annahmen müssten bei Ihnen erfüllt sein, damit ein solcher Bestand tragfähig wäre?","transition":"Vom Zahlenmodell zur vollständigen ClubLeader-Leistungswelt führen.","note":"Keine Einkommensgarantien; Kosten, Kündigungen und tatsächliche Nachfrage bleiben relevant."},{"title":"Die ClubLeader-Leistungswelt auf einen Blick.","goal":"Alle sieben Bereiche der Ausstattung zu einem Gesamtbild verbinden.","core":"Infrastruktur, Sichtbarkeit, Marktplatz, Abrechnung, Produkte, Ausbildung und Community greifen ineinander.","explain":"Gehen Sie die sieben anklickbaren Bereiche bewusst durch. Nutzen Sie die Mehrwert- und Reflexionsfelder nur zur Vertiefung. Diese Übersicht soll das zuvor Erklärte zusammenführen, nicht sieben neue Einzelvorträge eröffnen.","question":"Welcher der sieben Bereiche würde Sie in Ihrer Arbeit am stärksten unterstützen?","transition":"Vom Gesamtbild zur eigenen Einschätzung des Mitgliedschaftswerts führen.","note":"Ausstattung und wirtschaftliches Ergebnis ausdrücklich unterscheiden."},{"title":"Was kostet die vollständige Leistungswelt im Monat?","goal":"Die Werteinschätzung vor der tatsächlichen Preisaufdeckung ermöglichen.","core":"Direkter ClubLeader-Einstieg: 189 € netto je Halbjahr, rechnerisch 31,50 € netto pro Monat.","explain":"Lassen Sie zunächst eine Schätzung zu. Zeigen Sie dann den tatsächlichen Halbjahresbetrag und erklären Sie, dass die Monatszahl nur eine Rechengröße ist. Beim Einstieg über BusinessBooster oder Hörsaal ist die Ausstattung bereits enthalten.","question":"Wie bewerten Sie diesen Zugang im Verhältnis zu den gezeigten Werkzeugen?","transition":"Zur persönlichen Entscheidung und gegebenenfalls einem Gespräch überleiten.","note":"Keine monatliche Abbuchung oder garantierte Einkünfte suggerieren."},{"title":"Deine Möglichkeiten. Deine Entscheidung.","goal":"Das Webinar ohne Druck zu einer persönlichen Prüfung führen.","core":"Interesse bekunden, kennenlernen und anschließend selbst entscheiden.","explain":"Erläutern Sie die drei Schritte der Originalpräsentation: Interesse bekunden, persönliches Gespräch, eigene Entscheidung. Eine Bewerbung ist hier lediglich eine Interessensbekundung, noch kein Vertragsabschluss.","question":"Möchten Sie in einem persönlichen Gespräch prüfen, ob das zu Ihrer Situation passt?","transition":"Die Fragen aufnehmen und die Präsentation verbindlich, aber offen beenden.","note":"Keinen automatischen Abschluss oder eine Erfolgsgarantie behaupten."}],"en":[{"title":"One service world. Many possibilities.","goal":"Open the entrepreneurial perspective of the service portfolio.","core":"One setup connects knowledge, business tools and a network.","explain":"Welcome the audience and describe a practical business service ecosystem. This is about usable services rather than investments or passive income.","question":"What should a business platform help you achieve?","transition":"Introduce the webinar outline.","note":"No investment promises or general earnings claims."},{"title":"What can you expect from this webinar?","goal":"Provide a clear overview of the agenda.","core":"Services, benefits and building customer relationships are explained systematically.","explain":"Introduce the three central questions: What is offered, who benefits and how might a customer base be established? Present the webinar as an explanation, not a promise.","question":"Which of these questions matters most to you?","transition":"Introduce the idea behind the ecosystem.","note":"Keep educational and business services separate from investments."},{"title":"Why does LiquidityBooster exist?","goal":"Explain the common purpose connecting the services.","core":"People, businesses and experts should find one another more easily.","explain":"Describe three needs: understanding for individuals, visibility for businesses and suitable audiences for experts. Present the academy, BusinessBooster, lecture hall, marketplace and network as connected parts.","question":"Where do you see the strongest unmet need?","transition":"Introduce the two routes into the model.","note":"Do not present every area as a guaranteed revenue source."},{"title":"Your existing business – or a new beginning.","goal":"Distinguish two possible starting positions.","core":"Expand an existing business or start a new activity, using one ClubLeader setup per entrepreneur.","explain":"Explain that direct entry and entry through BusinessBooster or the lecture hall lead to the same setup. Additional products extend the model but do not create a second membership.","question":"Are you more interested in expanding an existing business or starting something new?","transition":"Explain the shared technical foundation.","note":"Results require real demand, activity and viable contracts."},{"title":"Your business needs a dependable foundation.","goal":"Show the infrastructure as a practical working base.","core":"Personal KMS, online presence, tools and training support business development.","explain":"Show the schematic KMS interface with contacts, groups, communication and organisation. Explain the value of following up systematically. The on-screen numbers are not live business data.","question":"How do you organise contacts and follow-ups now?","transition":"Move to the first concrete service.","note":"Never present demo figures as actual performance."},{"title":"Visibility does not happen by chance.","goal":"Explain impulse marketing as a distinct product service.","core":"BusinessBooster combines recurring impulses with suitable communication channels.","explain":"Use the annual illustration and optional detail views to describe planning, audience relevance and recognition. First-time customers receive the ClubLeader setup as part of their entry.","question":"What recurring themes might help your business stay visible?","transition":"Move from marketing to the expertise-based offer.","note":"Do not imply guaranteed marketing results."},{"title":"Expertise becomes understandable guidance.","goal":"Explain the entrepreneur lecture hall as a separate offer.","core":"Professional knowledge can be presented in an accessible, structured way.","explain":"Distinguish the benefits for companies, interested audiences and ClubLeaders. New lecture hall customers receive ClubLeader included; existing ClubLeaders can add the lecture hall.","question":"Which subject from your professional expertise deserves a clear explanation?","transition":"Move from expertise to products and referrals.","note":"Discuss commissions only for eligible sales under the product rules."},{"title":"Your own offers. New referral channels.","goal":"Distinguish the provider's role from referral activity.","core":"Providers offer services while the community may recommend suitable offers.","explain":"Explain the example 80/20 split for an approved marketplace offer. Responsibility for delivery remains with the provider; referral commissions are based on the specified platform share.","question":"Which of your services might fit a marketplace?","transition":"Move from individual offers to different industries.","note":"The 80/20 example is not a net-profit calculation."},{"title":"One portfolio. Many business opportunities.","goal":"Demonstrate how different industries can benefit.","core":"BusinessBooster, lecture hall, marketplace and network solve different needs in different sectors.","explain":"Illustrate the four areas with practical examples. The goal is to identify a relevant need and connect the right people, not push every service onto every company.","question":"Where does your sector have the greatest untapped opportunity?","transition":"Move from use cases to the product portfolio.","note":"Not every service suits every industry."},{"title":"Six products. A growing business.","goal":"Explain the product structure without double-counting.","core":"Three BusinessBooster and three lecture hall tiers make up the core sales portfolio.","explain":"Describe the three tiers of each family and additional marketplace and academy opportunities. ClubLeader provides the common setup; purchasing more products does not automatically generate another membership fee.","question":"Which product family would you choose to learn first?","transition":"Introduce personal recommendations.","note":"Product terms and commission rules differ by tier."},{"title":"Do you know someone this could suit?","goal":"Illustrate the importance of personal relationships.","core":"Referrals happen person to person; a three-level model is not automatic growth.","explain":"Use the thought experiment and three commission levels of 20, 15 and 10 percent as an illustration. Stress real decisions, paid eligible sales and ongoing relationship management.","question":"Who do you know who might genuinely benefit from one of these services?","transition":"Move from referrals to the customer-base simulator.","note":"Never present hypothetical partner counts as forecasts."},{"title":"One customer. Then more. The base grows.","goal":"Explain recurring product billings as a calculation.","core":"The simulator shows scenarios based on explicitly assumed continuation.","explain":"Demonstrate the difference between new monthly contracts and retained customers. The model uses BusinessBooster Premium and lecture hall Plus. The displayed figures are model commissions, not profit or an income promise.","question":"Which assumptions would need to hold for a customer base to remain sustainable?","transition":"Move from the calculation to the full set of ClubLeader services.","note":"No earnings guarantees; costs, cancellations and real demand matter."},{"title":"The ClubLeader world at a glance.","goal":"Bring the seven service areas together.","core":"Infrastructure, visibility, marketplace, billing, products, training and community connect.","explain":"Walk through the seven clickable areas. Use benefit and reflection detail only as needed. This is a synthesis of previous slides, not seven completely new presentations.","question":"Which of the seven areas would support your work most?","transition":"Move from the big picture to perceived membership value.","note":"Distinguish access to tools from commercial results."},{"title":"What does the complete service world cost monthly?","goal":"Let viewers estimate the value before revealing actual terms.","core":"Direct ClubLeader entry: EUR 189 net per half-year, equivalent to EUR 31.50 net per month.","explain":"Invite an estimate first. Reveal the half-year fee and explain the monthly figure is only a mathematical comparison. Entry through BusinessBooster or the lecture hall already includes the setup.","question":"How does the access cost compare with the tools and guidance presented?","transition":"Move to the viewer's personal decision.","note":"Do not imply monthly billing or guaranteed income."},{"title":"Your possibilities. Your decision.","goal":"Close with a pressure-free opportunity to explore.","core":"Express interest, talk personally, then decide independently.","explain":"Explain the three steps from the original deck: express interest, get to know the details and make a decision. An application is an expression of interest, not a binding contract.","question":"Would you like a personal conversation to see whether this fits your situation?","transition":"Answer remaining questions and close respectfully.","note":"Do not suggest automatic acceptance, contracts or financial results."}]}};

r","inviteText":"Understands the audience and presentations, invites prospects and follows up on questions. Webinar speaker approval is not needed for this role.","speakerTitle":"Approved webinar speaker","speakerText":"Can guide the slides, manage time, ask relevant questions and close professionally. Independent delivery of the official BusinessBooster webinar requires training and approval.","guideTitle":"Slide-by-slide guides – online reference","guideIntro":"Each slide guide explains the objective, main message and how to discuss it clearly. Reflection questions support relevant deeper discussion.","tabBusiness":"BusinessBooster · 10 slides","tabWorld":"Service World · 15 slides","goal":"Slide objective","core":"Core message","explain":"How to explain it","question":"Suggested reflection question","transition":"Transition to the next slide","note":"Important note","pdfTitle":"Printable guides for meetings and presentations","pdfText":"Download the full conversation guide or a concise conversation cheat sheet for preparation and meetings. Full slide guides and compact cheat sheets are also available for both presentations.","footer":"ClubLeader · Conversation and Presentation Workshop","downloadError":"The PDF download could not be started in this browser."}};

const CONVERSATION={"de":[{"title":"Warm-up – Beziehung aufbauen","goal":"Eine offene, respektvolle Gesprächsatmosphäre schaffen, bevor geschäftliche Fragen gestellt werden.","approach":"Begrüßen Sie Ihr Gegenüber persönlich. Sprechen Sie kurz über den Anlass des Treffens, die Region oder den Unternehmensalltag. Hören Sie zu und vermeiden Sie eine einstudierte Verkaufseröffnung.","question":"Wie geht es Ihnen derzeit mit Ihrem Unternehmen? Wie sind Sie zu Ihrer heutigen Tätigkeit gekommen?","transition":"Darf ich Ihnen ein paar Fragen stellen, um Ihre Situation und Ihre Ziele besser zu verstehen?","note":"Smalltalk ist kein Trick. Bleiben Sie authentisch und achten Sie auf die Zeit Ihres Gegenübers."},{"title":"Bedarfsanalyse – Situation und Ziele verstehen","goal":"Herausfinden, welche Wünsche, Herausforderungen und Prioritäten der Unternehmer tatsächlich hat.","approach":"Stellen Sie offene Fragen, hören Sie aktiv zu und fragen Sie bei allgemeinen Aussagen konkret nach. Erkundigen Sie sich nach bisherigen Versuchen, Zielgruppen und gewünschten Veränderungen. Fassen Sie die Aussagen ohne eigene Bewertung zusammen.","question":"Was läuft bereits gut? Was möchten Sie verbessern? Was haben Sie schon ausprobiert? Was wäre für Sie eine spürbare Verbesserung?","transition":"Wenn ich Sie richtig verstanden habe, ist Ihnen vor allem ... wichtig. Habe ich das korrekt zusammengefasst?","note":"Mehr Kunden ist noch keine fertige Diagnose. Fragen Sie nach der Ursache und drängen Sie nicht vorschnell zur Präsentation."},{"title":"Lösungen aufzeigen – passend zum Bedarf","goal":"Nur die Möglichkeiten vorstellen, die erkennbar zum bestätigten Bedarf passen.","approach":"Ordnen Sie den Bedarf gemeinsam ein: BusinessBooster für die Sichtbarkeit eines bestehenden Unternehmens, Leistungswelt für weitergehende unternehmerische Möglichkeiten. Beides kann passen, muss aber nicht. Holen Sie die Erlaubnis ein, den ausgewählten Ansatz vorzustellen.","question":"Wäre es hilfreich, wenn ich Ihnen einen Ansatz zeige, der genau an diesem Punkt ansetzt?","transition":"Ich zeige Ihnen zunächst den Zusammenhang. Danach können wir in Ruhe prüfen, ob er für Sie passt.","note":"Unsere Lösungen sind keine Pflichtstation. Falls keine passt, sagen Sie das offen."},{"title":"Dialog führen – Fragen und Vertiefung","goal":"Verständnis sichern und gemeinsam herausarbeiten, was für den Unternehmer wirklich relevant ist.","approach":"Unterbrechen Sie einen Monolog zugunsten echter Rückfragen. Nutzen Sie bei Bedarf die Vertiefungen der Originalpräsentation. Lassen Sie Unklarheiten stehen, bis sie nachvollziehbar beantwortet sind; versprechen Sie nichts, was das Angebot nicht leistet.","question":"Was davon ist für Sie besonders interessant? Welche Frage ist für Ihre Entscheidung noch offen?","transition":"Wenn die wichtigsten Fragen geklärt sind, schauen wir uns an, wie eine passende Zusammenarbeit konkret aussehen könnte.","note":"Ein Einwand ist zunächst eine Information. Nicht dagegen argumentieren, bevor die eigentliche Sorge verstanden ist."},{"title":"Angebot unterbreiten – konkret und verständlich","goal":"Eine nachvollziehbare Entscheidungsvorlage machen, die zum bestätigten Bedarf und zum tatsächlichen Leistungsumfang passt.","approach":"Benennen Sie die konkrete Leistung, die geltenden Konditionen, die Mitwirkung des Unternehmers und den Ablauf. Verwenden Sie die jeweils aktuellen Originalunterlagen; erfinden Sie keine Sonderleistungen, Preise oder Erfolgsgarantien.","question":"Wäre das in dieser Form für Ihr Unternehmen interessant? Welchen Punkt sollten wir noch klären?","transition":"Sie kennen jetzt den Vorschlag und die Rahmenbedingungen. Wie möchten Sie damit umgehen?","note":"Ein Angebot darf nur das enthalten, was tatsächlich vereinbart und leistbar ist."},{"title":"Abschluss – eine freie Entscheidung ermöglichen","goal":"Eine klare Entscheidung ohne Druck ermöglichen, einschließlich Nein oder zusätzlichem Klärungsbedarf.","approach":"Fragen Sie sachlich nach der Entscheidung. Bei Ja bestätigen Sie die vereinbarten Eckpunkte. Bei Nein bedanken Sie sich und respektieren die Wahl. Bei offenen Fragen vereinbaren Sie nur mit Zustimmung einen konkreten Folgeschritt.","question":"Passt das für Sie und möchten Sie damit starten, oder wünschen Sie noch Bedenkzeit?","transition":"Bei einer Zusage folgt eine persönliche Begrüßung. Andernfalls wird das Gespräch respektvoll abgeschlossen.","note":"Kein künstlicher Zeitdruck, keine unterstellte Zustimmung und keine automatisch verbindliche Zusage."},{"title":"Begrüßung – willkommen heißen","goal":"Nach einer positiven Entscheidung Wertschätzung zeigen und Orientierung geben.","approach":"Bedanken Sie sich für das Vertrauen und begrüßen Sie den neuen Kunden oder ClubLeader persönlich. Bestätigen Sie, welche Entscheidung getroffen wurde und wer künftig der Ansprechpartner ist.","question":"Gibt es noch etwas, das Ihnen für einen guten Start wichtig ist?","transition":"Lassen Sie uns direkt die nächsten konkreten Schritte miteinander abstimmen.","note":"Diese Phase gilt nur bei einer tatsächlich positiven Entscheidung, nicht bei einem Nein oder einer offenen Prüfung."},{"title":"Nächster Schritt – die Zusammenarbeit beginnen","goal":"Einen klaren, verlässlichen Übergang vom Gespräch zur vereinbarten Umsetzung schaffen.","approach":"Halten Sie fest, wer welchen Schritt übernimmt, welche Unterlagen oder Informationen erforderlich sind und wann die nächste Rückmeldung erfolgt. Nutzen Sie die bestehenden Systeme und abgestimmten Prozesse; versenden Sie nichts ohne erforderliche Einwilligung.","question":"Was übernehmen wir als Nächstes, und wann passt Ihnen die nächste Abstimmung?","transition":"Fassen Sie die Vereinbarungen kurz zusammen und beenden Sie das Gespräch verbindlich und freundlich.","note":"Ein guter Abschluss ist erst vollständig, wenn beide Seiten wissen, wie es weitergeht."}],"en":[{"title":"Warm-up – build rapport","goal":"Create an open, respectful atmosphere before asking business questions.","approach":"Greet the other person personally. Briefly discuss the reason for meeting, the region or their working day. Listen and avoid a rehearsed sales pitch.","question":"How are things going in your business right now? How did you get into this line of work?","transition":"May I ask a few questions to better understand your situation and goals?","note":"Small talk is not a trick. Stay authentic and respect the other person's time."},{"title":"Needs analysis – understand the situation and goals","goal":"Discover what the entrepreneur really wants, what is difficult and what matters most.","approach":"Ask open questions, listen actively and clarify general statements. Explore previous efforts, audiences and desired changes. Summarize the answers without judging them.","question":"What is already working well? What would you like to improve? What have you tried? What would count as a real improvement?","transition":"If I understood correctly, your main priority is ... Have I got that right?","note":"More customers is not yet a complete diagnosis. Explore the underlying problem before showing slides."},{"title":"Show solutions – match the identified need","goal":"Present only options that may genuinely fit the confirmed need.","approach":"Discuss the options together: BusinessBooster for visibility of an existing business and the Service World for broader entrepreneurial opportunities. One, both or neither might fit. Ask permission to introduce the relevant approach.","question":"Would it help if I showed you an approach that directly addresses that point?","transition":"Let me explain the idea first. Then we can decide together whether it is relevant.","note":"Our offerings are not mandatory steps. If neither fits, say so openly."},{"title":"Dialogue and deeper discussion","goal":"Check understanding and explore the aspects that genuinely matter to the entrepreneur.","approach":"Make room for questions instead of delivering a monologue. Use the original presentation's additional details when relevant. Address uncertainties carefully and promise no features or outcomes the offer cannot deliver.","question":"Which part matters most to you? What is still unclear before you can decide?","transition":"Once the important questions are answered, we can look at what working together could involve.","note":"An objection is information first. Understand the concern before responding."},{"title":"Make a clear offer","goal":"Present a concrete proposal matching the confirmed need and the actual service.","approach":"Explain the specific service, current terms, the entrepreneur's contribution and the process. Follow the current original materials; do not invent special features, prices or guarantees.","question":"Could this be relevant for your business? What should we clarify before deciding?","transition":"You now know the proposal and its conditions. How would you like to proceed?","note":"Only offer what can actually be provided and agreed."},{"title":"Close – enable a free decision","goal":"Allow a clear decision without pressure, including no or a need for further clarification.","approach":"Ask for a decision calmly. If yes, confirm the agreed points. If no, thank the person and respect their choice. If questions remain, agree a follow-up only with their consent.","question":"Does this suit you and would you like to proceed, or would you prefer more time to consider?","transition":"After a yes, welcome the person. Otherwise, close the conversation respectfully.","note":"No artificial urgency, assumed consent or automatically binding commitment."},{"title":"Welcome – start on the right foot","goal":"After a positive decision, show appreciation and give clear orientation.","approach":"Thank the new customer or ClubLeader for their trust and welcome them personally. Confirm the decision and who will be their contact person.","question":"Is there anything else that matters to you for a good start?","transition":"Let's agree the next practical steps together.","note":"This phase applies only after an actual yes, not after a no or pending decision."},{"title":"Next steps – begin the collaboration","goal":"Make the transition from conversation to implementation clear and reliable.","approach":"Agree who does what, which details or documents are needed, and when the next update will happen. Use the established systems and workflows; do not send messages without the required consent.","question":"Who will handle the next steps, and when would a follow-up suit you?","transition":"Briefly summarize the agreement and end the meeting in a friendly, reliable way.","note":"A good close is complete when both sides know what happens next."}]};

function col(hex){const h=hex.replace("#","");return [0,2,4].map(p=>(parseInt(h.slice(p,p+2),16)/255).toFixed(3)).join(" ")}
function pdfLatin(s){

function lit(s){return pdfLatin(s).replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)")}
class PDFPage{
 constructor(){this.ops=[]}

 rect(x,y,w,h,fill){this.ops.push(col(fill)+" rg "+x.toFixed(2)+" "+y.toFixed(2)+" "+w.toFixed(2)+" "+h.toFixed(2)+" re f")}
 wrap(s,x,y,maxWidth,size=10,lineHeight=14,bold=false,color="#253345"){
 const words=String(s).split(/\s+/);let line="",lines=[];const maxChars=Math.max(10,Math.floor(maxWidth/(size*.53)));
 for(const word of words){if(!word)continue;const proposal=line?line+" "+word:word;if(proposal.length>maxChars&&line){lines.push(line);line=word}else line=proposal}if(line)lines.push(line);
 for(const l of lines){this.text(l,x,y,size,bold,color);y-=lineHeight}return y
 }
}

 const pageIds=[];
 for(const page of pageOps){const stream=page.ops.join("\n")+"\n";const contentId=objs.push("<< /Length "+stream.length+" >>\nstream\n"+stream+"endstream");const pageId=objs.push("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+PAGE_W+" "+PAGE_H+"] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents "+contentId+" 0 R >>");pageIds.push(pageId)}
 objs[0]="<< /Type /Catalog /Pages 2 0 R >>";
 objs[1]="<< /Type /Pages /Kids ["+pageIds.map(i=>i+" 0 R").join(" ")+"] /Count "+pageIds.length+" >>";
 let output="%PDF-1.4\n%FSA-CL\n",offsets=[0];
 for(let i=0;i<objs.length;i++){offsets.push(output.length);output+=(i+1)+" 0 obj\n"+objs[i]+"\nendobj\n"}
 const xref=output.length;output+="xref\n0 "+(objs.length+1)+"\n0000000000 65535 f \n";
 for(let i=1;i<offsets.length;i++)output+=String(offsets[i]).padStart(10,"0")+" 00000 n \n";
 output+="trailer\n<< /Size "+(objs.length+1)+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF";

const PDF_HANDOFF_DB="lb-clubleader-werkstatt-pdf-handoff-v1";
const PDF_HANDOFF_STORE="files";
let pdfBusy=false;
function openHandoffDb(){
 return new Promise((resolve,reject)=>{
  if(typeof indexedDB==="undefined")return reject(new Error("IndexedDB nicht verfügbar"));
  const request=indexedDB.open(PDF_HANDOFF_DB,1);
  request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains(PDF_HANDOFF_STORE))request.result.createObjectStore(PDF_HANDOFF_STORE,{keyPath:"token"})};
  request.onsuccess=()=>resolve(request.result);
  request.onerror=()=>reject(request.error||new Error("PDF-Speicher nicht verfügbar"));
 });
}
async function storePdfForHandoff(blob,filename,format,lang){
 const db=await openHandoffDb();
 const token=typeof crypto!=="undefined"&&typeof crypto.randomUUID==="function"?crypto.randomUUID():(Date.now().toString(36)+"-"+Math.random().toString(36).slice(2));
 const record={token,blob,filename,format,created:new Intl.DateTimeFormat(lang==="de"?"de-DE":"en-GB",{dateStyle:"medium",timeStyle:"short"}).format(new Date()),createdAt:Date.now()};
 try{
  await new Promise((resolve,reject)=>{
   const tx=db.transaction(PDF_HANDOFF_STORE,"readwrite");
   tx.objectStore(PDF_HANDOFF_STORE).put(record);
   tx.oncomplete=()=>resolve();
   tx.onerror=()=>reject(tx.error||new Error("PDF konnte nicht bereitgestellt werden"));
   tx.onabort=()=>reject(tx.error||new Error("PDF-Speicherung wurde abgebrochen"));
  });
  return token;
 }finally{db.close()}
}
function pdfHandoffLink(token,action,lang){

}
