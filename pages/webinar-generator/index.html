<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>LiquidityBooster · Webinar-Generator</title>
<style>
:root{--navy:#132238;--mint:#00a7ad;--mag:#c6006f;--bg:#eef4f5;--line:#d8e4e8;--muted:#607080}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--navy);background:var(--bg)}
body{padding:18px}
.wrap{width:min(980px,100%);margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:clamp(24px,5vw,44px);box-shadow:0 18px 50px rgba(19,34,56,.08)}
.eyebrow{font-size:12px;letter-spacing:.13em;text-transform:uppercase;font-weight:900;color:var(--mint)}
h1{font-size:clamp(30px,5vw,48px);line-height:1.05;margin:10px 0 12px}
p{font-size:17px;line-height:1.6;color:var(--muted);max-width:760px;margin:0}
.accent{height:6px;width:150px;border-radius:99px;background:linear-gradient(90deg,var(--mint),var(--mag));margin-top:24px}
</style>
</head>
<body>
<div class="wrap">
  <main class="card">
    <div class="eyebrow">Club Partner Werkzeug</div>
    <h1>Webinar-Generator</h1>
    <p>Der neue A5-Webinar-Generator wird hier aufgebaut. Die vier Vorlagen werden im Unterordner <strong>vorlagen</strong> hinterlegt und anschließend in den Generator eingebunden.</p>
    <div class="accent"></div>
  </main>
</div>
</body>
</html>
