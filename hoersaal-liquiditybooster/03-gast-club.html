<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>03 Gast & Club | LiquidityBooster Hörsaal</title>
<style>
:root{--mint:#00a7ad;--mag:#c6006f;--navy:#132238;--line:#dbe8eb;--muted:#6f7d89}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#fff;color:var(--navy)}.load{min-height:100vh;display:grid;place-items:center;padding:30px;background:linear-gradient(120deg,#fff,#f3fcfc,#fff5fa)}.box{text-align:center;max-width:620px;padding:36px;border:1px solid var(--line);border-radius:30px;background:#fff;box-shadow:0 18px 48px rgba(19,34,56,.08)}.dot{width:54px;height:54px;border-radius:50%;margin:0 auto 18px;border:5px solid #dceced;border-top-color:var(--mint);border-right-color:var(--mag);animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}h1{font-size:28px;margin:0 0 10px}p{color:var(--muted);margin:0}.err{display:none;color:#9a234f;margin-top:16px;font-weight:700}
</style>
</head>
<body>
<div class="load"><div class="box"><div class="dot"></div><h1>Seite 3 wird geladen</h1><p>Die drei Tore, Erwartungsbögen und PDF-Funktionen werden vorbereitet.</p><div id="err" class="err"></div></div></div>
<script>
(async()=>{
 const err=document.getElementById('err');
 try{
   const [payload,wissen,perspektiven,talent]=await Promise.all([
     fetch('../.tmp-page3-final.gz.b64?nocache='+Date.now()).then(r=>{if(!r.ok)throw new Error('Seiteninhalt fehlt');return r.text()}),
     fetch('assets/tor-wissen.b64?nocache='+Date.now()).then(r=>{if(!r.ok)throw new Error('Bild Wissen fehlt');return r.text()}),
     fetch('assets/tor-perspektiven.b64?nocache='+Date.now()).then(r=>{if(!r.ok)throw new Error('Bild Perspektiven fehlt');return r.text()}),
     fetch('assets/tor-talent-business.b64?nocache='+Date.now()).then(r=>{if(!r.ok)throw new Error('Bild Talent & Business fehlt');return r.text()})
   ]);
   const packed=Uint8Array.from(atob(payload.trim()),c=>c.charCodeAt(0));
   if(typeof DecompressionStream==='undefined')throw new Error('Dieser Browser unterstützt die Seitendekompression nicht.');
   const stream=new Blob([packed]).stream().pipeThrough(new DecompressionStream('gzip'));
   let html=await new Response(stream).text();
   html=html.replace('assets/tor-wissen.webp','data:image/jpeg;base64,'+wissen.trim())
            .replace('assets/tor-perspektiven.webp','data:image/jpeg;base64,'+perspektiven.trim())
            .replace('assets/tor-talent-business.webp','data:image/jpeg;base64,'+talent.trim());
   document.open();document.write(html);document.close();
 }catch(e){
   err.style.display='block';
   err.textContent='Seite 3 konnte nicht geladen werden: '+e.message;
   document.querySelector('.dot').style.display='none';
 }
})();
</script>
</body>
</html>
