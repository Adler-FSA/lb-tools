name: Enable Notfallakte V08 feedback layer
on:
  push:
    paths:
      - '.github/workflows/enable-notfallakte-v08-feedback.yml'
permissions:
  contents: write
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable feedback layer
        shell: python
        run: |
          from pathlib import Path
          p=Path('pages/notfallakte/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./v08-feedback.js"></script>'
          if tag not in s:
              s=s.replace('</body></html>',tag+'</body></html>')
              p.write_text(s,encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name "Adler-FSA"
          git config user.email "ceo@liquiditybooster.de"
          git rm .github/workflows/enable-notfallakte-v08-feedback.yml
          git add pages/notfallakte/index.html
          git commit -m "Enable V08 unified backup feedback and autosave"
          git push
