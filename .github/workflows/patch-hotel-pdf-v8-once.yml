name: Patch hotel PDF loader v8 once

on:
  push:
    paths:
      - '.github/workflows/patch-hotel-pdf-v8-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump hotel PDF loader cache key only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pages/merchant-kompass/hotel.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="./hotel-pdf-v2.js?v=7"></script>'
          new='<script src="./hotel-pdf-v2.js?v=8"></script>'
          if old not in s:
              raise SystemExit('SCHUTZSTOPP: erwartete Loader-Version v7 fehlt')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify no page content changed beyond loader version
        shell: bash
        run: |
          git diff -- pages/merchant-kompass/hotel.html
          test "$(git diff --numstat -- pages/merchant-kompass/hotel.html | awk '{print $1+$2}')" = "2"
      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'Adler-FSA Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add pages/merchant-kompass/hotel.html
          git rm .github/workflows/patch-hotel-pdf-v8-once.yml
          git commit -m 'Load restored hotel PDF V2 download handling'
          git push
