name: Normalize LiquidityBooster lecture hall typography
on:
  push:
    paths:
      - '.github/workflows/normalize-hoersaal-typography.yml'
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply heading scale
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path('hoersaal-liquiditybooster/01-willkommen.html'),
              Path('hoersaal-liquiditybooster/02-big-picture.html'),
          ]

          h1_new = "h1{font-size:clamp(34px,4.2vw,58px);line-height:1.08;letter-spacing:-.025em;margin:17px 0 22px;font-weight:760}"
          h2_new = "h2{font-size:clamp(27px,3vw,42px);line-height:1.18;letter-spacing:-.018em;margin-bottom:16px;font-weight:720}"

          for path in files:
              text = path.read_text(encoding='utf-8')
              text, c1 = re.subn(r"h1\{font-size:clamp\(46px,6vw,(?:82|84)px\);line-height:(?:\.98|\.99);letter-spacing:-\.045em;margin:17px 0 22px;font-weight:860\}", h1_new, text, count=1)
              text, c2 = re.subn(r"h2\{font-size:clamp\(31px,4vw,(?:50|52)px\);line-height:1\.12;letter-spacing:-\.03em;margin-bottom:16px\}", h2_new, text, count=1)
              if c1 != 1 or c2 != 1:
                  raise SystemExit(f'{path}: expected one h1 and one h2 replacement, got h1={c1}, h2={c2}')
              path.write_text(text, encoding='utf-8')
              print(f'Updated {path}')
          PY
      - name: Verify typography
        run: |
          grep -F 'h1{font-size:clamp(34px,4.2vw,58px)' hoersaal-liquiditybooster/01-willkommen.html
          grep -F 'h1{font-size:clamp(34px,4.2vw,58px)' hoersaal-liquiditybooster/02-big-picture.html
          grep -F 'h2{font-size:clamp(27px,3vw,42px)' hoersaal-liquiditybooster/01-willkommen.html
          grep -F 'h2{font-size:clamp(27px,3vw,42px)' hoersaal-liquiditybooster/02-big-picture.html
      - name: Commit typography and remove temporary workflow
        run: |
          git config user.name 'Adler-FSA'
          git config user.email 'ceo@liquiditybooster.de'
          git add hoersaal-liquiditybooster/01-willkommen.html hoersaal-liquiditybooster/02-big-picture.html
          git rm .github/workflows/normalize-hoersaal-typography.yml
          git commit -m 'Use LiquidityBooster heading scale in lecture hall'
          git push
