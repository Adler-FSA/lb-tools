name: Add Projektanalyse banner
on:
  push:
    paths:
      - '.github/workflows/add-projektanalyse-banner.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert banner
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pages/projektanalyse-leitartikel/index.html')
          s=p.read_text(encoding='utf-8')
          marker='class="articleBanner"'
          if marker not in s:
              css='.articleBanner{margin:0 0 24px}.articleBanner img{display:block;width:100%;height:auto;border-radius:16px}.aiNote{margin:7px 4px 0;text-align:right;color:#7b828a;font-size:.78rem} '
              s=s.replace('.articleHead{padding:34px 6px 26px;', css+'.articleHead{padding:34px 6px 26px;',1)
              banner='<figure class="articleBanner"><img src="391F1C09-B73D-4DA8-A454-815F1B8D2DFD.png" alt="Big Picture zur Projektanalyse: Erst Klarheit. Dann handeln."><figcaption class="aiNote">KI-generierte Visualisierung</figcaption></figure>\n'
              s=s.replace('<main class="wrap">\n','<main class="wrap">\n'+banner,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/projektanalyse-leitartikel/index.html
          git commit -m "Add Projektanalyse Big Picture banner"
          git push
