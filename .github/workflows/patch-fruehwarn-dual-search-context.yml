name: Patch Frühwarn-Check Dual Search Context

on:
  push:
    paths:
      - '.github/workflows/patch-fruehwarn-dual-search-context.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use company and domain in region matching
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pages/projekt-fruehwarn-check/index.html')
          s=p.read_text(encoding='utf-8')
          old="function regionData(region,q){const rec=state.records.filter(r=>r.region===region);const graded=rec.map(r=>({r,q:quality(r,q)})).filter(x=>x.q>0);return{matches:graded.filter(x=>x.q>=3).map(x=>x.r),similar:graded.filter(x=>x.q===1).map(x=>x.r).slice(0,5),auto:state.sources.filter(s=>s.region===region&&['auto','local'].includes(s.mode)&&s.status==='available')}}"
          new="function regionData(region,q){const rec=state.records.filter(r=>r.region===region);const ctx=window.__fruehwarnInputContext||{};const qs=[q,ctx.company,ctx.domain].map(v=>String(v||'').trim()).filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i);const graded=rec.map(r=>({r,q:Math.max(0,...qs.map(v=>quality(r,v)))})).filter(x=>x.q>0);return{matches:graded.filter(x=>x.q>=3).map(x=>x.r),similar:graded.filter(x=>x.q===1).map(x=>x.r).slice(0,5),auto:state.sources.filter(s=>s.region===region&&['auto','local'].includes(s.mode)&&s.status==='available')}}"
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('regionData block not found')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/projekt-fruehwarn-check/index.html
          git commit -m "Frühwarn-Check: Firmenname und Domain gemeinsam prüfen"
          git push
