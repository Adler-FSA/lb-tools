name: Patch Follow-up-Zentrale 72h
on:
  push:
    paths:
      - '.github/workflows/patch-follow-up-zentrale-72h.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 72-Stunden-Follow-up ergänzen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pages/personal-management/follow-up-zentrale.html')
          s=p.read_text(encoding='utf-8')
          marker='<section class="section"><div class="wrap"><div class="eyebrow">Systemmails</div>'
          if marker not in s:
              raise SystemExit('Systemmail-Marker nicht gefunden')
          if 'id="guest72Subject1"' in s:
              raise SystemExit('72h-Bereich bereits vorhanden')
          block=Path('.github/patches/follow-up-zentrale-72h-fragment.html').read_text(encoding='utf-8')
          s=s.replace(marker,block+marker,1)
          s=s.replace('0 von 70 erledigt','0 von 73 erledigt',1)
          s=s.replace('10 Gruppen + 60 Follow-up-Mails. Der Fortschritt wird nur in diesem Browser gespeichert.','10 Gruppen + 60 Themen-Follow-up-Mails + 3 Gastzugang-Mails. Der Fortschritt wird nur in diesem Browser gespeichert.',1)
          old="function updateProgress(){let done=0,total=groups.length*7;groups.forEach(g=>{if(state[groupKey(g.n)])done++;g.mails.forEach((m,i)=>{if(state[mailKey(g.n,i)])done++})});$('#progressText').textContent=`${done} von ${total} erledigt`;$('#progressBar').style.width=(done/total*100)+'%'}"
          new="function updateProgress(){let done=0,total=groups.length*7+3;groups.forEach(g=>{if(state[groupKey(g.n)])done++;g.mails.forEach((m,i)=>{if(state[mailKey(g.n,i)])done++})});['h72-1','h72-2','h72-3'].forEach(k=>{if(state[k])done++});$('#progressText').textContent=`${done} von ${total} erledigt`;$('#progressBar').style.width=(done/total*100)+'%'}"
          if old not in s:
              raise SystemExit('updateProgress nicht gefunden')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validieren
        run: |
          grep -q 'guest72Subject1' pages/personal-management/follow-up-zentrale.html
          grep -q 'guest72Subject2' pages/personal-management/follow-up-zentrale.html
          grep -q 'guest72Subject3' pages/personal-management/follow-up-zentrale.html
          grep -q 'total=groups.length\*7+3' pages/personal-management/follow-up-zentrale.html
      - name: Commit und temporäre Dateien entfernen
        run: |
          git config user.name 'Adler-FSA'
          git config user.email 'ceo@liquiditybooster.de'
          git add pages/personal-management/follow-up-zentrale.html
          git rm .github/workflows/patch-follow-up-zentrale-72h.yml
          git rm .github/patches/follow-up-zentrale-72h-fragment.html
          git commit -m 'Follow-up-Zentrale: 3 Gastzugang-Mails für 72 Stunden ergänzen'
          git push
