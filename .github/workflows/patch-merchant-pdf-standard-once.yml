name: Patch merchant PDF standard once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-merchant-pdf-standard-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply proven contract PDF V2 delivery pattern
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'pages/merchant-kompass/hotel.html': [
                  ('<script src="./hotel-pdf-v2.js?v=8"></script>', '<script src="./hotel-pdf-v2-core.js?v=7"></script>'),
              ],
              'pages/merchant-kompass/hotel-pdf-v2-core.js': [
                  ('if(pdfUrl)URL.revokeObjectURL(pdfUrl);pdfUrl=URL.createObjectURL(out.blob);', 'if(pdfUrl)URL.revokeObjectURL(pdfUrl);const pdfFile=out.file||out.blob;pdfUrl=URL.createObjectURL(pdfFile);'),
              ],
              'pages/merchant-kompass/handel.html': [
                  ('<script src="./handel-pdf-v2.js?v=1"></script>', '<script src="./handel-pdf-v2.js?v=2"></script>'),
              ],
              'pages/merchant-kompass/handel-pdf-v2.js': [
                  ('if(pdfUrl)URL.revokeObjectURL(pdfUrl);pdfUrl=URL.createObjectURL(out.blob);', 'if(pdfUrl)URL.revokeObjectURL(pdfUrl);const pdfFile=out.file||out.blob;pdfUrl=URL.createObjectURL(pdfFile);'),
              ],
          }

          for rel, reps in replacements.items():
              p = Path(rel)
              s = p.read_text(encoding='utf-8')
              for old, new in reps:
                  count = s.count(old)
                  if count != 1:
                      raise SystemExit(f'{rel}: expected exactly 1 occurrence, found {count}: {old}')
                  s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')

          print('Patched Hotel and Handel to the proven direct PDF Engine V2 download pattern.')
          PY
      - name: Commit changes
        run: |
          git config user.name "Adler-FSA Automation"
          git config user.email "actions@users.noreply.github.com"
          git add pages/merchant-kompass/hotel.html pages/merchant-kompass/hotel-pdf-v2-core.js pages/merchant-kompass/handel.html pages/merchant-kompass/handel-pdf-v2.js
          git diff --cached --check
          git commit -m "Use proven contract PDF V2 delivery in merchant pages"
          git push origin main
