name: Projekt Frühwarn-Check – Striktes Register-Matching

on:
  push:
    paths:
      - '.github/workflows/patch-fruehwarn-strict-register-matching.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Register-Matching präzisieren
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, json

          p=Path('pages/projekt-fruehwarn-check/index.html')
          s=p.read_text(encoding='utf-8')

          pattern=r"function quality\(r,q\)\{.*?\}function cls\(r\)"
          m=re.search(pattern,s)
          if not m:
              raise SystemExit('quality()-Block nicht gefunden – kein unsicherer Patch')

          replacement=r'''function legalNormalize(v){let s=String(v||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');s=s.replace(/&/g,' and ');s=s.replace(/\bgesellschaft\s+mit\s+beschrankter\s+haftung\b/g,' gmbh ');s=s.replace(/\baktiengesellschaft\b/g,' ag ');s=s.replace(/\bpublic\s+limited\s+company\b/g,' plc ');s=s.replace(/\blimited\b/g,' ltd ');s=s.replace(/\bsociete\s+anonyme\b/g,' sa ');s=s.replace(/\ba\.?\s*g\.?\b/g,' ag ');s=s.replace(/\bg\.?\s*m\.?\s*b\.?\s*h\.?\b/g,' gmbh ');s=s.replace(/\bl\.?\s*t\.?\s*d\.?\b/g,' ltd ');s=s.replace(/\bp\.?\s*l\.?\s*c\.?\b/g,' plc ');s=s.replace(/\bs\.?\s*a\.?\b/g,' sa ');return s.replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim()}function strictRegisterRecord(r){return String(r.type||'').toLowerCase()==='register'||/^eba-|^esma-casp/.test(String(r.source_id||''))}function strictRegisterQuality(r,q){const raw=String(q||'').trim();if(!raw)return 0;const lq=legalNormalize(raw),nq=normalize(raw),cq=compact(raw);let sim=false;for(const term of rawTerms(r)){const lt=legalNormalize(term),nt=normalize(term),ct=compact(term);if(lq&&lt===lq)return 3;if(cq.length>=8&&ct===cq)return 3;if(nq.includes('.')&&(nt===nq||nt.endsWith('.'+nq)))return 3;if(nq.length>=4&&(nt.includes(nq)||nq.includes(nt)))sim=true}return sim?1:0}function quality(r,q){if(strictRegisterRecord(r))return strictRegisterQuality(r,q);const nq=normalize(q);if(!nq)return 0;const cq=compact(q),qt=tokens(nq);let sim=false;for(const term of recordTerms(r)){if(term===nq)return 3;const ct=compact(term);if(cq.length>=5&&ct===cq)return 3;const tt=tokens(term);if(qt.length===1&&tt.includes(nq))return 3;if(qt.length>1&&(term.startsWith(nq+' ')||term.startsWith(nq+'.')||term.startsWith(nq+'-')))return 3;if(nq.includes('.')&&(term===nq||term.endsWith('.'+nq)))return 3;if(nq.length>=4&&tt.some(x=>x.startsWith(nq)))sim=true;else if(nq.length>=3&&term.includes(nq))sim=true}return sim?1:0}function cls(r)'''

          s=s[:m.start()]+replacement+s[m.end():]
          p.write_text(s,encoding='utf-8')

          # Regression: Deutsche Bank AG darf im EBA-Kreditinstitutsbestand nur
          # dem Hauptrechtsträger rechtlich gleichwertig entsprechen.
          data=json.loads(Path('pages/projekt-fruehwarn-check/data/records.json').read_text(encoding='utf-8'))
          rows=[r for r in data.get('records',[]) if r.get('source_id')=='eba-credit-institutions']
          def legal_norm(v):
              import unicodedata
              x=unicodedata.normalize('NFD',str(v or '').lower())
              x=''.join(ch for ch in x if unicodedata.category(ch)!='Mn')
              x=re.sub(r'\bgesellschaft\s+mit\s+beschrankter\s+haftung\b',' gmbh ',x)
              x=re.sub(r'\baktiengesellschaft\b',' ag ',x)
              x=re.sub(r'\ba\.?\s*g\.?\b',' ag ',x)
              x=re.sub(r'\bg\.?\s*m\.?\s*b\.?\s*h\.?\b',' gmbh ',x)
              x=re.sub(r'[^a-z0-9]+',' ',x)
              return re.sub(r'\s+',' ',x).strip()
          target=legal_norm('Deutsche Bank AG')
          exact=[r for r in rows if legal_norm(r.get('name'))==target]
          print('EBA exakte/rechtlich gleichwertige Deutsche-Bank-Treffer:',len(exact))
          for r in exact: print(r.get('name'),r.get('country'),r.get('lei'))
          if len(exact)!=1 or exact[0].get('country')!='DE':
              raise SystemExit('Regression fehlgeschlagen: Deutsche Bank AG nicht eindeutig dem deutschen Hauptrechtsträger zugeordnet')
          PY

      - name: Patch validieren und speichern
        shell: bash
        run: |
          set -euo pipefail
          grep -q "function strictRegisterQuality" pages/projekt-fruehwarn-check/index.html
          grep -q "function legalNormalize" pages/projekt-fruehwarn-check/index.html
          git config user.name "FSA Frühwarn-Update"
          git config user.email "actions@github.com"
          git add pages/projekt-fruehwarn-check/index.html
          if git diff --cached --quiet; then
            echo "Keine Änderung notwendig."
          else
            git commit -m "Frühwarn-Check: Registertreffer strikt zuordnen"
            git pull --rebase
            git push
          fi
