name: Wire lecture hall page 3 navigation
on:
  push:
    paths:
      - '.github/workflows/wire-hoersaal-page3.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire page 3
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('hoersaal-liquiditybooster/01-willkommen.html'),
              Path('hoersaal-liquiditybooster/02-big-picture.html'),
          ]
          old_nav = '<span aria-disabled="true">03 Gast & Club</span>'
          new_nav = '<a href="03-gast-club.html">03 Gast & Club</a>'
          for path in files:
              s = path.read_text(encoding='utf-8')
              if old_nav not in s and 'href="03-gast-club.html"' not in s:
                  raise SystemExit(f'Navigation marker not found in {path}')
              s = s.replace(old_nav, new_nav)
              path.write_text(s, encoding='utf-8')

          p2 = Path('hoersaal-liquiditybooster/02-big-picture.html')
          s = p2.read_text(encoding='utf-8')
          old_next = '<span class="disabled" data-i18n data-de="Weiter: Gast & Club →" data-en="Next: Guest & Club →">Weiter: Gast & Club →</span>'
          new_next = '<a href="03-gast-club.html" data-i18n data-de="Weiter: Gast & Club →" data-en="Next: Guest & Club →">Weiter: Gast & Club →</a>'
          if old_next in s:
              s = s.replace(old_next, new_next)
          p2.write_text(s, encoding='utf-8')
          PY
      - name: Verify
        run: |
          test -f hoersaal-liquiditybooster/03-gast-club.html
          grep -q 'href="03-gast-club.html"' hoersaal-liquiditybooster/01-willkommen.html
          grep -q 'href="03-gast-club.html"' hoersaal-liquiditybooster/02-big-picture.html
          grep -q 'Seite 3 von 8' hoersaal-liquiditybooster/03-gast-club.html
      - name: Commit and remove temporary workflow
        run: |
          rm -f .github/workflows/wire-hoersaal-page3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hoersaal-liquiditybooster/01-willkommen.html hoersaal-liquiditybooster/02-big-picture.html .github/workflows/wire-hoersaal-page3.yml
          git diff --cached --quiet || git commit -m 'Connect lecture hall pages 1 to 3'
          git push