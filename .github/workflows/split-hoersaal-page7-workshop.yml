name: Split Hoersaal page 7 into workshop hub and calculator pages
on:
  push:
    paths:
      - '.github/workflows/split-hoersaal-page7-workshop.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build workshop hub and separate calculator pages
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('hoersaal-liquiditybooster/07-werkstatt.html')
          s = p.read_text(encoding='utf-8')

          style = s[s.index('<style>')+7:s.index('</style>')]
          start1 = s.index('<div class="calc-shell reveal" id="rechner1">')
          start2 = s.index('<div class="calc-shell reveal" id="rechner2">')
          pager = s.index('<div class="pager">', start2)
          calc1 = s[start1:start2].replace('class="calc-shell reveal"','class="calc-shell"',1).strip()
          calc2 = s[start2:pager].replace('class="calc-shell reveal"','class="calc-shell"',1).strip()

          script_start = s.index('<script>') + len('<script>')
          script_end = s.rindex('</script>')
          js = s[script_start:script_end].strip()
          if js.startswith('(()=>{'):
              js = js[len('(()=>{'):]
          if js.endswith('})();'):
              js = js[:-len('})();')]
          bb_marker = 'const bbPrices='
          bb_idx = js.index(bb_marker)
          calc1_js = js[:bb_idx].strip()
          calc2_js = js[bb_idx:].strip()

          # Shared navigation/header for calculator detail pages
          header = '''<header class="topbar"><div class="wrap top"><a class="brand-logo" href="01-willkommen.html" aria-label="LiquidityBooster"><img src="https://adler-fsa.github.io/lp-anfang/library/logos/liquiditybooster-logo.png" alt="LiquidityBooster"></a><div class="lang" aria-label="Sprache"><button class="active" type="button" data-lang="de" aria-pressed="true">DE</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div></div></header>
<div class="wrap course"><div class="progress-row"><span data-i18n data-de="Dein Lernweg" data-en="Your learning journey">Dein Lernweg</span><strong data-i18n data-de="Seite 7 von 8" data-en="Page 7 of 8">Seite 7 von 8</strong></div><div class="progress"><span></span></div><nav class="nav" aria-label="Hörsaal-Seiten"><a class="done" href="01-willkommen.html">01 Willkommen</a><a class="done" href="02-big-picture.html">02 Big Picture</a><a class="done" href="03-gast-club.html">03 Gast & Club</a><a class="done" href="04-rollen.html">04 Rollen & Entwicklung</a><a class="done" href="05-mein-nutzen.html">05 Mein Nutzen</a><a class="done" href="06-empfehlung.html">06 Empfehlung</a><a class="active" href="07-werkstatt.html">07 Werkstatt</a><span aria-disabled="true">08 Entscheidung</span></nav></div>'''

          extra_css = '''
          .detail-hero{padding:46px 0 30px;background:linear-gradient(125deg,#fff 0,#f1fbfb 55%,#fff5fa 100%);border-bottom:1px solid #edf4f5}.detail-hero .back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--mint);font-weight:850;margin-bottom:18px}.detail-hero h1{max-width:1050px;margin-bottom:14px}.detail-hero p{max-width:920px;color:var(--muted);font-size:18px}.detail-body{padding:42px 0 74px;background:var(--bg)}.detail-footer-nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.detail-footer-nav a{display:inline-flex;padding:12px 18px;border-radius:999px;border:1px solid var(--line);background:#fff;text-decoration:none;font-weight:850;color:var(--navy)}.reveal{opacity:1!important;transform:none!important}.calc-shell{margin-top:0}
          '''

          def page(title, kicker, headline, intro, calc_html, js_body, is_bb=False):
              if is_bb:
                  pre = "let lang='de';const eur=n=>new Intl.NumberFormat(lang==='de'?'de-DE':'en-IE',{style:'currency',currency:'EUR'}).format(Number.isFinite(n)?n:0);function setLang(l){lang=l;document.documentElement.lang=l;document.querySelectorAll('[data-lang]').forEach(b=>{b.classList.toggle('active',b.dataset.lang===l);b.setAttribute('aria-pressed',String(b.dataset.lang===l))});document.querySelectorAll('[data-i18n]').forEach(el=>{const v=el.getAttribute('data-'+l);if(v!==null)el.innerHTML=v});bbCalculate()}"
                  post = "document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));setLang('de');"
                  script = pre + '\n' + js_body + '\n' + post
              else:
                  script = js_body
              return f'''<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><meta name="theme-color" content="#ffffff"><title>{title}</title><style>{style}{extra_css}</style></head><body>{header}<main><section class="detail-hero"><div class="wrap"><a class="back" href="07-werkstatt.html">← Zurück zur Werkstatt</a><div class="eyebrow">{kicker}</div><h1>{headline}</h1><p>{intro}</p></div></section><section class="detail-body"><div class="wrap">{calc_html}<div class="detail-footer-nav"><a href="07-werkstatt.html">← Zurück zur Werkstatt</a><a href="06-empfehlung.html">06 Empfehlung</a></div></div></section></main><footer><div class="wrap"><strong>LiquidityBooster · Akademie für finanzielle Souveränität</strong><br>Bildung, Orientierung und eigenverantwortliche Entscheidung. Keine Anlageberatung oder Anlagevermittlung.</div></footer><script>(()=>{{{script}}})();</script></body></html>'''

          page1 = page(
              'Hörsaal-Rechner | LiquidityBooster Werkstatt',
              'Werkstatt · Rechner 1',
              'Hörsaal: 3 Ebenen, Setup und kumulativer Monatsaufbau',
              'Hier kannst du die persönliche 3-Ebenen-Logik des Hörsaals mit deinen eigenen Zahlen durchspielen. Setup und laufende Monatsprovision bleiben bewusst getrennt.',
              calc1,
              calc1_js,
              False
          )
          page2 = page(
              'BusinessBooster-Rechner | LiquidityBooster Werkstatt',
              'Werkstatt · Rechner 2',
              'BusinessBooster: Eigenleistung des Club Leaders über fünf Jahre',
              'Dieser Rechner betrachtet ausschließlich die eigene Vertriebsleistung des Club Leaders mit 20 %. Team- und Folgelinien bleiben bewusst außerhalb dieser Simulation.',
              calc2,
              calc2_js,
              True
          )

          Path('hoersaal-liquiditybooster/07-rechner-hoersaal.html').write_text(page1, encoding='utf-8')
          Path('hoersaal-liquiditybooster/07-rechner-businessbooster.html').write_text(page2, encoding='utf-8')

          hub = '''<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>07 Werkstatt | LiquidityBooster Hörsaal</title><style>
:root{--mint:#00a7ad;--mint-soft:#eaf9f9;--mag:#c6006f;--mag-soft:#fff0f7;--navy:#132238;--ink:#314253;--muted:#6f7d89;--line:#dbe8eb;--bg:#f7fbfb;--gold:#b88717;--shadow:0 18px 48px rgba(19,34,56,.08)}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#fff;font:16px/1.68 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{width:min(1460px,calc(100% - 34px));margin:auto}.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.top{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand-logo img{display:block;width:190px;max-width:42vw;max-height:52px;object-fit:contain}.lang{display:flex;gap:5px;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--bg)}.lang button{border:0;border-radius:999px;background:transparent;color:var(--muted);font-weight:850;padding:7px 11px}.lang button.active{background:var(--mint);color:#fff}.course{padding:18px 0 0}.progress-row{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.progress{height:6px;background:#e8f0f2;border-radius:99px;overflow:hidden;margin:8px 0 14px}.progress span{display:block;width:87.5%;height:100%;background:linear-gradient(90deg,var(--mint),var(--mag))}.nav{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:12px}.nav a,.nav span{padding:7px 11px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--muted);font-size:12px}.nav a.done{color:var(--mint);background:var(--mint-soft)}.nav a.active{background:var(--mint);color:#fff;font-weight:850}.hero{padding:68px 0 62px;background:linear-gradient(125deg,#fff 0,#f1fbfb 52%,#fff4f9 100%);border-bottom:1px solid #edf4f5}.eyebrow{display:inline-flex;align-items:center;gap:10px;color:var(--mint);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.14em}.eyebrow:before{content:"";width:28px;height:3px;background:linear-gradient(90deg,var(--mint),var(--mag));border-radius:99px}h1,h2,h3{color:var(--navy);margin-top:0}h1{font-size:clamp(34px,4.2vw,58px);line-height:1.08;letter-spacing:-.025em;margin:17px 0 20px}h2{font-size:clamp(27px,3vw,42px);line-height:1.18;letter-spacing:-.018em}.lead{font-size:clamp(19px,2.1vw,25px);color:#5d6d79;max-width:930px}.section{padding:70px 0}.soft{background:var(--bg)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:28px}.card{position:relative;display:block;text-decoration:none;color:inherit;padding:30px;border:1px solid var(--line);border-radius:28px;background:#fff;box-shadow:var(--shadow);transition:.2s ease}.card.open:hover{transform:translateY(-4px);border-color:#9fdadb}.card .num{font-size:12px;font-weight:900;letter-spacing:.12em;color:var(--mint)}.card h3{font-size:27px;margin:9px 0 9px}.card p{color:var(--muted);margin:0}.card .go{display:inline-flex;margin-top:22px;padding:10px 15px;border-radius:999px;background:var(--mint);color:#fff;font-weight:850}.card.bb .go{background:var(--mag)}.card.locked{opacity:.62;box-shadow:none}.pill{display:inline-flex;margin-top:16px;padding:7px 10px;border-radius:999px;background:var(--mint-soft);color:#087d83;font-size:12px;font-weight:850}.insight{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:26px}.insight article{padding:22px;border:1px solid var(--line);border-radius:22px;background:#fff}.insight b{display:block;color:var(--navy);font-size:18px}.insight span{display:block;color:var(--muted);font-size:13px;margin-top:5px}.split{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:26px}.box{padding:26px;border:1px solid var(--line);border-radius:24px;background:#fff}.box.mint{background:linear-gradient(145deg,var(--mint-soft),#fff)}.box.mag{background:linear-gradient(145deg,var(--mag-soft),#fff)}.pager{display:flex;justify-content:space-between;gap:12px;margin-top:26px}.pager a,.pager span{display:inline-flex;padding:11px 16px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--navy);font-weight:850;background:#fff}.pager span{color:#8b9aa4;background:#f4f7f8}footer{padding:34px 0 46px;border-top:1px solid #edf3f4;text-align:center;color:var(--muted);font-size:12px}@media(max-width:900px){.grid,.split{grid-template-columns:1fr}.insight{grid-template-columns:1fr 1fr}}@media(max-width:600px){.wrap{width:min(100% - 20px,1460px)}.insight{grid-template-columns:1fr}.pager{flex-direction:column}}
</style></head><body><header class="topbar"><div class="wrap top"><a class="brand-logo" href="01-willkommen.html"><img src="https://adler-fsa.github.io/lp-anfang/library/logos/liquiditybooster-logo.png" alt="LiquidityBooster"></a><div class="lang"><button class="active" type="button">DE</button><button type="button">EN</button></div></div></header><main><div class="wrap course"><div class="progress-row"><span>Dein Lernweg</span><strong>Seite 7 von 8</strong></div><div class="progress"><span></span></div><nav class="nav"><a class="done" href="01-willkommen.html">01 Willkommen</a><a class="done" href="02-big-picture.html">02 Big Picture</a><a class="done" href="03-gast-club.html">03 Gast & Club</a><a class="done" href="04-rollen.html">04 Rollen & Entwicklung</a><a class="done" href="05-mein-nutzen.html">05 Mein Nutzen</a><a class="done" href="06-empfehlung.html">06 Empfehlung</a><a class="active" href="07-werkstatt.html">07 Werkstatt</a><span>08 Entscheidung</span></nav></div><section class="hero"><div class="wrap"><div class="eyebrow">Werkstatt · Simulatoren · Praxis</div><h1>Vier Arbeitsstationen. <span style="color:#00a7ad">Vier Fragen, die du selbst durchrechnest.</span></h1><p class="lead">Hier wird nicht nur gelesen. Du öffnest eine Werkstatt-Station, gibst deine eigenen Zahlen ein und siehst unmittelbar, was die jeweilige Logik praktisch bedeutet. Jeder Rechner arbeitet bewusst für sich.</p></div></section><section class="section"><div class="wrap"><div class="eyebrow">Werkstatt-Zentrale</div><h2>Wähle deine Arbeitsstation.</h2><div class="grid"><a class="card open" href="07-rechner-hoersaal.html"><div class="num">01 · GEÖFFNET</div><h3>Hörsaal · 3 Ebenen & Zeit</h3><p>20 % / 15 % / 10 %, einmaliges Setup und der kumulative Aufbau aus laufenden Monatsgebühren.</p><span class="pill">Club Partner nach vorgesehener Qualifikation</span><span class="go">Rechner öffnen →</span></a><a class="card open bb" href="07-rechner-businessbooster.html"><div class="num">02 · GEÖFFNET</div><h3>BusinessBooster · Eigenleistung</h3><p>20 % auf die eigene Vertriebsleistung des Club Leaders. Mit separatem Setup und 5-Jahres-Vorschau.</p><span class="pill">Club Leader · Eigenumsatz</span><span class="go">Rechner öffnen →</span></a><div class="card locked"><div class="num">03 · FOLGT</div><h3>Kaufkraft</h3><p>Inflation und reale Kaufkraft praktisch sichtbar machen – mit eigenen Beträgen und Zeiträumen.</p><span class="pill">Nächste Werkstatt-Station</span></div><div class="card locked"><div class="num">04 · FOLGT</div><h3>Tragfähigkeit</h3><p>Eine eigene 12-Monats-Entwicklung durchspielen und sehen, wie sich Aufbau über Zeit verändert.</p><span class="pill">Danach geöffnet</span></div></div></div></section><section class="section soft"><div class="wrap"><div class="eyebrow">Was du hier lernst</div><h2>Rechnen ist hier kein Selbstzweck.</h2><div class="insight"><article><b>Verstehen</b><span>Welche Vergütungslogik gehört zu welchem Leistungsbereich?</span></article><article><b>Verändern</b><span>Eigene Zahlen eingeben statt mit fremden Musterwerten zu arbeiten.</span></article><article><b>Vergleichen</b><span>Einmalige und laufende Effekte klar auseinanderhalten.</span></article><article><b>Einordnen</b><span>Erkennen, welche Qualifikation für welchen Produktbereich gilt.</span></article></div><div class="split"><div class="box mint"><h3>Hörsaal ist nicht BusinessBooster.</h3><p>Beim Hörsaal greift die persönliche 3-Ebenen-Logik 20/15/10. Beim BusinessBooster zeigt diese Werkstatt bewusst nur die Eigenleistung des Club Leaders mit 20 %. Team- und Folgelinien folgen dort eigenen Qualifikations- und Leistungsregeln.</p></div><div class="box mag"><h3>Jeder Rechner bleibt unabhängig.</h3><p>Das ist Absicht. So können wir jede Logik einzeln testen, erweitern und später aktualisieren, ohne dass ein Rechner den anderen beeinflusst. Gleichzeitig bleibt Seite 7 selbst übersichtlich und kann weitere Praxis-Inhalte aufnehmen.</p></div></div><div class="pager"><a href="06-empfehlung.html">← 06 Empfehlung</a><span>08 Entscheidung · folgt</span></div></div></section></main><footer><div class="wrap"><strong>LiquidityBooster · Akademie für finanzielle Souveränität</strong><br>Bildung, Orientierung und eigenverantwortliche Entscheidung. Keine Anlageberatung oder Anlagevermittlung.</div></footer></body></html>'''
          p.write_text(hub, encoding='utf-8')
          PY
      - name: Commit new workshop architecture
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hoersaal-liquiditybooster/07-werkstatt.html hoersaal-liquiditybooster/07-rechner-hoersaal.html hoersaal-liquiditybooster/07-rechner-businessbooster.html
          git commit -m 'Split page 7 into workshop hub and calculator pages'
          git push
