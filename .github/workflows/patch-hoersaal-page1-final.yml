name: Finalize Hoersaal Page 1
on:
  push:
    paths:
      - '.github/workflows/patch-hoersaal-page1-final.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch page 1
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('hoersaal-liquiditybooster/01-willkommen.html')
          s=p.read_text(encoding='utf-8')

          meta='''<div class="tiny" data-i18n data-de="Wir bauen diesen Hörsaal bewusst Seite für Seite. Erst wenn Seite 1 sitzt, geht es weiter." data-en="We are deliberately building this lecture hall page by page. Page 2 comes only once page 1 is right.">Wir bauen diesen Hörsaal bewusst Seite für Seite. Erst wenn Seite 1 sitzt, geht es weiter.</div>'''
          s=s.replace(meta,'')
          s=s.replace('.tiny{margin-top:12px;color:#8a98a2;font-size:12px}','')

          css='''
          .time-section{background:linear-gradient(180deg,#fff,#f7fbfb 48%,#fff)}
          .time-intro{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:end;margin-bottom:26px}
          .time-intro p{max-width:860px;margin:0;color:var(--muted);font-size:17px}
          .time-journey{border:1px solid rgba(0,167,173,.32);border-radius:28px;background:#fff;overflow:hidden;box-shadow:0 14px 40px rgba(19,34,56,.055)}
          .time-journey>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 26px;cursor:pointer;background:linear-gradient(100deg,var(--mint-soft),#fff 54%,var(--mag-soft));color:var(--navy);font-weight:880;font-size:18px}
          .time-journey>summary::-webkit-details-marker{display:none}
          .time-journey>summary .time-open{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:23px;color:var(--mint);transition:transform .25s}
          .time-journey[open]>summary .time-open{transform:rotate(45deg);color:var(--mag)}
          .time-grid{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:26px}
          .time-grid:before{content:"";position:absolute;left:50%;top:30px;bottom:30px;width:2px;transform:translateX(-50%);background:linear-gradient(var(--mint),var(--mag));opacity:.28}
          .time-event{position:relative;padding:20px 21px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 8px 24px rgba(19,34,56,.04)}
          .time-event:nth-child(4n+1),.time-event:nth-child(4n+4){background:linear-gradient(145deg,var(--mint-soft),#fff 62%)}
          .time-event:nth-child(4n+2),.time-event:nth-child(4n+3){background:linear-gradient(145deg,var(--mag-soft),#fff 62%)}
          .time-event .time-date{display:inline-flex;margin-bottom:8px;padding:5px 9px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--mint);font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
          .time-event:nth-child(even) .time-date{color:var(--mag)}
          .time-event h3{margin:0 0 7px;font-size:17px}
          .time-event p{margin:0;color:var(--muted);font-size:14px;line-height:1.58}
          .time-close{margin:0 26px 26px;padding:20px 22px;border-left:4px solid var(--mag);border-radius:0 17px 17px 0;background:linear-gradient(100deg,var(--mag-soft),#fff);color:var(--navy);font-weight:800}
          @media(max-width:850px){.time-intro{display:block}.time-intro p{margin-top:8px}.time-grid{grid-template-columns:1fr}.time-grid:before{display:none}}
          '''
          marker='@media(max-width:1050px)'
          if '.time-journey{' not in s:
              s=s.replace(marker,css+marker,1)

          timeline='''
          <section class="section time-section"><div class="wrap"><div class="time-intro reveal"><div><div class="eyebrow" data-i18n data-de="Die Zeitreise" data-en="The timeline">Die Zeitreise</div><h2 data-i18n data-de="Vom Zeitproblem zum heutigen LiquidityBooster." data-en="From the time problem to today's LiquidityBooster.">Vom Zeitproblem zum heutigen LiquidityBooster.</h2></div><p data-i18n data-de="Wenn du genauer wissen möchtest, wie aus den ersten Gedanken Schritt für Schritt das heutige System wurde, kannst du die ganze Entwicklung hier aufklappen. Die Geschichte gehört dazu – aber du musst sie nicht lesen, um auf der Seite weiterzukommen." data-en="If you want to see in more detail how the first ideas gradually became today's system, you can open the full development here. The history matters, but you do not have to read it to continue through the page.">Wenn du genauer wissen möchtest, wie aus den ersten Gedanken Schritt für Schritt das heutige System wurde, kannst du die ganze Entwicklung hier aufklappen. Die Geschichte gehört dazu – aber du musst sie nicht lesen, um auf der Seite weiterzukommen.</p></div>
          <details class="time-journey reveal"><summary><span data-i18n data-de="Zeitreise öffnen · 14 Meilensteine von 2023 bis LiquidityBooster 3.0" data-en="Open timeline · 14 milestones from 2023 to LiquidityBooster 3.0">Zeitreise öffnen · 14 Meilensteine von 2023 bis LiquidityBooster 3.0</span><span class="time-open">+</span></summary><div class="time-grid">
          <article class="time-event"><span class="time-date" data-i18n data-de="Sommer 2023" data-en="Summer 2023">Sommer 2023</span><h3 data-i18n data-de="Das Zeitproblem wird sichtbar" data-en="The time problem becomes visible">Das Zeitproblem wird sichtbar</h3><p data-i18n data-de="Wiederkehrende Betreuung und Kryptoschulungen lassen sich für eine große Organisation nicht mehr allein bewältigen. Die zwei Worte „Finanzielle Souveränität“ werden zum Ausgangspunkt." data-en="Recurring support and crypto training can no longer be handled alone for a large organisation. The two words ‘financial sovereignty’ become the starting point.">Wiederkehrende Betreuung und Kryptoschulungen lassen sich für eine große Organisation nicht mehr allein bewältigen. Die zwei Worte „Finanzielle Souveränität“ werden zum Ausgangspunkt.</p></article>
          <article class="time-event"><span class="time-date" data-i18n data-de="Bis Sommer 2025" data-en="Until summer 2025">Bis Sommer 2025</span><h3 data-i18n data-de="Das Buch entsteht" data-en="The book is created">Das Buch entsteht</h3><p data-i18n data-de="„Die Rückeroberung der eigenen Souveränität“ ordnet die Gedanken und schafft die erste große Wissensgrundlage." data-en="‘Reclaiming Your Own Sovereignty’ organises the ideas and creates the first major knowledge base.">„Die Rückeroberung der eigenen Souveränität“ ordnet die Gedanken und schafft die erste große Wissensgrundlage.</p></article>
          <article class="time-event"><span class="time-date">2025</span><h3 data-i18n data-de="Die Idee einer Schule" data-en="The idea of a school">Die Idee einer Schule</h3><p data-i18n data-de="Ein Buch allein löst weder das Zeitproblem noch die wiederkehrende Betreuung. Aus Buch, Nutzerfragen und Alltagsproblemen entstehen die Fundamente der Akademie." data-en="A book alone solves neither the problem of time nor recurring support. The book, user questions and everyday challenges form the foundations of the Academy.">Ein Buch allein löst weder das Zeitproblem noch die wiederkehrende Betreuung. Aus Buch, Nutzerfragen und Alltagsproblemen entstehen die Fundamente der Akademie.</p></article>
          <article class="time-event"><span class="time-date" data-i18n data-de="Dezember 2025" data-en="December 2025">Dezember 2025</span><h3 data-i18n data-de="Achim Hubrich stellt die Verbindung her" data-en="Achim Hubrich makes the connection">Achim Hubrich stellt die Verbindung her</h3><p data-i18n data-de="Achim Hubrich bringt Alexander Finke und Michael Rau zusammen. Bildungsauftrag, technische Umsetzung und Unternehmertum finden zueinander." data-en="Achim Hubrich brings Alexander Finke and Michael Rau together. Educational mission, technical implementation and entrepreneurship come together.">Achim Hubrich bringt Alexander Finke und Michael Rau zusammen. Bildungsauftrag, technische Umsetzung und Unternehmertum finden zueinander.</p></article>
          <article class="time-event"><span class="time-date" data-i18n data-de="Februar 2026" data-en="February 2026">Februar 2026</span><h3 data-i18n data-de="Die gemeinsame Reise beginnt" data-en="The shared journey begins">Die gemeinsame Reise beginnt</h3><p data-i18n data-de="Aus der Verbindung entwickelt sich eine Partnerschaft. Die konkrete gemeinsame Aufbauarbeit nimmt ihren Anfang." data-en="The connection develops into a partnership. The concrete work of building together begins.">Aus der Verbindung entwickelt sich eine Partnerschaft. Die konkrete gemeinsame Aufbauarbeit nimmt ihren Anfang.</p></article>
          <article class="time-event"><span class="time-date" data-i18n data-de="10. Februar 2026" data-en="10 February 2026">10. Februar 2026</span><h3 data-i18n data-de="Der Bildungsauftrag wird angenommen" data-en="The educational mission is accepted">Der Bildungsauftrag wird angenommen</h3><p data-i18n data-de="Die eigentliche Entstehungsphase des LiquidityBoosters beginnt. Aus der Idee wird ein gemeinsames Aufbauprojekt." data-en="The actual creation phase of LiquidityBooster begins. The idea becomes a joint development project.">Die eigentliche Entstehungsphase des LiquidityBoosters beginnt. Aus der Idee wird ein gemeinsames Aufbauprojekt.</p></article>
          <article class="time-event"><span class="time-date" data-i18n data-de="Pre-Launch" data-en="Pre-launch">Pre-Launch</span><h3 data-i18n data-de="Die ersten Grundlagen entstehen" data-en="The first foundations are built">Die ersten Grundlagen entstehen</h3><p data-i18n data-de="Zugänge und erste Strukturen werden geschaffen. Peter Bösing wird das erste Mitglied des LiquidityBoosters." data-en="Access points and the first structures are created. Peter Bösing becomes the first LiquidityBooster member.">Zugänge und erste Strukturen werden geschaffen. Peter Bösing wird das erste Mitglied des LiquidityBoosters.</p></article>
          <article class="time-event"><span class="time-date" data-i18n data-de="1. März 2026" data-en="1 March 2026">1. März 2026</span><h3 data-i18n data-de="Der offizielle Start" data-en="The official launch">Der offizielle Start</h3><p data-i18n data-de="Der LiquidityBooster startet sein erstes offizielles Geschäftsjahr mit 21 Clubmitgliedern." data-en="LiquidityBooster begins its first official business year with 21 Club Members.">Der LiquidityBooster startet sein erstes offizielles Geschäftsjahr mit 21 Clubmitgliedern.</p></article>
          <article class="time-event"><span class="time-date" data-i18n data-de="April 2026" data-en="April 2026">April 2026</span><h3 data-i18n data-de="Das Team wächst" data-en="The team grows">Das Team wächst</h3><p data-i18n data-de="Oliver Beyer kommt hinzu und erweitert das entstehende Headteam." data-en="Oliver Beyer joins and expands the emerging Head Team.">Oliver Beyer kommt hinzu und erweitert das entstehende Headteam.</p></article>
          <article class="time-event"><span class="time-date" data-i18n data-de="Im weiteren Verlauf" data-en="As development continues">Im weiteren Verlauf</span><h3 data-i18n data-de="Weitere Expertise kommt hinzu" data-en="Further expertise is added">Weitere Expertise kommt hinzu</h3><p data-i18n data-de="Daniela Karl findet über Peter Bösing zum LiquidityBooster und bringt ihre eigene Erfahrung und Expertise ein." data-en="Daniela Karl discovers LiquidityBooster through Peter Bösing and contributes her own experience and expertise.">Daniela Karl findet über Peter Bösing zum LiquidityBooster und bringt ihre eigene Erfahrung und Expertise ein.</p></article>
          <article class="time-event"><span class="time-date" data-i18n data-de="März bis August 2026" data-en="March to August 2026">März bis August 2026</span><h3 data-i18n data-de="Der Aufbau wird täglich sichtbar" data-en="The build becomes visible every day">Der Aufbau wird täglich sichtbar</h3><p data-i18n data-de="Fast täglich und Woche für Woche entstehen neue Webseiten, Artikel, Videos, Werkzeuge, Lernwege, Mitgliederfunktionen und Schutzsysteme. Die Clubmitglieder erleben den Wandel von LiquidityBooster 1.0 über 2.0 bis zur neuen Gesamtarchitektur live mit." data-en="Almost every day and week, new pages, articles, videos, tools, learning paths, member functions and protection systems are created. Club Members experience the transformation from LiquidityBooster 1.0 through 2.0 to the new overall architecture live.">Fast täglich und Woche für Woche entstehen neue Webseiten, Artikel, Videos, Werkzeuge, Lernwege, Mitgliederfunktionen und Schutzsysteme. Die Clubmitglieder erleben den Wandel von LiquidityBooster 1.0 über 2.0 bis zur neuen Gesamtarchitektur live mit.</p></article>
          <article class="time-event"><span class="time-date" data-i18n data-de="31. August 2026" data-en="31 August 2026">31. August 2026</span><h3 data-i18n data-de="Der neue Gastzugang wird vorgestellt" data-en="The new guest access is presented">Der neue Gastzugang wird vorgestellt</h3><p data-i18n data-de="Warteraum, drei Tore, Erwartungsbogen und der begleitete 72-Stunden-Zugang verbinden die gewachsene Akademie erstmals mit einem gezielten persönlichen Einstieg." data-en="A waiting room, three gates, an expectations form and the guided 72-hour access connect the growing Academy with a targeted personal entry point for the first time.">Warteraum, drei Tore, Erwartungsbogen und der begleitete 72-Stunden-Zugang verbinden die gewachsene Akademie erstmals mit einem gezielten persönlichen Einstieg.</p></article>
          <article class="time-event"><span class="time-date" data-i18n data-de="1. September 2026" data-en="1 September 2026">1. September 2026</span><h3 data-i18n data-de="Sechs Monate LiquidityBooster" data-en="Six months of LiquidityBooster">Sechs Monate LiquidityBooster</h3><p data-i18n data-de="Der Halbjahres-Meilenstein macht in einer zusammenhängenden Rückschau sichtbar, was seit dem offiziellen Start entstanden ist: Lernwelt, Gastzugang, Hörsäle, Projektanalyse, Schutz und eine von der Community mitgetragene Entwicklung." data-en="The six-month milestone shows in one connected review what has emerged since the official launch: a learning world, guest access, lecture halls, project analysis, protection and development supported by the community.">Der Halbjahres-Meilenstein macht in einer zusammenhängenden Rückschau sichtbar, was seit dem offiziellen Start entstanden ist: Lernwelt, Gastzugang, Hörsäle, Projektanalyse, Schutz und eine von der Community mitgetragene Entwicklung.</p></article>
          <article class="time-event"><span class="time-date" data-i18n data-de="Ab September 2026" data-en="From September 2026">Ab September 2026</span><h3 data-i18n data-de="LiquidityBooster 3.0 öffnet das nächste Kapitel" data-en="LiquidityBooster 3.0 opens the next chapter">LiquidityBooster 3.0 öffnet das nächste Kapitel</h3><p data-i18n data-de="Die tragende Architektur steht. Der Schwerpunkt wechselt vom grundlegenden Aufbau zur Nutzung, Vertiefung und geordneten Erweiterung des Bildungs-, Community- und Unternehmerökosystems." data-en="The supporting architecture is in place. The focus shifts from fundamental construction to use, deepening and orderly expansion of the educational, community and entrepreneurial ecosystem.">Die tragende Architektur steht. Der Schwerpunkt wechselt vom grundlegenden Aufbau zur Nutzung, Vertiefung und geordneten Erweiterung des Bildungs-, Community- und Unternehmerökosystems.</p></article>
          </div><div class="time-close" data-i18n data-de="Aus zwei Worten wurde Schritt für Schritt ein System. Und viele dieser Schritte sind nicht am Reißbrett entstanden, sondern im echten Gebrauch, durch Fragen, Rückmeldungen und gemeinsames Weiterentwickeln." data-en="Two words gradually became a system. Many of those steps were not created on a drawing board, but through real use, questions, feedback and development together.">Aus zwei Worten wurde Schritt für Schritt ein System. Und viele dieser Schritte sind nicht am Reißbrett entstanden, sondern im echten Gebrauch, durch Fragen, Rückmeldungen und gemeinsames Weiterentwickeln.</div></details></div></section>
          '''
          insertion='<section class="section"><div class="wrap"><div class="reading reveal"><div class="eyebrow" data-i18n data-de="Drei mögliche Ausgangspunkte"'
          if 'Zeitreise öffnen · 14 Meilensteine' not in s:
              if insertion not in s:
                  raise SystemExit('Insertion marker not found')
              s=s.replace(insertion,timeline+insertion,1)

          if 'Wir bauen diesen Hörsaal bewusst Seite für Seite' in s:
              raise SystemExit('Meta text still present')
          if 'Zeitreise öffnen · 14 Meilensteine' not in s:
              raise SystemExit('Timeline missing')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name "LiquidityBooster Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/patch-hoersaal-page1-final.yml
          git add hoersaal-liquiditybooster/01-willkommen.html
          git commit -m "Finalize Hoersaal page 1 timeline"
          git push
