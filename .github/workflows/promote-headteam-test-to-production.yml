name: Promote Headteam Test Pages to Production

on:
  push:
    paths:
      - '.github/workflows/promote-headteam-test-to-production.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh checkout
        run: git pull --rebase origin main

      - name: Promote approved test pages
        run: |
          set -e
          test -s pages/headteam-vorlauf/head-control-2/index.html
          test -s pages/headteam-vorlauf/headteam-2/index.html
          python3 - <<'PY'
          from pathlib import Path

          hc_src = Path('pages/headteam-vorlauf/head-control-2/index.html').read_text(encoding='utf-8')
          ht_src = Path('pages/headteam-vorlauf/headteam-2/index.html').read_text(encoding='utf-8')
          hc_prod = hc_src.replace('<title>Head Control 2</title>', '<title>Head Control</title>', 1)

          Path('pages/headteam-vorlauf/head-control.html').write_text(hc_prod, encoding='utf-8')
          Path('pages/headteam-vorlauf/index.html').write_text(ht_src, encoding='utf-8')
          PY

      - name: Validate exact production copies
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          hc_src = Path('pages/headteam-vorlauf/head-control-2/index.html').read_text(encoding='utf-8')
          ht_src = Path('pages/headteam-vorlauf/headteam-2/index.html').read_text(encoding='utf-8')
          hc_expected = hc_src.replace('<title>Head Control 2</title>', '<title>Head Control</title>', 1)
          hc_prod = Path('pages/headteam-vorlauf/head-control.html').read_text(encoding='utf-8')
          ht_prod = Path('pages/headteam-vorlauf/index.html').read_text(encoding='utf-8')

          assert hc_prod == hc_expected, 'Head Control production copy differs from approved test source'
          assert ht_prod == ht_src, 'Headteam production copy differs from approved test source'
          assert len(hc_prod) > 10000 and len(ht_prod) > 10000, 'Production file unexpectedly small'
          print('Production copies match approved test pages exactly.')
          PY

      - name: Commit production migration
        run: |
          set -e
          git config user.name 'FSA Headteam'
          git config user.email 'actions@github.com'
          git add pages/headteam-vorlauf/index.html pages/headteam-vorlauf/head-control.html
          git commit -m 'Promote approved Headteam 14 Tage and Head Control to production'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then exit 1; fi
            sleep 2
          done

# trigger approved migration: production files only
