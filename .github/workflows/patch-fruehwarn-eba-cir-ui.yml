name: Projekt Frühwarn-Check – EBA Kreditinstitutsanzeige

on:
  push:
    paths:
      - '.github/workflows/patch-fruehwarn-eba-cir-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finanzaufsichtstext an angeschlossene Quellen angleichen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('pages/projekt-fruehwarn-check/index.html')
          s=p.read_text(encoding='utf-8')
          old="BaFin und ESMA automatisch geprüft: kein eindeutiger Warn- oder Zulassungstreffer gefunden."
          new="BaFin, ESMA und EBA automatisch geprüft: kein eindeutiger Warn- oder Zulassungs-/Registertreffer gefunden."
          if old not in s:
              if new in s:
                  print('Text bereits aktuell.')
              else:
                  raise SystemExit('Zieltext nicht gefunden – kein unsicherer Patch')
          else:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY

      - name: Änderungen speichern
        shell: bash
        run: |
          set -euo pipefail
          grep -q "BaFin, ESMA und EBA automatisch geprüft" pages/projekt-fruehwarn-check/index.html
          git config user.name "FSA Frühwarn-Update"
          git config user.email "actions@github.com"
          git add pages/projekt-fruehwarn-check/index.html
          if git diff --cached --quiet; then
            echo "Keine Änderung notwendig."
          else
            git commit -m "Frühwarn-Check: EBA Finanzaufsichtstext aktualisieren"
            git pull --rebase
            git push
          fi
