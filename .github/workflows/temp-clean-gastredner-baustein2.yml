name: One-time Gastredner Baustein 2 cleanup

on:
  push:
    paths:
      - '.github/workflows/temp-clean-gastredner-baustein2.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove retired 30-minute branch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('pages/gastredner-buehne-leitartikel/index.html')
          s = path.read_text(encoding='utf-8')
          before = s

          # Two products remain: 15-minute guest speaker + feature article.
          old = '.product-grid{display:grid;grid-template-columns:repeat(3,1fr);'
          new = '.product-grid{display:grid;grid-template-columns:repeat(2,1fr);'
          assert old in s
          s = s.replace(old, new, 1)

          # Visible flow copy.
          assert '15 Minuten, 30 Minuten oder Leitartikel.' in s
          s = s.replace('15 Minuten, 30 Minuten oder Leitartikel.', '15 Minuten oder Leitartikel.', 1)

          # Remove the retired 30-minute product button.
          s, n = re.subn(r'\n\s*<button class="product" type="button" data-product="speaker30">.*?</button>', '', s, count=1, flags=re.S)
          assert n == 1, n

          # Remove the complete 30-minute deep-dive form block while preserving the surrounding form-block close.
          marker = '        <div id="speaker30Extra" class="hidden">'
          assert marker in s
          start = s.index(marker)
          closing = '        </div>\n      </div>\n    </section>'
          end_anchor = s.index(closing, start)
          end = end_anchor + len('        </div>\n')
          s = s[:start] + s[end:]

          # Update DE/EN service-choice copy.
          s = s.replace("flow1s:'15 Minuten, 30 Minuten oder Leitartikel.'", "flow1s:'15 Minuten oder Leitartikel.'")
          s = s.replace("flow1s:'15 minutes, 30 minutes or feature article.'", "flow1s:'15 minutes or feature article.'")

          # Remove all i18n keys that existed only for the retired 30-minute option.
          keys = [
              'p30Title','p30Text','deepTitle','deepGuide','problem','background','approach','exampleStory','moderatorQuestions',
              'speaker30Title','speaker30Sub','slot30Guide','content30Guide','selected30','pdfGuide30'
          ]
          for key in keys:
              s, _ = re.subn(r"," + re.escape(key) + r":'(?:\\'|[^'])*'", '', s)

          # Old localStorage values from previous visits may still contain an obsolete product id.
          old_line = "let product=localStorage.getItem(STORE+'_product')||'';"
          new_line = "let product=localStorage.getItem(STORE+'_product')||'';if(!['speaker15','article'].includes(product)){product='';localStorage.removeItem(STORE+'_product')}"
          assert old_line in s
          s = s.replace(old_line, new_line, 1)

          # Product selection/rendering now only knows speaker15 + article.
          lines = s.splitlines()
          out = []
          replaced_set = replaced_render = replaced_snapshot = replaced_create = False
          for line in lines:
              if line.startswith('function setProduct(p){'):
                  out.append("function setProduct(p){if(!['speaker15','article'].includes(p))return;product=p;localStorage.setItem(STORE+'_product',p);document.querySelectorAll('.product').forEach(b=>b.classList.toggle('active',b.dataset.product===p));document.querySelectorAll('.form-area').forEach(el=>el.classList.add('show'));$('speakerPanel').classList.toggle('show',p==='speaker15');$('articlePanel').classList.toggle('show',p==='article');renderProduct();save();setTimeout(()=>$('commonPanel').scrollIntoView({behavior:'smooth',block:'start'}),80)}")
                  replaced_set = True
              elif line.startswith('function renderProduct(){'):
                  out.append("function renderProduct(){if(!product)return;if(product==='speaker15'){$('speakerTitle').textContent=tr('speaker15Title');$('speakerSub').textContent=tr('speaker15Sub');$('slotGuide').textContent=tr('slot15Guide');$('contentGuide').textContent=tr('content15Guide');$('selectedLabel').textContent=tr('selected15')}else $('selectedLabel').textContent=tr('selectedArticle')}")
                  replaced_render = True
              elif line.startswith('function dataSnapshot(){'):
                  line = line.replace(",problem:fieldValue('problem'),background:fieldValue('background'),approach:fieldValue('approach'),exampleStory:fieldValue('exampleStory'),moderatorQuestions:fieldValue('moderatorQuestions')", '')
                  out.append(line)
                  replaced_snapshot = True
              elif line.startswith('function createPdf(){'):
                  out.append("function createPdf(){if(!product)return;if(!validate())return;save();const d=dataSnapshot(),type=product==='article'?'Leitartikel':'Gastredner-15min',date=product==='article'?new Date().toISOString().slice(0,10):(d.date1||new Date().toISOString().slice(0,10));downloadBlob(`LiquidityBooster_${type}_${safeName(d.personName)}_${date}.pdf`,buildPdf(d));showNotice(tr('pdfOk'),'ok')}")
                  replaced_create = True
              else:
                  out.append(line)
          assert replaced_set and replaced_render and replaced_snapshot and replaced_create
          s = '\n'.join(out) + ('\n' if before.endswith('\n') else '')

          # Remove retired branches from the in-browser PDF engine.
          replacements = {
              "product==='article'?tr('paTitle'):(product==='speaker30'?tr('speaker30Title'):tr('speaker15Title'))": "product==='article'?tr('paTitle'):tr('speaker15Title')",
              "product==='article'?tr('pdfGuideArticle'):(product==='speaker30'?tr('pdfGuide30'):tr('pdfGuide15'))": "product==='article'?tr('pdfGuideArticle'):tr('pdfGuide15')",
              "product==='speaker30'?'Montag 19:15–19:45':'Montag 19:15–19:30'": "'Montag 19:15–19:30'",
              "(product==='speaker30'?'19:15–19:45':'19:15–19:30')": "'19:15–19:30'"
          }
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new)

          # Delete standalone 30-minute PDF guidance/content branches.
          s = re.sub(r"^\s*if\(product==='speaker30'\)para\(.*\);\n", '', s, flags=re.M)
          s = re.sub(r"^\s*if\(product==='speaker30'\)\{field\(.*\)\}\n", '', s, flags=re.M)

          # Safety audit: no retired product vocabulary/ids may survive in this combined page.
          forbidden = ['speaker30','p30Title','p30Text','slot30Guide','content30Guide','selected30','pdfGuide30','19:45','30 Minuten','30-Minuten','30 minutes','30-minute']
          leftovers = [x for x in forbidden if x in s]
          assert not leftovers, f'Leftovers: {leftovers}'
          assert 'data-product="speaker15"' in s
          assert 'data-product="article"' in s
          assert 'Montag · 19:15–19:30' in s
          assert s != before

          path.write_text(s, encoding='utf-8')
          PY

      - name: Commit cleanup and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-clean-gastredner-baustein2.yml
          git add pages/gastredner-buehne-leitartikel/index.html
          git commit -m "fix: remove retired 30-minute guest speaker branch"
          git push
