name: Consolidate Notfallakte V08
on:
  push:
    paths:
      - '.github/workflows/consolidate-notfallakte-v08.yml'
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check final V08
        run: node --check pages/notfallakte/v08-final.js
      - name: Activate consolidated V08
        shell: python
        run: |
          from pathlib import Path
          p=Path('pages/notfallakte/index.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="./v08-backup.js"></script><script src="./v08-training.js"></script><script src="./v08-feedback.js"></script>'
          new='<script src="./v08-final.js"></script>'
          if old not in s:
              raise SystemExit('Expected V08 script chain not found')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
      - name: Remove superseded V08 runtime files
        run: |
          git rm pages/notfallakte/v08-backup.js pages/notfallakte/v08-training.js pages/notfallakte/v08-feedback.js
      - name: Commit consolidated V08
        run: |
          git config user.name "Adler-FSA"
          git config user.email "ceo@liquiditybooster.de"
          git rm .github/workflows/consolidate-notfallakte-v08.yml
          git add pages/notfallakte/index.html pages/notfallakte/v08-final.js
          git commit -m "Consolidate Notfallakte V08 implementation"
          git push