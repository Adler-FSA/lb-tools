name: Polish contract PDF V2

on:
  push:
    paths:
      - '.github/workflows/polish-contract-pdf-v2.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Polish PDF engine and confirmation copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Generic V2 PDF engine: clean control rendering + footer
          p=Path('pages/vertraege/contract-pdf-engine-v2.js')
          s=p.read_text(encoding='utf-8')

          old="c.querySelectorAll('input,textarea,select').forEach(el=>{const span=document.createElement('span');if(el.type==='checkbox'||el.type==='radio')span.textContent=el.checked?'[X]':'[ ]';else span.textContent=el.value||'';el.replaceWith(span)});"
          new="c.querySelectorAll('input,textarea,select').forEach(el=>{const span=document.createElement('span');if(el.type==='checkbox'||el.type==='radio'){span.textContent=el.checked?'[X] ':'[ ] '}else{let v=el.value||'';if(el.type==='date'&&/^\\d{4}-\\d{2}-\\d{2}$/.test(v)){const [y,m,d]=v.split('-');v=document.documentElement.lang==='en'?`${d}/${m}/${y}`:`${d}.${m}.${y}`}span.textContent=v?': '+v:''}el.replaceWith(span)});"
          if old not in s:
              raise SystemExit('SCHUTZSTOPP: cloneContent control block not found')
          s=s.replace(old,new,1)

          old="function renderPage(pg,i,total,footerText,date){const p=pg.p;if(i>0&&footerText){p.text(footerText,ML,PH-27,7.2,true,p.C.navy);p.rule(ML,PH-36,W,p.C.mint,.55)}p.rule(ML,35,W);if(footerText)p.text(footerText,ML,22,6.7,false,p.C.gray);p.text(`${date} · Seite ${i+1} von ${total}`,PW-MR-114,22,6.7,false,p.C.gray);return ascii(p.c.join(''))}"
          new="function renderPage(pg,i,total,footerText,date){const p=pg.p;if(i>0&&footerText){p.text(footerText,ML,PH-27,7.2,true,p.C.navy);p.rule(ML,PH-36,W,p.C.mint,.55)}p.rule(ML,35,W);p.text(`${date} · Seite ${i+1} von ${total}`,PW-MR-114,22,6.7,false,p.C.gray);return ascii(p.c.join(''))}"
          if old not in s:
              raise SystemExit('SCHUTZSTOPP: renderPage block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Club Partner copy: no obsolete signatory-field wording
          p=Path('pages/vertraege/club-partner-enhancements-v1.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace(
            'Bitte bestätige die nachstehenden Erklärungen aktiv. Die gesetzten Bestätigungen, deine Vertragsdaten sowie Ort, Datum und Name des Unterzeichners werden gemeinsam mit diesem Vertragsstand in der erzeugten A4-PDF dokumentiert.',
            'Bitte bestätige die nachstehenden Erklärungen aktiv. Die gesetzten Bestätigungen, deine Vertragsdaten sowie Ort und Datum werden gemeinsam mit diesem Vertragsstand in der erzeugten A4-PDF dokumentiert. Dein Vor- und Nachname wird aus den Vertragsdaten übernommen.'
          )
          s=s.replace(
            'Please actively confirm the statements below. The selected confirmations, your contract data, place, date and signatory name are documented together with this contract version in the generated A4 PDF.',
            'Please actively confirm the statements below. The selected confirmations, your contract data, place and date are documented together with this contract version in the generated A4 PDF. Your first and last name are taken from the contract data.'
          )
          p.write_text(s,encoding='utf-8')

          # Cache bust on the page
          p=Path('pages/vertraege/club-partner.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('contract-pdf-engine-v2.js?v=2','contract-pdf-engine-v2.js?v=3')
          s=s.replace('club-partner-enhancements-v1.js?v=3','club-partner-enhancements-v1.js?v=4')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Verify scripts
        shell: bash
        run: |
          node --check pages/vertraege/contract-pdf-engine-v2.js
          node --check pages/vertraege/club-partner-enhancements-v1.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('pages/vertraege/club-partner.html').read_text(encoding='utf-8')
          assert 'contract-pdf-engine-v2.js?v=3' in s
          assert 'club-partner-enhancements-v1.js?v=4' in s
          e=Path('pages/vertraege/contract-pdf-engine-v2.js').read_text(encoding='utf-8')
          assert "v?': '+v:''" in e
          assert "if(footerText)p.text(footerText,ML,22" not in e
          x=Path('pages/vertraege/club-partner-enhancements-v1.js').read_text(encoding='utf-8')
          assert 'Dein Vor- und Nachname wird aus den Vertragsdaten übernommen.' in x
          PY

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'Adler-FSA'
          git config user.email 'ceo@liquiditybooster.de'
          git add pages/vertraege/contract-pdf-engine-v2.js pages/vertraege/club-partner-enhancements-v1.js pages/vertraege/club-partner.html
          git commit -m 'Polish contract PDF confirmation output'
          git rm .github/workflows/polish-contract-pdf-v2.yml
          git commit -m 'Remove one-time contract polish workflow'
          git push
