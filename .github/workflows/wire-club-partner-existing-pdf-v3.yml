name: Clean Club Partner contract PDF wiring

on:
  push:
    paths:
      - '.github/workflows/wire-club-partner-existing-pdf-v3.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Keep contract completely contract-specific
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html = Path('pages/vertraege/club-partner.html')
          engine = Path('pages/vertraege/fsa-contract-pdf-engine.js')
          s = html.read_text(encoding='utf-8')

          old = "Zu den derzeit vorgesehenen weiterführenden Angeboten können insbesondere Notfallakte, Krypto-Steuer-Assistent, Business-Assistent und Hörsäle gehören."
          new = "Weiterführende Akademieprodukte, Werkzeuge, Vermarktungsrechte und Sichtbarkeitsrechte können gesonderten Qualifikations- und Freischaltungsregeln unterliegen."
          s = s.replace(old, new)

          # Der Club-Partner-Vertrag bleibt ausschließlich an seiner eigenen PDF-Ausgabe verdrahtet.
          if '<script src="./fsa-contract-pdf-engine.js"></script>' not in s:
              raise SystemExit('SCHUTZSTOPP: Vertrags-PDF-Engine ist nicht korrekt verdrahtet')
          if 'pages/notfallakte' in s.lower() or '../notfallakte/' in s.lower():
              raise SystemExit('SCHUTZSTOPP: Notfallakte-Dateipfad in Vertragsseite gefunden')
          if 'notfallakte' in s.lower():
              raise SystemExit('SCHUTZSTOPP: sichtbare Notfallakte-Referenz im Club-Partner-Vertrag gefunden')
          if not engine.exists():
              raise SystemExit('SCHUTZSTOPP: Vertrags-PDF-Engine fehlt')
          if 'notfallakte' in engine.read_text(encoding='utf-8').lower():
              raise SystemExit('SCHUTZSTOPP: Notfallakte-Referenz in Vertrags-PDF-Engine gefunden')

          html.write_text(s, encoding='utf-8')
          PY

      - name: Syntax check contract JavaScript
        shell: bash
        run: |
          node --check pages/vertraege/fsa-contract-pdf-engine.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('pages/vertraege/club-partner.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/club-partner-inline.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/club-partner-inline.js

      - name: Commit cleanup and remove one-time workflow
        shell: bash
        run: |
          git config user.name "Adler-FSA Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/wire-club-partner-existing-pdf-v3.yml
          git add pages/vertraege/club-partner.html
          git commit -m "Keep Club Partner contract fully contract-specific"
          git push
