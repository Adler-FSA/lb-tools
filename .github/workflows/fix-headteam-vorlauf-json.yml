name: Headteam Vorlauf JSON reparieren

on:
  push:
    paths:
      - '.github/workflows/fix-headteam-vorlauf-json.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Headteam-Datendatei aktualisieren und validieren
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/headteam-vorlauf.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          target = None
          for project in data.get('projects', []):
              if project.get('url') == 'https://tools.liquiditybooster.de/pages/sichtbar-werden-produkte.html':
                  target = project
                  break

          if target is None:
              raise SystemExit('Zielprojekt Sichtbar werden wurde nicht gefunden.')

          old = 'Gastredner im Clubtreffen – 15 Minuten für 25 € oder 30 Minuten für 45 € inklusive Sichtbarkeitspaket.'
          new = 'Gastredner im Clubtreffen – 15 Minuten für 35 € inklusive Sichtbarkeitspaket.'

          text = target.get('what', '')
          if old in text:
              target['what'] = text.replace(old, new)
          elif new not in text:
              raise SystemExit('Erwarteter Gastredner-Text wurde nicht gefunden.')

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          json.loads(path.read_text(encoding='utf-8'))
          print('JSON gültig; Gastredner 15 Minuten / 35 € gesetzt.')
          PY

      - name: Reparatur speichern und Einmal-Workflow entfernen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FSA Headteam Repair"
          git config user.email "actions@github.com"
          git rm -- .github/workflows/fix-headteam-vorlauf-json.yml
          git add -- data/headteam-vorlauf.json
          git commit -m "fix: Headteam Vorlauf JSON gültig halten und 35-Euro-Gastredner setzen"
          git push
