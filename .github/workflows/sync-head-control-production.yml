name: Sync Head Control Production

on:
  push:
    paths:
      - '.github/workflows/sync-head-control-production.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh checkout
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Sync approved Head Control test source
        run: |
          cp pages/headteam-vorlauf/head-control-2.html pages/headteam-vorlauf/head-control-2/index.html
          cp pages/headteam-vorlauf/head-control-2.html pages/headteam-vorlauf/head-control.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pages/headteam-vorlauf/head-control.html')
          s=p.read_text()
          s=s.replace('<title>Head Control 2</title>','<title>Head Control</title>')
          p.write_text(s)
          PY
      - name: Validate required categories and parity
        run: |
          grep -q 'data-project-category="produkte-aktualisiert"' pages/headteam-vorlauf/head-control.html
          grep -q 'data-project-category="neue-produkte"' pages/headteam-vorlauf/head-control.html
          grep -q "'produkte-aktualisiert':'Produkte aktualisiert'" pages/headteam-vorlauf/head-control.html
          grep -q "'neue-produkte':'Neue Produkte'" pages/headteam-vorlauf/head-control.html
          cmp -s pages/headteam-vorlauf/head-control-2.html pages/headteam-vorlauf/head-control-2/index.html
      - name: Commit synced files
        run: |
          git config user.name 'FSA Headteam'
          git config user.email 'actions@github.com'
          git add pages/headteam-vorlauf/head-control.html pages/headteam-vorlauf/head-control-2/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'fix: sync Head Control with approved test version'
            git push origin HEAD:main
          fi
