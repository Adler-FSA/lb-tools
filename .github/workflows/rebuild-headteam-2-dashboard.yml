name: Headteam 2 Dashboard-Look neu aufbauen

on:
  push:
    paths:
      - '.github/workflows/rebuild-headteam-2-dashboard.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Headteam-2 neu erzeugen und prüfen
        run: python scripts/rebuild_headteam_2_dashboard.py
      - name: Änderungen speichern
        run: |
          rm -f .github/workflows/rebuild-headteam-2-dashboard.yml scripts/rebuild_headteam_2_dashboard.py
          git config user.name "FSA Headteam Test"
          git config user.email "actions@github.com"
          git add pages/headteam-vorlauf/headteam-2/index.html .github/workflows/rebuild-headteam-2-dashboard.yml scripts/rebuild_headteam_2_dashboard.py
          git commit -m "test: Headteam 2 Dashboard mit Neuzugaengen und Terminen"
          git push
