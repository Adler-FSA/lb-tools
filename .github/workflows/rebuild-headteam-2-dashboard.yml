name: Headteam 2 Dashboard-Look neu aufbauen

on:
  push:
    paths:
      - '.github/workflows/rebuild-headteam-2-dashboard.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Headteam-2 aus stabiler Sichtseite neu erzeugen
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re, subprocess, json

          src = Path('pages/headteam-vorlauf/index.html')
          dst = Path('pages/headteam-vorlauf/headteam-2/index.html')
          text = src.read_text(encoding='utf-8')

          categories = [
              ('leitartikel','Leitartikel'),
              ('kms-content','KMS Content'),
              ('serien','Serien'),
              ('club-haus','Club Haus'),
              ('oeffentlich','Öffentlich'),
              ('newsletter','Newsletter'),
              ('hoersaele','Hörsäle'),
              ('kurse','Kurse'),
              ('social-media','Social Media'),
          ]

          # Auf der Testseite immer absolut von der Domainwurzel laden.
          text = text.replace("const DATA_URL='../../data/headteam-vorlauf.json'", "const DATA_URL='/data/headteam-vorlauf.json'", 1)

          # Kategorien in die Navigation aufnehmen.
          nav_marker = '    <button class="nav-btn" data-panel="zoom" data-i18n="navZoom">Zoom</button>'
          cat_nav = ''.join(f'    <button class="nav-btn" data-project-category="{slug}">{label}</button>\n' for slug,label in categories)
          if nav_marker not in text:
              raise SystemExit('Navigation-Marker fehlt')
          text = text.replace(nav_marker, cat_nav + nav_marker, 1)

          # Übersicht bekommt Freigabe + Zoom nebeneinander, Neuzugänge und Team-Schnellzugriff.
          zoom_overview_marker = '    <div id="nextZoomOverview"></div>'
          overview_insert = '''    <div class="overview-focus"><div id="nextReleaseOverview"></div><div id="nextZoomOverview"></div></div>
    <section class="dash-section">
      <div class="dash-section-head"><h3>Neu eingestellt</h3><span>automatisch nach Einstelldatum</span></div>
      <div class="new-entry-list" id="newEntries"></div>
    </section>
    <section class="dash-section">
      <div class="dash-section-head"><h3>Headteam</h3><span>aktuelle Zuordnungen</span></div>
      <div class="team-quick" id="teamQuick"></div>
    </section>'''
          if zoom_overview_marker not in text:
              raise SystemExit('Overview-Marker fehlt')
          text = text.replace(zoom_overview_marker, overview_insert, 1)

          # 14-Tage-Bereich bekommt Mini-Dashboard mit nächster Freigabe + nächstem Zoom.
          lead_marker = '    <div class="filters" id="filters"></div><div class="list" id="list"></div>'
          lead_insert = '''    <div class="mini-dashboard"><div id="miniRelease"></div><div id="miniZoom"></div><div class="mini-count" id="miniCount"></div></div>
    <div class="filters" id="filters"></div><div class="list" id="list"></div>'''
          if lead_marker not in text:
              raise SystemExit('14-Tage-Marker fehlt')
          text = text.replace(lead_marker, lead_insert, 1)

          # Dashboard/Control Look & Feel.
          css = r'''
<style id="headteam-2-dashboard-look">
:root{--page:#f5fafb;--mint-soft-2:#eaf9fa;--magenta-soft:#fff1f7}
html,body{background:var(--page)}body{padding:0;min-height:100vh}.wrap{max-width:none;width:100%;margin:0;padding:28px 28px 42px 258px;min-height:100vh}
.headline{align-items:center;margin:0 0 18px}.eyebrow{font-size:11px}.headline h1{font-size:clamp(36px,4vw,54px);letter-spacing:-.025em}.headline h1::after{content:"";display:block;width:72px;height:5px;margin-top:12px;border-radius:999px;background:linear-gradient(90deg,var(--mint) 0 62%,var(--magenta) 62% 100%)}.count{border:1px solid #d9e6e8;border-radius:999px;background:#fff;padding:8px 11px;box-shadow:0 4px 14px rgba(19,34,56,.04)}
.cockpit-nav{position:fixed;z-index:40;left:0;top:0;bottom:0;width:230px;height:auto;margin:0;padding:118px 16px 22px;display:flex;flex-direction:column;align-items:stretch;gap:8px;overflow-y:auto;overflow-x:hidden;background:#fff;border:0;border-right:1px solid #d9e6e8;box-shadow:12px 0 32px rgba(19,34,56,.045);backdrop-filter:none}
.cockpit-nav::before{content:"HEADTEAM";position:absolute;left:20px;top:30px;right:20px;padding-bottom:18px;border-bottom:1px solid #e3ecee;color:var(--navy);font-size:19px;font-weight:950;letter-spacing:.02em}.cockpit-nav::after{content:"14 TAGE VORLAUF";position:absolute;left:20px;top:61px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.08em}
.nav-btn{width:100%;flex:0 0 auto;border:1px solid transparent;border-radius:12px;background:transparent;color:var(--navy);padding:12px 13px;text-align:left;font-size:14px;transition:.15s ease}.nav-btn:hover{background:var(--mint-soft);border-color:#ccecee}.nav-btn.active{background:var(--mint);border-color:var(--mint);color:#fff;box-shadow:0 7px 18px rgba(0,167,173,.18)}
.section-head{margin:4px 0 14px;padding:15px 18px;border:1px solid #d9e6e8;border-radius:16px;background:linear-gradient(90deg,#fff,#fbffff);box-shadow:0 6px 20px rgba(19,34,56,.04)}.section-title{font-size:22px}.section-copy{margin-top:5px!important}
.dashboard-grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.dash-card,.mini-card,.mini-count,.team-box,.item,.access-card,.person-group,.dash-section{border-color:#d9e6e8;box-shadow:0 7px 24px rgba(19,34,56,.05)}.dash-card{position:relative;overflow:hidden;padding:17px}.dash-card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--mint)}.dash-card:nth-child(even)::before{background:var(--magenta)}
.overview-focus{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}.overview-focus .next-card{height:100%;margin:0}.next-card{border-color:#cdebed;background:linear-gradient(135deg,#fff 0%,#eefafa 100%);box-shadow:0 8px 25px rgba(19,34,56,.05)}#nextZoomOverview .next-card{border-color:#f0c3dc;background:linear-gradient(135deg,#fff 0%,var(--magenta-soft) 100%)}#nextZoomOverview .next-kicker{color:var(--magenta)}
.dash-section{border:1px solid #d9e6e8;border-radius:18px;background:#fff;margin:0 0 14px;overflow:hidden}.dash-section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid #e5ecee;background:linear-gradient(90deg,#fff,#fbffff)}.dash-section-head h3{margin:0;color:var(--navy);font-size:17px}.dash-section-head span{color:var(--muted);font-size:11px;font-weight:800}
.new-entry-list{display:grid}.new-entry{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:13px 16px;border-top:1px solid #edf1f4}.new-entry:first-child{border-top:0}.new-title{font-weight:900;color:var(--navy);line-height:1.35}.new-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px;color:var(--muted);font-size:12px}.new-category{display:inline-flex;border-radius:999px;padding:4px 8px;background:var(--mint-soft);color:#08757a;font-size:11px;font-weight:900}.new-release{font-size:12px;color:var(--navy);font-weight:900;white-space:nowrap}.new-badge{display:inline-flex;border-radius:999px;padding:5px 8px;background:var(--magenta-soft);color:var(--magenta);font-size:10px;font-weight:950;letter-spacing:.05em}
.mini-dashboard{display:grid;grid-template-columns:1.15fr 1.15fr .7fr;gap:12px;margin:0 0 14px}.mini-card,.mini-count{position:relative;overflow:hidden;border:1px solid #d9e6e8;border-radius:16px;background:#fff;padding:16px}.mini-card::before,.mini-count::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--mint)}#miniZoom .mini-card::before{background:var(--magenta)}.mini-count::before{background:var(--navy)}.mini-card .kicker,.mini-count .kicker{font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:900;color:var(--muted)}.mini-card .big,.mini-count .big{margin-top:6px;color:var(--navy);font-size:18px;font-weight:950;line-height:1.3}.mini-card .small,.mini-count .small{margin-top:5px;color:var(--muted);font-size:12px;line-height:1.4}
.team-quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:14px}.team-box{border:1px solid #d9e6e8;border-radius:15px;background:#fff;padding:12px}.team-button{width:100%;border:0;border-radius:11px;background:var(--mint);color:#fff;padding:10px 12px;font:inherit;font-weight:900;cursor:pointer;box-shadow:0 5px 14px rgba(0,167,173,.13)}.team-box:nth-child(even) .team-button{background:var(--magenta);box-shadow:0 5px 14px rgba(198,0,111,.12)}.team-line{margin-top:8px;color:var(--muted);font-size:12px;line-height:1.4;min-height:34px}
.item{position:relative;border-radius:16px;background:#fff}.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--mint)}.row{padding:16px 17px 16px 20px}.title{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.35}.type{display:inline-flex;border-radius:999px;background:var(--mint-soft);padding:3px 7px}.quick-btn,.download{border-color:#d5e3e5}.quick-btn:hover,.download:hover{background:var(--mint-soft)}
@media(max-width:1320px){.dashboard-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:1050px){.wrap{padding-left:220px;padding-right:18px}.cockpit-nav{width:198px;padding-left:12px;padding-right:12px}.dashboard-grid{grid-template-columns:1fr 1fr}.overview-focus{grid-template-columns:1fr}}
@media(max-width:820px){.wrap{padding:14px}.cockpit-nav{position:sticky;top:0;bottom:auto;width:auto;height:auto;margin:0 -14px 16px;padding:10px 14px;flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid #d9e6e8;box-shadow:0 7px 20px rgba(19,34,56,.045)}.cockpit-nav::before,.cockpit-nav::after{display:none}.nav-btn{width:auto;white-space:nowrap;padding:9px 12px}.mini-dashboard{grid-template-columns:1fr 1fr}.mini-count{grid-column:1/-1}.team-quick{grid-template-columns:1fr 1fr}.new-entry{grid-template-columns:1fr auto}}
@media(max-width:560px){.wrap{padding:10px}.cockpit-nav{margin:0 -10px 14px;padding-left:10px;padding-right:10px}.dashboard-grid,.mini-dashboard,.team-quick,.overview-focus{grid-template-columns:1fr}.mini-count{grid-column:auto}.headline{flex-direction:column;align-items:flex-start;gap:10px}.new-entry{grid-template-columns:1fr}.new-release,.new-badge{justify-self:start}.row{grid-template-columns:1fr}.row>.open{grid-column:auto;grid-row:auto;justify-self:start}}
</style>
'''
          text = text.replace('</head>', css + '</head>', 1)

          # Statusvariablen für Bereichs- und Personenfilter.
          old_state = "let state={version:4,projects:[],archive:[],personalLinks:[],headteamAccess:[]},activeType='all',activePanel='overview';"
          new_state = "let state={version:4,projects:[],archive:[],personalLinks:[],headteamAccess:[]},activeType='all',activePanel='overview',activeProjectCategory='all',activePerson='all';"
          if old_state not in text:
              raise SystemExit('State-Marker fehlt')
          text = text.replace(old_state, new_state, 1)

          cat_map = ','.join(f"'{slug}':'{label}'" for slug,label in categories)
          type_marker = "const typeMap={course:'course',website:'website',clubhouse:'clubhouse',function:'function',other:'other'},personOrder=['alexander','oliver','peter','daniel'];"
          helper = f"const READ_CATEGORIES={{{cat_map}}};function readCategoryLabel(v){{return READ_CATEGORIES[v]||''}};"
          if type_marker not in text:
              raise SystemExit('TypeMap-Marker fehlt')
          text = text.replace(type_marker, helper + type_marker, 1)

          # Nur echte Panel-Buttons an die normale Panel-Navigation hängen.
          text = text.replace("document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>setPanel(b.dataset.panel));", "document.querySelectorAll('.nav-btn[data-panel]').forEach(b=>b.onclick=()=>setPanel(b.dataset.panel));", 1)

          # Projektliste nach Bereich filterbar machen und Bereich anzeigen.
          old_filter = "list=all.filter(p=>activeType==='all'||p.type===activeType).sort("
          new_filter = "list=all.filter(p=>(activeProjectCategory==='all'||p.category===activeProjectCategory)&&(activeType==='all'||p.type===activeType)).sort("
          if old_filter not in text:
              raise SystemExit('Projektfilter-Marker fehlt')
          text = text.replace(old_filter, new_filter, 1)
          old_meta = "if(p.type)meta.push(`<span class=\"type\">${esc(typeLabel(p.type))}</span>`);if(p.releaseDate)"
          new_meta = "if(p.category)meta.push(`<span class=\"type\">${esc(readCategoryLabel(p.category))}</span>`);else if(p.type)meta.push(`<span class=\"type\">${esc(typeLabel(p.type))}</span>`);if(p.releaseDate)"
          text = text.replace(old_meta, new_meta, 1)

          # Archiv zeigt bei neuen Einträgen ebenfalls den Bereich.
          old_archive_meta = "if(p.type)meta.push(`<span class=\"type\">${esc(typeLabel(p.type))}</span>`);if(p.archivedAt)"
          new_archive_meta = "if(p.category)meta.push(`<span class=\"type\">${esc(readCategoryLabel(p.category))}</span>`);else if(p.type)meta.push(`<span class=\"type\">${esc(typeLabel(p.type))}</span>`);if(p.archivedAt)"
          text = text.replace(old_archive_meta, new_archive_meta, 1)

          extra_js = r'''
function nextRelease(){const today=new Date();today.setHours(0,0,0,0);return(state.projects||[]).filter(p=>p.releaseDate&&new Date(p.releaseDate+'T00:00:00')>=today).slice().sort((a,b)=>a.releaseDate.localeCompare(b.releaseDate))[0]||null}
function releaseCard(p){if(!p)return`<div class="next-card"><div class="next-kicker">Nächste Freigabe</div><div class="next-row"><div><div class="next-title">Keine Freigabe terminiert</div><div class="next-meta">Sobald in Head Control ein Termin gesetzt wird, erscheint er hier.</div></div></div></div>`;return`<div class="next-card"><div class="next-kicker">Nächste Freigabe</div><div class="next-row"><div><div class="next-title">${esc(p.title||'–')}</div><div class="next-time">${esc(formatDate(p.releaseDate))}</div><div class="next-meta">${p.category?'Bereich: '+esc(readCategoryLabel(p.category)):'Bereich noch nicht zugeordnet'}</div></div>${openButton(p.url)}</div></div>`}
function renderNextReleaseOverview(){const el=$('#nextReleaseOverview');if(el)el.innerHTML=releaseCard(nextRelease())}
function renderMiniDashboard(){const n=nextRelease(),today=new Date();today.setHours(0,0,0,0);const end=new Date(today);end.setDate(end.getDate()+14);const count=(state.projects||[]).filter(p=>p.releaseDate&&new Date(p.releaseDate+'T00:00:00')>=today&&new Date(p.releaseDate+'T00:00:00')<=end).length;const rel=$('#miniRelease'),zoom=$('#miniZoom'),cnt=$('#miniCount');if(rel)rel.innerHTML=n?`<div class="mini-card"><div class="kicker">Nächste Freigabe</div><div class="big">${esc(n.title||'–')}</div><div class="small">${esc(formatDate(n.releaseDate))}${n.category?' · '+esc(readCategoryLabel(n.category)):''}</div></div>`:`<div class="mini-card"><div class="kicker">Nächste Freigabe</div><div class="big">–</div><div class="small">Aktuell keine Freigabe terminiert.</div></div>`;const z=nextZoom();if(zoom)zoom.innerHTML=z?`<div class="mini-card"><div class="kicker">Nächster Zoom</div><div class="big">${esc(z.a.title||'–')}</div><div class="small">${esc(formatOccurrence(z.when))}${z.a.to?' – '+esc(z.a.to):''}</div></div>`:`<div class="mini-card"><div class="kicker">Nächster Zoom</div><div class="big">–</div><div class="small">Kein Termin berechenbar.</div></div>`;if(cnt)cnt.innerHTML=`<div class="kicker">14 Tage</div><div class="big">${count}</div><div class="small">anstehende Freigaben</div>`}
function renderNewEntries(){const el=$('#newEntries');if(!el)return;const items=(state.projects||[]).slice().sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')).slice(0,6);el.innerHTML=items.length?items.map(p=>{const cat=p.category?readCategoryLabel(p.category):'';return`<div class="new-entry"><div><div class="new-title">${esc(p.title||'–')}</div><div class="new-meta">${cat?`<span class="new-category">${esc(cat)}</span>`:'<span>Bereich noch nicht zugeordnet</span>'}${p.createdAt?`<span>Eingestellt: ${esc(formatDateTime(p.createdAt))}</span>`:''}</div></div><div class="new-release">${p.releaseDate?'Freigabe: '+esc(formatDate(p.releaseDate)):'Noch kein Freigabetermin'}</div><span class="new-badge">NEU</span></div>`}).join(''):`<div class="empty">Noch keine Projekte eingestellt.</div>`}
function renderTeamQuick(){const el=$('#teamQuick');if(!el)return;const people=['alexander','oliver','peter','daniel'];el.innerHTML=people.map(person=>{const items=(state.personalLinks||[]).filter(x=>x.recipient===person).slice().sort((a,b)=>(b.updatedAt||b.createdAt||'').localeCompare(a.updatedAt||a.createdAt||''));const first=items[0];const line=first?`${items.length} ${items.length===1?'Aufgabe':'Aufgaben'} · ${first.title||first.note||first.url||'Eintrag'}`:'Aktuell nichts eingetragen';return`<div class="team-box"><button class="team-button" data-person-button="${person}">${esc(recipientLabel(person))}</button><div class="team-line">${esc(line)}</div></div>`}).join('');document.querySelectorAll('[data-person-button]').forEach(b=>b.onclick=()=>{activePerson=b.dataset.personButton;setPanel('tasks');renderPersonalLinks()})}
const baseRenderPersonalLinks=renderPersonalLinks;
renderPersonalLinks=function(){if(activePerson==='all'){baseRenderPersonalLinks();return}const original=state.personalLinks;state.personalLinks=(original||[]).filter(l=>l.recipient===activePerson);baseRenderPersonalLinks();state.personalLinks=original;};
document.querySelectorAll('[data-project-category]').forEach(btn=>btn.onclick=()=>{activeProjectCategory=btn.dataset.projectCategory;activeType='all';setPanel('lead');document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));btn.classList.add('active');renderProjects()});
const leadBtn=document.querySelector('[data-panel="lead"]');if(leadBtn){const baseLeadClick=leadBtn.onclick;leadBtn.onclick=()=>{activeProjectCategory='all';if(baseLeadClick)baseLeadClick();renderProjects();}};
const taskBtn=document.querySelector('[data-panel="tasks"]');if(taskBtn){const baseTaskClick=taskBtn.onclick;taskBtn.onclick=()=>{activePerson='all';if(baseTaskClick)baseTaskClick();renderPersonalLinks();}};
'''
          render_marker = "function render(){renderDashboard();renderAccess();renderProjects();renderPersonalLinks();renderArchive()}"
          if render_marker not in text:
              raise SystemExit('Render-Marker fehlt')
          new_render = extra_js + "\nfunction render(){renderDashboard();renderAccess();renderProjects();renderNextReleaseOverview();renderMiniDashboard();renderNewEntries();renderTeamQuick();renderPersonalLinks();renderArchive()}"
          text = text.replace(render_marker, new_render, 1)

          dst.parent.mkdir(parents=True,exist_ok=True)
          dst.write_text(text,encoding='utf-8')

          # Syntax und Datendatei vor dem Commit prüfen.
          json.loads(Path('data/headteam-vorlauf.json').read_text(encoding='utf-8'))
          m=re.search(r'<script>\s*(.*?)\s*</script>\s*</body>',text,re.S)
          if not m:
              raise SystemExit('Script konnte nicht extrahiert werden')
          js=Path('/tmp/headteam-2.js');js.write_text(m.group(1),encoding='utf-8')
          subprocess.run(['node','--check',str(js)],check=True)
          PY

      - name: Testseite committen und Workflow entfernen
        shell: bash
        run: |
          rm -f .github/workflows/rebuild-headteam-2-dashboard.yml
          git config user.name "FSA Headteam Test"
          git config user.email "actions@github.com"
          git add pages/headteam-vorlauf/headteam-2/index.html .github/workflows/rebuild-headteam-2-dashboard.yml
          git commit -m "test: Headteam 2 als Dashboard mit Neuzugaengen aufbauen"
          git push
