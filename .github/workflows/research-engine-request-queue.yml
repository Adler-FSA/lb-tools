name: Research Engine Request Queue

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  research-request:
    if: startsWith(github.event.head_commit.message, 'Research Auftrag')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout request commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencies
        run: |
          python -m pip install --disable-pip-version-check -r research-engine/requirements.txt
          python -m playwright install chromium

      - name: Process request
        run: python research-engine/process_control_request.py

      - name: Save result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-engine/output/control-center research-engine/output/control-center-status
          if git diff --cached --quiet; then
            echo "Kein Ergebnis zum Speichern."
            exit 1
          fi
          git commit -m "Research Engine: Control-Center-Ergebnis"
          git pull --rebase origin main
          git push origin HEAD:main
