name: Patch Notfallakte V08 demo training
on:
  push:
    paths:
      - '.github/workflows/patch-notfallakte-v08-demo-training.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch V08 only
        shell: python
        run: |
          from pathlib import Path
          p=Path('pages/notfallakte/v08-backup.js')
          s=p.read_text(encoding='utf-8')

          s=s.replace("store:'notfallakte'};","store:'notfallakte',modeKey:'lb_notfallakte_v08_mode'};")

          old="""function restoreJSON(file){const r=new FileReader();r.onload=async()=>{try{const pack=JSON.parse(String(r.result));if(!pack||pack.schema!==V08.schema||!pack.data||typeof pack.data!=='object')throw new Error('schema');if(!confirm('Diese Sicherung wiederherstellen? Der aktuelle Stand dieser Notfallakte wird dadurch ersetzt.'))return;state=merge(pack.data);state.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(state));await idbPut(state);demoMode=false;q('#demoBanner')?.classList.remove('show');fill();render();status();const c=JSON.parse(JSON.stringify(state));delete c.updatedAt;localStorage.setItem(V08.backupAtKey,pack.createdAt||new Date().toISOString());localStorage.setItem(V08.backupHashKey,hashState(c));refreshBackupStatus();flash('Vollständige Sicherung wiederhergestellt ✓')}catch(e){alert('Diese Datei ist keine gültige Sicherung der Notfallakte Version 08.')}};r.readAsText(file,'utf-8')}"""
          new="""function restoreJSON(file){const r=new FileReader();r.onload=async()=>{try{const pack=JSON.parse(String(r.result));if(!pack||pack.schema!==V08.schema||!pack.data||typeof pack.data!=='object')throw new Error('schema');if(demoMode){if(!pack.demo){alert('Diese Datei gehört zu einer persönlichen Notfallakte. In der Demo können nur DEMO-Sicherungen eingelesen werden.');return}if(!confirm('Diese DEMO-Sicherung jetzt testweise wiederherstellen? Die persönlichen Daten bleiben davon unberührt.'))return;state=merge(pack.data);demoMode=true;localStorage.setItem(V08.modeKey,'demo');q('#demoBanner')?.classList.add('show');fill();render();syncDemoTraining();flash('Demo-Sicherung erfolgreich wiederhergestellt ✓');return}if(pack.demo){alert('Eine DEMO-Sicherung kann nicht in deine persönliche Notfallakte eingelesen werden. Öffne dafür zuerst die Demo.');return}if(!confirm('Diese Sicherung wiederherstellen? Der aktuelle Stand dieser Notfallakte wird dadurch ersetzt.'))return;state=merge(pack.data);state.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(state));await idbPut(state);demoMode=false;localStorage.setItem(V08.modeKey,'own');q('#demoBanner')?.classList.remove('show');fill();render();status();const c=JSON.parse(JSON.stringify(state));delete c.updatedAt;localStorage.setItem(V08.backupAtKey,pack.createdAt||new Date().toISOString());localStorage.setItem(V08.backupHashKey,hashState(c));refreshBackupStatus();syncDemoTraining();flash('Vollständige Sicherung wiederhergestellt ✓')}catch(e){alert('Diese Datei ist keine gültige Sicherung der Notfallakte Version 08.')}};r.readAsText(file,'utf-8')}"""
          if old not in s: raise SystemExit('restoreJSON pattern not found')
          s=s.replace(old,new)

          start=s.index('function sheetXML(rows){')
          end=s.index('\nfunction crcTable()',start)
          sheet="""function sheetXML(rows){const maxCols=Math.max(1,...rows.map(r=>r.length));const widths=[];for(let c=0;c<maxCols;c++){let max=10;for(const r of rows){const v=String(r[c]??'');const longest=Math.max(...v.split(/\\n/).map(x=>x.length),0);max=Math.max(max,Math.min(longest+3,c===0?34:42))}widths[c]=Math.max(14,Math.min(max,c===0?32:38))}let x='<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?><worksheet xmlns=\"http://schemas.openxmlformats.org/spreadsheetml/2006/main\"><sheetViews><sheetView workbookViewId=\"0\"><pane ySplit=\"1\" topLeftCell=\"A2\" activePane=\"bottomLeft\" state=\"frozen\"/></sheetView></sheetViews><cols>';widths.forEach((w,i)=>x+=`<col min=\"${i+1}\" max=\"${i+1}\" width=\"${w}\" customWidth=\"1\"/>`);x+='</cols><sheetData>';rows.forEach((row,ri)=>{const height=ri===0?26:Math.min(90,22+Math.max(...row.map(v=>(String(v??'').match(/\\n/g)||[]).length*15),0));x+=`<row r=\"${ri+1}\" ht=\"${height}\" customHeight=\"1\">`;row.forEach((v,ci)=>{const ref=colName(ci+1)+(ri+1);x+=`<c r=\"${ref}\" t=\"inlineStr\" s=\"${ri===0?1:2}\"><is><t xml:space=\"preserve\">${xmlEsc(v)}</t></is></c>`});x+='</row>'});return x+'</sheetData></worksheet>'}"""
          s=s[:start]+sheet+s[end:]

          oldstyles="""files.push({name:'xl/styles.xml',data:'<?xml version=\"1.0\" encoding=\"UTF-8\"?><styleSheet xmlns=\"http://schemas.openxmlformats.org/spreadsheetml/2006/main\"><fonts count=\"2\"><font><sz val=\"11\"/><name val=\"Calibri\"/></font><font><b/><sz val=\"11\"/><name val=\"Calibri\"/></font></fonts><fills count=\"2\"><fill><patternFill patternType=\"none\"/></fill><fill><patternFill patternType=\"gray125\"/></fill></fills><borders count=\"1\"><border/></borders><cellStyleXfs count=\"1\"><xf numFmtId=\"0\" fontId=\"0\" fillId=\"0\" borderId=\"0\"/></cellStyleXfs><cellXfs count=\"2\"><xf numFmtId=\"0\" fontId=\"0\" fillId=\"0\" borderId=\"0\" xfId=\"0\"/><xf numFmtId=\"0\" fontId=\"1\" fillId=\"0\" borderId=\"0\" xfId=\"0\" applyFont=\"1\"/></cellXfs></styleSheet>'});"""
          newstyles="""files.push({name:'xl/styles.xml',data:'<?xml version=\"1.0\" encoding=\"UTF-8\"?><styleSheet xmlns=\"http://schemas.openxmlformats.org/spreadsheetml/2006/main\"><fonts count=\"3\"><font><sz val=\"11\"/><name val=\"Calibri\"/></font><font><b/><sz val=\"11\"/><name val=\"Calibri\"/><color rgb=\"FFFFFFFF\"/></font><font><sz val=\"11\"/><name val=\"Calibri\"/></font></fonts><fills count=\"3\"><fill><patternFill patternType=\"none\"/></fill><fill><patternFill patternType=\"gray125\"/></fill><fill><patternFill patternType=\"solid\"><fgColor rgb=\"FF132238\"/><bgColor indexed=\"64\"/></patternFill></fill></fills><borders count=\"2\"><border/><border><left style=\"thin\"><color rgb=\"FFD8E4E7\"/></left><right style=\"thin\"><color rgb=\"FFD8E4E7\"/></right><top style=\"thin\"><color rgb=\"FFD8E4E7\"/></top><bottom style=\"thin\"><color rgb=\"FFD8E4E7\"/></bottom></border></borders><cellStyleXfs count=\"1\"><xf numFmtId=\"0\" fontId=\"0\" fillId=\"0\" borderId=\"0\"/></cellStyleXfs><cellXfs count=\"3\"><xf numFmtId=\"0\" fontId=\"0\" fillId=\"0\" borderId=\"0\" xfId=\"0\"/><xf numFmtId=\"0\" fontId=\"1\" fillId=\"2\" borderId=\"1\" xfId=\"0\" applyFont=\"1\" applyFill=\"1\" applyBorder=\"1\" applyAlignment=\"1\"><alignment wrapText=\"1\" vertical=\"center\"/></xf><xf numFmtId=\"0\" fontId=\"2\" fillId=\"0\" borderId=\"1\" xfId=\"0\" applyBorder=\"1\" applyAlignment=\"1\"><alignment wrapText=\"1\" vertical=\"top\"/></xf></cellXfs></styleSheet>'});"""
          if oldstyles not in s: raise SystemExit('styles pattern not found')
          s=s.replace(oldstyles,newstyles)

          marker="""function injectUI(){if(q('#v08BackupSection'))return;"""
          insert="""function syncDemoTraining(){const el=q('#v08DemoTraining');if(el)el.style.display=demoMode?'block':'none';const st=q('#v08BackupStatus');if(demoMode&&st){st.className='v08Status ok';st.innerHTML='<strong>Demo-Sicherungstraining aktiv ✓</strong><span>Erstelle eine DEMO-JSON, speichere sie und lies sie anschließend hier wieder ein. Genau so funktioniert später die Sicherung deiner eigenen Notfallakte.</span>'}}
function showDemoV08(){demoMode=true;state=merge(JSON.parse(JSON.stringify(demo)));localStorage.setItem(V08.modeKey,'demo');fill();render();q('#demoBanner')?.classList.add('show');syncDemoTraining();flash('Demo wurde geöffnet ✓')}
function showOwnV08(){localStorage.setItem(V08.modeKey,'own');q('#demoBanner')?.classList.remove('show');load();syncDemoTraining();flash('Eigene Notfallakte wurde geöffnet ✓')}
"""+marker
          if marker not in s: raise SystemExit('inject marker not found')
          s=s.replace(marker,insert)

          uiold="""<div class=\"learn security\" style=\"margin-top:16px\"><strong>Sicherheit:</strong> JSON- und Excel-Dateien können hochsensible persönliche Informationen enthalten. Bewahre sie ausschließlich an einem geschützten, selbst kontrollierten Speicherort auf.</div><div class=\"v08Actions\">"""
          uinew="""<div class=\"learn\" id=\"v08DemoTraining\" style=\"display:none;margin-top:16px\"><strong>Demo-Sicherungstraining:</strong> Hier kannst du den vollständigen Sicherungsablauf gefahrlos mit Daniel Muster üben.<span class=\"why\">1. DEMO-Sicherung erstellen. 2. Datei über „In Dateien sichern“ ablegen. 3. Demo-Excel ansehen. 4. Die DEMO-JSON über „Sicherung wiederherstellen“ wieder einlesen. Deine persönliche Notfallakte wird dabei nicht verändert.</span></div><div class=\"learn security\" style=\"margin-top:16px\"><strong>Sicherheit:</strong> JSON- und Excel-Dateien können hochsensible persönliche Informationen enthalten. Bewahre sie ausschließlich an einem geschützten, selbst kontrollierten Speicherort auf.</div><div class=\"v08Actions\">"""
          if uiold not in s: raise SystemExit('UI marker not found')
          s=s.replace(uiold,uinew)

          oldboot="""async function boot(){injectUI();installActionFeedback();document.addEventListener('input',scheduleMirror,true);document.addEventListener('change',scheduleMirror,true);q('#saveAll')?.addEventListener('click',()=>setTimeout(()=>{idbPut(cloneState());refreshBackupStatus()},0));q('#saveFamily')?.addEventListener('click',()=>setTimeout(()=>{idbPut(cloneState());refreshBackupStatus()},0));q('#resetBtn')?.addEventListener('click',()=>setTimeout(()=>{if(!localStorage.getItem(KEY)){idbClear();localStorage.removeItem(V08.backupAtKey);localStorage.removeItem(V08.backupHashKey);refreshBackupStatus()}},0));if(localStorage.getItem(KEY)){try{idbPut(JSON.parse(localStorage.getItem(KEY)))}catch{}}else{const mirrored=await idbGet();if(mirrored&&!demoMode){state=merge(mirrored);localStorage.setItem(KEY,JSON.stringify(state));load();flash('Lokaler Arbeitsstand aus der Gerätesicherung wiederhergestellt ✓')}}refreshBackupStatus()}"""
          newboot="""async function boot(){injectUI();installActionFeedback();if(q('#demoBtn'))q('#demoBtn').onclick=showDemoV08;if(q('#ownBtn'))q('#ownBtn').onclick=showOwnV08;document.addEventListener('input',scheduleMirror,true);document.addEventListener('change',scheduleMirror,true);q('#saveAll')?.addEventListener('click',()=>setTimeout(()=>{idbPut(cloneState());refreshBackupStatus()},0));q('#saveFamily')?.addEventListener('click',()=>setTimeout(()=>{idbPut(cloneState());refreshBackupStatus()},0));q('#resetBtn')?.addEventListener('click',()=>setTimeout(()=>{if(!localStorage.getItem(KEY)){idbClear();localStorage.removeItem(V08.backupAtKey);localStorage.removeItem(V08.backupHashKey);refreshBackupStatus()}},0));const mode=localStorage.getItem(V08.modeKey);if(mode!=='own'){showDemoV08();return}if(localStorage.getItem(KEY)){try{idbPut(JSON.parse(localStorage.getItem(KEY)))}catch{}load()}else{const mirrored=await idbGet();if(mirrored){state=merge(mirrored);localStorage.setItem(KEY,JSON.stringify(state));load();flash('Lokaler Arbeitsstand aus der Gerätesicherung wiederhergestellt ✓')}else load()}syncDemoTraining();refreshBackupStatus()}"""
          if oldboot not in s: raise SystemExit('boot pattern not found')
          s=s.replace(oldboot,newboot)

          p.write_text(s,encoding='utf-8')
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name "Adler-FSA"
          git config user.email "ceo@liquiditybooster.de"
          git rm .github/workflows/patch-notfallakte-v08-demo-training.yml
          git add pages/notfallakte/v08-backup.js
          git commit -m "Update Notfallakte V08 demo training and Excel formatting"
          git push
