name: Projekt-Check – Live-Fortschritt und Scope patchen

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_projekt_check_live_progress_and_scope.py'
      - '.github/workflows/patch-projekt-check-live-progress-and-scope.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch anwenden
        run: python scripts/patch_projekt_check_live_progress_and_scope.py

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/projekt-check/control-panel.html projekt-check-engine/identify/browser_probe.py projekt-check-engine/core/run_discovery.py projekt-check-engine/tests/test_discovery_contract.py
          if git diff --cached --quiet; then
            echo "Keine Änderungen nötig."
          else
            git commit -m "Projekt-Check: Live-Fortschritt und Recherche-Scope korrigieren"
            git push
          fi
