name: Research Engine – Crawler V2 Patch

on:
  push:
    paths:
      - '.github/workflows/patch-research-engine-crawl-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Crawler um Hauptseite Sitemap und Unterseiten erweitern
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('research-engine/engine.py')
          s=p.read_text(encoding='utf-8')

          anchor='''PRIORITY_WORDS = (\n    "about", "uber-uns", "ueber-uns", "faq", "help", "how", "earn", "staking",\n    "stake", "yield", "interest", "rates", "terms", "legal", "imprint", "impressum",\n    "privacy", "withdraw", "withdrawal", "payout", "fees", "referral", "affiliate",\n    "partner", "bonus", "security", "custody", "risk", "strategy", "trading",\n)\n'''
          insert=anchor+'''\nCOMMON_PATHS = (\n    "/", "/about", "/about-us", "/faq", "/how-it-works", "/earn", "/staking",\n    "/rates", "/terms", "/legal", "/imprint", "/impressum", "/privacy",\n    "/security", "/custody", "/withdrawal", "/fees", "/referral", "/affiliate",\n    "/partner", "/risk", "/strategy",\n)\n'''
          if anchor not in s:
              raise SystemExit('priority anchor not found')
          s=s.replace(anchor,insert,1)

          anchor2='''def same_domain(url: str, domain: str) -> bool:\n    host = (urlparse(url).hostname or "").removeprefix("www.")\n    return host == domain or host.endswith("." + domain)\n\n\ndef link_priority(url: str) -> int:\n'''
          insert2='''def same_domain(url: str, domain: str) -> bool:\n    host = (urlparse(url).hostname or "").removeprefix("www.")\n    return host == domain or host.endswith("." + domain)\n\n\ndef sitemap_urls(domain: str) -> list[str]:\n    """Liest öffentliche Sitemap-Hinweise ohne von ihnen abhängig zu sein."""\n    headers = {"User-Agent": UA, "Accept": "text/plain,application/xml,text/xml"}\n    sitemap_targets = [f"https://{domain}/sitemap.xml"]\n    found: list[str] = []\n    try:\n        r = requests.get(f"https://{domain}/robots.txt", headers=headers, timeout=TIMEOUT)\n        if r.ok:\n            for line in r.text.splitlines():\n                if line.lower().startswith("sitemap:"):\n                    u = line.split(":", 1)[1].strip()\n                    if u.startswith(("http://", "https://")):\n                        sitemap_targets.append(u)\n    except requests.RequestException:\n        pass\n\n    for target in list(dict.fromkeys(sitemap_targets))[:5]:\n        try:\n            r = requests.get(target, headers=headers, timeout=TIMEOUT)\n            if not r.ok:\n                continue\n            for u in re.findall(r"<loc>\\s*(https?://[^<]+?)\\s*</loc>", r.text, re.I):\n                u = clean_text(u.replace("&amp;", "&"))\n                if same_domain(u, domain) and u not in found:\n                    found.append(u)\n                if len(found) >= 100:\n                    return found\n        except requests.RequestException:\n            continue\n    return found\n\n\ndef link_priority(url: str) -> int:\n'''
          if anchor2 not in s:
              raise SystemExit('same_domain anchor not found')
          s=s.replace(anchor2,insert2,1)

          old='''def crawl(seed: Page, domain: str, input_url: str = "", max_pages: int = MAX_PAGES) -> list[Page]:\n    pages = [seed]\n    seen = {urldefrag(seed.url)[0]}\n    queue = [u for u in seed.links if same_domain(u, domain)]\n    if input_url and same_domain(input_url, domain):\n        queue.insert(0, input_url)\n    queue = list(dict.fromkeys(queue))\n\n    while queue and len(pages) < max_pages:\n'''
          new='''def crawl(seed: Page, domain: str, input_url: str = "", max_pages: int = MAX_PAGES) -> list[Page]:\n    pages = [seed]\n    seen = {urldefrag(seed.url)[0]}\n    root = f"https://{domain}/"\n    queue: list[str] = []\n\n    # Ein Referral-/Deep-Link darf nie die einzige gelesene Seite bleiben.\n    if input_url and same_domain(input_url, domain):\n        queue.append(input_url)\n    queue.append(root)\n\n    # Öffentliche Sitemap zuerst; danach typische Informationsseiten als robuste Reserve.\n    queue.extend(sitemap_urls(domain))\n    queue.extend(urljoin(root, path) for path in COMMON_PATHS)\n    queue.extend(u for u in seed.links if same_domain(u, domain))\n    queue = list(dict.fromkeys(queue))\n\n    while queue and len(pages) < max_pages:\n'''
          if old not in s:
              raise SystemExit('crawl block not found')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile research-engine/engine.py
          grep -q "def sitemap_urls" research-engine/engine.py
          grep -q "Ein Referral-/Deep-Link darf nie" research-engine/engine.py
          git config user.name "Akademie Research Engine"
          git config user.email "actions@github.com"
          git add research-engine/engine.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Research Engine: Crawler um Hauptseite und Sitemap erweitern"
          git pull --rebase
          git push
