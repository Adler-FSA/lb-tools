name: Patch Frühwarn-Check FCA Parallelimport

on:
  push:
    paths:
      - '.github/workflows/patch-fruehwarn-fca-parallel.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: FCA Vollabzug parallelisieren
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('pages/projekt-fruehwarn-check/scripts/update_fca.py')
          s=p.read_text(encoding='utf-8')
          if 'from concurrent.futures import ThreadPoolExecutor, as_completed' not in s:
              s=s.replace('from datetime import datetime, timedelta, timezone\n', 'from datetime import datetime, timedelta, timezone\nfrom concurrent.futures import ThreadPoolExecutor, as_completed\n', 1)
          new_func=r'''def full_refresh():
    first_html = fetch_text(LIST_URL)
    first, total = parse_list_page(first_html, LIST_URL)
    if total < 10000:
        raise RuntimeError(f"FCA-Vollabzug unplausibel: Gesamtzahl {total}")
    if not first:
        raise RuntimeError("FCA-Vollabzug: erste Seite enthält keine Warnungen")

    per_page = max(1, len(first))
    pages = math.ceil(total / per_page)
    print(f"FCA Vollabzug: {total} Einträge, ca. {pages} Seiten; paralleler Abruf")
    all_records = first[:]
    seen_urls = {r["source_url"] for r in all_records}

    def load_page(page):
        url = LIST_URL + "?" + urllib.parse.urlencode({"page": page})
        html = fetch_text(url)
        rows, _ = parse_list_page(html, url)
        return page, rows

    failures = []
    completed = 0
    with ThreadPoolExecutor(max_workers=8) as pool:
        futures = {pool.submit(load_page, page): page for page in range(1, pages)}
        for future in as_completed(futures):
            page = futures[future]
            try:
                _, rows = future.result()
            except Exception as exc:
                failures.append((page, str(exc)))
                continue
            if not rows and page < pages - 2:
                failures.append((page, "keine Datensätze"))
                continue
            for rec in rows:
                if rec["source_url"] not in seen_urls:
                    seen_urls.add(rec["source_url"])
                    all_records.append(rec)
            completed += 1
            if completed % 50 == 0:
                print(f"  {completed}/{pages-1} Seiten verarbeitet: {len(all_records)} eindeutige Einträge")

    # Einzelne temporäre Abruffehler nochmals seriell versuchen.
    if failures:
        print(f"FCA: {len(failures)} Seiten werden erneut versucht")
        still_failed = []
        for page, _ in failures:
            try:
                _, rows = load_page(page)
                for rec in rows:
                    if rec["source_url"] not in seen_urls:
                        seen_urls.add(rec["source_url"])
                        all_records.append(rec)
            except Exception as exc:
                still_failed.append((page, str(exc)))
        failures = still_failed

    if failures:
        print("Nicht abrufbare FCA-Seiten:", failures[:10])
    if len(all_records) < int(total * 0.90):
        raise RuntimeError(f"FCA-Vollabzug unvollständig: {len(all_records)} von erwarteten {total}")
    return all_records
'''
          pattern=r'def full_refresh\(\):.*?\n\ndef parse_rss_date'
          ns,n=re.subn(pattern,new_func+'\n\ndef parse_rss_date',s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'full_refresh replacement count={n}')
          p.write_text(ns,encoding='utf-8')
          PY
      - name: Syntax prüfen
        run: python -m py_compile pages/projekt-fruehwarn-check/scripts/update_fca.py
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/projekt-fruehwarn-check/scripts/update_fca.py
          git commit -m "Frühwarn-Check: FCA Vollabzug parallelisieren"
          git push
