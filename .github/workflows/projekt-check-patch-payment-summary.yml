name: Projekt-Check – Payment-Zählung auf Quellenbasis patchen

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/projekt-check-patch-payment-summary.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Payment-Zusammenfassung auf Quellen statt Satztreffer umstellen
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('projekt-check-engine/core/run_payment_depth.py')
          s=p.read_text(encoding='utf-8')
          old='''set_completed(st,ev,result,f"Karten-/Banking-/Payment-Tiefenprüfung abgeschlossen · {analysis.get('first_party_claim_count',0)} projektseitige Funktionsaussagen · {analysis.get('external_claim_count',0)} externe Payment-Spuren · {analysis.get('verified_infrastructure_target_count',0)} amtlich verifizierte Infrastrukturbeziehungen.",lang)'''
          new='''set_completed(st,ev,result,f"Karten-/Banking-/Payment-Tiefenprüfung abgeschlossen · {analysis.get('first_party_claim_source_count',0)} projektseitige Quellen mit Funktionsaussagen · {analysis.get('external_claim_source_count',0)} externe projektbezogene Quellen mit Payment-Bezug · {analysis.get('verified_infrastructure_target_count',0)} amtlich verifizierte Infrastrukturbeziehungen.",lang)'''
          if old not in s:
              raise SystemExit('Erwartete Payment-Zusammenfassung nicht gefunden')
          s=s.replace(old,new,1)
          s=s.replace('''"first_party_claims":analysis.get("first_party_claim_count",0),"external_claims":analysis.get("external_claim_count",0)''','''"first_party_sources":analysis.get("first_party_claim_source_count",0),"external_sources":analysis.get("external_claim_source_count",0)''')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Patch speichern und temporären Workflow entfernen
        run: |
          git config user.name "FSA Projekt-Check"
          git config user.email "actions@github.com"
          git add projekt-check-engine/core/run_payment_depth.py
          git rm .github/workflows/projekt-check-patch-payment-summary.yml
          git commit -m "Projekt-Check: Payment-Auswertung zählt Quellen statt Satztreffer"
          git pull --rebase origin main
          git push origin HEAD:main
