name: Patch Notfallakte V08 feedback
on:
  push:
    paths:
      - '.github/workflows/patch-notfallakte-v08-feedback.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch V08 only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pages/notfallakte/v08-backup.js')
          s=p.read_text()

          old="function exportJSON(){if(demoMode)return flash('Die Demo wird nicht als persönliche Sicherung exportiert.');readTop();const data=cloneState(),createdAt=new Date().toISOString();const pack={schema:V08.schema,product:V08.product,createdAt,data};const hash=hashState((()=>{const c=JSON.parse(JSON.stringify(data));delete c.updatedAt;return c})());download(new Blob([JSON.stringify(pack,null,2)],{type:'application/json;charset=utf-8'}),`Notfallakte-${safeName(data.owner)}-${createdAt.slice(0,10)}.json`);localStorage.setItem(V08.backupAtKey,createdAt);localStorage.setItem(V08.backupHashKey,hash);idbPut(data);refreshBackupStatus();flash('Vollständige JSON-Sicherung erstellt ✓')}"
          new="function exportJSON(){flash(demoMode?'Demo: JSON-Sicherung wird erstellt …':'JSON-Sicherung wird erstellt …');readTop();const data=cloneState(),createdAt=new Date().toISOString();const pack={schema:V08.schema,product:V08.product,createdAt,demo:!!demoMode,data};const hash=hashState((()=>{const c=JSON.parse(JSON.stringify(data));delete c.updatedAt;return c})());download(new Blob([JSON.stringify(pack,null,2)],{type:'application/json;charset=utf-8'}),`${demoMode?'DEMO-':''}Notfallakte-${safeName(data.owner)}-${createdAt.slice(0,10)}.json`);if(!demoMode){localStorage.setItem(V08.backupAtKey,createdAt);localStorage.setItem(V08.backupHashKey,hash);idbPut(data);refreshBackupStatus()}setTimeout(()=>flash(demoMode?'Demo-JSON wurde erstellt ✓':'Vollständige JSON-Sicherung erstellt ✓'),120)}"
          if old not in s: raise SystemExit('exportJSON signature not found')
          s=s.replace(old,new,1)

          old2="function exportXLSX(){if(demoMode)return flash('Die Demo wird nicht als persönliche Excel-Datei exportiert.');const sheets=excelSheets();"
          new2="function exportXLSX(){flash(demoMode?'Demo: Excel-Datei wird erstellt …':'Excel-Datei wird erstellt …');const sheets=excelSheets();"
          if old2 not in s: raise SystemExit('exportXLSX signature not found')
          s=s.replace(old2,new2,1)

          old3="download(zipStore(files),`Notfallakte-${safeName(state.owner)}-${new Date().toISOString().slice(0,10)}.xlsx`);flash('Excel-Übersicht erstellt ✓')}"
          new3="download(zipStore(files),`${demoMode?'DEMO-':''}Notfallakte-${safeName(state.owner)}-${new Date().toISOString().slice(0,10)}.xlsx`);setTimeout(()=>flash(demoMode?'Demo-Excel wurde erstellt ✓':'Excel-Übersicht erstellt ✓'),120)}"
          if old3 not in s: raise SystemExit('xlsx download signature not found')
          s=s.replace(old3,new3,1)

          old4="q('#v08JsonExport').onclick=exportJSON;q('#v08JsonImport').onchange=e=>{const f=e.target.files?.[0];if(f)restoreJSON(f);e.target.value=''};q('#v08Excel').onclick=exportXLSX;refreshBackupStatus()}"
          new4="q('#v08JsonExport').onclick=exportJSON;q('#v08JsonImport').onchange=e=>{const f=e.target.files?.[0];if(f){flash('Sicherungsdatei ausgewählt – Prüfung läuft …');restoreJSON(f)}e.target.value=''};q('#v08Excel').onclick=exportXLSX;refreshBackupStatus()}"
          if old4 not in s: raise SystemExit('V08 click handlers not found')
          s=s.replace(old4,new4,1)

          old5="async function boot(){injectUI();document.addEventListener('input',scheduleMirror,true);"
          new5="function installActionFeedback(){const map={saveAll:'Alles speichern wurde ausgeführt ✓',saveFamily:'Bereich speichern wurde ausgeführt ✓',demoBtn:'Demo wurde geöffnet ✓',ownBtn:'Eigene Notfallakte wurde geöffnet ✓',exportBtn:'CSV-Sicherung wurde angefordert ✓',printBtn:'PDF / Ausdruck wurde angefordert ✓',toTopBtn:'Nach oben wurde ausgeführt ✓',clearSignature:'Unterschrift wurde gelöscht ✓'};Object.entries(map).forEach(([id,msg])=>q('#'+id)?.addEventListener('click',()=>flash(msg),true));document.addEventListener('click',e=>{const b=e.target.closest('.addRec,.delRec,.saveRec');if(!b)return;if(b.classList.contains('addRec'))flash('Weiterer Eintrag wurde hinzugefügt ✓');else if(b.classList.contains('delRec'))flash('Löschen wurde ausgewählt – bitte bestätigen');else flash('Eintrag speichern wurde ausgeführt ✓')},true)}\nasync function boot(){injectUI();installActionFeedback();document.addEventListener('input',scheduleMirror,true);"
          if old5 not in s: raise SystemExit('boot signature not found')
          s=s.replace(old5,new5,1)

          p.write_text(s)
          PY
          node --check pages/notfallakte/v08-backup.js
          grep -F "Demo-JSON wurde erstellt" pages/notfallakte/v08-backup.js
          grep -F "Demo-Excel wurde erstellt" pages/notfallakte/v08-backup.js
          grep -F "installActionFeedback" pages/notfallakte/v08-backup.js
      - name: Commit patch and remove workflow
        run: |
          git config user.name 'actions-user'
          git config user.email 'actions@users.noreply.github.com'
          git add pages/notfallakte/v08-backup.js
          git commit -m 'Fix V08 demo exports and visible action feedback'
          git rm .github/workflows/patch-notfallakte-v08-feedback.yml
          git commit -m 'Remove one-time V08 feedback workflow'
          git pull --rebase origin main
          git push origin main
