name: Wire Hoersaal Page 6
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/wire-hoersaal-page6.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire navigation and pager
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          base=Path('hoersaal-liquiditybooster')
          files=[
            base/'01-willkommen.html',
            base/'02-big-picture.html',
            base/'03-gast-club.html',
            base/'04-rollen.html',
            base/'05-mein-nutzen.html',
          ]
          for p in files:
              s=p.read_text(encoding='utf-8')
              old=s
              s,n=re.subn(r'<span aria-disabled="true">06[^<]*</span>', '<a class="done" href="06-empfehlung.html">06 Empfehlung</a>', s, count=1)
              if not n and 'href="06-empfehlung.html"' not in s:
                  raise SystemExit(f'Could not wire page 6 nav in {p}')
              p.write_text(s,encoding='utf-8')
          p=base/'05-mein-nutzen.html'
          s=p.read_text(encoding='utf-8')
          pattern=r'<span class="disabled"[^>]*data-de="06 Empfehlung · folgt"[^>]*>06 Empfehlung · folgt</span>'
          s,n=re.subn(pattern,'<a href="06-empfehlung.html">06 Empfehlung →</a>',s,count=1)
          if not n and '06 Empfehlung →</a>' not in s:
              raise SystemExit('Could not wire page 5 forward pager')
          p.write_text(s,encoding='utf-8')
          # Validation
          for p in files:
              s=p.read_text(encoding='utf-8')
              if 'href="06-empfehlung.html"' not in s:
                  raise SystemExit(f'Missing page 6 link in {p}')
          s=(base/'05-mein-nutzen.html').read_text(encoding='utf-8')
          if '<a href="06-empfehlung.html">06 Empfehlung →</a>' not in s:
              raise SystemExit('Page 5 forward link validation failed')
          PY
      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/wire-hoersaal-page6.yml
          git add -A
          git commit -m "Wire Hoersaal page 6 navigation"
          git push