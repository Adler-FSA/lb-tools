name: Patch Hoersaal Rechner 2
on:
  push:
    paths:
      - '.github/workflows/patch-hoersaal-rechner2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply calculator patch
        run: python tmp/patch-hoersaal-rechner2.py
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hoersaal-liquiditybooster/07-werkstatt.html
          git rm tmp/patch-hoersaal-rechner2.py .github/workflows/patch-hoersaal-rechner2.yml
          git commit -m "Add BusinessBooster own-sales calculator to Hoersaal page 7"
          git push
