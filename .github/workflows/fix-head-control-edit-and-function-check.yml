name: Fix Head Control Edit and Function Check

on:
  push:
    paths:
      - '.github/workflows/fix-head-control-edit-and-function-check.yml'

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch edit navigation and validate functions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json, subprocess, sys

          control_paths = [
              Path('pages/headteam-vorlauf/head-control.html'),
              Path('pages/headteam-vorlauf/head-control-2.html'),
              Path('pages/headteam-vorlauf/head-control-2/index.html'),
          ]

          old_project = "window.editProject=i=>{const p=state.projects[i];if(!p)return;editIndex=i;['title','releaseDate','url','what','why','test','meeting'].forEach(id=>$('#'+id).value=p[id]||'');$('#type').value=p.type||'';$('#category').value=p.category||'';$('#saveProject').textContent=t('saveEdit');$('#cancelEdit').style.display='inline-block';render()}"
          new_project = "window.editProject=i=>{const p=state.projects[i];if(!p)return;editIndex=i;['title','releaseDate','url','what','why','test','meeting'].forEach(id=>$('#'+id).value=p[id]||'');$('#type').value=p.type||'';$('#category').value=p.category||'';$('#saveProject').textContent=t('saveEdit');$('#cancelEdit').style.display='inline-block';render();const el=$('#title');if(el)el.focus({preventScroll:true});window.scrollTo({top:0,behavior:'smooth'})}"

          old_task = "window.editPersonalLink=i=>{const p=state.personalLinks[i];if(!p)return;linkEditIndex=i;$('#linkRecipient').value=p.recipient||'alexander';$('#linkTitle').value=p.title||'';$('#personalUrl').value=p.url||'';$('#linkNote').value=p.note||'';$('#savePersonalLink').textContent=t('saveTaskEdit');$('#cancelLinkEdit').style.display='inline-block';render()}"
          new_task = "window.editPersonalLink=i=>{const p=state.personalLinks[i];if(!p)return;linkEditIndex=i;$('#linkRecipient').value=p.recipient||'alexander';$('#linkTitle').value=p.title||'';$('#personalUrl').value=p.url||'';$('#linkNote').value=p.note||'';$('#savePersonalLink').textContent=t('saveTaskEdit');$('#cancelLinkEdit').style.display='inline-block';render();const el=$('#linkTitle');if(el)el.focus({preventScroll:true});window.scrollTo({top:0,behavior:'smooth'})}"

          for path in control_paths:
              s = path.read_text()
              if old_project in s:
                  s = s.replace(old_project, new_project, 1)
              elif new_project not in s:
                  raise SystemExit(f'editProject pattern missing in {path}')
              if old_task in s:
                  s = s.replace(old_task, new_task, 1)
              elif new_task not in s:
                  raise SystemExit(f'editPersonalLink pattern missing in {path}')
              path.write_text(s)

          required_categories = [
              'leitartikel','kms-content','serien','club-haus','oeffentlich','newsletter',
              'hoersaele','kurse','produkte-aktualisiert','neue-produkte','social-media'
          ]
          required_handlers = [
              'editAccess','deleteAccess','editProject','archiveProject','restoreProject',
              'deleteProject','editPersonalLink','deletePersonalLink'
          ]

          for path in control_paths:
              s = path.read_text()
              for c in required_categories:
                  if f'data-project-category="{c}"' not in s:
                      raise SystemExit(f'missing menu category {c} in {path}')
                  if f'<option value="{c}"' not in s:
                      raise SystemExit(f'missing select category {c} in {path}')
              for h in required_handlers:
                  if f'window.{h}=' not in s:
                      raise SystemExit(f'missing handler {h} in {path}')
              onclicks = set(re.findall(r'onclick="([A-Za-z_$][\w$]*)\(', s))
              missing = [h for h in onclicks if f'window.{h}=' not in s]
              if missing:
                  raise SystemExit(f'undefined inline handlers in {path}: {missing}')
              ids = set(re.findall(r'id="([A-Za-z0-9_-]+)"', s))
              refs = set(re.findall(r"\$\('#([A-Za-z0-9_-]+)'\)", s))
              missing_ids = sorted(refs - ids)
              if missing_ids:
                  raise SystemExit(f'missing DOM ids in {path}: {missing_ids}')
              if "window.scrollTo({top:0,behavior:'smooth'})" not in s:
                  raise SystemExit(f'missing edit scroll behavior in {path}')
              m = re.search(r'<script>([\s\S]*?)</script>\s*</body>', s)
              if not m:
                  raise SystemExit(f'script extraction failed in {path}')
              tmp = Path('/tmp') / (path.name.replace('.html','') + '-' + str(abs(hash(str(path)))) + '.js')
              tmp.write_text(m.group(1))
              subprocess.run(['node','--check',str(tmp)], check=True)

          headteam = Path('pages/headteam-vorlauf/index.html').read_text()
          for c in required_categories:
              if f'data-project-category="{c}"' not in headteam:
                  raise SystemExit(f'missing Headteam category {c}')
          if '>Ansehen<' not in headteam:
              raise SystemExit('missing Ansehen quick button on production Headteam page')
          m = re.search(r'<script>([\s\S]*?)</script>\s*</body>', headteam)
          if not m:
              raise SystemExit('Headteam script extraction failed')
          Path('/tmp/headteam.js').write_text(m.group(1))
          subprocess.run(['node','--check','/tmp/headteam.js'], check=True)

          json.loads(Path('data/headteam-vorlauf.json').read_text())
          print('FUNCTION CHECK OK: controls, handlers, DOM refs, categories, scripts and JSON validated')
          PY
      - name: Commit fix
        run: |
          git config user.name 'FSA Headteam'
          git config user.email 'actions@github.com'
          git add pages/headteam-vorlauf/head-control.html pages/headteam-vorlauf/head-control-2.html pages/headteam-vorlauf/head-control-2/index.html
          if git diff --cached --quiet; then
            echo 'No content changes needed'
          else
            git commit -m 'fix: make Head Control edit actions visible and validate functions'
            git push
          fi
# trigger
