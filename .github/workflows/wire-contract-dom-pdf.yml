name: Wire contract pages to generic DOM PDF engine

on:
  push:
    paths:
      - '.github/workflows/wire-contract-dom-pdf.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wire Club Partner page to DOM-only contract engine
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html_path=Path('pages/vertraege/club-partner.html')
          s=html_path.read_text(encoding='utf-8')

          s=s.replace('<script src="./fsa-contract-pdf-engine.js"></script>','<script src="./contract-pdf-engine-v1.js"></script>')
          s=s.replace('Die PDF wird direkt durch die FSA Contract PDF Engine erzeugt - ohne Browser-Druckdialog.','Die PDF wird direkt aus dem aktuellen Vertragstext dieser Seite und den eingegebenen Vertragsdaten erzeugt - ohne Browser-Druckdialog.')
          s=s.replace('The PDF is generated directly by the FSA Contract PDF Engine - without a browser print dialog.','The PDF is generated directly from the current contract text on this page and the entered contract data - without a browser print dialog.')

          # Entfernt den bisherigen zweiten, separat gepflegten PDF-Vertrag vollständig.
          s,n=re.subn(r'function pdfBlocks\(blank\)\{.*?\}\nfunction showError', 'function showError', s, count=1, flags=re.S)
          if n!=1:
              raise SystemExit(f'SCHUTZSTOPP: pdfBlocks nicht eindeutig gefunden ({n})')

          new_create=r'''async function createPdf(blank){
  $('#formError').classList.remove('show');
  if(!window.FSAContractPdfEngine||window.FSAContractPdfEngine.version!=='FSA_CONTRACT_PDF_ENGINE_V1'){
    showError(lang==='de'?'Vertrags-PDF-Engine konnte nicht geladen werden.':'Contract PDF engine could not be loaded.');return
  }
  if(!blank&&!validateFilled())return;
  const signer=blank?'Leer':$('#signerName').value.trim();
  const filename=(lang==='de'?'Club-Partner-Vertrag-':'Club-Partner-Agreement-')+window.FSAContractPdfEngine.safeFilePart(signer)+'.pdf';
  const controls=$$('input,textarea,select');
  const snapshot=blank?controls.map(el=>({el,value:el.value,checked:el.checked})):null;
  try{
    if(blank)controls.forEach(el=>{if(el.type==='checkbox'||el.type==='radio')el.checked=false;else if(el.type!=='date')el.value='';else el.value=''});
    updatePartyPreview();
    const result=await window.FSAContractPdfEngine.generate({
      contentRoot:'.paper',
      fieldsRoot:'#partnerForm',
      fieldsTitle:ui[lang]['form.title'],
      footerText:lang==='de'?'Club-Partner-Vereinbarung · LiquidityBooster':'Club Partner Agreement · LiquidityBooster',
      filename
    });
    if(currentUrl)URL.revokeObjectURL(currentUrl);
    currentUrl=URL.createObjectURL(result.blob);
    const a=$('#downloadLink');a.href=currentUrl;a.download=filename;
    $('#downloadInfo').textContent=(lang==='de'?`PDF erstellt: ${result.pages} Seiten · `:`PDF created: ${result.pages} pages · `)+filename;
    $('#downloadState').classList.add('show');
    setTimeout(()=>$('#downloadState').scrollIntoView({behavior:'smooth',block:'nearest'}),20)
  }catch(err){
    console.error(err);
    showError((lang==='de'?'PDF-Erstellung fehlgeschlagen: ':'PDF creation failed: ')+(err&&err.message?err.message:err))
  }finally{
    if(snapshot){snapshot.forEach(x=>{x.el.value=x.value;x.el.checked=x.checked});updatePartyPreview()}
  }
}'''
          s,n=re.subn(r'async function createPdf\(blank\)\{.*?\}\n\$\(\'#blankPdfBtn\'\)', new_create+"\n$('#blankPdfBtn')", s, count=1, flags=re.S)
          if n!=1:
              raise SystemExit(f'SCHUTZSTOPP: createPdf nicht eindeutig ersetzt ({n})')

          checks={
            'generic engine':'<script src="./contract-pdf-engine-v1.js"></script>',
            'DOM content root':"contentRoot:'.paper'",
            'DOM fields root':"fieldsRoot:'#partnerForm'",
          }
          for name,needle in checks.items():
              if needle not in s: raise SystemExit('SCHUTZSTOPP: '+name+' fehlt')
          forbidden=['function pdfBlocks(','window.FsaContractPdf','./fsa-contract-pdf-engine.js','../notfallakte/','NotfallaktePdfExport']
          for needle in forbidden:
              if needle in s: raise SystemExit('SCHUTZSTOPP: alte/unerlaubte Verdrahtung gefunden: '+needle)

          html_path.write_text(s,encoding='utf-8')
          PY

      - name: Verify engine contains no contract copy or Notfallakte coupling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          e=Path('pages/vertraege/contract-pdf-engine-v1.js').read_text(encoding='utf-8')
          h=Path('pages/vertraege/club-partner.html').read_text(encoding='utf-8')
          if 'notfallakte' in e.lower(): raise SystemExit('SCHUTZSTOPP: Notfallakte-Referenz in generischer Vertragsengine')
          for phrase in ['Mission Dorade','Club Partner Plus','ONLY INSIDE Software-Solution GmbH']:
              if phrase in e: raise SystemExit('SCHUTZSTOPP: Vertragstext in generischer Engine: '+phrase)
          if 'function pdfBlocks(' in h: raise SystemExit('SCHUTZSTOPP: doppelter PDF-Vertrag noch vorhanden')
          PY
          node --check pages/vertraege/contract-pdf-engine-v1.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('pages/vertraege/club-partner.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/club-partner-inline.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/club-partner-inline.js

      - name: Remove obsolete files and commit
        shell: bash
        run: |
          git config user.name "Adler-FSA Automation"
          git config user.email "actions@users.noreply.github.com"
          rm -f pages/vertraege/fsa-contract-pdf-engine.js
          rm -f .github/workflows/wire-club-partner-existing-pdf-v3.yml
          git rm .github/workflows/wire-contract-dom-pdf.yml
          git add pages/vertraege/club-partner.html pages/vertraege/contract-pdf-engine-v1.js
          git add -u
          git commit -m "Use generic DOM-driven PDF engine for contracts"
          git push
