name: Patch Hoersaal Rechner 1 Setup
on:
  push:
    paths:
      - '.github/workflows/patch-hoersaal-r1-setup.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch calculator
        shell: python
        run: |
          from pathlib import Path
          p=Path('hoersaal-liquiditybooster/07-werkstatt.html')
          s=p.read_text(encoding='utf-8')

          css_anchor='.results{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:26px}'
          css_insert='''\n.setup-window{margin-top:22px;padding:22px;border:1px solid #e7c3d6;border-radius:24px;background:linear-gradient(135deg,var(--mag-soft),#fff);box-shadow:0 10px 28px rgba(19,34,56,.05)}.setup-window .setup-kicker{font-size:11px;font-weight:900;letter-spacing:.11em;text-transform:uppercase;color:var(--mag)}.setup-window h3{margin:6px 0 6px}.setup-window p{margin:0;color:var(--muted);font-size:13px}.setup-results{margin-top:16px}.setup-results .result.main{background:linear-gradient(145deg,var(--mag-soft),#fff);border-color:#e7c3d6}\n'''
          if '.setup-window{' not in s:
              s=s.replace(css_anchor, css_insert+css_anchor)

          old_note='Dieser erste Rechner berechnet bewusst nur die wiederkehrende Provision aus den monatlichen Hörsaal-Gebühren. Die einmaligen Setup-Gebühren werden als Produktinformation angezeigt, aber hier noch nicht in die Provisionssumme eingerechnet.'
          new_note='Die monatlichen Hörsaal-Gebühren bilden den kumulativen Zeitverlauf. Die einmalige Setup-Provision wird separat berechnet und bewusst nicht in Monat 1, Monat 6, Monat 12 oder die kumulierte 12-Monats-Summe eingerechnet.'
          s=s.replace(old_note,new_note)
          old_note_en='This first calculator deliberately calculates only recurring commission from monthly lecture hall fees. One-time setup fees are shown as product information but are not yet included in the commission total.'
          new_note_en='The monthly lecture hall fees form the cumulative time progression. The one-time setup commission is calculated separately and deliberately not included in month 1, month 6, month 12 or the cumulative 12-month total.'
          s=s.replace(old_note_en,new_note_en)

          actions='''<div class="actions"><button class="btn primary" id="calcBtn" type="button" data-i18n data-de="Neu berechnen" data-en="Recalculate">Neu berechnen</button><button class="btn" id="resetBtn" type="button" data-i18n data-de="Alle Eingaben auf 0" data-en="Reset all inputs to 0">Alle Eingaben auf 0</button></div>'''
          setup='''<div class="setup-window" aria-live="polite"><div class="setup-kicker" data-i18n data-de="Einmaliger Startimpuls" data-en="One-time starting impulse">Einmaliger Startimpuls</div><h3 data-i18n data-de="Einmalige Setup-Provision" data-en="One-time setup commission">Einmalige Setup-Provision</h3><p data-i18n data-de="Für die oben eingegebenen neuen Hörsaal-Verträge eines Monats. Die Setup-Gebühr fällt je Vertrag einmal an und wird mit derselben persönlichen 3-Ebenen-Logik 20 / 15 / 10 vergütet. Sie bleibt vollständig getrennt vom kumulativen Monatsaufbau." data-en="For the new lecture hall contracts entered above for one month. The setup fee is charged once per contract and uses the same personal 3-level logic 20 / 15 / 10. It remains completely separate from the cumulative monthly build-up.">Für die oben eingegebenen neuen Hörsaal-Verträge eines Monats. Die Setup-Gebühr fällt je Vertrag einmal an und wird mit derselben persönlichen 3-Ebenen-Logik 20 / 15 / 10 vergütet. Sie bleibt vollständig getrennt vom kumulativen Monatsaufbau.</p><div class="results setup-results"><div class="result"><span>E1 · 20 %</span><b id="setupE1">0,00 €</b></div><div class="result"><span>E2 · 15 %</span><b id="setupE2">0,00 €</b></div><div class="result"><span>E3 · 10 %</span><b id="setupE3">0,00 €</b></div><div class="result main"><span data-i18n data-de="Setup-Provision gesamt" data-en="Total setup commission">Setup-Provision gesamt</span><b id="setupTotal">0,00 €</b></div></div></div>'''
          if 'id="setupTotal"' not in s:
              s=s.replace(actions, actions+setup)

          s=s.replace("const prices={basis:{monthly:399},plus:{monthly:649},pro:{monthly:899}},rates=[.20,.15,.10];", "const prices={basis:{monthly:399,setup:990},plus:{monthly:649,setup:1490},pro:{monthly:899,setup:1990}},rates=[.20,.15,.10];")

          old_start="function calculate(){const d=read(),months=[],lv=[0,0,0],pt={basis:0,plus:0,pro:0};for(let m=1;m<=12;m++){"
          new_start="function calculate(){const d=read(),months=[],lv=[0,0,0],pt={basis:0,plus:0,pro:0},setupLv=[0,0,0];Object.keys(prices).forEach(p=>{for(let l=0;l<3;l++){setupLv[l]+=d[p][l]*prices[p].setup*rates[l]}});const setupTotalValue=setupLv.reduce((a,b)=>a+b,0);document.getElementById('setupE1').textContent=eur(setupLv[0]);document.getElementById('setupE2').textContent=eur(setupLv[1]);document.getElementById('setupE3').textContent=eur(setupLv[2]);document.getElementById('setupTotal').textContent=eur(setupTotalValue);for(let m=1;m<=12;m++){"
          if old_start not in s:
              raise SystemExit('calculate() anchor not found')
          s=s.replace(old_start,new_start,1)

          s=s.replace('– ausschließlich aus den monatlichen Gebühren, ohne Setup.','– ausschließlich aus den monatlichen Gebühren. Die einmalige Setup-Provision steht separat im eigenen Fenster.')
          s=s.replace('– monthly fees only, excluding setup.','– monthly fees only. The one-time setup commission is shown separately in its own window.')

          p.write_text(s,encoding='utf-8')
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hoersaal-liquiditybooster/07-werkstatt.html
          git rm .github/workflows/patch-hoersaal-r1-setup.yml
          git commit -m "Separate Hoersaal setup provision from cumulative monthly calculator"
          git push