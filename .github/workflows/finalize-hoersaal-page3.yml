name: Finalize Hoersaal Page 3

on:
  push:
    paths:
      - '.github/workflows/finalize-hoersaal-page3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build final page 3 and gate images
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip
          payload = Path('.tmp-page3-final.gz.b64').read_text().strip()
          html = gzip.decompress(base64.b64decode(payload)).decode('utf-8')
          html = html.replace('assets/tor-wissen.webp','assets/tor-wissen.jpg')
          html = html.replace('assets/tor-perspektiven.webp','assets/tor-perspektiven.jpg')
          html = html.replace('assets/tor-talent-business.webp','assets/tor-talent-business.jpg')
          Path('hoersaal-liquiditybooster/03-gast-club.html').write_text(html, encoding='utf-8')
          for stem in ('tor-wissen','tor-perspektiven','tor-talent-business'):
              src = Path(f'hoersaal-liquiditybooster/assets/{stem}.b64')
              data = base64.b64decode(src.read_text().strip())
              Path(f'hoersaal-liquiditybooster/assets/{stem}.jpg').write_bytes(data)
          PY
          rm -f hoersaal-liquiditybooster/assets/tor-wissen.b64
          rm -f hoersaal-liquiditybooster/assets/tor-perspektiven.b64
          rm -f hoersaal-liquiditybooster/assets/tor-talent-business.b64
          rm -f .tmp-page3-final.gz.b64
          rm -f .github/workflows/finalize-hoersaal-page3.yml
      - name: Verify final page 3
        shell: bash
        run: |
          set -euo pipefail
          test -s hoersaal-liquiditybooster/03-gast-club.html
          test -s hoersaal-liquiditybooster/assets/tor-wissen.jpg
          test -s hoersaal-liquiditybooster/assets/tor-perspektiven.jpg
          test -s hoersaal-liquiditybooster/assets/tor-talent-business.jpg
          grep -q 'Was möchtest du wissen?' hoersaal-liquiditybooster/03-gast-club.html
          grep -q 'Was möchtest du entwickeln?' hoersaal-liquiditybooster/03-gast-club.html
          grep -q 'Was bringst du mit?' hoersaal-liquiditybooster/03-gast-club.html
          grep -q 'Wissensanfrage als PDF herunterladen' hoersaal-liquiditybooster/03-gast-club.html
          grep -q 'Bewerbung als PDF herunterladen' hoersaal-liquiditybooster/03-gast-club.html
          grep -q 'Business-Profil als PDF herunterladen' hoersaal-liquiditybooster/03-gast-club.html
          grep -q 'Mission Dorade ist kein Tor' hoersaal-liquiditybooster/03-gast-club.html
      - name: Commit final page 3
        shell: bash
        run: |
          git config user.name 'LiquidityBooster Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize Hoersaal page 3 with real gates, forms and PDFs'
          git push
