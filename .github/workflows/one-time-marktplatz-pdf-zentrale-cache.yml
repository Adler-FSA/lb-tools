name: One-time marketplace PDF Zentrale integration
on:
  push:
    paths:
      - '.github/workflows/one-time-marktplatz-pdf-zentrale-cache.yml'
permissions:
  contents: write
jobs:
  verify-and-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify JS and update ONLY workshop page script version
        run: |
          node --check pages/vertraege/club-marktplatz-vertragswerkstatt.js
          python3 - <<'PY'
          from pathlib import Path
          page=Path('pages/vertraege/club-marktplatz-vertragswerkstatt.html')
          text=page.read_text(encoding='utf-8')
          old='./club-marktplatz-vertragswerkstatt.js?v=1'
          new='./club-marktplatz-vertragswerkstatt.js?v=2'
          assert text.count(old)==1, 'Script reference not found exactly once'
          text=text.replace(old,new)
          page.write_text(text,encoding='utf-8')
          js=Path('pages/vertraege/club-marktplatz-vertragswerkstatt.js').read_text(encoding='utf-8')
          assert "../merchant-kompass/akademie-pdf-uebergabe.js?v=1" in js
          assert "zentrale.setDocument({blob:pdf.blob,filename:pdf.filename,pages:pdf.pages" in js
          assert 'URL.createObjectURL(pdf' not in js
          print('PASS: JS syntax, approved PDF handoff, no competing PDF blob links, cache-busted HTML')
          PY
      - name: Commit narrowly scoped cache update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/vertraege/club-marktplatz-vertragswerkstatt.html
          git commit -m 'Connect workshop to approved PDF Zentrale with refreshed script reference'
          git push