name: Cleanup obsolete contract workflow
on:
  push:
    paths:
      - '.github/workflows/cleanup-failed-contract-workflow.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete failed workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/beautify-contract-pdf-header.yml || true
          git rm -f .github/workflows/cleanup-failed-contract-workflow.yml
          git commit -m "Remove obsolete contract workflow files"
          git push
