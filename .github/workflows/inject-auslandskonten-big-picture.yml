name: Inject Auslandskonten Big Picture

on:
  push:
    paths:
      - '.github/workflows/inject-auslandskonten-big-picture.yml'

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Insert final Big Picture
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('pages/leitartikel/auslandskonten-crd-vi-2027/index.html')
          s = p.read_text(encoding='utf-8')
          image = '9951909D-0C62-494E-8BC2-4E3C261948FB.png'
          if '.hero-image{' not in s:
              s = s.replace('.wrap{width:min(1040px,calc(100% - 28px));margin:0 auto;padding:22px 0 54px}.hero{', '.wrap{width:min(1040px,calc(100% - 28px));margin:0 auto;padding:22px 0 54px}.hero-image{margin:0 0 24px}.hero-image img{display:block;width:100%;height:auto;border-radius:20px;box-shadow:var(--shadow)}.hero{')
              s = s.replace('@media(max-width:820px){.wrap{width:min(100% - 16px,1040px);padding-top:9px}.hero{', '@media(max-width:820px){.wrap{width:min(100% - 16px,1040px);padding-top:9px}.hero-image img{border-radius:14px}.hero{')
          if image not in s:
              s = s.replace('<main class="wrap">\n<section class="hero">', '<main class="wrap">\n<figure class="hero-image"><img src="./'+image+'" alt="Auslandskonten 2027 – CRD VI, EU-Banken, Drittstaatenbanken und weltweite Orientierung"></figure>\n<section class="hero">')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then
            echo 'No change needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/leitartikel/auslandskonten-crd-vi-2027/index.html
          git commit -m 'Add final Big Picture to Auslandskonten 2027 article'
          git push
