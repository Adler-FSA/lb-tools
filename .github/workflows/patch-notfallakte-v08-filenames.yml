name: Patch Notfallakte V08 filenames
on:
  push:
    paths:
      - '.github/workflows/patch-notfallakte-v08-filenames.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch V08 filenames and Excel labels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pages/notfallakte/v08-backup.js')
          s=p.read_text()
          # Add local date/time helper after nowLabel
          old="function nowLabel(v){if(!v)return '';try{return new Date(v).toLocaleString('de-DE')}catch{return v}}"
          new=old+"\nfunction fileStamp(d=new Date()){const pad=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`}"
          if 'function fileStamp(' not in s:
              s=s.replace(old,new)
          # JSON filename: readable purpose + local date/time
          s=s.replace("`${demoMode?'DEMO-':''}Notfallakte-${safeName(data.owner)}-${createdAt.slice(0,10)}.json`","`${demoMode?'DEMO-':''}Notfallakte-${safeName(data.owner)}-Sicherung-${fileStamp()}.json`")
          # Excel filename: readable purpose + local date/time
          s=s.replace("`${demoMode?'DEMO-':''}Notfallakte-${safeName(state.owner)}-${new Date().toISOString().slice(0,10)}.xlsx`","`${demoMode?'DEMO-':''}Notfallakte-${safeName(state.owner)}-Uebersicht-${fileStamp()}.xlsx`")
          # Human-readable Excel values
          s=s.replace("['Testament vorhanden?',state.testamentExists]","['Testament vorhanden?',state.testamentExists==='yes'?'Ja':state.testamentExists==='no'?'Nein':'']")
          s=s.replace("['Unterschriftsmodus',state.signatureMode]","['Unterschriftsmodus',state.signatureMode==='paper'?'Nach dem Ausdruck handschriftlich unterschreiben':state.signatureMode==='digital'?'Digital unterschrieben':state.signatureMode||'']")
          p.write_text(s)
          PY
          node --check pages/notfallakte/v08-backup.js
          grep -q 'Sicherung-${fileStamp()}.json' pages/notfallakte/v08-backup.js
          grep -q 'Uebersicht-${fileStamp()}.xlsx' pages/notfallakte/v08-backup.js
          grep -q "Testament vorhanden?',state.testamentExists==='yes'?'Ja'" pages/notfallakte/v08-backup.js
          grep -q "Nach dem Ausdruck handschriftlich unterschreiben" pages/notfallakte/v08-backup.js
      - name: Commit correction and remove workflow
        run: |
          git config user.name 'Adler-FSA'
          git config user.email 'ceo@liquiditybooster.de'
          git add pages/notfallakte/v08-backup.js
          git rm .github/workflows/patch-notfallakte-v08-filenames.yml
          git commit -m 'Correct V08 backup filenames and Excel labels'
          git push