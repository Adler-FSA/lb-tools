name: Projekt Frühwarn-Check – Marken-Webspur-Resolver

on:
  push:
    paths:
      - '.github/workflows/patch-fruehwarn-brand-resolver-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolver in Seite einbinden
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('pages/projekt-fruehwarn-check/index.html')
          s=p.read_text(encoding='utf-8')
          if '<script src="./brand-resolver.js"></script>' in s:
              raise SystemExit(0)
          old='<script src="./dual-input.js"></script>\n</body>'
          new='<script src="./dual-input.js"></script>\n<script src="./brand-resolver.js"></script>\n</body>'
          if old not in s:
              raise SystemExit('Einbindepunkt nicht gefunden')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check pages/projekt-fruehwarn-check/brand-resolver.js
          grep -q 'brand-resolver.js' pages/projekt-fruehwarn-check/index.html
          git config user.name "FSA Frühwarn-Update"
          git config user.email "actions@github.com"
          git add pages/projekt-fruehwarn-check/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Frühwarn-Check: automatische Webspur-Suche aktivieren"
          git pull --rebase
          git push

