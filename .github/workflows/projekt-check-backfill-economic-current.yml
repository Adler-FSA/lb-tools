name: Projekt-Check – Aktuellen Testfall wirtschaftlich auswerten

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/projekt-check-backfill-economic-current.yml'

permissions:
  contents: write

jobs:
  economic-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: U-Center Geldfluss, Rendite, Einnahmequelle und Stressszenarien auswerten
        run: python projekt-check-engine/core/run_economic_analysis.py --case-id PCA-20260825-NN0U4DO7
      - name: Wirtschaftlichen Teststand speichern
        run: |
          git config user.name "FSA Projekt-Check"
          git config user.email "actions@github.com"
          git add data/projekt-check/cases/PCA-20260825-NN0U4DO7
          git commit -m "Projekt-Check: U-Center wirtschaftliche Tiefenprüfung"
          git pull --rebase origin main
          git push origin HEAD:main
