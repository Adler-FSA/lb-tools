name: Wire Personal Management PDF V2

on:
  push:
    paths:
      - '.github/workflows/wire-personal-management-pdf-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify shared PDF engines
        run: |
          node --check pages/vertraege/contract-pdf-engine-v2.js
          node --check pages/personal-management/personal-management-pdf-v2.js
          grep -q "FSA_CONTRACT_PDF_ENGINE_V2" pages/vertraege/contract-pdf-engine-v2.js
          grep -q "FSA_CONTRACT_PDF_ENGINE_V2" pages/personal-management/personal-management-pdf-v2.js

      - name: Wire only the three standalone pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path('pages/personal-management/wissen.html'),
              Path('pages/personal-management/perspektiven.html'),
              Path('pages/personal-management/talent-business.html'),
          ]
          engine = '<script src="../vertraege/contract-pdf-engine-v2.js?v=3"></script>'
          adapter = '<script src="./personal-management-pdf-v2.js?v=1"></script>'
          injection = engine + '\n' + adapter + '\n</body>\n</html>'

          for p in files:
              s = p.read_text(encoding='utf-8')
              if adapter in s:
                  continue
              if 'gastzugang@liquiditybooster.de' not in s:
                  raise SystemExit(f'SCHUTZSTOPP: neue Gastzugang-Adresse fehlt in {p}')
              n = re.sub(r'</body>\s*</html>\s*$', injection, s, count=1, flags=re.I)
              if n == s:
                  raise SystemExit(f'SCHUTZSTOPP: Dokumentende nicht gefunden in {p}')
              p.write_text(n, encoding='utf-8')
          PY

      - name: Verify the three pages
        shell: bash
        run: |
          for f in pages/personal-management/wissen.html pages/personal-management/perspektiven.html pages/personal-management/talent-business.html; do
            grep -q 'gastzugang@liquiditybooster.de' "$f"
            grep -q '../vertraege/contract-pdf-engine-v2.js?v=3' "$f"
            grep -q './personal-management-pdf-v2.js?v=1' "$f"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          for name in ['wissen','perspektiven','talent-business']:
              s=Path(f'pages/personal-management/{name}.html').read_text(encoding='utf-8')
              blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S|re.I)
              out=Path(f'/tmp/{name}-inline.js')
              out.write_text('\n'.join(blocks),encoding='utf-8')
              subprocess.run(['node','--check',str(out)],check=True)
          PY
          git diff --check

      - name: Commit repair and remove one-time workflow
        run: |
          rm .github/workflows/wire-personal-management-pdf-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/personal-management/wissen.html pages/personal-management/perspektiven.html pages/personal-management/talent-business.html .github/workflows/wire-personal-management-pdf-v2.yml
          git commit -m "Restore PDF Engine V2 on personal management forms"
          git push
