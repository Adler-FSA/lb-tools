name: Fix personal management name field width

on:
  push:
    paths:
      - '.github/workflows/fix-personal-management-name-field-width.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix untyped text inputs on perspective and talent pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('pages/personal-management/perspektiven.html'),
              Path('pages/personal-management/talent-business.html'),
          ]
          old = 'input[type=text],input[type=email],textarea,select'
          new = 'input:not([type]),input[type=text],input[type=email],textarea,select'
          for p in files:
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'SCHUTZSTOPP: erwarteter CSS-Selektor fehlt in {p}')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Verify fix and preserve PDF V2 wiring
        run: |
          grep -q 'input:not(\[type\]),input\[type=text\],input\[type=email\],textarea,select' pages/personal-management/perspektiven.html
          grep -q 'input:not(\[type\]),input\[type=text\],input\[type=email\],textarea,select' pages/personal-management/talent-business.html
          grep -q '../vertraege/contract-pdf-engine-v2.js?v=3' pages/personal-management/perspektiven.html
          grep -q '../vertraege/contract-pdf-engine-v2.js?v=3' pages/personal-management/talent-business.html
          grep -q './personal-management-pdf-v2.js?v=1' pages/personal-management/perspektiven.html
          grep -q './personal-management-pdf-v2.js?v=1' pages/personal-management/talent-business.html
          git diff --check

      - name: Commit fix and remove one-time workflow
        run: |
          rm .github/workflows/fix-personal-management-name-field-width.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/personal-management/perspektiven.html pages/personal-management/talent-business.html .github/workflows/fix-personal-management-name-field-width.yml
          git commit -m "Fix personal management text input widths"
          git push
