name: Fix Sichtbar werden PDF download V3

on:
  push:
    paths:
      - '.github/workflows/fix-sichtbar-werden-pdf-download-v3.yml'
      - '.github/scripts/fix_sichtbar_pdf_v3.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply PDF V3 patch
        run: python3 .github/scripts/fix_sichtbar_pdf_v3.py
      - name: Verify embedded JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in [Path('pages/gastredner-15-minuten/index.html'),Path('pages/gastredner-30-minuten/index.html'),Path('pages/leitartikel-vorbereitung/index.html')]:
              blocks=re.findall(r'<script(?:[^>]*)>(.*?)</script>',p.read_text(encoding='utf-8'),re.S)
              Path('/tmp/'+p.parent.name+'.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/gastredner-15-minuten.js
          node --check /tmp/gastredner-30-minuten.js
          node --check /tmp/leitartikel-vorbereitung.js
      - name: Commit repaired pages
        shell: bash
        run: |
          git config user.name 'Adler-FSA Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add pages/gastredner-15-minuten/index.html pages/gastredner-30-minuten/index.html pages/leitartikel-vorbereitung/index.html
          if git diff --cached --quiet; then
            echo 'PDF V3 pages already patched'
          else
            git commit -m 'Use named PDF V3 handoff for Sichtbar werden pages'
            git push
          fi
