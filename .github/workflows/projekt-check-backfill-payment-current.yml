name: Projekt-Check – Aktuellen Testfall Payment prüfen

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/projekt-check-backfill-payment-current.yml'

permissions:
  contents: write

jobs:
  payment-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Chromium bereitstellen
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: U-Center Karte, Banking, Payment, Issuer und IBAN prüfen
        run: python projekt-check-engine/core/run_payment_depth.py --case-id PCA-20260825-NN0U4DO7 --max-captures 8
      - name: Payment-Teststand speichern
        run: |
          git config user.name "FSA Projekt-Check"
          git config user.email "actions@github.com"
          git add data/projekt-check/cases/PCA-20260825-NN0U4DO7
          git commit -m "Projekt-Check: U-Center Karten-Banking-Payment-Tiefenprüfung"
          git pull --rebase origin main
          git push origin HEAD:main
