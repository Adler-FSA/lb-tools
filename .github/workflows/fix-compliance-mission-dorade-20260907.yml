name: Compliance Mission Dorade korrigieren

on:
  push:
    paths:
      - '.github/workflows/fix-compliance-mission-dorade-20260907.yml'

permissions:
  contents: write

jobs:
  patch-compliance:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Veraltete Mission-Dorade-Aussagen korrigieren
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = {
              Path('pages/compliance/modul-3-kommunikation-claims.html'): {
                  'dass der aktive Verdienst- und Aufbauweg erst mit Aktivierung und Teilnahme an Mission Dorade beginnt':
                      'dass jeder Club Partner persönlich empfehlen darf und Mission Dorade keine Voraussetzung für die persönliche Empfehlungsvergütung ist',
                  'Club Partner ist keine passive Mitgliedschaft. Mit der Club-Partnerschaft werden Wissen, Clubhaus und die dafür freigegebenen Inhalte und Werkzeuge zugänglich. Wer aktiv mitverdienen und den Aufbauweg nutzen möchte, aktiviert Mission Dorade und nimmt daran teil. Weiterführende Qualifikationen – darunter Club Partner Plus – setzen die jeweils festgelegten Pflichtbausteine voraus.':
                      'Club Partner ist keine passive Mitgliedschaft. Mit der Club-Partnerschaft werden Wissen, Clubhaus und die dafür freigegebenen Inhalte und Werkzeuge zugänglich. Jeder Club Partner darf persönlich empfehlen. Mission Dorade ist keine Voraussetzung für die persönliche Empfehlungsvergütung. Sie ist ein gesonderter Qualifikations- und Aufbauweg für den Mission-Dorade-Jackpot und gehört verbindlich zur Club-Partner-Plus-Qualifikation. Weiterführende Qualifikationen – darunter Club Partner Plus – setzen die jeweils festgelegten Pflichtbausteine voraus.',
                  '„Wer aktiv mitverdienen möchte, aktiviert Mission Dorade und nimmt am vorgesehenen Aufbauweg teil.“':
                      '„Jeder Club Partner darf persönlich empfehlen; Mission Dorade ist dafür keine Voraussetzung.“'
              },
              Path('pages/compliance/modul-4-verguetung-transparenz-grenzen.html'): {
                  'Vergütung darf niemals als automatische Folge einer Club-Partnerschaft dargestellt werden. Club Partner schaltet Wissen und Clubhaus frei. Wer aktiv mitverdienen und den Aufbauweg nutzen möchte, aktiviert Mission Dorade und nimmt daran teil. Vergütung entsteht nur dort, wo die jeweils gültigen Voraussetzungen erfüllt sind und ein realer, zugeordneter und provisionsfähiger Umsatz vorliegt.':
                      'Vergütung darf niemals als automatische Folge einer Club-Partnerschaft dargestellt werden. Die Club-Partnerschaft allein erzeugt noch keinen Vergütungsanspruch. Jeder Club Partner darf jedoch persönlich empfehlen. Vergütung entsteht nur dort, wo die jeweils gültigen Voraussetzungen erfüllt sind und ein realer, zugeordneter und provisionsfähiger Umsatz vorliegt. Mission Dorade ist dafür keine Voraussetzung.',
                  'Maßgeblich bleibt der jeweils gültige Vergütungsplan, die wirksame Zuordnung des Vorgangs sowie die Erfüllung der Voraussetzungen des aktiven Verdienstwegs.':
                      'Maßgeblich bleibt der jeweils gültige Vergütungsplan, die wirksame Zuordnung des Vorgangs sowie die Erfüllung der jeweils gültigen Vergütungsregeln.',
                  '<h2>2. Mission Dorade aktiviert den aktiven Verdienst- und Aufbauweg</h2><p>Die Club-Partnerschaft allein ist keine Verdienstfreischaltung. Wer den aktiven Empfehlungs- und Aufbauweg nutzen möchte, aktiviert Mission Dorade und nimmt am vorgesehenen vierwöchigen Aufbau- und Umsetzungsweg teil.</p><div class="callout"><strong>Klare Trennung:</strong> Club Partner = Wissen und Clubhaus freischalten. Mission Dorade = aktiven Verdienst- und Aufbauweg freischalten.</div>':
                      '<h2>2. Mission Dorade ist der Qualifikations- und Aufbauweg</h2><p>Mission Dorade ist keine Voraussetzung, um als Club Partner persönlich zu empfehlen oder eine persönliche Empfehlungsvergütung zu erhalten. Sie ist der gesonderte vierwöchige Qualifikations- und Aufbauweg für die Teilnahme am Mission-Dorade-Jackpot und Bestandteil der Club-Partner-Plus-Qualifikation.</p><div class="callout"><strong>Klare Trennung:</strong> Club Partner = persönliches Empfehlungsrecht nach den gültigen Vergütungsregeln. Mission Dorade = Qualifikations- und Aufbauweg für Jackpot und Club Partner Plus.</div>',
                  '<div class="callout"><strong>Merksatz:</strong> Vergütung folgt aktivem Aufbau, realem Umsatz und klaren Regeln – nicht bloßer Mitgliedschaft, Kontaktnennung oder Hoffnung.</div>':
                      '<div class="callout"><strong>Merksatz:</strong> Vergütung folgt realem, zugeordnetem und provisionsfähigem Umsatz sowie den gültigen Regeln – nicht bloßer Mitgliedschaft, Kontaktnennung oder Hoffnung.</div>'
              }
          }

          for path, replacements in files.items():
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  if old not in text:
                      raise SystemExit(f'Erwarteter Text nicht gefunden in {path}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Änderung committen
        shell: bash
        run: |
          git config user.name "LiquidityBooster Automation"
          git config user.email "actions@users.noreply.github.com"
          git add pages/compliance/modul-3-kommunikation-claims.html pages/compliance/modul-4-verguetung-transparenz-grenzen.html
          if git diff --cached --quiet; then
            echo "Keine Änderung erforderlich."
            exit 0
          fi
          git commit -m "Compliance: Mission Dorade von Empfehlungsvergütung trennen"
          git push origin main
