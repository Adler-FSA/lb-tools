name: Beautify contract PDF header and download card

on:
  push:
    paths:
      - '.github/workflows/beautify-contract-pdf-header.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch generic contract PDF engine
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('pages/vertraege/contract-pdf-engine-v1.js')
          s=p.read_text(encoding='utf-8')

          s=s.replace("const cp={8364:128,8211:150,8212:151,8216:145,8217:146,8220:147,8221:148,8226:149};",
                      "const cp={8364:128,8211:150,8212:151,8216:145,8217:146,8220:147,8221:148,8222:132,8226:149,8230:133};")
          s=s.replace("const clean=s=>String(s??'').replace(/[\\t\\r]+/g,' ').replace(/ +/g,' ').trim();",
                      "const clean=s=>String(s??'').replace(/[\\u00AD\\u2010\\u2011\\uFFFE\\uFFFF]/g,'-').replace(/[\\t\\r]+/g,' ').replace(/ +/g,' ').trim();")

          marker='function wrap(s,w,z,b=false)'
          if 'async function loadLogo(' not in s:
              helper=r'''async function loadLogo(url){
  if(!url)return null;
  try{
    const r=await fetch(url,{mode:'cors',cache:'force-cache'});
    if(!r.ok)throw new Error('Logo HTTP '+r.status);
    const source=await r.blob(),u=URL.createObjectURL(source);
    const img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=u});
    const max=1400,scale=Math.min(1,max/Math.max(img.naturalWidth||1,img.naturalHeight||1));
    const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round((img.naturalWidth||1)*scale));canvas.height=Math.max(1,Math.round((img.naturalHeight||1)*scale));
    const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(u);
    const jpg=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('Logo-Konvertierung fehlgeschlagen')),'image/jpeg',0.95));
    return{bytes:new Uint8Array(await jpg.arrayBuffer()),width:canvas.width,height:canvas.height};
  }catch(err){console.warn('Vertragslogo konnte nicht eingebettet werden',err);return null}
}
'''
              s=s.replace(marker,helper+marker,1)

          marker='function renderPage(pg,i,total,footerText,date)'
          if 'function drawBrandHeader(' not in s:
              helper=r'''function drawBrandHeader(pg,title,subtitle,logo){
  const top=pg.p.y;
  let logoW=0,logoH=0;
  if(logo&&logo.bytes&&logo.width&&logo.height){
    const scale=Math.min(252/logo.width,70/logo.height);logoW=logo.width*scale;logoH=logo.height*scale;
    pg.p.c.push(`q ${logoW.toFixed(2)} 0 0 ${logoH.toFixed(2)} ${ML.toFixed(2)} ${(top-logoH).toFixed(2)} cm /Im1 Do Q\n`);
  }
  const tx=logoW?ML+278:ML,tw=logoW?W-278:W,ts=14.6;
  let ty=top-14;
  wrap(title||'',tw,ts,true).slice(0,3).forEach(line=>{pg.p.text(line,tx,ty,ts,true,pg.p.C.navy);ty-=18});
  if(subtitle){ty-=2;wrap(subtitle,tw,8.5,false).slice(0,3).forEach(line=>{pg.p.text(line,tx,ty,8.5,false,pg.p.C.gray);ty-=11})}
  const visualBottom=Math.min(top-(logoH||54),ty)-13;
  pg.p.rule(ML,visualBottom,W,pg.p.C.mint,1.15);
  pg.p.y=visualBottom-18;
  return pg;
}
'''
              s=s.replace(marker,helper+marker,1)

          a=s.index('function pdf(streams){')
          b=s.index('async function generate(opts={}){')
          if a<0 or b<0: raise SystemExit('SCHUTZSTOPP: PDF/generate marker fehlt')
          new_pdf=r'''function pdf(streams,image){
  const n=streams.length,imageId=image?5:null;let id=image?6:5,pi=[],ci=[];
  for(let i=0;i<n;i++){pi.push(id++);ci.push(id++)}
  const o=new Map([[1,ascii('<< /Type /Catalog /Pages 2 0 R >>')],[2,ascii(`<< /Type /Pages /Count ${n} /Kids [${pi.map(x=>x+' 0 R').join(' ')}] >>`)],[3,ascii('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>')],[4,ascii('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>')]]);
  if(image){o.set(imageId,cat([ascii(`<< /Type /XObject /Subtype /Image /Width ${image.width} /Height ${image.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${image.bytes.length} >>\nstream\n`),image.bytes,ascii('\nendstream')]))}
  for(let i=0;i<n;i++){
    const xo=image?` /XObject << /Im1 ${imageId} 0 R >>`:'';
    o.set(pi[i],ascii(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >>${xo} >> /Contents ${ci[i]} 0 R >>`));
    o.set(ci[i],cat([ascii(`<< /Length ${streams[i].length} >>\nstream\n`),streams[i],ascii('\nendstream')]))
  }
  const h=ascii('%PDF-1.4\n%FSA\n'),chunks=[h],offs=[0];let off=h.length;
  for(let i=1;i<id;i++){offs[i]=off;const x=ascii(`${i} 0 obj\n`),body=o.get(i),z=ascii('\nendobj\n');chunks.push(x,body,z);off+=x.length+body.length+z.length}
  const xo=off;let x=`xref\n0 ${id}\n0000000000 65535 f \n`;for(let i=1;i<id;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';x+=`trailer\n<< /Size ${id} /Root 1 0 R >>\nstartxref\n${xo}\n%%EOF`;chunks.push(ascii(x));return cat(chunks)
}
'''
          s=s[:a]+new_pdf+s[b:]

          a=s.index('async function generate(opts={}){')
          b=s.index('window.FSAContractPdfEngine=')
          if a<0 or b<0: raise SystemExit('SCHUTZSTOPP: generate/window marker fehlt')
          new_gen=r'''async function generate(opts={}){
  const root=typeof opts.root==='string'?document.querySelector(opts.root):(opts.root||document.querySelector('[data-contract-document]')||document.querySelector('.paper')||document.body);
  if(!root)throw new Error('Vertragsbereich wurde nicht gefunden.');
  const contentRoot=typeof opts.contentRoot==='string'?document.querySelector(opts.contentRoot):(opts.contentRoot||root);
  const fieldsRoot=typeof opts.fieldsRoot==='string'?document.querySelector(opts.fieldsRoot):(opts.fieldsRoot||document);
  const bs=blocks(contentRoot),fs=collectFields(fieldsRoot);
  if(!bs.length&&!fs.length)throw new Error('Die Vertragsseite enthält keinen ausgabefähigen Inhalt.');
  const title=clean(opts.titleText||(opts.titleSelector?textOf(document.querySelector(opts.titleSelector)):'')||document.title||'Vertrag');
  const subtitle=clean(opts.subtitleText||(opts.subtitleSelector?textOf(document.querySelector(opts.subtitleSelector)):'')||'');
  const logo=await loadLogo(opts.logoUrl||'');
  const pages=[page()];let pg=pages[0];pg=drawBrandHeader(pg,title,subtitle,logo);
  for(const b of bs){if(b.type==='heading')pg=drawHeading(pg,b,pages);else if(b.type==='table')pg=drawTable(pg,b,pages);else pg=drawText(pg,b,pages)}
  pg=drawFields(pg,fs,pages,opts.fieldsTitle||'Vertragsdaten');
  const date=new Intl.DateTimeFormat('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date());
  const footer=clean(opts.footerText||document.title||'');
  const streams=pages.map((x,i)=>renderPage(x,i,pages.length,footer,date));
  const out=pdf(streams,logo),filename=(opts.filename?String(opts.filename):safeFilePart(document.title)+'.pdf');
  const file=(typeof File==='function')?new File([out],filename,{type:'application/pdf',lastModified:Date.now()}):new Blob([out],{type:'application/pdf'});
  if(opts.autoDownload===true){const u=URL.createObjectURL(file),a=document.createElement('a');a.href=u;a.download=filename;a.rel='noopener';a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
  return{blob:file,file,filename,pages:pages.length,bytes:out.length,version:VERSION}
}
'''
          s=s[:a]+new_gen+s[b:]

          s=s.replace("function renderPage(pg,i,total,footerText,date){const p=pg.p;p.rule(ML,35,W);if(footerText)p.text(footerText,ML,22,6.7,false,p.C.gray);p.text(`${date} · Seite ${i+1} von ${total}`,PW-MR-114,22,6.7,false,p.C.gray);return ascii(p.c.join(''))}",
                      "function renderPage(pg,i,total,footerText,date){const p=pg.p;if(i>0&&footerText){p.text(footerText,ML,PH-24,7.0,true,p.C.navy);p.rule(ML,PH-33,W,p.C.mint,.55)}p.rule(ML,35,W);if(footerText)p.text(footerText,ML,22,6.7,false,p.C.gray);p.text(`${date} · Seite ${i+1} von ${total}`,PW-MR-114,22,6.7,false,p.C.gray);return ascii(p.c.join(''))}")

          p.write_text(s,encoding='utf-8')
          PY
          node --check pages/vertraege/contract-pdf-engine-v1.js

      - name: Patch Club Partner user page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pages/vertraege/club-partner.html')
          s=p.read_text(encoding='utf-8')

          css=""".main-download-card{display:none;margin:28px auto 6px;max-width:700px;border:2px solid var(--mint);border-radius:20px;padding:22px;background:linear-gradient(135deg,#f1ffff,#fff);box-shadow:0 18px 46px rgba(19,34,56,.12);text-align:center}.main-download-card.show{display:block}.main-download-check{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;margin:0 auto 10px;background:var(--mint);color:#fff;font-weight:900;font-size:25px}.main-download-card h3{margin:0 0 5px;color:var(--navy);font-size:22px}.main-download-meta{margin:0;color:var(--muted);font-size:13px}.main-download-name{margin:12px auto 14px;padding:10px 12px;border-radius:11px;background:#fff;border:1px solid var(--line);font-weight:900;color:var(--navy);overflow-wrap:anywhere}.main-download-card .btn{justify-content:center;min-width:220px}.download-state{display:none!important}"
          if '.main-download-card{' not in s:
              s=s.replace('.footer-note{text-align:center',css+'.footer-note{text-align:center',1)

          card='''<section class="main-download-card" id="mainDownloadCard" data-pdf-exclude><div class="main-download-check">✓</div><h3 id="mainDownloadTitle">PDF fertig erstellt</h3><p class="main-download-meta" id="mainDownloadMeta"></p><div class="main-download-name" id="mainDownloadFilename"></div><a class="btn primary" id="mainDownloadLink" href="#" download>PDF herunterladen</a></section>'''
          if 'id="mainDownloadCard"' not in s:
              s=s.replace('</section></div></article>', '</section>'+card+'</div></article>',1)

          s=s.replace('<script src="./contract-pdf-engine-v1.js?v=3"></script>','<script src="./contract-pdf-engine-v1.js?v=4"></script>')
          s=s.replace("contentRoot:'.paper',","contentRoot:'.paper .contract',\n      titleSelector:'.hero h1',\n      subtitleSelector:'.hero .lead',\n      logoUrl:'https://raw.githubusercontent.com/Adler-FSA/lp-anfang/main/library/logos/liquiditybooster-logo.png',")

          old="""    const a=$('#downloadLink');a.href=currentUrl;a.download=filename;
    $('#downloadInfo').textContent=(lang==='de'?`PDF erstellt: ${result.pages} Seiten · `:`PDF created: ${result.pages} pages · `)+filename;
    $('#downloadState').classList.add('show');
    setTimeout(()=>$('#downloadState').scrollIntoView({behavior:'smooth',block:'nearest'}),20)"""
          new="""    const a=$('#downloadLink');a.href=currentUrl;a.download=filename;
    $('#downloadInfo').textContent=(lang==='de'?`PDF erstellt: ${result.pages} Seiten · `:`PDF created: ${result.pages} pages · `)+filename;
    const main=$('#mainDownloadLink');main.href=currentUrl;main.download=filename;main.textContent=lang==='de'?'PDF herunterladen':'Download PDF';
    $('#mainDownloadTitle').textContent=lang==='de'?'Deine PDF ist fertig':'Your PDF is ready';
    $('#mainDownloadMeta').textContent=(lang==='de'?`${result.pages} Seiten · erstellt am `:`${result.pages} pages · created on `)+new Intl.DateTimeFormat(lang==='de'?'de-DE':'en-GB').format(new Date());
    $('#mainDownloadFilename').textContent=filename;
    $('#mainDownloadCard').classList.add('show');
    setTimeout(()=>$('#mainDownloadCard').scrollIntoView({behavior:'smooth',block:'center'}),30)"""
          if old not in s: raise SystemExit('SCHUTZSTOPP: Download-Ausgabeblock nicht gefunden')
          s=s.replace(old,new,1)
          s=s.replace("$('#downloadState').classList.remove('show');", "$('#downloadState').classList.remove('show');$('#mainDownloadCard')?.classList.remove('show');",1)

          p.write_text(s,encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('pages/vertraege/club-partner.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?![^>]*\\bsrc=)[^>]*>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/club-partner-inline.js').write_text('\n'.join(blocks),encoding='utf-8')
          required=['mainDownloadCard',"contentRoot:'.paper .contract'","logoUrl:'https://raw.githubusercontent.com/Adler-FSA/lp-anfang/main/library/logos/liquiditybooster-logo.png'",'contract-pdf-engine-v1.js?v=4']
          for r in required:
              if r not in s: raise SystemExit('SCHUTZSTOPP: fehlt '+r)
          PY
          node --check /tmp/club-partner-inline.js

      - name: Verify generic engine remains contract-text free
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('pages/vertraege/contract-pdf-engine-v1.js').read_text(encoding='utf-8')
          for phrase in ['Mission Dorade','Club Partner Plus','ONLY INSIDE Software-Solution GmbH','notfallakte']:
              if phrase.lower() in s.lower(): raise SystemExit('SCHUTZSTOPP: Produkt-/Vertragstext in generischer Engine: '+phrase)
          for need in ['loadLogo(','drawBrandHeader(','/Subtype /Image','opts.logoUrl','opts.titleSelector','8222:132']:
              if need not in s: raise SystemExit('SCHUTZSTOPP: Engine-Funktion fehlt: '+need)
          PY

      - name: Commit changes and remove one-time workflow
        shell: bash
        run: |
          git config user.name "Adler-FSA Automation"
          git config user.email "actions@users.noreply.github.com"
          git add pages/vertraege/contract-pdf-engine-v1.js pages/vertraege/club-partner.html
          git rm .github/workflows/beautify-contract-pdf-header.yml
          git commit -m "Polish contract PDF branding and download UX"
          git push
