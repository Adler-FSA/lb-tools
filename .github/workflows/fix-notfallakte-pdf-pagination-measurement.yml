name: Fix Notfallakte PDF pagination measurement

on:
  push:
    paths:
      - '.github/workflows/fix-notfallakte-pdf-pagination-measurement.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch V08 PDF measurement styles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pages/notfallakte/v08-final.js')
          s = p.read_text(encoding='utf-8')
          marker = "function installButtons(){"
          if marker not in s:
              raise SystemExit('installButtons marker not found')
          helper = r'''function ensurePdfMeasureStyles(){if(q('#v08PdfMeasureFix'))return;const s=document.createElement('style');s.id='v08PdfMeasureFix';s.textContent=`
#bcx_dummy{display:none}
#printSheet{font-family:Arial,Helvetica,sans-serif;font-size:10.8pt;line-height:1.4;color:#202b39}
#printSheet .pHead{border-bottom:2px solid #162238;padding:0 0 11px;margin-bottom:10px}
#printSheet .pEyebrow{font-size:9pt;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#555}
#printSheet .pHead h1{font-size:27pt;line-height:1.02;margin:7px 0 9px;color:#000}
#printSheet .pHead p{margin:0;font-size:11.5pt}
#printSheet .pSection{margin:0 0 9px;border:1px solid #b7bdc2;border-radius:12px;overflow:visible}
#printSheet .pSectionHead{display:flex;gap:10px;align-items:center;padding:9px 11px;border-bottom:1px solid #d6dde0;font-size:12.5pt;font-weight:800;color:#18263a}
#printSheet .pBody{padding:10px}
#printSheet .pRecord{border:1px solid #d9e0e3;border-radius:9px;padding:9px;margin-bottom:8px}
#printSheet .pRecordTitle{font-weight:800;margin-bottom:7px;color:#18263a}
#printSheet .pGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 18px}
#printSheet .pGrid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px 14px}
#printSheet .pItem{min-width:0}
#printSheet .pItem.full{grid-column:1/-1}
#printSheet .pLabel{display:block;font-size:9.2pt;font-weight:800;color:#172438;margin-bottom:2px}
#printSheet .pValue{display:block;overflow-wrap:anywhere;word-break:break-word;white-space:pre-wrap}
#printSheet .pCallout{margin-top:8px;padding:9px;border:1px solid #e4c8d3;border-radius:9px;background:#fff9fb}
#printSheet .pSafety{padding:10px;border:1px solid #bbb;border-radius:9px;margin-bottom:11px}
#printSheet .pMessage{padding:12px;border:1px solid #d6dde0;border-radius:10px;background:#fbfdfd;margin:0 0 10px;white-space:pre-wrap}
#printSheet .pSignGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#printSheet .pSignLines{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}
#printSheet .pSignLine{border-top:1px solid #222;padding-top:4px;font-size:8.8pt;color:#555}
#printSheet .pFooter{font-size:8.8pt;color:#667085;margin-top:10px}
#printSheet .pNum{width:24px;color:#999}
`;document.head.appendChild(s)}

'''
          if 'function ensurePdfMeasureStyles()' not in s:
              s = s.replace(marker, helper + marker, 1)
          old = "q('#printBtn').classList.remove('printPulse');if(typeof optimizePrint==='function')optimizePrint();else if(typeof buildPrint==='function')buildPrint();"
          new = "q('#printBtn').classList.remove('printPulse');ensurePdfMeasureStyles();if(typeof optimizePrint==='function')optimizePrint();else if(typeof buildPrint==='function')buildPrint();"
          if old not in s:
              raise SystemExit('print handler target not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Syntax check
        run: node --check pages/notfallakte/v08-final.js
      - name: Remove one-time workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-notfallakte-pdf-pagination-measurement.yml
          git add pages/notfallakte/v08-final.js
          git commit -m "Fix Notfallakte PDF A4 pagination measurement"
          git push
