name: Head Control 2 und Headteam Testansicht erweitern

on:
  push:
    paths:
      - '.github/workflows/patch-head-control-2-dashboard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Testseiten erweitern
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re, shutil

          categories = [
            ('leitartikel','Leitartikel'),('kms-content','KMS Content'),('serien','Serien'),('club-haus','Club Haus'),('oeffentlich','Öffentlich'),('newsletter','Newsletter'),('hoersaele','Hörsäle'),('kurse','Kurse'),('social-media','Social Media')
          ]
          cat_options = '<option value="">Keine Angabe</option>' + ''.join(f'<option value="{s}">{l}</option>' for s,l in categories)
          cat_nav = ''.join(f'<button class="nav-btn" data-project-category="{s}">{l}</button>' for s,l in categories)
          cat_js_map = ','.join(f"'{s}':'{l}'" for s,l in categories)

          # ---------------- Head Control 2 ----------------
          for p in [Path('pages/headteam-vorlauf/head-control-2.html'), Path('pages/headteam-vorlauf/head-control-2/index.html')]:
            text=p.read_text(encoding='utf-8')
            # Meta-/Hilfstexte aus der sichtbaren Verwaltung entfernen.
            text=re.sub(r'<p class="sub"[^>]*>.*?</p>\s*','',text,count=1,flags=re.S)
            text=re.sub(r'<div class="hint"[^>]*>.*?</div>','',text,flags=re.S)

            if 'data-project-category="leitartikel"' not in text:
              nav_marker='<button class="nav-btn" data-panel="zoom"'
              text=text.replace(nav_marker,cat_nav+nav_marker,1)

              # Bereichsauswahl in die vorhandene, zentrale Projektmaske einbauen.
              marker='<div class="field"><label for="type" data-i18n="type">Art</label>'
              insert=f'<div class="field"><label for="category">Bereich</label><select id="category">{cat_options}</select></div>'
              text=text.replace(marker,insert+marker,1)

              # Tabelle erhält Bereich + Art.
              text=text.replace('<th data-i18n="projectName">Projektname</th><th data-i18n="type">Art</th>', '<th data-i18n="projectName">Projektname</th><th>Bereich</th><th data-i18n="type">Art</th>',1)

              # Variable für die aktuell gewählte Bereichsansicht.
              text=text.replace("let token='',sha='',state={version:4,projects:[],archive:[],personalLinks:[],headteamAccess:[]},editIndex=null,linkEditIndex=null,accessEditIndex=null;", "let token='',sha='',state={version:4,projects:[],archive:[],personalLinks:[],headteamAccess:[]},editIndex=null,linkEditIndex=null,accessEditIndex=null,activeProjectCategory='all';",1)

              helper=f"const HEAD_CATEGORIES={{{cat_js_map}}};function categoryLabel(v){{return HEAD_CATEGORIES[v]||'–'}};"
              text=text.replace("function auth(){",helper+"function auth(){",1)

              # read/reset/edit um category ergänzen.
              text=text.replace("function resetProject(){editIndex=null;['title','releaseDate','url','what','why','test','meeting'].forEach(id=>$('#'+id).value='');$('#type').value='';", "function resetProject(){editIndex=null;['title','releaseDate','url','what','why','test','meeting'].forEach(id=>$('#'+id).value='');$('#type').value='';$('#category').value=activeProjectCategory==='all'?'':activeProjectCategory;",1)
              text=text.replace("function readProject(){return{title:$('#title').value.trim(),type:$('#type').value,releaseDate:", "function readProject(){return{title:$('#title').value.trim(),category:$('#category').value,type:$('#type').value,releaseDate:",1)
              text=text.replace("$('#type').value=p.type||'';$('#saveProject')", "$('#type').value=p.type||'';$('#category').value=p.category||'';$('#saveProject')",1)

              # Projektliste nach Bereich filtern und Kategorie anzeigen.
              text=text.replace("const list=state.projects.map((p,index)=>({p,index})).sort(", "const list=state.projects.map((p,index)=>({p,index})).filter(x=>activeProjectCategory==='all'||x.p.category===activeProjectCategory).sort(",1)
              text=text.replace("<td><strong>${esc(p.title||'–')}</strong><div class=\"history\">${esc(t('lastUpdate'))}: ${esc(formatDateTime(p.updatedAt||p.createdAt))}</div></td><td>${esc(typeLabel(p.type))}</td>", "<td><strong>${esc(p.title||'–')}</strong><div class=\"history\">${esc(t('lastUpdate'))}: ${esc(formatDateTime(p.updatedAt||p.createdAt))}</div></td><td>${esc(categoryLabel(p.category))}</td><td>${esc(typeLabel(p.type))}</td>",1)
              text=text.replace('colspan="5" class="empty"', 'colspan="6" class="empty"',1)

              # Bereichsbuttons benutzen dieselbe Eingabemaske; kein zweites Pflegesystem.
              extra_js="""
              document.querySelectorAll('[data-project-category]').forEach(btn=>btn.onclick=()=>{activeProjectCategory=btn.dataset.projectCategory;setPanel('lead');document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));btn.classList.add('active');$('#category').value=activeProjectCategory;render()});
              const leadNav=document.querySelector('[data-panel="lead"]');if(leadNav){const oldLead=leadNav.onclick;leadNav.onclick=()=>{activeProjectCategory='all';if(oldLead)oldLead();render()}};
              """
              text=text.replace("$('#connect').onclick=load;",extra_js+"$('#connect').onclick=load;",1)

            p.write_text(text,encoding='utf-8')

          # ---------------- Read-only Testseite ----------------
          src=Path('pages/headteam-vorlauf/index.html')
          dst=Path('pages/headteam-vorlauf/headteam-2/index.html')
          dst.parent.mkdir(parents=True,exist_ok=True)
          text=src.read_text(encoding='utf-8')
          text=text.replace("const DATA_URL='../../data/headteam-vorlauf.json'", "const DATA_URL='../../../data/headteam-vorlauf.json'",1)

          if 'data-project-category="leitartikel"' not in text:
            nav_marker='    <button class="nav-btn" data-panel="zoom" data-i18n="navZoom">Zoom</button>'
            ro_nav=''.join(f'    <button class="nav-btn" data-project-category="{s}">{l}</button>' for s,l in categories)
            text=text.replace(nav_marker,ro_nav+nav_marker,1)

            # Mini-Dashboard + Team-Schnellzugriff direkt auf der 14-Tage-Ansicht.
            lead_marker='    <div class="filters" id="filters"></div><div class="list" id="list"></div>'
            lead_insert='''    <div class="mini-dashboard" id="miniDashboard"><div id="miniRelease"></div><div id="miniZoom"></div><div class="mini-count" id="miniCount"></div></div>\n    <div class="team-quick" id="teamQuick"></div>\n    <div class="filters" id="filters"></div><div class="list" id="list"></div>'''
            text=text.replace(lead_marker,lead_insert,1)

            css='''\n.mini-dashboard{display:grid;grid-template-columns:1.15fr 1.15fr .7fr;gap:10px;margin:0 0 14px}.mini-card,.mini-count{border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:var(--shadow);padding:14px}.mini-card .kicker,.mini-count .kicker{font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:900;color:var(--muted)}.mini-card .big,.mini-count .big{margin-top:5px;color:var(--navy);font-size:18px;font-weight:950;line-height:1.25}.mini-card .small,.mini-count .small{margin-top:5px;color:var(--muted);font-size:12px;line-height:1.4}.team-quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 14px}.team-box{border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:var(--shadow);padding:10px}.team-button{width:100%;border:0;border-radius:10px;background:var(--mint);color:#fff;padding:9px 10px;font:inherit;font-weight:900;cursor:pointer}.team-line{margin-top:7px;color:var(--muted);font-size:11px;line-height:1.35;min-height:30px}.team-box:nth-child(even) .team-button{background:var(--magenta)}@media(max-width:900px){.mini-dashboard{grid-template-columns:1fr 1fr}.mini-count{grid-column:1/-1}.team-quick{grid-template-columns:1fr 1fr}}@media(max-width:560px){.mini-dashboard,.team-quick{grid-template-columns:1fr}.mini-count{grid-column:auto}}\n'''
            text=text.replace('</style>\n</head>',css+'</style>\n</head>',1)

            text=text.replace("let state={version:4,projects:[],archive:[],personalLinks:[],headteamAccess:[]},activeType='all',activePanel='overview';", "let state={version:4,projects:[],archive:[],personalLinks:[],headteamAccess:[]},activeType='all',activePanel='overview',activeProjectCategory='all',activePerson='all';",1)
            helper=f"const READ_CATEGORIES={{{cat_js_map}}};function readCategoryLabel(v){{return READ_CATEGORIES[v]||'–'}};"
            text=text.replace("const typeMap=",helper+"const typeMap=",1)

            # Nur normale data-panel Buttons an die normale Navigation hängen.
            text=text.replace("document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>setPanel(b.dataset.panel));", "document.querySelectorAll('.nav-btn[data-panel]').forEach(b=>b.onclick=()=>setPanel(b.dataset.panel));",1)

            # Bereichsfilter in bestehender 14-Tage-Projektansicht.
            text=text.replace("list=all.filter(p=>activeType==='all'||p.type===activeType).sort(", "list=all.filter(p=>(activeProjectCategory==='all'||p.category===activeProjectCategory)&&(activeType==='all'||p.type===activeType)).sort(",1)
            text=text.replace("if(p.type)meta.push(`<span class=\"type\">${esc(typeLabel(p.type))}</span>`);if(p.releaseDate)", "if(p.category)meta.push(`<span class=\"type\">${esc(readCategoryLabel(p.category))}</span>`);else if(p.type)meta.push(`<span class=\"type\">${esc(typeLabel(p.type))}</span>`);if(p.releaseDate)",1)

            # Mini-Dashboard Funktionen.
            mini_js="""
            function nextRelease(){const today=new Date();today.setHours(0,0,0,0);return (state.projects||[]).filter(p=>p.releaseDate&&new Date(p.releaseDate+'T00:00:00')>=today).slice().sort((a,b)=>a.releaseDate.localeCompare(b.releaseDate))[0]||null}
            function renderMiniDashboard(){const n=nextRelease(),today=new Date();today.setHours(0,0,0,0);const end=new Date(today);end.setDate(end.getDate()+14);const count=(state.projects||[]).filter(p=>p.releaseDate&&new Date(p.releaseDate+'T00:00:00')>=today&&new Date(p.releaseDate+'T00:00:00')<=end).length;$('#miniRelease').innerHTML=n?`<div class="mini-card"><div class="kicker">Nächste Freigabe</div><div class="big">${esc(n.title||'–')}</div><div class="small">${esc(formatDate(n.releaseDate))}${n.category?' · '+esc(readCategoryLabel(n.category)):''}</div></div>`:`<div class="mini-card"><div class="kicker">Nächste Freigabe</div><div class="big">–</div><div class="small">Aktuell keine Freigabe terminiert.</div></div>`;const z=nextZoom();$('#miniZoom').innerHTML=z?`<div class="mini-card"><div class="kicker">Nächster Zoom</div><div class="big">${esc(z.a.title||'–')}</div><div class="small">${esc(formatOccurrence(z.when))}${z.a.to?' – '+esc(z.a.to):''}</div></div>`:`<div class="mini-card"><div class="kicker">Nächster Zoom</div><div class="big">–</div><div class="small">Kein Termin berechenbar.</div></div>`;$('#miniCount').innerHTML=`<div class="kicker">14 Tage</div><div class="big">${count}</div><div class="small">anstehende Freigaben</div>`;renderTeamQuick()}
            function renderTeamQuick(){const people=['alexander','oliver','peter','daniel'];$('#teamQuick').innerHTML=people.map(person=>{const items=(state.personalLinks||[]).filter(x=>x.recipient===person).slice().sort((a,b)=>(b.updatedAt||b.createdAt||'').localeCompare(a.updatedAt||a.createdAt||''));const first=items[0],line=first?`${items.length} ${items.length===1?'Aufgabe':'Aufgaben'} · ${first.title||first.note||first.url||'Eintrag'}`:'Aktuell nichts eingetragen';return`<div class="team-box"><button class="team-button" data-person-button="${person}">${esc(recipientLabel(person))}</button><div class="team-line">${esc(line)}</div></div>`}).join('');document.querySelectorAll('[data-person-button]').forEach(b=>b.onclick=()=>{activePerson=b.dataset.personButton;setPanel('tasks');renderPersonalLinks()})}
            const __renderPersonalLinks=renderPersonalLinks;renderPersonalLinks=function(){if(activePerson==='all'){__renderPersonalLinks();return}const links=(state.personalLinks||[]).filter(l=>l.recipient===activePerson).slice().sort((a,b)=>(b.updatedAt||b.createdAt||'').localeCompare(a.updatedAt||a.createdAt||''));$('#personalLinks').innerHTML=links.length?`<div class="person-area"><section class="person-group"><div class="person-head">${esc(recipientLabel(activePerson))}</div><div>${links.map(l=>`<div class="person-link"><div class="main"><div class="title">${esc(l.title||l.url||'–')}</div>${l.title&&l.url?`<div class="person-url">${esc(l.url)}</div>`:''}${l.note?`<div class="person-note">${esc(l.note)}</div>`:''}</div>${openButton(l.url)}</div>`).join('')}</div></section></div>`:`<div class="empty">Aktuell nichts eingetragen.</div>`}
            document.querySelectorAll('[data-project-category]').forEach(btn=>btn.onclick=()=>{activeProjectCategory=btn.dataset.projectCategory;activeType='all';setPanel('lead');document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));btn.classList.add('active');renderProjects()});
            const leadBtn=document.querySelector('[data-panel="lead"]');if(leadBtn){const old=leadBtn.onclick;leadBtn.onclick=()=>{activeProjectCategory='all';if(old)old();renderProjects()}};
            const taskBtn=document.querySelector('[data-panel="tasks"]');if(taskBtn){const oldTask=taskBtn.onclick;taskBtn.onclick=()=>{activePerson='all';if(oldTask)oldTask();renderPersonalLinks()}};
            """
            text=text.replace("function render(){renderDashboard();renderAccess();renderProjects();renderPersonalLinks();renderArchive()}", mini_js+"\nfunction render(){renderDashboard();renderAccess();renderProjects();renderMiniDashboard();renderPersonalLinks();renderArchive()}",1)

          dst.write_text(text,encoding='utf-8')
          PY

      - name: Änderungen speichern
        shell: bash
        run: |
          rm -f .github/workflows/patch-head-control-2-dashboard.yml
          git config user.name "FSA Head Control"
          git config user.email "actions@github.com"
          git add pages/headteam-vorlauf/head-control-2.html pages/headteam-vorlauf/head-control-2/index.html pages/headteam-vorlauf/headteam-2/index.html .github/workflows/patch-head-control-2-dashboard.yml
          git commit -m "feat: Head Control 2 Bereiche und Headteam Mini-Dashboard testen"
          git push
