name: Research Engine – Browser V4 Patch

on:
  push:
    paths:
      - '.github/workflows/patch-research-engine-browser-v4.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Chromium Browser-Fallback in Engine einbauen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('research-engine/engine.py')
          s=p.read_text(encoding='utf-8')

          anchor='''def reader_links(text: str) -> list[str]:\n    links = []\n    for u in re.findall(r"https?://[^\\s)\\]>\\\"']+", text or "", re.I):\n        u = u.rstrip(".,;:")\n        if u not in links:\n            links.append(u)\n    return links[:120]\n\n\ndef fetch_page(url: str) -> Page | None:\n'''
          insert='''def reader_links(text: str) -> list[str]:\n    links = []\n    for u in re.findall(r"https?://[^\\s)\\]>\\\"']+", text or "", re.I):\n        u = u.rstrip(".,;:")\n        if u not in links:\n            links.append(u)\n    return links[:120]\n\n\n_BROWSER_USES = 0\n_BROWSER_MAX = 5\n\ndef browser_fetch_page(url: str) -> Page | None:\n    """Rendert eine öffentliche JS-Seite mit Chromium. Kein Login/CAPTCHA-Bypass."""\n    global _BROWSER_USES\n    if _BROWSER_USES >= _BROWSER_MAX:\n        return None\n    _BROWSER_USES += 1\n    try:\n        from playwright.sync_api import sync_playwright\n    except Exception:\n        return None\n    browser = None\n    try:\n        with sync_playwright() as p:\n            browser = p.chromium.launch(headless=True, args=["--disable-dev-shm-usage", "--no-sandbox"])\n            context = browser.new_context(user_agent=UA, locale="de-DE")\n            page = context.new_page()\n            response = page.goto(url, wait_until="domcontentloaded", timeout=22000)\n            if response is not None and response.status >= 400:\n                browser.close()\n                return None\n            try:\n                page.wait_for_load_state("networkidle", timeout=6000)\n            except Exception:\n                pass\n            page.wait_for_timeout(1800)\n            title = clean_text(page.title())\n            try:\n                text = clean_text(page.locator("body").inner_text(timeout=6000))\n            except Exception:\n                text = ""\n            try:\n                links = page.eval_on_selector_all("a[href]", "els => els.map(e => e.href).filter(Boolean)")\n            except Exception:\n                links = []\n            final_url = page.url or url\n            browser.close()\n            if len(text) < 350 or reader_error(text):\n                return None\n            return Page(url=final_url, status=200, title=title, text=text, links=list(dict.fromkeys(links))[:160], fetch_mode="browser")\n    except Exception:\n        try:\n            if browser:\n                browser.close()\n        except Exception:\n            pass\n        return None\n\n\ndef fetch_page(url: str) -> Page | None:\n'''
          if anchor not in s:
              raise SystemExit('reader_links anchor not found')
          s=s.replace(anchor,insert,1)

          old='''        except requests.RequestException:\n            continue\n    return None\n\n\ndef verifies_brand(page: Page, name: str, domain: str) -> bool:\n'''
          new='''        except requests.RequestException:\n            continue\n\n    # Letzte Stufe: echter Headless-Browser für JS-lastige öffentliche Seiten.\n    browser_page = browser_fetch_page(url)\n    if browser_page:\n        return browser_page\n    return None\n\n\ndef verifies_brand(page: Page, name: str, domain: str) -> bool:\n'''
          if old not in s:
              raise SystemExit('fetch_page return anchor not found')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile research-engine/engine.py
          grep -q "def browser_fetch_page" research-engine/engine.py
          grep -q 'fetch_mode="browser"' research-engine/engine.py
          git config user.name "Akademie Research Engine"
          git config user.email "actions@github.com"
          git add research-engine/engine.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Research Engine: Chromium-Browser als Fallback ergänzen"
          git pull --rebase
          git push
