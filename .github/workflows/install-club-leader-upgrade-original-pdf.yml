name: Temporary Headteam Product Categories Patch

on:
  push:
    paths:
      - 'scripts/add-headteam-product-categories.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add product categories
        run: python scripts/add-headteam-product-categories.py
      - name: Commit page changes and remove temporary script
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/add-headteam-product-categories.py
          git config user.name 'FSA Headteam'
          git config user.email 'actions@github.com'
          git add pages/headteam-vorlauf/head-control-2.html pages/headteam-vorlauf/headteam-2/index.html scripts/add-headteam-product-categories.py
          git commit -m 'Add product categories to Head Control and 14-day view'
          git push
