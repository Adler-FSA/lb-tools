name: Akademie Research Engine – Akademie Vergleich

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Projektname"
        required: false
        default: "KryptoSavings"
  push:
    branches:
      - main
    paths:
      - "research-engine/academy_analysis.py"
      - "research-engine/operator_registry_research.py"
      - "research-engine/external_research.py"
      - "research-engine/engine.py"
      - "research-engine/tests/**"
      - ".github/workflows/research-engine-academy-analysis-test.yml"
  pull_request:
    paths:
      - "research-engine/academy_analysis.py"
      - "research-engine/operator_registry_research.py"
      - "research-engine/external_research.py"
      - "research-engine/engine.py"
      - "research-engine/tests/**"
      - ".github/workflows/research-engine-academy-analysis-test.yml"

permissions:
  contents: write

jobs:
  academy-analysis-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        id: deps
        run: |
          python -m pip install --upgrade pip
          pip install -r research-engine/requirements.txt pytest

      - name: Regressionstests
        id: tests
        run: python -m pytest -q research-engine/tests

      - name: Website-Rohresearch
        id: website
        shell: bash
        env:
          INPUT_QUERY: ${{ github.event.inputs.query }}
        run: |
          QUERY="${INPUT_QUERY:-KryptoSavings}"
          python research-engine/engine.py "$QUERY" --output research-engine/output/kryptosavings-live.json

      - name: Externe Rohrecherche
        id: external
        run: |
          python research-engine/external_research.py \
            --input research-engine/output/kryptosavings-live.json \
            --output research-engine/output/kryptosavings-external.json

      - name: Betreiber Register Behörden
        id: operator
        run: |
          python research-engine/operator_registry_research.py \
            --input research-engine/output/kryptosavings-external.json \
            --output research-engine/output/kryptosavings-operators.json

      - name: Akademie Vergleichsmotor
        id: academy
        run: |
          python research-engine/academy_analysis.py \
            --input research-engine/output/kryptosavings-operators.json \
            --output research-engine/output/kryptosavings-academy.json

      - name: Akademie-Ergebnis prüfen
        id: checks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data=json.loads(Path('research-engine/output/kryptosavings-academy.json').read_text(encoding='utf-8'))
          aa=data.get('academy_analysis') or {}
          comparisons=aa.get('comparisons') or []
          tensions=aa.get('tensions') or []
          summary=aa.get('summary') or {}

          assert data.get('status') == 'ok'
          assert aa.get('status') == 'ok'
          assert comparisons, 'Keine Akademie-Vergleiche erzeugt'
          assert aa.get('open_questions'), 'Keine offenen Fragen erzeugt'
          assert aa.get('guardrails') == {
              'risk_score_created': False,
              'fraud_verdict_created': False,
              'seriousness_verdict_created': False,
          }

          allowed={
              'independently_supported','partially_supported','not_independently_verified',
              'context_challenged','contradicted','open'
          }
          assert all(c.get('assessment') in allowed for c in comparisons)

          yield_cmp=next(c for c in comparisons if c.get('topic') == 'yield')
          assert yield_cmp.get('project_value') == '23%'
          assert yield_cmp.get('project_source_url','').startswith('https://www.kryptosavings.com/')

          commission_cmp=next(c for c in comparisons if c.get('topic') == 'affiliate_commission')
          assert commission_cmp.get('project_value') == '30%'

          operators=[c for c in comparisons if c.get('topic') == 'operator_relation']
          names={c.get('project_value') for c in operators}
          assert {'Delta West Credit Bank Ltd','Open Delta DAO LLC','GBH Coriolis Bancorp'} <= names

          delta=next(c for c in operators if c.get('project_value') == 'Delta West Credit Bank Ltd')
          gbh=next(c for c in operators if c.get('project_value') == 'GBH Coriolis Bancorp')
          opendelta=next(c for c in operators if c.get('project_value') == 'Open Delta DAO LLC')

          assert delta.get('assessment') == 'context_challenged'
          assert gbh.get('assessment') == 'context_challenged'
          assert opendelta.get('assessment') in {'partially_supported','not_independently_verified'}
          assert any(x.get('source_role') == 'regulator' for x in delta.get('external_challenges') or [])
          assert any(x.get('source_role') == 'regulator' for x in gbh.get('external_challenges') or [])
          assert tensions, 'Behörden-/Quellenkonflikt wurde nicht als Spannung ausgegeben'

          assert summary.get('comparison_count') == len(comparisons)
          assert summary.get('open_question_count') == len(aa.get('open_questions') or [])

          print(
              f"Akademie-Vergleich OK: {len(comparisons)} Kernaussagen | "
              f"{len(tensions)} Spannungen | {len(aa.get('open_questions') or [])} offene Fragen"
          )
          for c in comparisons:
              print(f"COMPARE: [{c['assessment']}] {c['project_statement']}")
          PY

      - name: Diagnose schreiben
        if: always()
        env:
          DEPS: ${{ steps.deps.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          WEBSITE: ${{ steps.website.outcome }}
          EXTERNAL: ${{ steps.external.outcome }}
          OPERATOR: ${{ steps.operator.outcome }}
          ACADEMY: ${{ steps.academy.outcome }}
          CHECKS: ${{ steps.checks.outcome }}
        run: |
          mkdir -p research-engine/output
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          status={
            'generated_at':datetime.now(timezone.utc).isoformat(),
            'dependencies':os.environ.get('DEPS'),
            'tests':os.environ.get('TESTS'),
            'website_research':os.environ.get('WEBSITE'),
            'external_research':os.environ.get('EXTERNAL'),
            'operator_registry_research':os.environ.get('OPERATOR'),
            'academy_analysis':os.environ.get('ACADEMY'),
            'academy_checks':os.environ.get('CHECKS'),
          }
          Path('research-engine/output/academy-status.json').write_text(
              json.dumps(status,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          print(status)
          PY

      - name: Ergebnisse auf main sichern
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "Akademie Research Engine"
          git config user.email "actions@github.com"
          git add research-engine/output/academy-status.json
          if [ -f research-engine/output/kryptosavings-academy.json ]; then
            git add research-engine/output/kryptosavings-academy.json
          fi
          if git diff --cached --quiet; then
            echo "Keine Änderung am Akademie-Testergebnis."
            exit 0
          fi
          git commit -m "Research Engine: Akademie-Testdiagnose aktualisieren"
          git pull --rebase
          git push
