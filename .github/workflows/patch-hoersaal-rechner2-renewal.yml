name: Patch Hoersaal Rechner 2 Renewal
on:
  push:
    paths:
      - '.github/workflows/patch-hoersaal-rechner2-renewal.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch page 7 renewal model
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('hoersaal-liquiditybooster/07-werkstatt.html')
          s=p.read_text()
          reps={
          'Der Rechner arbeitet nur mit deiner eigenen Vertriebsleistung. Jeder neu eingegebene Vertrag wird für die Vorschau exakt 12 Monate mit seiner monatlichen Gebühr gerechnet. Eine Verlängerung nach dem 12. Monat wird nicht automatisch unterstellt.':'Der Rechner arbeitet nur mit deiner eigenen Vertriebsleistung. Für die 5-Jahres-Vorschau wird als feste Modellannahme unterstellt, dass bestehende BusinessBooster-Kunden ihre 12-Monats-Verträge jährlich fortführen. Die monatliche Gebühr läuft dadurch weiter; die Setup-Gebühr fällt je Kunde nur einmal beim Start an.',
          'The calculator uses only your own sales activity. Each new contract is counted for exactly 12 months of monthly fees. Renewal after month 12 is not assumed automatically.':'The calculator uses only your own sales activity. For the five-year forecast, the model assumes that existing BusinessBooster customers renew their 12-month contracts each year. The monthly fee therefore continues, while the setup fee is charged only once per customer at the start.',
          'Bei gleichbleibend vielen neuen Eigenabschlüssen pro Monat und ohne unterstellte Verlängerungen ersetzt ab Monat 13 jeder neue Vertrag rechnerisch einen Vertrag, dessen 12 Monate enden. Dadurch stabilisiert sich die laufende Monatsprovision auf dem Niveau von Monat 12.':'Ab Monat 13 endet der Bestandsaufbau nicht. Für diese Simulation wird die jährliche Fortführung bestehender BusinessBooster-Verträge fest angenommen. Neue eigene Kunden kommen weiter hinzu, während die laufenden Monatsgebühren der Bestandskunden fortgeführt werden. Dadurch wächst die laufende Eigenumsatz-Provision über die gesamten 60 Monate weiter.',
          'Die Jahreswerte zeigen ausschließlich die laufende 20-%-Provision aus deinen eigenen BusinessBooster-Abschlüssen. Setup bleibt separat; Vertragsverlängerungen nach 12 Monaten werden nicht eingerechnet.':'Die Jahreswerte zeigen ausschließlich die laufende 20-%-Provision aus deinen eigenen BusinessBooster-Abschlüssen. Setup bleibt separat. Für den 5-Jahres-Zeitraum wird die jährliche Fortführung der bestehenden 12-Monats-Verträge als feste Modellannahme gerechnet.',
          "const months=Array.from({length:60},(_,i)=>base*Math.min(i+1,12));":"const months=Array.from({length:60},(_,i)=>base*(i+1));",
          "eur(baseByProduct[p]*654)":"eur(baseByProduct[p]*1830)",
          'Über fünf Jahre ergeben sich ${eur(cum)} laufende Eigenumsatz-Provision – ohne Setup, ohne Teamprovision und ohne unterstellte Verlängerung.':'Über fünf Jahre ergeben sich ${eur(cum)} laufende Eigenumsatz-Provision – ohne Setup und ohne Teamprovision. Die jährliche Fortführung bestehender 12-Monats-Verträge ist in dieser Modellrechnung fest angenommen.',
          'Lernsimulation, keine Einkommenszusage. Tatsächliche Eigenumsatz-Provision entsteht nur auf bezahlten provisionsfähigen Netto-Umsätzen. Teamleader-Provisionen und Beteiligungen aus weiteren Linien sind nicht Bestandteil dieses Rechners.':'Lernsimulation, keine Einkommenszusage. Die jährliche Fortführung bestehender BusinessBooster-Verträge ist eine feste Modellannahme dieser Vorschau. Tatsächliche Eigenumsatz-Provision entsteht nur auf bezahlten provisionsfähigen Netto-Umsätzen. Teamleader-Provisionen und Beteiligungen aus weiteren Linien sind nicht Bestandteil dieses Rechners.'
          }
          for old,new in reps.items():
              if old not in s:
                  raise SystemExit('missing marker: '+old[:80])
              s=s.replace(old,new)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hoersaal-liquiditybooster/07-werkstatt.html
          git rm .github/workflows/patch-hoersaal-rechner2-renewal.yml
          git commit -m "Use annual renewal assumption in BusinessBooster forecast"
          git push
