name: Projekt Frühwarn – Klaus-Test Fixes

on:
  push:
    paths:
      - '.github/workflows/patch-projekt-fruehwarn-klaus-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Neue Klaus-Seite korrigieren
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('pages/projekt-fruehwarn/index.html')
          s=p.read_text(encoding='utf-8')

          old="""function pct(text){const out=[];const re=/(?:bis\\s+zu|up\\s+to|earn\\s+up\\s+to)?[^\\n\\r%]{0,35}(\\d{1,3}(?:[.,]\\d+)?)\\s*%\\s*(APY|APR|p\\.?a\\.?|annual|jährlich|yield|interest)?/gi;let m;while((m=re.exec(text))&&out.length<15){const n=parseFloat(m[1].replace(',','.'));if(n>0&&n<=500)out.push(n)}return out.sort((a,b)=>b-a)}"""
          new="""function pct(text){const out=[];const re=/(\\d{1,3}(?:[.,]\\d+)?)\\s*%\\s*(APY|APR|p\\.?a\\.?|annual|jährlich|yield|interest)?/gi;let m;while((m=re.exec(text))&&out.length<30){const n=parseFloat(m[1].replace(',','.'));if(n>0&&n<=500)out.push(n)}return out.sort((a,b)=>b-a)}"""
          if old not in s:
              raise SystemExit('pct block not found')
          s=s.replace(old,new)

          old_return="""return {products,promises,dist,risks,questions:[...new Set(questions)].slice(0,8),sources,max}}"""
          new_return="""const productItems=products.map(x=>typeof x==='string'?{kind:'info',title:x,text:'Auf der gelesenen öffentlichen Website als Bestandteil des Angebots erkannt.'}:x);return {products:productItems,promises,dist,risks,questions:[...new Set(questions)].slice(0,8),sources,max}}"""
          if old_return not in s:
              raise SystemExit('return block not found')
          s=s.replace(old_return,new_return)

          old_ctx="""if(ctx.url)sources.unshift({title:'Von dir eingegebener Link',url:ctx.url});else if(ctx.domain)sources.unshift({title:'Gefundene Projektwebsite',url:'https://'+ctx.domain});"""
          new_ctx="""if(ctx.url){sources.unshift({title:'Von dir eingegebener Link',url:ctx.url});if(/\\/ref\\/|[?&](?:ref|affiliate|partner)=/i.test(ctx.url)){add(dist,'risk','Persönlicher Empfehlungslink erkannt','Der von dir eingegebene Link enthält eine Referral-/Partnerkennung. Das zeigt, dass dein Zugang einer Empfehlung bzw. einem Werber zugeordnet werden kann. Ob und wie der Werber dafür vergütet wird, muss transparent geklärt werden.');questions.push('Welche Provision, Bonus- oder sonstige Vergütung erhält der Werber über genau diesen Empfehlungslink?')}}else if(ctx.domain)sources.unshift({title:'Gefundene Projektwebsite',url:'https://'+ctx.domain});"""
          if old_ctx not in s:
              raise SystemExit('ctx block not found')
          s=s.replace(old_ctx,new_ctx)

          p.write_text(s,encoding='utf-8')
          PY
          grep -q "Persönlicher Empfehlungslink erkannt" pages/projekt-fruehwarn/index.html
          grep -q "const productItems=products.map" pages/projekt-fruehwarn/index.html
          git config user.name "FSA Frühwarn-Check"
          git config user.email "actions@github.com"
          git add pages/projekt-fruehwarn/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Projekt Frühwarn: Klaus-Test Auswertung korrigieren"
          git pull --rebase
          git push

