name: Activate Notfallakte V08
on:
  push:
    paths:
      - '.github/workflows/activate-notfallakte-v08.yml'
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Activate V08 module only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pages/notfallakte/index.html')
          s=p.read_text()
          marker='<script src="./v08-backup.js"></script>'
          if marker not in s:
              old='</script></body></html>'
              if old not in s:
                  raise SystemExit('Expected closing marker not found; refusing wider edit.')
              s=s.replace(old,'</script>'+marker+'</body></html>',1)
              p.write_text(s)
          PY
          git diff --check
      - name: Commit activation and remove one-time workflow
        run: |
          git config user.name 'actions-user'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/activate-notfallakte-v08.yml
          git add pages/notfallakte/index.html
          git commit -m 'Activate Notfallakte Version 08 backup module'
          git pull --rebase origin main
          git push origin main
