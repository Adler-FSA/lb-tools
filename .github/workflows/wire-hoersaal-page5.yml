name: Wire Hoersaal Page5
on:
  push:
    paths:
      - '.github/workflows/wire-hoersaal-page5.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire page 5 into existing Hoersaal pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          base=Path('hoersaal-liquiditybooster')
          files=[base/'01-willkommen.html',base/'02-big-picture.html',base/'03-gast-club.html',base/'04-rollen.html']
          for p in files:
              s=p.read_text()
              original=s
              s=s.replace('<span aria-disabled="true">05 Mein Nutzen</span>','<a href="05-mein-nutzen.html">05 Mein Nutzen</a>')
              s=re.sub(r'<span(?=[^>]*aria-disabled="true")[^>]*>05 Mein Nutzen</span>', '<a href="05-mein-nutzen.html">05 Mein Nutzen</a>', s)
              if p.name=='04-rollen.html':
                  old='<span class="disabled" data-i18n data-de="05 Mein Nutzen · folgt" data-en="05 My benefit · coming next">05 Mein Nutzen · folgt</span>'
                  new='<a href="05-mein-nutzen.html" data-i18n data-de="05 Mein Nutzen →" data-en="05 My benefit →">05 Mein Nutzen →</a>'
                  s=s.replace(old,new)
                  s=s.replace('<span class="disabled">05 Mein Nutzen · folgt</span>','<a href="05-mein-nutzen.html">05 Mein Nutzen →</a>')
              if s==original:
                  print('No change needed:',p)
              else:
                  p.write_text(s)
                  print('Updated:',p)
          # Validation
          for p in files:
              s=p.read_text()
              assert 'href="05-mein-nutzen.html"' in s, f'Missing Page5 nav link in {p}'
              assert 'href="06-' not in s, f'Page6 must stay disabled in {p}'
          s=(base/'04-rollen.html').read_text()
          assert '05 Mein Nutzen →' in s, 'Page4 forward pager not wired'
          print('Validation OK')
          PY
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hoersaal-liquiditybooster/01-willkommen.html hoersaal-liquiditybooster/02-big-picture.html hoersaal-liquiditybooster/03-gast-club.html hoersaal-liquiditybooster/04-rollen.html
          if git diff --cached --quiet; then
            echo "No wiring changes needed"
          else
            git commit -m "Hörsaal: Seite 5 Navigation und Weiter-Button verdrahten"
            git push
          fi
      - name: Cleanup one-time workflow
        run: |
          git pull --rebase
          git rm .github/workflows/wire-hoersaal-page5.yml
          git commit -m "Cleanup: einmaligen Seite-5-Verdrahtungsworkflow entfernen"
          git push