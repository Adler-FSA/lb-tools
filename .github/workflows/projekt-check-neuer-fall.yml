name: Projekt-Check – Analyse starten

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: "CASE_ID aus dem geschützten Auftragsposteingang"
        required: true
        type: string
      poststelle_base:
        description: "HTTPS-Basisadresse der Projekt-Check-Poststelle"
        required: true
        type: string
      start_ticket:
        description: "Kurzlebiges Einmal-Ticket der Poststelle"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: projekt-check-start-${{ inputs.case_id }}
  cancel-in-progress: false

jobs:
  start-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Geschützten Auftrag einmalig aus der Poststelle holen
        env:
          CASE_ID: ${{ inputs.case_id }}
          POSTSTELLE_BASE: ${{ inputs.poststelle_base }}
          START_TICKET: ${{ inputs.start_ticket }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re
          from urllib.parse import quote, urlparse
          from urllib.request import Request, urlopen

          case_id = os.environ.get('CASE_ID', '').strip().upper()
          base = os.environ.get('POSTSTELLE_BASE', '').strip().rstrip('/')
          ticket = os.environ.get('START_TICKET', '').strip().upper()

          if not re.fullmatch(r'PCA-[0-9]{8}-[A-Z0-9]{8}', case_id):
              raise SystemExit('Ungültige CASE_ID')
          parsed_base = urlparse(base)
          if parsed_base.scheme != 'https' or not parsed_base.netloc:
              raise SystemExit('Ungültige Poststellen-Adresse')
          if not re.fullmatch(r'[A-F0-9]{48}', ticket):
              raise SystemExit('Ungültiges Start-Ticket')

          url = f"{base}/start/{case_id}?ticket={quote(ticket)}"
          req = Request(url, headers={'user-agent': 'FSA-Projekt-Check-Action/1.0'})
          with urlopen(req, timeout=30) as response:
              payload = json.loads(response.read().decode('utf-8'))

          if payload.get('case_id') != case_id or not isinstance(payload.get('intake'), dict):
              raise SystemExit('Poststelle lieferte keinen passenden Intake')
          intake = payload['intake']
          if str(intake.get('contract_version') or '') != '1.0':
              raise SystemExit('Falsche contract_version')

          traces = intake.get('traces')
          if not isinstance(traces, list) or not 1 <= len(traces) <= 20:
              raise SystemExit('Es werden 1 bis 20 öffentliche Spuren benötigt')
          clean = []
          for raw in traces:
              value = str(raw or '').strip()
              parsed = urlparse(value)
              if parsed.scheme not in ('http', 'https') or not parsed.netloc:
                  raise SystemExit('Nur konkrete HTTP/HTTPS-Spuren sind zulässig')
              if value not in clean:
                  clean.append(value)

          claim = str(intake.get('claim') or '').strip()
          if len(claim) > 3000:
              raise SystemExit('Aussage ist zu lang')

          requested_output = str(intake.get('requested_output') or 'customer_check')
          if requested_output not in ('customer_check', 'company_check'):
              raise SystemExit('Ungültiger Auftragstyp')

          normalized = {
              'contract_version': '1.0',
              'submitted_at': str(intake.get('submitted_at') or ''),
              'language': 'en' if intake.get('language') == 'en' else 'de',
              'traces': clean,
              'claim': claim,
              'requested_output': requested_output,
              'source': 'projekt-check-poststelle'
          }

          pathlib.Path('/tmp/case_id.txt').write_text(case_id, encoding='utf-8')
          pathlib.Path('/tmp/intake.json').write_text(json.dumps(normalized, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Analysefall mit 37 Prüfbereichen initialisieren
        run: |
          CASE_ID="$(cat /tmp/case_id.txt)"
          python projekt-check-engine/core/new_case.py \
            --intake /tmp/intake.json \
            --case-id "$CASE_ID" \
            --initial-state angenommen \
            --persist-intake sanitized

      - name: Analysefall im Control-Panel-Datenbestand speichern
        run: |
          CASE_ID="$(cat /tmp/case_id.txt)"
          git config user.name "FSA Projekt-Check"
          git config user.email "actions@github.com"
          git add "data/projekt-check/cases/$CASE_ID"
          git commit -m "Projekt-Check: Analyse $CASE_ID starten"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Start bestätigt
        run: |
          CASE_ID="$(cat /tmp/case_id.txt)"
          echo "Projekt-Check-Analyse $CASE_ID wurde intern gestartet. Der vollständige Intake bleibt außerhalb des öffentlichen Repositorys."
