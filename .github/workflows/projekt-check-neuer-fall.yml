name: Projekt-Check – Analyse starten

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: "Automatisch erzeugte CASE_ID aus dem Control Panel"
        required: true
        type: string
      traces_json:
        description: "JSON-Liste der öffentlichen Analyse-Spuren"
        required: true
        type: string
      claim:
        description: "Optionale Aussage zum Angebot"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: projekt-check-start-${{ inputs.case_id }}
  cancel-in-progress: false

jobs:
  start-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Analyse-Eingaben prüfen
        env:
          CASE_ID: ${{ inputs.case_id }}
          TRACES_JSON: ${{ inputs.traces_json }}
          CLAIM: ${{ inputs.claim }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re
          from datetime import datetime, timezone
          from urllib.parse import urlparse

          case_id = os.environ.get('CASE_ID', '').strip().upper()
          if not re.fullmatch(r'PCA-[0-9]{8}-[A-Z0-9]{8}', case_id):
              raise SystemExit('Ungültige CASE_ID')

          try:
              traces = json.loads(os.environ.get('TRACES_JSON', '[]'))
          except json.JSONDecodeError:
              raise SystemExit('traces_json ist kein gültiges JSON')

          if not isinstance(traces, list) or not 1 <= len(traces) <= 20:
              raise SystemExit('Es werden 1 bis 20 öffentliche Spuren benötigt')

          clean = []
          for raw in traces:
              value = str(raw or '').strip()
              parsed = urlparse(value)
              if parsed.scheme not in ('http', 'https') or not parsed.netloc:
                  raise SystemExit('Nur konkrete HTTP/HTTPS-Spuren sind zulässig')
              if value not in clean:
                  clean.append(value)

          claim = str(os.environ.get('CLAIM') or '').strip()
          if len(claim) > 3000:
              raise SystemExit('Aussage ist zu lang')

          normalized = {
              'contract_version': '1.0',
              'submitted_at': datetime.now(timezone.utc).isoformat(),
              'language': 'de',
              'traces': clean,
              'claim': claim,
              'requested_output': 'customer_check',
              'source': 'projekt-check-control-panel'
          }

          pathlib.Path('/tmp/case_id.txt').write_text(case_id, encoding='utf-8')
          pathlib.Path('/tmp/intake.json').write_text(
              json.dumps(normalized, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )
          PY

      - name: Analysefall mit 37 Prüfbereichen initialisieren
        run: |
          CASE_ID="$(cat /tmp/case_id.txt)"
          python projekt-check-engine/core/new_case.py \
            --intake /tmp/intake.json \
            --case-id "$CASE_ID" \
            --initial-state angenommen \
            --persist-intake sanitized

      - name: Analysefall im Control-Panel-Datenbestand speichern
        run: |
          CASE_ID="$(cat /tmp/case_id.txt)"
          git config user.name "FSA Projekt-Check"
          git config user.email "actions@github.com"
          git add "data/projekt-check/cases/$CASE_ID"
          git commit -m "Projekt-Check: Analyse $CASE_ID starten"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Start bestätigt
        run: |
          CASE_ID="$(cat /tmp/case_id.txt)"
          echo "Projekt-Check-Analyse $CASE_ID wurde intern gestartet."
