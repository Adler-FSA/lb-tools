name: Projekt-Check – Analyse starten

on:
  push:
    branches:
      - main
    paths:
      - 'data/projekt-check/start-requests/*.json'

permissions:
  contents: write

concurrency:
  group: projekt-check-start-${{ github.sha }}
  cancel-in-progress: false

jobs:
  start-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Auslösenden Commit laden
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Projekt-Check-Auftrag aus dem Commit lesen
        shell: bash
        run: |
          REQUEST_PATH="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^data/projekt-check/start-requests/[^/]+\.json$' | tail -n 1)"
          if [ -z "$REQUEST_PATH" ] || [ ! -f "$REQUEST_PATH" ]; then
            echo "Keine Projekt-Check-Startdatei im auslösenden Commit gefunden."
            exit 1
          fi
          export PROJECT_CHECK_REQUEST_PATH="$REQUEST_PATH"
          echo "PROJECT_CHECK_REQUEST_PATH=$REQUEST_PATH" >> "$GITHUB_ENV"

          python - <<'PY'
          import json, os, pathlib, re
          from datetime import datetime, timezone
          from urllib.parse import urlparse

          request_path = pathlib.Path(os.environ['PROJECT_CHECK_REQUEST_PATH'])
          request = json.loads(request_path.read_text(encoding='utf-8'))
          case_id = str(request.get('case_id') or request_path.stem).strip().upper()
          if not re.fullmatch(r'PCA-[0-9]{8}-[A-Z0-9]{8}', case_id):
              raise SystemExit('Ungültige CASE_ID')
          traces = request.get('traces')
          if not isinstance(traces, list) or not 1 <= len(traces) <= 20:
              raise SystemExit('Es werden 1 bis 20 öffentliche Spuren benötigt')
          clean = []
          for raw in traces:
              value = str(raw or '').strip()
              parsed = urlparse(value)
              if parsed.scheme not in ('http', 'https') or not parsed.netloc:
                  raise SystemExit('Nur konkrete HTTP/HTTPS-Spuren sind zulässig')
              if value not in clean:
                  clean.append(value)
          claim = str(request.get('claim') or '').strip()
          if len(claim) > 3000:
              raise SystemExit('Aussage ist zu lang')
          requested_output = str(request.get('requested_output') or 'customer_check')
          if requested_output not in ('customer_check', 'company_check'):
              raise SystemExit('Ungültiger Auftragstyp')
          submitted_at = str(request.get('submitted_at') or '').strip() or datetime.now(timezone.utc).isoformat()
          normalized = {
              'contract_version': '1.0',
              'submitted_at': submitted_at,
              'language': 'en' if request.get('language') == 'en' else 'de',
              'traces': clean,
              'claim': claim,
              'requested_output': requested_output,
              'source': 'projekt-check-control-panel-contents-queue'
          }
          pathlib.Path('/tmp/case_id.txt').write_text(case_id, encoding='utf-8')
          pathlib.Path('/tmp/intake.json').write_text(json.dumps(normalized, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Analysefall mit 37 Prüfbereichen initialisieren
        run: |
          CASE_ID="$(cat /tmp/case_id.txt)"
          python projekt-check-engine/core/new_case.py \
            --intake /tmp/intake.json \
            --case-id "$CASE_ID" \
            --initial-state angenommen \
            --persist-intake sanitized

      - name: Analysefall sofort für das Control Panel veröffentlichen
        shell: bash
        run: |
          CASE_ID="$(cat /tmp/case_id.txt)"
          git config user.name "FSA Projekt-Check"
          git config user.email "actions@github.com"
          git add "data/projekt-check/cases/$CASE_ID"
          git commit -m "Projekt-Check: Analyse $CASE_ID angenommen"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Chromium für die neue Discovery-Engine bereitstellen
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Eingereichte Spuren öffnen, Identität ableiten und Primärbelege sichern
        id: discovery
        continue-on-error: true
        shell: bash
        run: |
          CASE_ID="$(cat /tmp/case_id.txt)"
          python projekt-check-engine/core/run_discovery.py \
            --intake /tmp/intake.json \
            --case-id "$CASE_ID"

      - name: Discovery-Zwischenstand speichern und Startdatei entfernen
        shell: bash
        run: |
          CASE_ID="$(cat /tmp/case_id.txt)"
          git add "data/projekt-check/cases/$CASE_ID"
          git rm "$PROJECT_CHECK_REQUEST_PATH"
          git commit -m "Projekt-Check: Discovery $CASE_ID gespeichert"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: 37 Prüfbereiche aus Primärbelegen neutral vor-auswerten
        id: evaluation
        if: steps.discovery.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          CASE_ID="$(cat /tmp/case_id.txt)"
          python projekt-check-engine/core/run_evaluation.py --case-id "$CASE_ID"

      - name: 37-Punkte-Auswertungsstand veröffentlichen
        if: steps.discovery.outcome == 'success' && steps.evaluation.outcome == 'success'
        shell: bash
        run: |
          CASE_ID="$(cat /tmp/case_id.txt)"
          git add "data/projekt-check/cases/$CASE_ID"
          git commit -m "Projekt-Check: Primärquellen-Auswertung $CASE_ID gespeichert"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Unabhängige Web-Recherche nach weiteren öffentlichen Spuren
        id: independent_web
        if: steps.discovery.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          CASE_ID="$(cat /tmp/case_id.txt)"
          python projekt-check-engine/core/run_independent_research.py --case-id "$CASE_ID" --max-captures 8

      - name: Unabhängigen Recherche-Zwischenstand veröffentlichen
        if: steps.independent_web.outcome == 'success'
        shell: bash
        run: |
          CASE_ID="$(cat /tmp/case_id.txt)"
          git add "data/projekt-check/cases/$CASE_ID"
          git commit -m "Projekt-Check: unabhängige Web-Recherche $CASE_ID gespeichert"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Rechtsträger, Personen, Register und Aufsichtsquellen amtlich verifizieren
        id: official_verification
        if: steps.discovery.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          CASE_ID="$(cat /tmp/case_id.txt)"
          python projekt-check-engine/core/run_official_verification.py --case-id "$CASE_ID" --max-captures 10

      - name: Amtlichen Verifikationsstand veröffentlichen
        if: steps.official_verification.outcome == 'success'
        shell: bash
        run: |
          CASE_ID="$(cat /tmp/case_id.txt)"
          git add "data/projekt-check/cases/$CASE_ID"
          git commit -m "Projekt-Check: amtliche Verifikation $CASE_ID gespeichert"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Bei starkem VAE-Hinweis direktes Dubai-Firmenlizenzregister prüfen
        id: direct_registry
        if: steps.official_verification.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          CASE_ID="$(cat /tmp/case_id.txt)"
          python projekt-check-engine/core/run_direct_registry_verification.py --case-id "$CASE_ID"

      - name: Direkten Registerstand veröffentlichen
        if: steps.direct_registry.outcome == 'success'
        shell: bash
        run: |
          CASE_ID="$(cat /tmp/case_id.txt)"
          git add "data/projekt-check/cases/$CASE_ID"
          git commit -m "Projekt-Check: direkter Registercheck $CASE_ID gespeichert"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Geldfluss, Rendite, Einnahmequelle, Tragfähigkeit und Stresstest auswerten
        id: economic_analysis
        if: steps.discovery.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          CASE_ID="$(cat /tmp/case_id.txt)"
          python projekt-check-engine/core/run_economic_analysis.py --case-id "$CASE_ID"

      - name: Wirtschaftlichen Auswertungsstand veröffentlichen
        if: steps.economic_analysis.outcome == 'success'
        shell: bash
        run: |
          CASE_ID="$(cat /tmp/case_id.txt)"
          git add "data/projekt-check/cases/$CASE_ID"
          git commit -m "Projekt-Check: wirtschaftliche Tiefenprüfung $CASE_ID gespeichert"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Start, Discovery und Auswertung bestätigt
        shell: bash
        run: |
          CASE_ID="$(cat /tmp/case_id.txt)"
          echo "Discovery: ${{ steps.discovery.outcome }}"
          echo "Primärquellen-Auswertung: ${{ steps.evaluation.outcome }}"
          echo "Unabhängige Web-Recherche: ${{ steps.independent_web.outcome }}"
          echo "Amtliche Verifikation: ${{ steps.official_verification.outcome }}"
          echo "Direkter Firmenregister-Check: ${{ steps.direct_registry.outcome }}"
          echo "Wirtschafts-/Rendite-Tiefenprüfung: ${{ steps.economic_analysis.outcome }}"
          echo "Projekt-Check $CASE_ID bleibt im Control Panel nachvollziehbar; noch offene technische, rechtliche und weitere fachliche Tiefenprüfungen werden nicht als abgeschlossen ausgegeben."
