name: Projekt-Check – Analyse starten

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: "Vorab erzeugte CASE_ID aus dem Auftragsposteingang"
        required: true
        type: string
      intake_json:
        description: "Geschützter Intake-Datensatz gemäß Vertrag 1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: projekt-check-start-${{ inputs.case_id }}
  cancel-in-progress: false

jobs:
  start-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Auftrag prüfen und vorbereiten
        env:
          CASE_ID: ${{ inputs.case_id }}
          INTAKE_JSON: ${{ inputs.intake_json }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re
          from urllib.parse import urlparse

          case_id = os.environ.get('CASE_ID', '').strip().upper()
          intake = json.loads(os.environ.get('INTAKE_JSON', '{}'))

          if not re.fullmatch(r'PCA-[0-9]{8}-[A-Z0-9]{8}', case_id):
              raise SystemExit('Ungültige CASE_ID')
          if not isinstance(intake, dict):
              raise SystemExit('Intake muss ein JSON-Objekt sein')
          if str(intake.get('contract_version') or '') != '1.0':
              raise SystemExit('Falsche contract_version')

          traces = intake.get('traces')
          if not isinstance(traces, list) or not 1 <= len(traces) <= 20:
              raise SystemExit('Es werden 1 bis 20 öffentliche Spuren benötigt')
          clean = []
          for raw in traces:
              value = str(raw or '').strip()
              parsed = urlparse(value)
              if parsed.scheme not in ('http', 'https') or not parsed.netloc:
                  raise SystemExit('Nur konkrete HTTP/HTTPS-Spuren sind zulässig')
              if value not in clean:
                  clean.append(value)

          claim = str(intake.get('claim') or '').strip()
          if len(claim) > 3000:
              raise SystemExit('Aussage ist zu lang')

          requested_output = str(intake.get('requested_output') or 'customer_check')
          if requested_output not in ('customer_check', 'company_check'):
              raise SystemExit('Ungültiger Auftragstyp')

          normalized = {
              'contract_version': '1.0',
              'submitted_at': str(intake.get('submitted_at') or ''),
              'language': 'en' if intake.get('language') == 'en' else 'de',
              'traces': clean,
              'claim': claim,
              'requested_output': requested_output,
              'source': 'projekt-check-control-panel'
          }

          pathlib.Path('/tmp/case_id.txt').write_text(case_id, encoding='utf-8')
          pathlib.Path('/tmp/intake.json').write_text(json.dumps(normalized, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Analysefall mit 37 Prüfbereichen initialisieren
        run: |
          CASE_ID="$(cat /tmp/case_id.txt)"
          python projekt-check-engine/core/new_case.py \
            --intake /tmp/intake.json \
            --case-id "$CASE_ID" \
            --initial-state angenommen

      - name: Analysefall im Control-Panel-Datenbestand speichern
        run: |
          CASE_ID="$(cat /tmp/case_id.txt)"
          git config user.name "FSA Projekt-Check"
          git config user.email "actions@github.com"
          git add "data/projekt-check/cases/$CASE_ID"
          git commit -m "Projekt-Check: Analyse $CASE_ID starten"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Start bestätigt
        run: |
          CASE_ID="$(cat /tmp/case_id.txt)"
          echo "Projekt-Check-Analyse $CASE_ID wurde intern gestartet und mit 37 Prüfbereichen initialisiert."
