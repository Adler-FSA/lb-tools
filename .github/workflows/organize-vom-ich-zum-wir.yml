name: Organize Vom Ich zum Wir

on:
  push:
    paths:
      - ".github/workflows/organize-vom-ich-zum-wir.yml"

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build song folder
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p pages/vom-ich-zum-wir/cover
          mkdir -p pages/vom-ich-zum-wir/audio

          if [ -f pages/index.html ]; then
            mv pages/index.html pages/vom-ich-zum-wir/index.html
          fi

          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/Adler-FSA/lp-anfang/main/library/images/vom-ich-zum-wir-cover.png" \
            -o pages/vom-ich-zum-wir/cover/vom-ich-zum-wir-cover.png

          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/Adler-FSA/lp-anfang/main/library/music/Vom%20Ich%20zum%20Wir%202.mp3" \
            -o pages/vom-ich-zum-wir/audio/vom-ich-zum-wir.mp3

          python3 - <<'PY'
          from pathlib import Path

          p = Path("pages/vom-ich-zum-wir/index.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              "https://tools.liquiditybooster.de/pages/vom-ich-zum-wir/vom-ich-zum-wir-cover.png",
              "https://tools.liquiditybooster.de/pages/vom-ich-zum-wir/cover/vom-ich-zum-wir-cover.png"
          )
          s = s.replace(
              'src="vom-ich-zum-wir-cover.png"',
              'src="cover/vom-ich-zum-wir-cover.png"'
          )
          s = s.replace(
              'src="vom-ich-zum-wir.mp3"',
              'src="audio/vom-ich-zum-wir.mp3"'
          )
          s = s.replace(
              'Die Audiodatei ist in diesem ZIP noch nicht enthalten. Lege die fertige MP3 mit dem Namen <strong>vom-ich-zum-wir.mp3</strong> in diesen Ordner.',
              'Die Audiodatei konnte nicht geladen werden.'
          )
          p.write_text(s, encoding="utf-8")
          PY

      - name: Commit organized files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Organize Vom Ich zum Wir page and assets"
          git push
