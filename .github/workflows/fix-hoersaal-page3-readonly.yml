name: Fix Hoersaal Page 3 readonly
on:
  push:
    paths:
      - '.github/workflows/fix-hoersaal-page3-readonly.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore approved page 3 and remove form/PDF functionality
        shell: bash
        run: |
          git show 4f5d4be8e5266887837689bda6c0efeb0a99a414:hoersaal-liquiditybooster/03-gast-club.html > hoersaal-liquiditybooster/03-gast-club.html
          python - <<'PY'
          from pathlib import Path
          p=Path('hoersaal-liquiditybooster/03-gast-club.html')
          s=p.read_text(encoding='utf-8')
          def replace_between(s,start,end,repl):
              a=s.index(start); b=s.index(end,a); return s[:a]+repl+s[b:]
          s=s.replace('Die drei realen Tore des LiquidityBooster-Gastzugangs: Wissen, Perspektiven und Talent & Business – mit den echten Erwartungsbögen und PDF-Ergebnis.','Die drei realen Tore des LiquidityBooster-Gastzugangs: Wissen, Perspektiven und Talent & Business – mit den Inhalten der echten Erwartungsbögen.')
          s=s.replace('Dieser Weg bleibt kostenlos. Du beschreibst deinen Wissensbedarf und kannst daraus eine persönliche PDF erstellen. Die Formulardaten bleiben dabei im Browser.','Hier wird sichtbar, welche Fragen hinter dem Tor „Wissen“ stehen. Es geht um Wissensbedarf, Interessengebiete, Orientierung und die Art von Unterstützung, die jemand sucht.')
          s=s.replace('This path remains free. You describe your knowledge needs and can create a personal PDF. Your form data stays in the browser.','This shows which questions sit behind the Knowledge gate: knowledge needs, areas of interest, orientation and the kind of support someone is looking for.')
          s=s.replace('Hier geht es um deine Ziele, Erwartungen und die Frage, welche persönlichen oder wirtschaftlichen Perspektiven für dich überhaupt interessant sind. Der Bogen endet mit einer PDF für ein mögliches persönliches Kennenlernen.','Hier geht es um persönliche Ziele, Erwartungen, Zeit, Entwicklung und die Frage, was jemand von einer Zusammenarbeit oder Mitgliedschaft erwartet.')
          s=s.replace('This path is about your goals, expectations and which personal or economic perspectives are actually relevant to you. The questionnaire ends with a PDF for a possible personal introduction.','This gate is about personal goals, expectations, time, development and what someone expects from collaboration or membership.')
          s=s.replace('Erwartungsbogen öffnen ↓','Was wird abgefragt? ↓').replace('Open questionnaire ↓','What is asked? ↓').replace('Business-Profil öffnen ↓','Was wird abgefragt? ↓')
          s=s.replace('<div class="fact"><b>PDF</b><span data-i18n data-de="Persönliche Wissensanfrage" data-en="Personal knowledge request">Persönliche Wissensanfrage</span></div>','<div class="fact"><b>Format</b><span>Erwartungsbogen</span></div>')
          s=s.replace('<div class="fact"><b>PDF</b><span>Bewerbung zum Kennenlernen</span></div>','<div class="fact"><b>Format</b><span>Erwartungsbogen</span></div>')
          s=s.replace('<div class="fact"><b>PDF</b><span>Business-Profil</span></div>','<div class="fact"><b>Format</b><span>Business-Erwartungsbogen</span></div>')
          wissen='''<div class="form-area" id="wissen-form"><div class="readonly-note">Hier wird nichts ausgefüllt. Der Hörsaal zeigt nur, welche Inhalte im echten Erwartungsbogen abgefragt werden.</div><div class="question-overview">
          <details open><summary>Basisangaben</summary><div class="question-body"><div class="question-list"><div class="question-item">Vor- und Nachname</div><div class="question-item">E-Mail-Adresse</div></div></div></details>
          <details><summary>Wissensbedarf & Interessengebiete</summary><div class="question-body"><div class="question-list"><div class="question-item"><b>Was ist der wichtigste Grund für deine Wissensanfrage?</b></div><div class="question-item"><b>Welche Themen interessieren dich aktuell besonders?</b><div class="option-chips"><span>Finanzielle Grundlagen</span><span>Vermögensaufbau</span><span>Krypto & Blockchain</span><span>Wallets & Self-Custody</span><span>Steuern</span><span>Unternehmertum</span><span>Absicherung & Notfallvorsorge</span><span>Einkommensmöglichkeiten</span><span>Betrugsprävention & Projektprüfung</span><span>Finanzielle Souveränität</span></div></div><div class="question-item">Eigenes Thema / weitere Interessen</div></div></div></details>
          <details><summary>Orientierung & Lernziel</summary><div class="question-body"><div class="question-list"><div class="question-item">Wo fehlt dir heute Wissen oder Orientierung?</div><div class="question-item">Welches Wissen möchtest du in den nächsten zwölf Monaten aufbauen oder vertiefen?</div><div class="question-item">Was möchtest du danach besser verstehen oder selbstständig beurteilen können?</div></div></div></details>
          <details><summary>Gewünschte Unterstützung</summary><div class="question-body"><div class="question-list"><div class="question-item"><b>Welche Art von Unterstützung wünschst du dir?</b><div class="option-chips"><span>Verständliche Erklärungen</span><span>Vertiefende Informationen</span><span>Praktische Anleitungen</span><span>Orientierung</span><span>Neue Perspektiven</span><span>Werkzeuge</span><span>Neutrale Einordnung</span></div></div><div class="question-item">Gibt es ein Angebot oder ein Thema, das du heute noch vermisst?</div><div class="question-item">Wenn wir dir einmal im Monat genau einen Wissensimpuls schicken dürften: Worum sollte es gehen?</div><div class="question-item">Zustimmung zu passenden Wissensimpulsen für 12 Monate per E-Mail – mit jederzeitiger Widerspruchsmöglichkeit.</div></div></div></details>
          </div></div></section>
          '''
          perspektiven='''<div class="form-area" id="perspektiven-form"><div class="readonly-note">Hier wird nichts ausgefüllt. Gezeigt werden ausschließlich die Inhalte, die im echten Perspektiven-Erwartungsbogen abgefragt werden.</div><div class="question-overview">
          <details open><summary>Basisangaben & Motivation</summary><div class="question-body"><div class="question-list"><div class="question-item">Vor- und Nachname</div><div class="question-item">E-Mail-Adresse</div><div class="question-item">Was hat dich an den Möglichkeiten des LiquidityBoosters angesprochen?</div><div class="question-item">Was möchtest du für dich persönlich erreichen?</div></div></div></details>
          <details><summary>Zeit, Einkommen & mögliche Begleitung</summary><div class="question-body"><div class="question-list"><div class="question-item"><b>Welche Rolle spielt zusätzliches Einkommen für dich?</b><div class="option-chips mag"><span>Aktuell keine Priorität</span><span>Interessante Ergänzung</span><span>Wichtige zusätzliche Perspektive</span><span>Ich möchte mir gezielt etwas aufbauen</span></div></div><div class="question-item"><b>Wie viel Zeit möchtest du realistisch investieren?</b><div class="option-chips mag"><span>Bis 2 Stunden pro Woche</span><span>2–5 Stunden pro Woche</span><span>5–10 Stunden pro Woche</span><span>Mehr als 10 Stunden pro Woche</span></div></div><div class="question-item"><b>Kannst du dir vorstellen, später auch andere Menschen zu begleiten?</b><div class="option-chips mag"><span>Ich möchte zunächst nur meinen eigenen Weg gehen</span><span>Vielleicht später</span><span>Ja, das kann ich mir gut vorstellen</span><span>Ja, Menschen zu entwickeln interessiert mich besonders</span></div></div></div></div></details>
          <details><summary>Was ist dir in der Zusammenarbeit wichtig?</summary><div class="question-body"><div class="question-item">Diese 13 Bereiche werden jeweils auf einer Skala von 1 bis 5 bewertet:</div><div class="option-chips mag"><span>Betreuung</span><span>Erreichbarkeit</span><span>Verlässlichkeit</span><span>Pünktlichkeit</span><span>Qualität der Angebote</span><span>Nachvollziehbare Vergütungen und Belohnungen</span><span>Klare Informationen</span><span>Persönliche Unterstützung</span><span>Weiterbildung</span><span>Faire Behandlung</span><span>Transparenz</span><span>Gemeinschaft</span><span>Entwicklungsmöglichkeiten</span></div></div></details>
          <details><summary>Erwartungen an Betreuung & Mitgliedschaft</summary><div class="question-body"><div class="question-list"><div class="question-item">Was bedeutet gute Betreuung für dich persönlich?</div><div class="question-item">Was müsste passieren, damit du nach zwölf Monaten sagst: „Die Mitgliedschaft hat sich für mich gelohnt“?</div><div class="question-item">Was dürfen wir aus deiner Sicht auf keinen Fall falsch machen?</div><div class="question-item">Gibt es etwas, das du von uns erwartest und wonach wir noch nicht gefragt haben?</div></div></div></details>
          </div></div></section>
          '''
          talent='''<div class="form-area" id="talent-form"><div class="readonly-note">Hier wird nichts ausgefüllt. Der Hörsaal zeigt, welche Informationen im echten Talent-&-Business-Bogen abgefragt werden.</div><div class="question-overview">
          <details open><summary>Basisangaben & beruflicher Hintergrund</summary><div class="question-body"><div class="question-list"><div class="question-item">Vor- und Nachname</div><div class="question-item">E-Mail-Adresse</div><div class="question-item">Was machst du beruflich?</div><div class="question-item">Welche Expertise bringst du mit?</div><div class="question-item">Seit wann beschäftigst du dich professionell damit?</div><div class="question-item">Was kannst du besonders gut?</div></div></div></details>
          <details><summary>Angebot, Zielgruppe & Rolle</summary><div class="question-body"><div class="question-list"><div class="question-item">Welches bestehende Angebot, Produkt oder welche Dienstleistung hast du?</div><div class="question-item">Für wen ist dein Angebot gedacht?</div><div class="question-item"><b>Welche Rollen beschreiben dich?</b><div class="option-chips"><span>Coach</span><span>Trainer</span><span>Berater</span><span>Unternehmer</span><span>Recruiter / Headhunter</span><span>Experte / Spezialist</span><span>Referent</span><span>Branchenkenner</span></div></div></div></div></details>
          <details><summary>Netzwerk & möglicher Beitrag</summary><div class="question-body"><div class="question-list"><div class="question-item">Hast du bereits Kunden, Teilnehmer, Mitglieder oder ein eigenes Netzwerk? Beschreibe es kurz.</div><div class="question-item">Was könntest du Clubmitgliedern konkret anbieten?</div><div class="question-item">Welche deiner Erfahrungen könnten für die Akademie interessant sein?</div><div class="question-item">Könntest du dir vorstellen, Wissen innerhalb eines Hörsaals, Coachings, Workshops oder eines eigenen Angebots weiterzugeben?</div><div class="question-item">Gibt es bereits eine konkrete Business-Idee, über die du mit uns sprechen möchtest?</div></div></div></details>
          <details><summary>Interesse & Zusammenarbeit</summary><div class="question-body"><div class="question-list"><div class="question-item">Warum interessiert dich der LiquidityBooster?</div><div class="question-item">Was könnte der LiquidityBooster für dein bestehendes Business interessant machen?</div><div class="question-item">Was erwartest du von einer Zusammenarbeit?</div><div class="question-item">Welche Unterstützung oder Möglichkeiten wären für dich besonders wertvoll?</div><div class="question-item">Was müsste eine Zusammenarbeit erfüllen, damit sie für beide Seiten sinnvoll ist?</div></div></div></details>
          </div></div></section>
          '''
          s=replace_between(s,'<div class="form-area" id="wissen-form">','<section class="gate-panel" id="panel-perspektiven">',wissen)
          s=replace_between(s,'<div class="form-area" id="perspektiven-form">','<section class="gate-panel" id="panel-talent">',perspektiven)
          s=replace_between(s,'<div class="form-area" id="talent-form">','<section class="price-section">',talent)
          css='''.question-overview{display:grid;gap:12px}.question-overview details{border:1px solid var(--line);border-radius:18px;background:#fff;overflow:hidden}.question-overview summary{list-style:none;cursor:pointer;padding:17px 19px;font-weight:850;color:var(--navy);display:flex;justify-content:space-between;gap:14px;align-items:center}.question-overview summary::-webkit-details-marker{display:none}.question-overview summary:after{content:"+";width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--mint);font-size:20px;flex:0 0 auto}.question-overview details[open] summary:after{content:"−";color:var(--mag)}.question-body{padding:0 19px 19px}.question-list{display:grid;gap:9px}.question-item{padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink)}.question-item b{color:var(--navy)}.option-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.option-chips span{padding:7px 10px;border-radius:999px;background:var(--mint-soft);border:1px solid #cbecec;color:#176f73;font-size:12px}.option-chips.mag span{background:var(--mag-soft);border-color:#f3cadf;color:#8f1458}.readonly-note{margin:0 0 16px;padding:14px 16px;border-left:4px solid var(--mint);background:var(--mint-soft);border-radius:0 14px 14px 0;color:var(--navy)}'''
          s=s.replace('</style>',css+'</style>',1)
          a=s.index('<script>'); b=s.index('</script>',a)+9
          js='''<script>(()=>{const langBtns=[...document.querySelectorAll('[data-lang]')];function setLang(lang){document.documentElement.lang=lang;langBtns.forEach(b=>{const on=b.dataset.lang===lang;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on))});document.querySelectorAll('[data-i18n]').forEach(el=>{const v=el.getAttribute('data-'+lang);if(v!==null)el.innerHTML=v})}langBtns.forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));const cards=[...document.querySelectorAll('.gate-card')],panels=[...document.querySelectorAll('.gate-panel')];function showGate(key){cards.forEach(c=>c.classList.toggle('active',c.dataset.gate===key));panels.forEach(p=>p.classList.toggle('show',p.id==='panel-'+key))}cards.forEach(c=>c.addEventListener('click',()=>showGate(c.dataset.gate)));showGate('wissen');document.querySelectorAll('.form-toggle').forEach(btn=>btn.addEventListener('click',()=>{const el=document.getElementById(btn.dataset.form);const open=el.classList.toggle('open');btn.textContent=open?'Inhalte schließen ↑':'Was wird abgefragt? ↓';if(open)setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'nearest'}),80)}));const io=('IntersectionObserver'in window)?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target)}}),{threshold:.1}):null;document.querySelectorAll('.reveal').forEach(el=>{if(io)io.observe(el);else el.classList.add('visible')});setLang('de')})();</script>'''
          s=s[:a]+js+s[b:]
          if '<form' in s or 'PDF herunterladen' in s or 'Bewerbung als PDF' in s or 'Business-Profil als PDF' in s:
              raise SystemExit('Validation failed: form/PDF function still present')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/fix-hoersaal-page3-readonly.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hoersaal-liquiditybooster/03-gast-club.html .github/workflows/fix-hoersaal-page3-readonly.yml
          git commit -m 'Fix Seite 3: Tore nur als Inhaltsübersicht'
          git push
