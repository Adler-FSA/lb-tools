name: Refresh contract PDF engine cache key

on:
  push:
    paths:
      - '.github/workflows/refresh-contract-pdf-engine-cache.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh Club Partner engine cache key
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pages/vertraege/club-partner.html')
          s=p.read_text(encoding='utf-8')
          old='./contract-pdf-engine-v1.js?v=1'
          new='./contract-pdf-engine-v1.js?v=2'
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          elif new not in s:
              raise SystemExit('SCHUTZSTOPP: PDF-Engine Script-Link nicht gefunden')
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "Adler-FSA Automation"
          git config user.email "actions@users.noreply.github.com"
          git add pages/vertraege/club-partner.html
          git rm .github/workflows/refresh-contract-pdf-engine-cache.yml
          git commit -m "Refresh contract PDF engine cache key"
          git push
