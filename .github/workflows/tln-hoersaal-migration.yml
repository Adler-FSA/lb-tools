name: TLN Hörsaal Migration

on:
  push:
    paths:
      - '.github/workflows/tln-hoersaal-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lb-tools
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy current TLN Hörsaal 1:1 from lp-anfang
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pages/tln
          base='https://raw.githubusercontent.com/Adler-FSA/lp-anfang/main/pages/tln'
          files=(
            index.html
            vow-oekosystem.html
            projekt-einstieg.html
            community.html
            community-kompass.html
            koepfe-unternehmen-geschichte.html
            telefonleitfaeden.html
          )
          for file in "${files[@]}"; do
            curl --fail --silent --show-error --location "$base/$file" --output "pages/tln/$file"
          done

      - name: Remove old Hörsaal URL traces without redesign
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('pages/tln')
          old_base = 'https://adler-fsa.github.io/lp-anfang/pages/tln/'

          # In normal Hörsaal navigation an old absolute TLN URL becomes a relative
          # internal URL. Relative links keep the complete Hörsaal inside the new host.
          for path in root.glob('*.html'):
              text = path.read_text(encoding='utf-8')
              if path.name != 'community-kompass.html':
                  text = text.replace(old_base, './')
              path.write_text(text, encoding='utf-8')

          # Community-Kompass: copied answers must contain NO Hörsaal URL at all.
          kompass = root / 'community-kompass.html'
          text = kompass.read_text(encoding='utf-8')
          for filename in (
              'vow-oekosystem.html',
              'community.html',
              'projekt-einstieg.html',
              'index.html',
              'koepfe-unternehmen-geschichte.html',
              'telefonleitfaeden.html',
              'community-kompass.html',
          ):
              text = text.replace(old_base + filename, '')
          # Catch any remaining old TLN URL in this communication tool.
          text = re.sub(r'https://adler-fsa\.github\.io/lp-anfang/pages/tln/[^\s\'\"<]+', '', text, flags=re.I)
          text = text.replace('  ', ' ')
          text = text.replace(' :', ':')
          kompass.write_text(text, encoding='utf-8')

      - name: Audit migration and old-path traces
        shell: bash
        run: |
          set -euo pipefail
          test -f pages/tln/index.html
          test -f pages/tln/vow-oekosystem.html
          test -f pages/tln/projekt-einstieg.html
          test -f pages/tln/community.html
          test -f pages/tln/community-kompass.html
          test -f pages/tln/koepfe-unternehmen-geschichte.html
          test -f pages/tln/telefonleitfaeden.html

          if grep -RniE 'adler-fsa\.github\.io|lp-anfang/pages/tln' pages/tln; then
            echo 'ERROR: old TLN path trace remains in migrated Hörsaal.'
            exit 1
          fi

          echo 'Seven TLN files present and no old TLN GitHub Pages path remains.'

      - name: Commit migrated Hörsaal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/tln
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git commit -m 'Migrate TLN Hörsaal to tools.liquiditybooster.de'
          git push origin HEAD:main
