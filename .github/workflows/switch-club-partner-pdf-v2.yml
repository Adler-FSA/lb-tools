name: Switch Club Partner PDF v2
on:
  push:
    paths:
      - '.github/workflows/switch-club-partner-pdf-v2.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pages/vertraege/club-partner.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="./contract-pdf-engine-v1.js?v=3"></script>'
          new='<script src="./contract-pdf-engine-v2.js?v=1"></script>\n<script src="./club-partner-enhancements-v1.js?v=1"></script>'
          if old not in s:
              raise SystemExit('SCHUTZSTOPP: alter Engine-Link nicht gefunden')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check pages/vertraege/contract-pdf-engine-v2.js
          node --check pages/vertraege/club-partner-enhancements-v1.js
      - name: Commit change and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/vertraege/club-partner.html
          git commit -m "Use contract PDF v2 with branded header and confirmation UX"
          git rm .github/workflows/switch-club-partner-pdf-v2.yml
          git commit -m "Remove one-shot Club Partner PDF switch workflow"
          git push
