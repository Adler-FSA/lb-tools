name: Akademie Research Engine – 16 Punkte

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Projektname"
        required: false
        default: "KryptoSavings"
  push:
    branches: [main]
    paths:
      - "research-engine/analysis_standard_16.json"
      - "research-engine/sixteen_point_analysis.py"
      - "research-engine/build_16_monitor.py"
      - "research-engine/academy_analysis.py"
      - "research-engine/operator_registry_research.py"
      - "research-engine/external_research.py"
      - "research-engine/engine.py"
      - "research-engine/tests/**"
      - ".github/workflows/research-engine-16-point-test.yml"
  pull_request:
    paths:
      - "research-engine/analysis_standard_16.json"
      - "research-engine/sixteen_point_analysis.py"
      - "research-engine/build_16_monitor.py"
      - "research-engine/academy_analysis.py"
      - "research-engine/operator_registry_research.py"
      - "research-engine/external_research.py"
      - "research-engine/engine.py"
      - "research-engine/tests/**"
      - ".github/workflows/research-engine-16-point-test.yml"

permissions:
  contents: write

jobs:
  sixteen-point-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        id: deps
        run: |
          python -m pip install --upgrade pip
          pip install -r research-engine/requirements.txt pytest

      - name: Regressionstests
        id: tests
        run: python -m pytest -q research-engine/tests

      - name: Website-Rohresearch
        id: website
        shell: bash
        env:
          INPUT_QUERY: ${{ github.event.inputs.query }}
        run: |
          QUERY="${INPUT_QUERY:-KryptoSavings}"
          python research-engine/engine.py "$QUERY" --output research-engine/output/kryptosavings-live.json

      - name: Externe Rohrecherche
        id: external
        run: |
          python research-engine/external_research.py \
            --input research-engine/output/kryptosavings-live.json \
            --output research-engine/output/kryptosavings-external.json

      - name: Betreiber Register Behörden
        id: operator
        run: |
          python research-engine/operator_registry_research.py \
            --input research-engine/output/kryptosavings-external.json \
            --output research-engine/output/kryptosavings-operators.json

      - name: Akademie Vergleich
        id: academy
        run: |
          python research-engine/academy_analysis.py \
            --input research-engine/output/kryptosavings-operators.json \
            --output research-engine/output/kryptosavings-academy.json

      - name: 16-Punkte-Prüfung
        id: sixteen
        run: |
          python research-engine/sixteen_point_analysis.py \
            --input research-engine/output/kryptosavings-academy.json \
            --output research-engine/output/kryptosavings-16-points.json

      - name: Monitor-Datei erzeugen
        id: monitor
        run: |
          python research-engine/build_16_monitor.py \
            --input research-engine/output/kryptosavings-16-points.json \
            --output research-engine/output/kryptosavings-16-monitor.json

      - name: 16-Punkte-Ergebnis prüfen
        id: checks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data=json.loads(Path('research-engine/output/kryptosavings-16-points.json').read_text(encoding='utf-8'))
          monitor=json.loads(Path('research-engine/output/kryptosavings-16-monitor.json').read_text(encoding='utf-8'))
          block=data.get('sixteen_point_analysis') or {}
          questions=block.get('questions') or []
          assert data.get('status') == 'ok'
          assert block.get('status') == 'ok'
          assert len(questions) == 16
          assert [q.get('id') for q in questions] == list(range(1,17))
          by_id={q['id']:q for q in questions}
          assert by_id[1]['state'] in {'partially_answered','supported'}
          assert by_id[4]['state'] in {'clarification_needed','conflict_found'}
          assert by_id[6]['state'] == 'conflict_found'
          assert by_id[9]['state'] == 'clarification_needed'
          assert '23%' in by_id[9]['finding']
          assert by_id[11]['state'] == 'partially_answered'
          assert '30%' in by_id[11]['finding']
          assert by_id[12]['state'] == 'research_gap'
          assert by_id[16]['state'] == 'overall_not_ready'
          assert by_id[16]['traffic_light'] is None
          assert block['summary']['overall_assessment_ready'] is False
          assert block['guardrails']['overall_traffic_light_created'] is False
          assert block['guardrails']['fraud_verdict_created'] is False
          assert monitor.get('status') == 'ok'
          assert len(monitor.get('questions') or []) == 16
          assert monitor.get('summary',{}).get('overall_assessment_ready') is False
          print('16-Punkte OK:', block['summary']['counts_by_state'])
          for q in questions:
              print(f"Q{q['id']:02d} [{q['state']}] {q['title']} -> {q['finding']}")
          PY

      - name: Diagnose schreiben
        if: always()
        env:
          DEPS: ${{ steps.deps.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          WEBSITE: ${{ steps.website.outcome }}
          EXTERNAL: ${{ steps.external.outcome }}
          OPERATOR: ${{ steps.operator.outcome }}
          ACADEMY: ${{ steps.academy.outcome }}
          SIXTEEN: ${{ steps.sixteen.outcome }}
          MONITOR: ${{ steps.monitor.outcome }}
          CHECKS: ${{ steps.checks.outcome }}
        run: |
          mkdir -p research-engine/output
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          status={
            'generated_at':datetime.now(timezone.utc).isoformat(),
            'dependencies':os.environ.get('DEPS'),
            'tests':os.environ.get('TESTS'),
            'website_research':os.environ.get('WEBSITE'),
            'external_research':os.environ.get('EXTERNAL'),
            'operator_registry_research':os.environ.get('OPERATOR'),
            'academy_analysis':os.environ.get('ACADEMY'),
            'sixteen_point_analysis':os.environ.get('SIXTEEN'),
            'monitor_export':os.environ.get('MONITOR'),
            'sixteen_point_checks':os.environ.get('CHECKS'),
          }
          Path('research-engine/output/16-point-status.json').write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(status)
          PY

      - name: Liveoutputs als Debug-Artefakt sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-engine-16-point-${{ github.run_id }}
          path: |
            research-engine/output/16-point-status.json
            research-engine/output/kryptosavings-16-points.json
            research-engine/output/kryptosavings-16-monitor.json
          if-no-files-found: warn
          retention-days: 14

      - name: Ergebnisse auf main sichern
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "Akademie Research Engine"
          git config user.email "actions@github.com"
          git add research-engine/output/16-point-status.json
          if [ -f research-engine/output/kryptosavings-16-points.json ]; then
            git add research-engine/output/kryptosavings-16-points.json
          fi
          if [ -f research-engine/output/kryptosavings-16-monitor.json ]; then
            git add research-engine/output/kryptosavings-16-monitor.json
          fi
          if git diff --cached --quiet; then
            echo "Keine Änderung am 16-Punkte-Ergebnis."
            exit 0
          fi
          git commit -m "Research Engine: 16-Punkte-Testdiagnose aktualisieren"
          git pull --rebase
          git push
