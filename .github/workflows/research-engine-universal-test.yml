name: Research Engine Universal Router Test

on:
  push:
    paths:
      - 'research-engine/research_router.py'
      - 'research-engine/identity_resolver.py'
      - 'research-engine/quick_external_research.py'
      - 'research-engine/universal_external_research.py'
      - 'research-engine/universal_pipeline.py'
      - 'research-engine/universal_runtime.py'
      - 'research-engine/research_quality.py'
      - 'research-engine/entity_role_analysis.py'
      - 'research-engine/registry_adapters.py'
      - 'research-engine/operator_registry_research.py'
      - 'research-engine/entity_identifier_research.py'
      - 'research-engine/universal_operator_research.py'
      - 'research-engine/project_people_discovery.py'
      - 'research-engine/universal_people_research.py'
      - 'research-engine/sixteen_point_people_adapter.py'
      - 'research-engine/universal_academy_analysis.py'
      - 'research-engine/universal_sixteen_analysis.py'
      - 'research-engine/process_control_request.py'
      - 'research-engine/tests/test_universal_research_router.py'
      - 'research-engine/tests/test_identity_resolver.py'
      - 'research-engine/tests/test_quick_external_research.py'
      - 'research-engine/tests/test_universal_external_research.py'
      - 'research-engine/tests/test_research_quality.py'
      - 'research-engine/tests/test_entity_role_analysis.py'
      - 'research-engine/tests/test_operator_registry_safety.py'
      - 'research-engine/tests/test_entity_identifier_research.py'
      - 'research-engine/tests/test_registry_adapters.py'
      - 'research-engine/tests/test_project_people_discovery.py'
      - 'research-engine/tests/test_universal_people_research.py'
      - 'research-engine/tests/test_sixteen_point_people_adapter.py'
      - 'research-engine/tests/test_universal_analysis_outputs.py'
      - 'research-engine/tests/test_universal_fixture_separation.py'
      - 'research-engine/tests/fixtures/**'
      - 'data/research-requests/**'
      - '.github/workflows/research-engine-universal-test.yml'
  pull_request:
    paths:
      - 'research-engine/research_router.py'
      - 'research-engine/identity_resolver.py'
      - 'research-engine/quick_external_research.py'
      - 'research-engine/universal_external_research.py'
      - 'research-engine/universal_pipeline.py'
      - 'research-engine/universal_runtime.py'
      - 'research-engine/research_quality.py'
      - 'research-engine/entity_role_analysis.py'
      - 'research-engine/registry_adapters.py'
      - 'research-engine/operator_registry_research.py'
      - 'research-engine/entity_identifier_research.py'
      - 'research-engine/universal_operator_research.py'
      - 'research-engine/project_people_discovery.py'
      - 'research-engine/universal_people_research.py'
      - 'research-engine/sixteen_point_people_adapter.py'
      - 'research-engine/universal_academy_analysis.py'
      - 'research-engine/universal_sixteen_analysis.py'
      - 'research-engine/process_control_request.py'
      - 'research-engine/tests/test_universal_research_router.py'
      - 'research-engine/tests/test_identity_resolver.py'
      - 'research-engine/tests/test_quick_external_research.py'
      - 'research-engine/tests/test_universal_external_research.py'
      - 'research-engine/tests/test_research_quality.py'
      - 'research-engine/tests/test_entity_role_analysis.py'
      - 'research-engine/tests/test_operator_registry_safety.py'
      - 'research-engine/tests/test_entity_identifier_research.py'
      - 'research-engine/tests/test_registry_adapters.py'
      - 'research-engine/tests/test_project_people_discovery.py'
      - 'research-engine/tests/test_universal_people_research.py'
      - 'research-engine/tests/test_sixteen_point_people_adapter.py'
      - 'research-engine/tests/test_universal_analysis_outputs.py'
      - 'research-engine/tests/test_universal_fixture_separation.py'
      - 'research-engine/tests/fixtures/**'
      - '.github/workflows/research-engine-universal-test.yml'

jobs:
  universal-router:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: pip install -r research-engine/requirements.txt pytest
      - name: Universal router, identity, external guard, quick depth, quality, entity roles, operator safety, identifiers, project people, Q5, fixtures, academy, 16-point and registry tests
        run: pytest -q research-engine/tests/test_universal_research_router.py research-engine/tests/test_identity_resolver.py research-engine/tests/test_quick_external_research.py research-engine/tests/test_universal_external_research.py research-engine/tests/test_research_quality.py research-engine/tests/test_entity_role_analysis.py research-engine/tests/test_operator_registry_safety.py research-engine/tests/test_entity_identifier_research.py research-engine/tests/test_registry_adapters.py research-engine/tests/test_project_people_discovery.py research-engine/tests/test_universal_people_research.py research-engine/tests/test_sixteen_point_people_adapter.py research-engine/tests/test_universal_analysis_outputs.py research-engine/tests/test_universal_fixture_separation.py

  control-request:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Research Auftrag')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout request commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencies
        run: |
          python -m pip install --disable-pip-version-check -r research-engine/requirements.txt
          python -m playwright install chromium

      - name: Process Control Center request
        run: python research-engine/process_control_request.py

      - name: Save Control Center result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-engine/output/control-center research-engine/output/control-center-status
          if git diff --cached --quiet; then
            echo "Kein Control-Center-Ergebnis erzeugt."
            exit 1
          fi
          git commit -m "Research Engine: Control-Center-Ergebnis"
          git pull --rebase origin main
          git push origin HEAD:main
