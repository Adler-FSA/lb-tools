name: Research Engine Universal Router Test

on:
  push:
    paths:
      - 'research-engine/research_router.py'
      - 'research-engine/identity_resolver.py'
      - 'research-engine/universal_pipeline.py'
      - 'research-engine/registry_adapters.py'
      - 'research-engine/universal_operator_research.py'
      - 'research-engine/tests/test_universal_research_router.py'
      - 'research-engine/tests/test_identity_resolver.py'
      - 'research-engine/tests/test_registry_adapters.py'
      - '.github/workflows/research-engine-universal-test.yml'
  pull_request:
    paths:
      - 'research-engine/research_router.py'
      - 'research-engine/identity_resolver.py'
      - 'research-engine/universal_pipeline.py'
      - 'research-engine/registry_adapters.py'
      - 'research-engine/universal_operator_research.py'
      - 'research-engine/tests/test_universal_research_router.py'
      - 'research-engine/tests/test_identity_resolver.py'
      - 'research-engine/tests/test_registry_adapters.py'
      - '.github/workflows/research-engine-universal-test.yml'

jobs:
  universal-router:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: pip install -r research-engine/requirements.txt pytest
      - name: Universal router, identity, product split and registry adapter tests
        run: pytest -q research-engine/tests/test_universal_research_router.py research-engine/tests/test_identity_resolver.py research-engine/tests/test_registry_adapters.py
