name: Projekt Frühwarn-Check – BaFin Update
# Stand: BaFin Expertensuche · laufendes Jahr · 50 Treffer · nur gtp-Pagination

on:
  workflow_dispatch:
  schedule:
    - cron: '47 5 * * *'
  push:
    paths:
      - '.github/workflows/update-fruehwarn-bafin.yml'
      - 'pages/projekt-fruehwarn-check/scripts/update_bafin.py'
      - 'pages/projekt-fruehwarn-check/scripts/diagnose_bafin_links.py'

permissions:
  contents: write

concurrency:
  group: projekt-fruehwarn-bafin
  cancel-in-progress: false

jobs:
  update-bafin:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: BaFin Verbraucherwarnungen aktualisieren
        shell: bash
        run: |
          set +e
          {
            python pages/projekt-fruehwarn-check/scripts/diagnose_bafin_links.py
            echo
            python pages/projekt-fruehwarn-check/scripts/update_bafin.py
          } 2>&1 | tee /tmp/bafin-update.log
          CODE=${PIPESTATUS[0]}
          echo "BAFIN_EXIT=$CODE" >> "$GITHUB_ENV"
          if [ "$CODE" -ne 0 ]; then
            cp /tmp/bafin-update.log pages/projekt-fruehwarn-check/data/bafin-last-error.txt
          else
            rm -f pages/projekt-fruehwarn-check/data/bafin-last-error.txt
          fi
          exit 0

      - name: Fehlerdiagnose speichern
        if: env.BAFIN_EXIT != '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FSA Frühwarn-Update"
          git config user.email "actions@github.com"
          git add -- pages/projekt-fruehwarn-check/data/bafin-last-error.txt
          if ! git diff --cached --quiet; then
            git commit -m "Frühwarn-Check: BaFin Importfehler protokollieren"
            git push
          fi

      - name: Fehlgeschlagenen Import stoppen
        if: env.BAFIN_EXIT != '0'
        run: exit 1

      - name: Ergebnis prüfen
        if: env.BAFIN_EXIT == '0'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('pages/projekt-fruehwarn-check/data/records.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          bafin = [r for r in data.get('records', []) if r.get('source_id') == 'bafin-warnings']
          orange = [r for r in bafin if 'orange cat' in ' '.join(r.get('match_terms', [])).lower()]
          print(f'BaFin: {len(bafin)}')
          print(f'Orange Cat: {len(orange)}')
          if len(bafin) < 40:
              raise SystemExit('Validierung fehlgeschlagen: zu wenige BaFin-Datensätze.')
          if not orange:
              raise SystemExit('Abnahmetest fehlgeschlagen: Orange Cat fehlt.')
          PY

      - name: Aktualisierten Datenbestand speichern
        if: env.BAFIN_EXIT == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FSA Frühwarn-Update"
          git config user.email "actions@github.com"
          git add -- pages/projekt-fruehwarn-check/data/records.json pages/projekt-fruehwarn-check/data/sources.json
          if git diff --cached --quiet; then
            echo "Keine Datenänderung seit dem letzten erfolgreichen Lauf."
          else
            git commit -m "Frühwarn-Check: BaFin Daten aktualisieren"
            git push
          fi
