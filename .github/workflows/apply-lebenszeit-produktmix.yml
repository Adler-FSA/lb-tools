name: Apply lifetime calculator product mix

on:
  push:
    paths:
      - '.github/workflows/apply-lebenszeit-produktmix.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch lifetime calculator
        run: python tmp/patch-lebenszeit-produktmix.py
      - name: Clean temporary patch files
        run: |
          rm -f tmp/patch-lebenszeit-produktmix.py
          rm -f .github/workflows/apply-lebenszeit-produktmix.yml
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix lifetime calculator product mix and setup comparison'
          git push
