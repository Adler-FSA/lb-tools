name: Projekt Frühwarn-Check – EBA PSD2 Update

on:
  workflow_dispatch:
  schedule:
    - cron: '47 5 * * *'
  push:
    paths:
      - '.github/workflows/update-fruehwarn-eba-psd2.yml'
      - 'pages/projekt-fruehwarn-check/scripts/update_eba_psd2.py'

permissions:
  contents: write

concurrency:
  group: projekt-fruehwarn-eba-psd2
  cancel-in-progress: false

jobs:
  update-eba-psd2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Streaming-JSON-Parser installieren
        run: python -m pip install --disable-pip-version-check ijson

      - name: EBA PSD2 Register aktualisieren
        run: python pages/projekt-fruehwarn-check/scripts/update_eba_psd2.py

      - name: Ergebnis validieren
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('pages/projekt-fruehwarn-check/data/records.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          rows=[r for r in data.get('records',[]) if r.get('source_id')=='eba-psd2-register']
          print('EBA PSD2 Rechtstraeger:',len(rows))
          if len(rows)<1000:
              raise SystemExit('EBA PSD2 Validierung fehlgeschlagen')
          active=sum(1 for r in rows if r.get('status') in {'authorized','registered','exempted','national_entitlement','excluded_scope'})
          print('Davon aktuell positiv/aktiv gefuehrt:',active)
          if active<500:
              raise SystemExit('EBA PSD2 Aktivstatus unplausibel')
          PY

      - name: Aktualisierten Datenbestand speichern
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FSA Frühwarn-Update"
          git config user.email "actions@github.com"
          git add -- pages/projekt-fruehwarn-check/data/records.json pages/projekt-fruehwarn-check/data/sources.json
          if git diff --cached --quiet; then
            echo "Keine Datenänderung seit dem letzten erfolgreichen Lauf."
          else
            git commit -m "Frühwarn-Check: EBA PSD2 Register aktualisieren"
            git push
          fi
