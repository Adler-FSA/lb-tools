name: Diagnose Frühwarn-Check EBA Download

on:
  push:
    paths:
      - '.github/workflows/diagnose-fruehwarn-eba.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: EBA Metadaten-Endpunkt isolieren
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, requests
          from pathlib import Path

          txt=requests.get('https://euclid.eba.europa.eu/register/main.0f59f6811f5cb8c0bd29.js',headers={'User-Agent':'Mozilla/5.0'},timeout=45).text
          out=[]
          pats=[
            r'fileMetaData=function',
            r'\.fileMetaData=function',
            r'fileMetaData\s*=\s*function',
            r'golden_copy_path_context',
            r'latest_version_relative_zip_path'
          ]
          for pat in pats:
            out.append(f'===== {pat} =====\n')
            ms=list(re.finditer(pat,txt,re.I))
            out.append(f'count={len(ms)}\n')
            for i,m in enumerate(ms[:20],1):
              a=max(0,m.start()-5000); b=min(len(txt),m.end()+5000)
              out.append(f'--- {i} ---\n'+re.sub(r'\s+',' ',txt[a:b])+'\n')

          # zusätzliche kurze String-Literale mit server/API/metadata/file
          strings=re.findall(r'["\']([^"\']{1,240})["\']',txt)
          keep=[]
          for v in strings:
            lv=v.lower()
            if any(k in lv for k in ['metadata','filemeta','golden_copy','latest_version','backend','serverurl','apiurl','baseurl']):
              if v not in keep: keep.append(v)
          out.append('===== STRINGS =====\n'+'\n'.join(keep)+'\n')
          Path('pages/projekt-fruehwarn-check/data/eba-diagnostic.txt').write_text(''.join(out),encoding='utf-8')
          PY
      - name: Diagnose speichern
        run: |
          git config user.name "FSA Frühwarn-Diagnose"
          git config user.email "actions@github.com"
          git add pages/projekt-fruehwarn-check/data/eba-diagnostic.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Frühwarn-Check: EBA Metadaten-Endpunkt isolieren"
          git push
