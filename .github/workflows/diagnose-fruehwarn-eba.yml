name: Diagnose Frühwarn-Check EBA Download

on:
  push:
    paths:
      - '.github/workflows/diagnose-fruehwarn-eba.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: EBA CIR Metadaten prüfen
        shell: bash
        run: |
          python - <<'PY'
          import json, requests
          from pathlib import Path
          urls=[
            'https://euclid.eba.europa.eu/register/cir-api/filemetadata',
            'https://euclid.eba.europa.eu/register/api/filemetadata',
            'https://euclid.eba.europa.eu/register/pir-api/filemetadata'
          ]
          s=requests.Session(); s.headers.update({'User-Agent':'Akademie-Fruehwarn-Check/1.0','Accept':'application/json,*/*'})
          out=[]
          for u in urls:
            try:
              r=s.get(u,timeout=30,allow_redirects=True)
              out.append(f'URL={u}\nSTATUS={r.status_code}\nTYPE={r.headers.get("content-type")}\nFINAL={r.url}\nBODY={r.text[:5000]}\n---\n')
            except Exception as e:
              out.append(f'URL={u}\nERROR={e}\n---\n')
          Path('pages/projekt-fruehwarn-check/data/eba-diagnostic.txt').write_text(''.join(out),encoding='utf-8')
          PY
      - name: Diagnose speichern
        run: |
          git config user.name "FSA Frühwarn-Diagnose"
          git config user.email "actions@github.com"
          git add pages/projekt-fruehwarn-check/data/eba-diagnostic.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Frühwarn-Check: EBA CIR Metadaten prüfen"
          git push
