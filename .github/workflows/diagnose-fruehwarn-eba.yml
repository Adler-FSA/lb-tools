name: Diagnose Frühwarn-Check EBA Download

on:
  push:
    paths:
      - '.github/workflows/diagnose-fruehwarn-eba.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: EBA CIR Query aus offiziellem Frontend extrahieren
        shell: bash
        run: |
          python - <<'PY'
          import re, requests
          from pathlib import Path

          js='https://euclid.eba.europa.eu/register/main.0f59f6811f5cb8c0bd29.js'
          txt=requests.get(js,headers={'User-Agent':'Mozilla/5.0'},timeout=45).text
          out=[]

          pats=[
            'CRD_CRE_INS',
            'CRD_EEA_BR',
            'CRD_NON_EEA_BR',
            'searchEntities(',
            'querySearch',
            'queryLoad',
            'ENT_NAM',
            'cir/search'
          ]
          for pat in pats:
            out.append(f'\n===== {pat} =====\n')
            ms=list(re.finditer(re.escape(pat),txt,re.I))
            out.append(f'count={len(ms)}\n')
            for i,m in enumerate(ms[:35],1):
              a=max(0,m.start()-1800); b=min(len(txt),m.end()+2600)
              out.append(f'--- {i} ---\n'+re.sub(r'\s+',' ',txt[a:b])+'\n')

          Path('pages/projekt-fruehwarn-check/data/eba-diagnostic.txt').write_text(''.join(out),encoding='utf-8')
          PY
      - name: Diagnose speichern
        run: |
          git config user.name "FSA Frühwarn-Diagnose"
          git config user.email "actions@github.com"
          git add pages/projekt-fruehwarn-check/data/eba-diagnostic.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Frühwarn-Check: EBA CIR Frontend-Query extrahieren"
          git push
