name: Diagnose Frühwarn-Check EBA Download

on:
  push:
    paths:
      - '.github/workflows/diagnose-fruehwarn-eba.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: EBA Download-Endpunkt untersuchen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, requests
          from pathlib import Path

          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Akademie Fruehwarn-Check)','Accept':'*/*'})
          jsurl='https://euclid.eba.europa.eu/register/main.0f59f6811f5cb8c0bd29.js'
          txt=s.get(jsurl,timeout=45).text
          out=[f'JS size={len(txt)}\n']

          for pat in ['Downloading file :','registerDownload','pir/register','responseType:"blob"','responseType:"text"']:
            out.append(f'\n===== {pat} =====\n')
            matches=list(re.finditer(re.escape(pat),txt,re.I))
            out.append(f'count={len(matches)}\n')
            for i,m in enumerate(matches[:20],1):
              a=max(0,m.start()-2200); b=min(len(txt),m.end()+2600)
              chunk=re.sub(r'\s+',' ',txt[a:b])
              out.append(f'--- match {i} ---\n{chunk}\n')

          # Alle plausiblen internen REST-Pfade aus String-Literalen sammeln.
          strings=re.findall(r'["\']([^"\']{1,300})["\']',txt)
          vals=[]
          for v in strings:
            if v.startswith('/') and any(k in v.lower() for k in ['api','pir','download','register','entity','file']):
              if v not in vals: vals.append(v)
          out.append('\n===== PATH STRINGS =====\n'+'\n'.join(vals[:1000])+'\n')

          Path('pages/projekt-fruehwarn-check/data/eba-diagnostic.txt').write_text(''.join(out),encoding='utf-8')
          PY
      - name: Diagnose speichern
        run: |
          git config user.name "FSA Frühwarn-Diagnose"
          git config user.email "actions@github.com"
          git add pages/projekt-fruehwarn-check/data/eba-diagnostic.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Frühwarn-Check: EBA Download-Funktion isolieren"
          git push
