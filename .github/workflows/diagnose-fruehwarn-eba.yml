name: Diagnose Frühwarn-Check EBA CIR

on:
  push:
    paths:
      - '.github/workflows/diagnose-fruehwarn-eba.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Produktiven EBA-Bestand auf Deutsche Bank prüfen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          p=Path('pages/projekt-fruehwarn-check/data/records.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          rows=[r for r in data.get('records',[]) if r.get('source_id')=='eba-credit-institutions']
          db=[r for r in rows if 'deutsche bank' in str(r.get('name','')).casefold()]
          de=[r for r in db if r.get('country')=='DE']

          out=[]
          out.append(f'eba_credit_institutions={len(rows)}\n')
          out.append(f'deutsche_bank_all={len(db)}\n')
          out.append(f'deutsche_bank_de={len(de)}\n')
          for r in de[:20]:
              keep={k:r.get(k) for k in [
                  'name','aliases','entity_code','lei','country','city','national_reference',
                  'status','authorization_history','competent_authority_code','source_url','summary_de','match_terms'
              ]}
              out.append(json.dumps(keep,ensure_ascii=False,indent=2)+'\n')

          if len(rows)<3000 or not de:
              raise SystemExit('Produktiver EBA-CIR-Bestand unvollständig')

          Path('pages/projekt-fruehwarn-check/data/eba-cir-diagnostic.txt').write_text(''.join(out),encoding='utf-8')
          PY
      - name: Diagnose speichern
        run: |
          git config user.name "FSA Frühwarn-Diagnose"
          git config user.email "actions@github.com"
          git add pages/projekt-fruehwarn-check/data/eba-cir-diagnostic.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Frühwarn-Check: produktiven EBA CIR Treffer prüfen"
          git pull --rebase
          git push
