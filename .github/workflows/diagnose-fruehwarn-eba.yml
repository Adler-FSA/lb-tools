name: Diagnose Frühwarn-Check EBA Download

on:
  push:
    paths:
      - '.github/workflows/diagnose-fruehwarn-eba.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: EBA Download-Endpunkt untersuchen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, requests, urllib.parse
          from pathlib import Path

          out=[]
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Akademie Fruehwarn-Check)','Accept':'*/*'})
          root='https://euclid.eba.europa.eu/register/pir/registerDownload'
          r=s.get(root,timeout=30)
          out.append(f'ROOT status={r.status_code} type={r.headers.get("content-type")} len={len(r.content)}\n')
          scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)',r.text,re.I)
          out.append('scripts='+repr(scripts)+'\n')

          for src in scripts:
            jsurl=urllib.parse.urljoin('https://euclid.eba.europa.eu/register/',src)
            j=s.get(jsurl,timeout=45)
            txt=j.text
            if 'registerDownload' not in txt and '/api/' not in txt and 'download' not in txt.lower():
              continue
            out.append(f'\n### {jsurl} size={len(txt)}\n')
            strings=re.findall(r'["\']([^"\']{3,260})["\']',txt)
            interesting=[]
            for v in strings:
              low=v.lower()
              if any(k in low for k in ['registerdownload','/api/','download','export','json','pir/','register-file']):
                if v not in interesting: interesting.append(v)
            out.append('INTERESTING STRINGS:\n'+'\n'.join(interesting[:500])+'\n')
            for pat in ['registerDownload','/api/','downloadFile','fileDownload','responseType','blob']:
              for m in list(re.finditer(re.escape(pat),txt,re.I))[:40]:
                a=max(0,m.start()-350); b=min(len(txt),m.end()+500)
                out.append(f'CTX {pat}: '+re.sub(r'\s+',' ',txt[a:b])+'\n')

          Path('pages/projekt-fruehwarn-check/data/eba-diagnostic.txt').write_text(''.join(out),encoding='utf-8')
          PY
      - name: Diagnose speichern
        run: |
          git config user.name "FSA Frühwarn-Diagnose"
          git config user.email "actions@github.com"
          git add pages/projekt-fruehwarn-check/data/eba-diagnostic.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Frühwarn-Check: EBA API-Pfad diagnostizieren"
          git push
