name: Diagnose Frühwarn-Check EBA Download

on:
  push:
    paths:
      - '.github/workflows/diagnose-fruehwarn-eba.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: EBA Institutsblock prüfen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, io, json, requests, zipfile
          from pathlib import Path

          meta_url='https://euclid.eba.europa.eu/register/api/filemetadata'
          s=requests.Session(); s.headers.update({'User-Agent':'Akademie-Fruehwarn-Check/1.0','Accept':'application/json,*/*'})
          meta=s.get(meta_url,timeout=30).json()
          url=meta['golden_copy_path_context']+meta['latest_version_relative_zip_path']
          raw=s.get(url,timeout=120).content
          digest=hashlib.sha256(raw).hexdigest()
          if digest.lower()!=str(meta.get('sha256_hash','')).lower(): raise SystemExit('SHA256 mismatch')
          out=[f'metadata={json.dumps(meta,ensure_ascii=False)}\n']
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
            name=next(i.filename for i in z.infolist() if i.filename.lower().endswith('.json'))
            data=json.loads(z.read(name).decode('utf-8-sig'))
            out.append(f'TOP type={type(data).__name__} len={len(data) if hasattr(data,"__len__") else "?"}\n')
            if isinstance(data,list):
              for idx,item in enumerate(data):
                out.append(f'INDEX {idx}: type={type(item).__name__}')
                if hasattr(item,'__len__'): out.append(f' len={len(item)}')
                out.append('\n')
                if isinstance(item,dict):
                  out.append(' keys='+repr(list(item.keys())[:100])+'\n')
                  out.append(' sample='+json.dumps(item,ensure_ascii=False)[:12000]+'\n')
                elif isinstance(item,list):
                  for j,x in enumerate(item[:3]):
                    out.append(f'  CHILD {j}: type={type(x).__name__}')
                    if hasattr(x,'__len__'): out.append(f' len={len(x)}')
                    out.append('\n')
                    if isinstance(x,dict):
                      out.append('   keys='+repr(list(x.keys())[:120])+'\n')
                      out.append('   sample='+json.dumps(x,ensure_ascii=False)[:12000]+'\n')
                    elif isinstance(x,list) and x:
                      out.append(f'   GRANDCHILD type={type(x[0]).__name__} len={len(x)}\n')
                      out.append('   sample='+json.dumps(x[0],ensure_ascii=False)[:12000]+'\n')
          Path('pages/projekt-fruehwarn-check/data/eba-diagnostic.txt').write_text(''.join(out),encoding='utf-8')
          PY
      - name: Diagnose speichern
        run: |
          git config user.name "FSA Frühwarn-Diagnose"
          git config user.email "actions@github.com"
          git add pages/projekt-fruehwarn-check/data/eba-diagnostic.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Frühwarn-Check: EBA Institutsblock prüfen"
          git push
