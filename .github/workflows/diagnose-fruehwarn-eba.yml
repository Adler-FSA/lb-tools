name: Diagnose Frühwarn-Check EBA Download

on:
  push:
    paths:
      - '.github/workflows/diagnose-fruehwarn-eba.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: EBA API-Konstanten exakt auslesen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, requests, json
          from pathlib import Path

          js='https://euclid.eba.europa.eu/register/main.0f59f6811f5cb8c0bd29.js'
          txt=requests.get(js,headers={'User-Agent':'Mozilla/5.0'},timeout=45).text
          out=[]

          # Exakte Konstantenzuweisungen global suchen.
          patterns=[
            r'API_BASE_URL\s*[:=]\s*["\']([^"\']+)',
            r'CIR_API_BASE_URL\s*[:=]\s*["\']([^"\']+)',
            r'API_BASE_URL[^,;}]{0,250}',
            r'CIR_API_BASE_URL[^,;}]{0,250}'
          ]
          for pat in patterns:
            out.append(f'PATTERN {pat}\n')
            vals=[]
            for m in re.finditer(pat,txt,re.I):
              vals.append(m.group(1) if m.lastindex else m.group(0))
            out.extend(v+'\n' for v in vals[:50])

          # Alle exakten Moduldefinitionen von AytR finden.
          for pat in [r'AytR:function\([^)]*\)\{', r'["\']AytR["\']:function\([^)]*\)\{']:
            out.append(f'MODULE PATTERN {pat}\n')
            for m in list(re.finditer(pat,txt))[:10]:
              out.append(re.sub(r'\s+',' ',txt[m.start():m.start()+12000])+'\n')

          # URL-Literale aus dem Bundle; auf EUCLID/EBA begrenzen.
          urls=[]
          for u in re.findall(r'https?://[^"\'\\\s]+',txt):
            u=u.rstrip('),};]')
            if ('eba.europa.eu' in u or 'euclid' in u) and u not in urls:
              urls.append(u)
          out.append('URLS\n'+'\n'.join(urls)+'\n')

          Path('pages/projekt-fruehwarn-check/data/eba-diagnostic.txt').write_text(''.join(out),encoding='utf-8')
          PY
      - name: Diagnose speichern
        run: |
          git config user.name "FSA Frühwarn-Diagnose"
          git config user.email "actions@github.com"
          git add pages/projekt-fruehwarn-check/data/eba-diagnostic.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Frühwarn-Check: EBA API-Konstanten auslesen"
          git push
