name: Patch hotel PDF loader v6

on:
  push:
    paths:
      - '.github/workflows/patch-hotel-pdf-loader-v6.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh hotel PDF loader cache key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pages/merchant-kompass/hotel.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="./hotel-pdf-v2.js?v=5"></script>'
          new='<script src="./hotel-pdf-v2.js?v=6"></script>'
          if old not in s:
              raise SystemExit('expected hotel PDF loader v5 not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit cache-key refresh
        run: |
          git config user.name 'Adler-FSA Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add pages/merchant-kompass/hotel.html
          git commit -m 'Load named hotel PDF preview flow with fresh cache key'
          git push
