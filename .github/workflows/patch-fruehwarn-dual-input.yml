name: Patch Frühwarn-Check Dual Input

on:
  push:
    paths:
      - '.github/workflows/patch-fruehwarn-dual-input.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch page and result logic
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('pages/projekt-fruehwarn-check/index.html')
          s = index.read_text(encoding='utf-8')
          tag = '<script src="./layer-results.js"></script>'
          dual = '<script src="./dual-input.js"></script>'
          if dual not in s:
              if tag not in s:
                  raise SystemExit('layer-results script tag not found')
              s = s.replace(tag, tag + '\n' + dual, 1)
          index.write_text(s, encoding='utf-8')

          layer = Path('pages/projekt-fruehwarn-check/layer-results.js')
          x = layer.read_text(encoding='utf-8')
          old = "function update(q){if(!q)return;const seq=++identitySeq;const matchedRecords=records.filter(r=>exactMatch(r,q));const matchedTraces=traces.filter(r=>exactMatch(r,q));"
          new = "function update(q){if(!q)return;const seq=++identitySeq;const ctx=window.__fruehwarnInputContext||{};const queries=[q,ctx.company,ctx.domain].map(v=>String(v||'').trim()).filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i);const matchedRecords=records.filter(r=>queries.some(v=>exactMatch(r,v)));const matchedTraces=traces.filter(r=>queries.some(v=>exactMatch(r,v)));"
          if old in x:
              x = x.replace(old, new, 1)
          elif new not in x:
              raise SystemExit('update() search block not found')
          layer.write_text(x, encoding='utf-8')
          PY
      - name: JavaScript syntax check
        run: |
          node --check pages/projekt-fruehwarn-check/dual-input.js
          node --check pages/projekt-fruehwarn-check/layer-results.js
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/projekt-fruehwarn-check/index.html pages/projekt-fruehwarn-check/layer-results.js
          git commit -m "Frühwarn-Check: Zwei-Feld-Suche verdrahten"
          git push
