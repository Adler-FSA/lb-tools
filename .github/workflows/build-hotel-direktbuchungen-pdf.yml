name: Hotel-Telefonleitfaden PDF bereitstellen
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-hotel-direktbuchungen-pdf.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair-hotel-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: PDF-Bearbeitung vorbereiten
        run: python -m pip install --quiet pymupdf
      - name: Seite 5 ohne überlagerte Überschrift neu setzen
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import re
          from pathlib import Path
          import fitz

          pdf = Path('pages/akquise/Telefonleitfaden_Hotels.pdf')
          archive = Path('pages/hotel-telefonleitfaden/index.html')
          if not pdf.is_file() or not archive.is_file():
              raise SystemExit('Quelle oder Zieldokument fehlt')

          html = archive.read_text(encoding='utf-8')
          images = {}
          for tag in re.findall(r'<img\b[^>]*>', html, flags=re.I):
              alt = re.search(r'alt="([^"]*)"', tag)
              src = re.search(r'src="data:image/[^;]+;base64,([^"]+)"', tag)
              if not alt or not src:
                  continue
              label = alt.group(1)
              if label == 'Originallogo':
                  label += '-' + str(sum(k.startswith('Originallogo') for k in images))
              elif label != 'Originalgrafik 8: image10.png':
                  continue
              images[label] = base64.b64decode(src.group(1))

          needed = {'Originallogo-0', 'Originallogo-1', 'Originalgrafik 8: image10.png'}
          if not needed.issubset(images):
              raise SystemExit('Originalbilder für Seite 5 fehlen')

          doc = fitz.open(pdf)
          if len(doc) != 7:
              raise SystemExit('Es werden sieben Seiten erwartet')
          w, h = doc[4].rect.width, doc[4].rect.height
          sx, sy = w / 595.304, h / 841.89
          def R(x0, y0, x1, y1):
              return fitz.Rect(x0*sx, y0*sy, x1*sx, y1*sy)
          def P(x, y):
              return fitz.Point(x*sx, y*sy)

          doc.delete_page(4)
          p = doc.new_page(pno=4, width=w, height=h)
          p.insert_image(R(70.2, 40.8, 170.2, 67.1), stream=images['Originallogo-1'])
          p.insert_image(R(415.2, 32.9, 556.0, 64.7), stream=images['Originallogo-0'])
          p.insert_text(P(70.8, 91.5), 'Muster der Einladung an Hotels',
                        fontname='hebo', fontsize=13.8*sx, color=(0.73, 0.03, 0.38))
          p.insert_image(R(70.8, 106.2, 523.3, 640.0),
                         stream=images['Originalgrafik 8: image10.png'])

          texts = [
              (672.4, 'Spätestens jetzt trägst Du diesen Kontakt in Deinem KMS ein.'),
              (689.5, 'Die Anleitung dazu findest Du in der KMS-Beschreibung.'),
              (706.6, 'Auf der Folgenden Seite findest Du Standard-Schreiben für Sonderfälle.')
          ]
          for y, text in texts:
              p.insert_text(P(70.85, y), text, fontname='helv', fontsize=10*sx)
          temp = pdf.with_suffix('.new.pdf')
          doc.save(temp, garbage=4, deflate=True)
          doc.close()
          verify = fitz.open(temp)
          if len(verify) != 7 or 'Muster der Einladung an Hotels' not in verify[4].get_text():
              raise SystemExit('PDF-Nachprüfung fehlgeschlagen')
          verify.close()
          temp.replace(pdf)
          print('Bereinigte siebenseitige PDF erstellt:', pdf, pdf.stat().st_size)
          PY
      - name: Nur die PDF aktualisieren
        shell: bash
        run: |
          git config user.name "Adler-FSA PDF Build"
          git config user.email "actions@users.noreply.github.com"
          git add pages/akquise/Telefonleitfaden_Hotels.pdf
          if git diff --cached --quiet; then
            echo "PDF bereits aktuell"
            exit 0
          fi
          git commit -m "Hotel-Telefonleitfaden: Überlagerung auf Seite 5 korrigieren"
          git push
