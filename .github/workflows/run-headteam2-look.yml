name: Headteam 2 Look Runner

on:
  push:
    paths:
      - '.headteam2-look-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Token einklappen und Headteam 2 modernisieren
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          control_paths = [
              Path('pages/headteam-vorlauf/head-control-2.html'),
              Path('pages/headteam-vorlauf/head-control-2/index.html'),
          ]

          token_block = '''<details class="token-details" id="tokenDetails">
          <summary><span>GitHub-Zugang</span><span class="status" id="status" data-i18n="notConnected">Nicht verbunden</span></summary>
          <div class="token-body">
          <div class="connect"><input id="token" type="password" placeholder="Fine-Grained GitHub Token" autocomplete="off"><button class="btn" id="connect" data-i18n="connect">Verbinden & laden</button></div>
          <div class="tokenline"><label><input id="remember" type="checkbox" checked> <span data-i18n="remember">Token auf diesem Gerät speichern</span></label><button class="btn light" id="removeToken" data-i18n="removeToken">Gespeicherten Token entfernen</button></div>
          <div class="error" id="error"></div><div class="success" id="success"></div>
          </div>
          </details>'''

          token_css = '''
          .token-details{margin:0 0 16px;border:1px solid #d9e6e8;border-radius:14px;background:#fff;box-shadow:0 5px 18px rgba(19,34,56,.035);overflow:hidden}
          .token-details summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:12px 15px;color:var(--navy);font-size:13px;font-weight:900;background:linear-gradient(90deg,#fff,#fbffff)}
          .token-details summary::-webkit-details-marker{display:none}.token-details summary::after{content:'▾';margin-left:auto;color:var(--mint);font-size:15px;transition:.18s transform}.token-details[open] summary::after{transform:rotate(180deg)}
          .token-details .status{margin-left:8px}.token-body{padding:14px 15px;border-top:1px solid #e3ecee}
          '''

          for path in control_paths:
              text = path.read_text(encoding='utf-8')
              if 'class="token-details"' not in text:
                  pattern = r'<section class="card"><div class="head"><span data-i18n="github">GitHub-Verbindung</span><span class="status" id="status" data-i18n="notConnected">Nicht verbunden</span></div><div class="body">.*?</div></section>\s*\n<nav class="cockpit-nav">'
                  text, count = re.subn(pattern, token_block + '\n<nav class="cockpit-nav">', text, count=1, flags=re.S)
                  if count != 1:
                      raise SystemExit(f'Tokenblock nicht gefunden: {path}')
                  text = text.replace('</style></head>', token_css + '</style></head>', 1)
                  text = text.replace("const saved=localStorage.getItem(KEY);if(saved){$('#token').value=saved;load()}", "const saved=localStorage.getItem(KEY);const tokenDetails=$('#tokenDetails');if(saved){$('#token').value=saved;load()}else if(tokenDetails){tokenDetails.open=true}", 1)
                  text = text.replace("$('#status').className='status ok';showError('');render()", "$('#status').className='status ok';if($('#tokenDetails'))$('#tokenDetails').open=false;showError('');render()", 1)
                  text = text.replace("catch(e){$('#status').textContent=t('notConnected');$('#status').className='status';showError(t('loadError'))}", "catch(e){$('#status').textContent=t('notConnected');$('#status').className='status';if($('#tokenDetails'))$('#tokenDetails').open=true;showError(t('loadError'))}", 1)
              path.write_text(text, encoding='utf-8')

          path = Path('pages/headteam-vorlauf/headteam-2/index.html')
          text = path.read_text(encoding='utf-8')
          if 'id="headteam-2-dashboard-look"' not in text:
              look = '''
          <style id="headteam-2-dashboard-look">
          :root{--page:#f5fafb;--mint-strong:#00a7ad;--magenta-soft:#fff1f7}
          html,body{background:var(--page)}body{padding:0;min-height:100vh}.wrap{max-width:none;width:100%;margin:0;padding:28px 28px 42px 258px;min-height:100vh}
          .headline{align-items:center;margin:0 0 18px;padding:0}.eyebrow{color:var(--mint);font-size:11px}.headline h1{font-size:clamp(36px,4vw,54px);letter-spacing:-.025em}.headline h1::after{content:'';display:block;width:72px;height:5px;margin-top:12px;border-radius:999px;background:linear-gradient(90deg,var(--mint) 0 62%,var(--magenta) 62% 100%)}.count{border:1px solid #d9e6e8;border-radius:999px;background:#fff;padding:8px 11px;box-shadow:0 4px 14px rgba(19,34,56,.04)}
          .cockpit-nav{position:fixed;z-index:40;left:0;top:0;bottom:0;width:230px;height:auto;margin:0;padding:118px 16px 22px;display:flex;flex-direction:column;align-items:stretch;gap:8px;overflow-y:auto;overflow-x:hidden;background:#fff;border:0;border-right:1px solid #d9e6e8;box-shadow:12px 0 32px rgba(19,34,56,.045);backdrop-filter:none}
          .cockpit-nav::before{content:'HEADTEAM';position:absolute;left:20px;top:30px;right:20px;padding-bottom:18px;border-bottom:1px solid #e3ecee;color:var(--navy);font-size:19px;font-weight:950;letter-spacing:.02em}.cockpit-nav::after{content:'14 TAGE VORLAUF';position:absolute;left:20px;top:61px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.08em}
          .nav-btn{width:100%;flex:0 0 auto;border:1px solid transparent;border-radius:12px;background:transparent;color:var(--navy);padding:12px 13px;text-align:left;font-size:14px;transition:.15s ease}.nav-btn:hover{background:var(--mint-soft);border-color:#ccecee}.nav-btn.active{background:var(--mint);border-color:var(--mint);color:#fff;box-shadow:0 7px 18px rgba(0,167,173,.18)}
          .panel{min-width:0}.section-head{margin:4px 0 14px;padding:15px 18px;border:1px solid #d9e6e8;border-radius:16px;background:linear-gradient(90deg,#fff,#fbffff);box-shadow:0 6px 20px rgba(19,34,56,.04)}.section-title{font-size:22px}.section-copy{margin-top:5px!important}
          .dashboard-grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.dash-card,.mini-card,.mini-count,.team-box,.item,.access-card,.person-group{border-color:#d9e6e8;box-shadow:0 7px 24px rgba(19,34,56,.05)}.dash-card{position:relative;overflow:hidden;padding:17px}.dash-card::before{content:'';position:absolute;left:0;right:0;top:0;height:4px;background:var(--mint)}.dash-card:nth-child(even)::before{background:var(--magenta)}
          .next-card{border-color:#cdebed;background:linear-gradient(135deg,#fff 0%,#eefafa 100%);box-shadow:0 8px 25px rgba(19,34,56,.05)}.quick-btn,.download{border-color:#d5e3e5}.quick-btn:hover,.download:hover{background:var(--mint-soft)}
          .mini-dashboard{gap:12px}.mini-card,.mini-count{position:relative;overflow:hidden;padding:16px}.mini-card::before,.mini-count::before{content:'';position:absolute;left:0;right:0;top:0;height:4px;background:var(--mint)}#miniZoom .mini-card::before{background:var(--magenta)}.mini-count::before{background:var(--navy)}
          .team-quick{gap:12px}.team-box{padding:12px}.team-button{border-radius:11px;padding:10px 12px;box-shadow:0 5px 14px rgba(0,167,173,.13)}.team-box:nth-child(even) .team-button{box-shadow:0 5px 14px rgba(198,0,111,.12)}.team-line{font-size:12px;min-height:34px}
          .item{position:relative;border-radius:16px;background:#fff}.item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--mint)}.row{padding:16px 17px 16px 20px}.title{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.35}.meta{margin-top:7px}.type{display:inline-flex;border-radius:999px;background:var(--mint-soft);padding:3px 7px}.days{padding:7px 10px}.open{box-shadow:0 5px 14px rgba(0,167,173,.14)}summary{background:#fbfdfd}.detail{background:#fff}.box{background:#fbfdfd}
          .access-card,.person-group{border-radius:16px}.person-head{background:linear-gradient(90deg,var(--mint-soft),#fff)}.archive-list .item{background:#fff}
          @media(max-width:1320px){.dashboard-grid{grid-template-columns:repeat(3,1fr)}}
          @media(max-width:1050px){.wrap{padding-left:220px;padding-right:18px}.cockpit-nav{width:198px;padding-left:12px;padding-right:12px}.dashboard-grid{grid-template-columns:1fr 1fr}}
          @media(max-width:820px){.wrap{padding:14px}.cockpit-nav{position:sticky;top:0;bottom:auto;width:auto;height:auto;margin:0 -14px 16px;padding:10px 14px;flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid #d9e6e8;box-shadow:0 7px 20px rgba(19,34,56,.045)}.cockpit-nav::before,.cockpit-nav::after{display:none}.nav-btn{width:auto;white-space:nowrap;padding:9px 12px}.headline{align-items:flex-start}.mini-dashboard{grid-template-columns:1fr 1fr}.mini-count{grid-column:1/-1}.team-quick{grid-template-columns:1fr 1fr}}
          @media(max-width:560px){.wrap{padding:10px}.cockpit-nav{margin:0 -10px 14px;padding-left:10px;padding-right:10px}.dashboard-grid,.mini-dashboard,.team-quick{grid-template-columns:1fr}.mini-count{grid-column:auto}.headline{flex-direction:column;gap:10px}.count{white-space:normal}.row{grid-template-columns:1fr}.row>.open{grid-column:auto;grid-row:auto;justify-self:start}.days{justify-self:start}}
          </style>
          '''
              text = text.replace('</head>', look + '</head>', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Änderungen speichern und Runner entfernen
        shell: bash
        run: |
          rm -f .github/workflows/run-headteam2-look.yml .github/workflows/patch-headteam-2-look-token.yml .headteam2-look-trigger
          git config user.name "FSA Head Control"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "style: Head Control Token einklappen und Headteam 2 Look angleichen"
          git push
