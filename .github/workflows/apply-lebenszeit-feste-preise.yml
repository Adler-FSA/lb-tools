name: Apply lifetime calculator fixed club pricing

on:
  push:
    paths:
      - 'tmp/patch-lebenszeit-feste-preise.py'
      - '.github/workflows/apply-lebenszeit-feste-preise.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python tmp/patch-lebenszeit-feste-preise.py
      - name: Commit result and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tmp/patch-lebenszeit-feste-preise.py .github/workflows/apply-lebenszeit-feste-preise.yml
          git add hoersaal-liquiditybooster/07-rechner-lebenszeit.html tmp/patch-lebenszeit-feste-preise.py .github/workflows/apply-lebenszeit-feste-preise.yml
          git commit -m "Use fixed club pricing in lifetime calculator"
          git push
