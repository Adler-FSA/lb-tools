name: Patch Headteam New Entry Category Links
on:
  push:
    paths:
      - '.github/workflows/patch-headteam-new-entry-category-links.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch category quick links
        run: python scripts/patch-headteam-new-entry-category-links.py
      - name: Commit patch and cleanup
        run: |
          set -e
          rm -f scripts/patch-headteam-new-entry-category-links.py
          rm -f .github/workflows/patch-headteam-new-entry-category-links.yml
          git config user.name 'FSA Headteam'
          git config user.email 'actions@github.com'
          git add pages/headteam-vorlauf/headteam-2/index.html scripts/patch-headteam-new-entry-category-links.py .github/workflows/patch-headteam-new-entry-category-links.yml
          git commit -m 'Make new-entry category badges quick links'
          git push
