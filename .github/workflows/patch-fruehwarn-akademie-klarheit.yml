name: Frühwarn-Check – Akademie-Klarheit verankern

on:
  push:
    paths:
      - '.github/workflows/patch-fruehwarn-akademie-klarheit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Oberfläche auf neue Frühwarn-Logik ausrichten
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('pages/projekt-fruehwarn-check/index.html')
          s=p.read_text(encoding='utf-8')
          reps={
          "Frühwarnsystem · offizielle Spuren":"Frühwarnsystem · Akademie-Klarheit",
          "Ein Name. Drei Ebenen. Offizielle Quellen aus Deutschland, Europa und der Welt – bevor aus Werbung, Empfehlung oder Interesse eine finanzielle Entscheidung wird.":"Ein Name genügt. Die Akademie sammelt öffentliche Spuren, erkennt Versprechen und mögliche Fallstricke und zeigt, was vor dem nächsten Schritt geklärt werden sollte.",
          "Unabhängig prüfen. Offizielle Spuren sichtbar machen. Selbst entscheiden.":"Verstehen. Risiken sichtbar machen. Souverän entscheiden.",
          "Offizielle Quellen zuerst":"Öffentliche Spuren verstehen",
          "Behörden, Register und Justiz statt Gerüchte.":"Website, Werbung, Vertrieb und belegbare Außenwelt zusammenführen.",
          "Keine Vorverurteilung":"Akademie erklärt statt urteilt",
          "Ermittlung, Anklage und Urteil bleiben klar getrennt.":"Risiken und offene Fragen verständlich einordnen – ohne pauschale Freigabe oder Verurteilung.",
          "Kein Treffer ist kein Gütesiegel":"Früh erkennen statt spät reagieren",
          "Fehlende Behördenhinweise bedeuten nicht automatisch Seriosität.":"Warnzeichen können sichtbar sein, bevor Behörden oder Medien ein Projekt aufgreifen.",
          "Ergebnis des Frühwarn-Checks":"Offizielle Quellen & Registerspuren",
          "Ergebnisse nach Prüfbereich":"Vertiefende Quellen- & Prüfhinweise",
          "Jeder Bereich zeigt den Stand der tatsächlich angeschlossenen Quellen zur aktuellen Eingabe.":"Diese Ebene ergänzt die Akademie-Auswertung mit Identitäts-, Aufsichts-, Justiz-, Status- und Werbespuren.",
          "Frühwarnsystem · official traces":"Early warning system · Academy clarity",
          "One name. Three levels. Official sources from Germany, Europe and the world – before advertising, recommendations or interest turn into a financial decision.":"One name is enough. The Academy gathers public traces, recognises promises and possible pitfalls, and shows what should be clarified before the next step.",
          "Check independently. Make official traces visible. Decide for yourself.":"Understand. Make risks visible. Decide sovereignly.",
          "Official sources first":"Understand public traces",
          "Authorities, registers and justice sources instead of rumours.":"Bring together websites, advertising, sales claims and verifiable outside evidence.",
          "No prejudgment":"Academy explains instead of judging",
          "Investigation, charge and judgment remain clearly separated.":"Explain risks and open questions clearly without blanket approval or condemnation.",
          "No result is not a seal of approval":"Detect early instead of reacting late",
          "No authority notice does not automatically mean legitimacy.":"Warning signs may be visible before authorities or media notice a project.",
          "Early warning check result":"Official sources & register traces"
          }
          for a,b in reps.items(): s=s.replace(a,b)
          if './academy-guidance.js' not in s:
              s=s.replace('<script src="./brand-resolver.js"></script>','<script src="./brand-resolver.js"></script>\n<script src="./academy-guidance.js"></script>')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'academy-guidance.js' pages/projekt-fruehwarn-check/index.html
          git config user.name "FSA Frühwarn-Check"
          git config user.email "actions@github.com"
          git add pages/projekt-fruehwarn-check/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Frühwarn-Check: Akademie-Auswertung vor Quellencheck stellen"
          git pull --rebase
          git push
