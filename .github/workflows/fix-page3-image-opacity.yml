name: Fix Page 3 gate image visibility

on:
  push:
    paths:
      - '.github/workflows/fix-page3-image-opacity.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make uploaded gate images visible
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('hoersaal-liquiditybooster/03-gast-club.html')
          s = p.read_text(encoding='utf-8')
          old = '.gate-card img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .35s}'
          new = '.gate-card img{width:100%;height:100%;object-fit:cover;display:block;opacity:1;transition:opacity .35s}'
          if old not in s:
              raise SystemExit('Expected image CSS rule not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit page fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hoersaal-liquiditybooster/03-gast-club.html
          git commit -m 'Fix Seite 3 Tor-Bilder Sichtbarkeit'
          git push
      - name: Remove temporary workflow
        run: |
          git pull --rebase
          git rm .github/workflows/fix-page3-image-opacity.yml
          git commit -m 'Remove temporary Page 3 image fix workflow'
          git push
