name: Wire lecture hall page 1 to page 2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('hoersaal-liquiditybooster/01-willkommen.html')
          s = p.read_text(encoding='utf-8')
          old_nav = '<span aria-disabled="true">02 Big Picture</span>'
          new_nav = '<a href="02-big-picture.html">02 Big Picture</a>'
          old_btn = '<span class="button disabled" aria-disabled="true" data-i18n data-de="Big Picture · Seite 2 folgt" data-en="Big Picture · Page 2 coming next">Big Picture · Seite 2 folgt</span>'
          new_btn = '<a class="button" href="02-big-picture.html" data-i18n data-de="Big Picture öffnen →" data-en="Open Big Picture →">Big Picture öffnen →</a>'
          if old_nav not in s:
              raise SystemExit('Navigation placeholder not found')
          if old_btn not in s:
              raise SystemExit('Bottom button placeholder not found')
          s = s.replace(old_nav, new_nav, 1)
          s = s.replace(old_btn, new_btn, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/wire-hoersaal-01-02.yml
          git add hoersaal-liquiditybooster/01-willkommen.html .github/workflows/wire-hoersaal-01-02.yml
          git commit -m "Connect lecture hall page 1 to Big Picture"
          git push
