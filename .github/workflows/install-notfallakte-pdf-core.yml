# second push activates the already-registered workflow
name: Install Notfallakte PDF core

on:
  push:
    paths:
      - '.github/workflows/install-notfallakte-pdf-core.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install stable PDF filename core and guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          nf = root / 'pages' / 'notfallakte'
          nf.mkdir(parents=True, exist_ok=True)

          core = r'''(()=>{
          'use strict';
          /* FSA_PDF_FILENAME_CORE_V1
             Stabiler Basisbaustein fuer browseruebergreifende PDF-Dateinamen.
             Darf von Pagination/Demo/Excel-Updates nicht ersetzt oder umgangen werden. */
          const CORE_VERSION='FSA_PDF_FILENAME_CORE_V1';
          let originalTitle=null;
          let activeFilename='';
          let restoreTimer=null;
          const safeName=s=>(String(s||'notfallakte').trim().replace(/[^a-zA-Z0-9äöüÄÖÜß_-]+/g,'-').replace(/^-+|-+$/g,'')||'notfallakte');
          const stamp=(d=new Date())=>{const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`};
          const buildFilename=({demo=false,owner='',date=new Date()}={})=>`${demo?'DEMO-':''}Notfallakte-${safeName(owner)}-${stamp(date)}.pdf`;
          function applyTitle(filename){
            activeFilename=filename;
            if(originalTitle===null) originalTitle=document.title;
            const base=filename.replace(/\.pdf$/i,'');
            document.title=base;
            document.documentElement.setAttribute('data-fsa-pdf-filename',filename);
            try{sessionStorage.setItem('fsa_notfallakte_pdf_filename',filename)}catch{}
            let meta=document.querySelector('meta[name="application-name"]');
            if(!meta){meta=document.createElement('meta');meta.name='application-name';document.head.appendChild(meta)}
            meta.content=base;
            return base;
          }
          function prepare(opts={}){
            clearTimeout(restoreTimer);
            const filename=buildFilename(opts);
            applyTitle(filename);
            return {filename,base:filename.replace(/\.pdf$/i,''),version:CORE_VERSION};
          }
          function reassert(){if(activeFilename)applyTitle(activeFilename)}
          function markPrintDialogClosed(){
            clearTimeout(restoreTimer);
            restoreTimer=setTimeout(restore,20000);
          }
          function restore(){
            clearTimeout(restoreTimer);
            if(originalTitle!==null) document.title=originalTitle;
            originalTitle=null;
            activeFilename='';
            document.documentElement.removeAttribute('data-fsa-pdf-filename');
          }
          window.addEventListener('beforeprint',reassert);
          window.NotfallaktePdfCore=Object.freeze({version:CORE_VERSION,buildFilename,prepare,reassert,markPrintDialogClosed,restore,printDelay:320});
          })();
          '''
          (nf / 'pdf-core.js').write_text(core, encoding='utf-8')

          index = nf / 'index.html'
          html = index.read_text(encoding='utf-8')
          old = '<script src="./demo-stress-test.js"></script><script src="./v08-final.js"></script>'
          new = '<script src="./demo-stress-test.js"></script><script src="./pdf-core.js"></script><script src="./v08-final.js"></script>'
          if './pdf-core.js' not in html:
              if old not in html:
                  raise SystemExit('index.html: erwartete Script-Kette nicht gefunden')
              html = html.replace(old,new,1)
              index.write_text(html, encoding='utf-8')

          v08 = nf / 'v08-final.js'
          js = v08.read_text(encoding='utf-8')
          if 'window.NotfallaktePdfCore' not in js:
              start=js.find("const pdfName=`${demoMode?'DEMO-':''}Notfallakte-${safeName(state.owner)}-${stamp()}.pdf`")
              end=js.find("setTimeout(()=>window.print(),120)",start)
              if start<0 or end<0:
                  raise SystemExit('v08-final.js: PDF-Block nicht gefunden')
              end += len("setTimeout(()=>window.print(),120)")
              replacement="const pdfCore=window.NotfallaktePdfCore;const ticket=pdfCore?pdfCore.prepare({demo:demoMode,owner:state.owner}):null;const pdfName=ticket?.filename||`${demoMode?'DEMO-':''}Notfallakte-${safeName(state.owner)}-${stamp()}.pdf`;if(!ticket)document.title=pdfName.replace(/\\.pdf$/i,'');actionBox('✓ PDF / Ausdruck angefordert','Der Druckdialog wird jetzt geöffnet. Prüfe Ziel, Seiten und Speicherort. Die Bedienmeldung selbst wird nicht mitgedruckt.',pdfName);const done=()=>{pdfCore?.markPrintDialogClosed();actionBox('PDF / Ausdruck – Vorgang beendet','Der Druckdialog wurde geschlossen. Wenn du als PDF gespeichert hast, kontrolliere die Datei jetzt an deinem gewählten Speicherort.',pdfName)};window.addEventListener('afterprint',done,{once:true});setTimeout(()=>{pdfCore?.reassert();window.print()},pdfCore?.printDelay||320)"
              js=js[:start]+replacement+js[end:]
              v08.write_text(js, encoding='utf-8')

          guard = '''name: Notfallakte PDF core guard\n\non:\n  push:\n    paths:\n      - 'pages/notfallakte/**'\n      - '.github/workflows/notfallakte-pdf-core-guard.yml'\n  pull_request:\n    paths:\n      - 'pages/notfallakte/**'\n\njobs:\n  guard:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - name: Verify permanent PDF filename core\n        shell: bash\n        run: |\n          python - <<'PY2'\n          from pathlib import Path\n          base=Path('pages/notfallakte')\n          idx=(base/'index.html').read_text(encoding='utf-8')\n          v08=(base/'v08-final.js').read_text(encoding='utf-8')\n          core=(base/'pdf-core.js').read_text(encoding='utf-8')\n          assert 'FSA_PDF_FILENAME_CORE_V1' in core, 'PDF core marker missing'\n          assert '<script src=\"./pdf-core.js\"></script>' in idx, 'pdf-core.js is not loaded by index.html'\n          assert idx.index('./pdf-core.js') < idx.index('./v08-final.js'), 'pdf-core.js must load before v08-final.js'\n          assert 'window.NotfallaktePdfCore' in v08, 'v08-final.js bypasses PDF core'\n          assert 'pdfCore.prepare({demo:demoMode,owner:state.owner})' in v08, 'PDF button does not use central filename core'\n          print('Notfallakte PDF filename core: protected')\n          PY2\n'''
          (root/'.github'/'workflows'/'notfallakte-pdf-core-guard.yml').write_text(guard,encoding='utf-8')
          (root/'blaupausen'/'PDF-DATEINAME-BASISBAUSTEIN.md').write_text('''# PDF-Dateiname – fester FSA-Basisbaustein\n\nDie Notfallakte verwendet `pages/notfallakte/pdf-core.js` als alleinige zentrale Dateinamenslogik für PDF/Druck.\n\nPflichtregeln:\n- Dateiname: `DEMO-Notfallakte-<Name>-YYYY-MM-DD-HHMM.pdf` bzw. `Notfallakte-<Name>-YYYY-MM-DD-HHMM.pdf`.\n- `pdf-core.js` muss vor `v08-final.js` geladen werden.\n- Pagination, Demo, Excel, JSON und UI dürfen die Dateinamenslogik nicht selbst ersetzen.\n- Vor `window.print()` wird der Titel erneut gesetzt; nach `afterprint` wird er bewusst verzögert restauriert.\n- Der GitHub-Workflow `notfallakte-pdf-core-guard.yml` schützt diese Regeln bei späteren Änderungen.\n''',encoding='utf-8')
          PY
      - name: Commit protected PDF core
        shell: bash
        run: |
          git config user.name "Adler-FSA Automation"
          git config user.email "actions@users.noreply.github.com"
          git add pages/notfallakte/pdf-core.js pages/notfallakte/index.html pages/notfallakte/v08-final.js .github/workflows/notfallakte-pdf-core-guard.yml blaupausen/PDF-DATEINAME-BASISBAUSTEIN.md
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Protect Notfallakte PDF filename core"
            git push
          fi
