name: Protect Notfallakte PDF core v2

on:
  push:
    paths:
      - '.github/workflows/install-notfallakte-pdf-core.yml'
      - 'pages/notfallakte/**'
      - 'blaupausen/pdf-core-canonical.js'

permissions:
  contents: write

jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce generated PDF core v2
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          nf=Path('pages/notfallakte')
          canonical=Path('blaupausen/pdf-core-canonical.js')
          core=nf/'pdf-core.js'
          exporter=nf/'pdf-document-export.js'
          index=nf/'index.html'
          v08=nf/'v08-final.js'
          if not canonical.exists(): raise SystemExit('SCHUTZSTOPP: kanonischer PDF-Core fehlt')
          wanted=canonical.read_text(encoding='utf-8')
          if 'FSA_PDF_CORE_V2' not in wanted or 'window.print=generatedPrint' not in wanted:
              raise SystemExit('SCHUTZSTOPP: kanonischer PDF-Core ist unvollständig')
          if not exporter.exists() or 'FSA_PDF_DOCUMENT_EXPORT_V1' not in exporter.read_text(encoding='utf-8'):
              raise SystemExit('SCHUTZSTOPP: echte PDF-Dokumentengine fehlt')
          if not core.exists() or core.read_text(encoding='utf-8')!=wanted:
              core.write_text(wanted,encoding='utf-8')
          html=index.read_text(encoding='utf-8')
          if './pdf-core.js' not in html or './v08-final.js' not in html:
              raise SystemExit('SCHUTZSTOPP: PDF-Core oder V08-Script fehlt in index.html')
          if html.index('./pdf-core.js')>html.index('./v08-final.js'):
              raise SystemExit('SCHUTZSTOPP: pdf-core.js muss vor v08-final.js geladen werden')
          js=v08.read_text(encoding='utf-8')
          if 'pdfCore.prepare({demo:demoMode,owner:state.owner})' not in js or 'window.print()' not in js:
              raise SystemExit('SCHUTZSTOPP: V08-PDF-Aufruf wurde strukturell verändert')
          print('PDF-Core V2 + echte Dokumentengine geschützt ✓')
          PY
      - name: Commit repair if required
        shell: bash
        run: |
          git config user.name "Adler-FSA Automation"
          git config user.email "actions@users.noreply.github.com"
          git add pages/notfallakte/pdf-core.js
          if git diff --cached --quiet; then
            echo "PDF core v2 already protected"
          else
            git commit -m "Restore protected Notfallakte PDF core v2"
            git push
          fi
