name: Apply lifetime calculator community step cleanup

on:
  push:
    paths:
      - 'tmp/patch-lebenszeit-community-step.py'
      - '.github/workflows/apply-lebenszeit-community-step.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python tmp/patch-lebenszeit-community-step.py
      - name: Commit result and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tmp/patch-lebenszeit-community-step.py .github/workflows/apply-lebenszeit-community-step.yml
          git add hoersaal-liquiditybooster/07-rechner-lebenszeit.html tmp/patch-lebenszeit-community-step.py .github/workflows/apply-lebenszeit-community-step.yml
          git commit -m "Clarify marketplace cashback in lifetime calculator"
          git push
