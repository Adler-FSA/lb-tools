name: Projekt-Check – Aktuellen Testfall einmalig auswerten

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/projekt-check-backfill-evaluation-current.yml'

permissions:
  contents: write

jobs:
  evaluate-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bestehenden Testfall auswerten
        run: python projekt-check-engine/core/run_evaluation.py --case-id PCA-20260825-NN0U4DO7
      - name: Auswertungsstand speichern
        run: |
          git config user.name "FSA Projekt-Check"
          git config user.email "actions@github.com"
          git add data/projekt-check/cases/PCA-20260825-NN0U4DO7
          git commit -m "Projekt-Check: U-Center Primärquellen-Auswertung nachziehen"
          git pull --rebase origin main
          git push origin HEAD:main
