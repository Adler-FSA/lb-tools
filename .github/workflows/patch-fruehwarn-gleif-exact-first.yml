name: Patch Frühwarn-Check GLEIF Legal Forms

# trigger revision 2
on:
  push:
    paths:
      - '.github/workflows/patch-fruehwarn-gleif-exact-first.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch GLEIF legal-name matching
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('pages/projekt-fruehwarn-check/layer-results.js')
          s=p.read_text(encoding='utf-8')
          helper=r'''function canonicalLegalName(v){
let s=String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
s=s.replace(/gesellschaft mit beschrankter haftung/g,' gmbh ')
.replace(/aktiengesellschaft/g,' ag ')
.replace(/societe anonyme/g,' sa ')
.replace(/public limited company/g,' plc ')
.replace(/private limited company/g,' ltd ')
.replace(/limited liability company/g,' llc ')
.replace(/company limited/g,' ltd ')
.replace(/co\.?\s*,?\s*ltd\.?/g,' ltd ')
.replace(/s\.?\s*a\.?/g,' sa ')
.replace(/s\.?\s*r\.?\s*o\.?/g,' sro ')
.replace(/[^a-z0-9]+/g,' ')
.replace(/\s+/g,' ')
.trim();
return s;
}'''
          if 'function canonicalLegalName' not in s:
              marker='function rawComparable(v){'
              idx=s.find(marker)
              if idx<0: raise SystemExit('rawComparable marker not found')
              s=s[:idx]+helper+'\n'+s[idx:]
          new_func=r'''async function lookupGLEIF(q){
const cacheKey='legalform-v2|'+canonicalLegalName(q);
if(gleifCache.has(cacheKey))return gleifCache.get(cacheKey);
const terms=queryTerms(q);
let reached=false;
let lastError=null;
const dedupe=list=>{const out=[];const seen=new Set();for(const c of list){const lei=c?.item?.attributes?.lei||c?.item?.id||'';const key=lei||rawComparable(c?.item?.attributes?.entity?.legalName?.name||'')+'|'+String(c?.item?.attributes?.entity?.jurisdiction||'');if(seen.has(key))continue;seen.add(key);out.push(c);}return out;};
const exactEquivalent=[];
for(const term of terms){
  try{
    const rows=await exactNameCandidates(term);
    reached=true;
    for(const item of rows){
      const legal=item?.attributes?.entity?.legalName?.name||'';
      if(canonicalLegalName(legal)===canonicalLegalName(term))exactEquivalent.push({item,term,score:130});
    }
  }catch(e){lastError=e;}
}
let exactUnique=dedupe(exactEquivalent);
if(exactUnique.length===1){const value={status:'match',record:normalizeGleif(exactUnique[0].item,exactUnique[0].term)};gleifCache.set(cacheKey,value);return value;}
if(exactUnique.length>1){const active=exactUnique.filter(x=>String(x?.item?.attributes?.entity?.status||'').toUpperCase()==='ACTIVE'&&String(x?.item?.attributes?.registration?.status||'').toUpperCase()==='ISSUED');if(active.length===1){const value={status:'match',record:normalizeGleif(active[0].item,active[0].term)};gleifCache.set(cacheKey,value);return value;}const value={status:'ambiguous',candidates:exactUnique.slice(0,5).map(x=>normalizeGleif(x.item,x.term))};gleifCache.set(cacheKey,value);return value;}
const fuzzyHits=[];
for(const term of terms){
  try{
    const fuzzy=await fuzzyCandidates(term);
    reached=true;
    for(const completion of fuzzy.slice(0,10)){
      const item=await fullRecordFromCompletion(completion);
      if(!item)continue;
      const legal=item?.attributes?.entity?.legalName?.name||'';
      const equivalent=canonicalLegalName(legal)===canonicalLegalName(term);
      const recordScore=Math.max(0,...gleifNameCandidates(item).map(n=>scoreName(n,term)));
      fuzzyHits.push({item,term,score:equivalent?130:recordScore,equivalent});
    }
  }catch(e){lastError=e;}
}
if(!reached&&lastError)throw lastError;
const unique=dedupe(fuzzyHits).sort((a,b)=>b.score-a.score);
const equivalents=unique.filter(x=>x.equivalent);
if(equivalents.length===1){const value={status:'match',record:normalizeGleif(equivalents[0].item,equivalents[0].term)};gleifCache.set(cacheKey,value);return value;}
if(equivalents.length>1){const active=equivalents.filter(x=>String(x?.item?.attributes?.entity?.status||'').toUpperCase()==='ACTIVE'&&String(x?.item?.attributes?.registration?.status||'').toUpperCase()==='ISSUED');if(active.length===1){const value={status:'match',record:normalizeGleif(active[0].item,active[0].term)};gleifCache.set(cacheKey,value);return value;}const value={status:'ambiguous',candidates:equivalents.slice(0,5).map(x=>normalizeGleif(x.item,x.term))};gleifCache.set(cacheKey,value);return value;}
const ambiguous=unique.filter(x=>x.score>=82).slice(0,5);
const value=ambiguous.length?{status:'ambiguous',candidates:ambiguous.map(x=>normalizeGleif(x.item,x.term))}:{status:'none'};
gleifCache.set(cacheKey,value);
return value;
}'''
          pattern=r'async function lookupGLEIF\(q\)\{.*?\nfunction renderGleifIdentity'
          ns,n=re.subn(pattern,new_func+'\nfunction renderGleifIdentity',s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'lookupGLEIF replacement count={n}')
          p.write_text(ns,encoding='utf-8')
          PY
      - name: JavaScript syntax check
        run: node --check pages/projekt-fruehwarn-check/layer-results.js
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/projekt-fruehwarn-check/layer-results.js
          git commit -m "Frühwarn-Check: GLEIF Rechtsformen eindeutig abgleichen"
          git push
