name: Akademie Research Engine – KryptoSavings Test

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Projektname, Domain oder Referral-Link"
        required: false
        default: "KryptoSavings"
  push:
    paths:
      - "research-engine/engine.py"
      - "research-engine/requirements.txt"
      - "research-engine/tests/**"
      - ".github/workflows/research-engine-kryptosavings-test.yml"
  pull_request:
    paths:
      - "research-engine/engine.py"
      - "research-engine/requirements.txt"
      - "research-engine/tests/**"
      - ".github/workflows/research-engine-kryptosavings-test.yml"

permissions:
  contents: write

jobs:
  research-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python-Abhängigkeiten installieren
        id: deps
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install -r research-engine/requirements.txt pytest

      - name: Chromium für Browser-Fallback installieren
        id: browser
        continue-on-error: true
        run: python -m playwright install chromium

      - name: Regressionstests
        id: tests
        continue-on-error: true
        run: python -m pytest -q research-engine/tests

      - name: Live-Recherche ausführen
        id: live
        continue-on-error: true
        shell: bash
        env:
          INPUT_QUERY: ${{ github.event.inputs.query }}
        run: |
          QUERY="${INPUT_QUERY:-KryptoSavings}"
          echo "Recherche: $QUERY"
          python research-engine/engine.py "$QUERY" --output research-engine/output/kryptosavings-live.json

      - name: Klaus-Prüfpunkte – nur Projektname
        id: klaus
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('research-engine/output/kryptosavings-live.json').read_text(encoding='utf-8'))
          assert data.get('status') == 'ok', data.get('status')

          ctx = data['context']
          ana = data['analysis']
          assert ctx.get('input_kind') == 'name', ctx
          assert ctx.get('project_name') == 'KryptoSavings', ctx
          assert ctx.get('domain') == 'kryptosavings.com', ctx
          assert ana.get('max_yield_percentage') == 23.0, ana.get('max_yield_percentage')
          assert ana.get('max_commission_percentage') == 30.0, ana.get('max_commission_percentage')
          assert ana.get('detected', {}).get('referral') is True

          urls = [p.get('url', '') for p in ana.get('pages', [])]
          assert any('/affiliate' in u for u in urls), urls
          assert any('/strategy' in u for u in urls), urls
          print('Klaus-Test OK: kryptosavings.com | 23% APY | 30% Provision | Referral erkannt')
          PY

      - name: Diagnose schreiben
        if: always()
        env:
          DEPS: ${{ steps.deps.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          LIVE: ${{ steps.live.outcome }}
          KLAUS: ${{ steps.klaus.outcome }}
        run: |
          mkdir -p research-engine/output
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          status={
            'generated_at': datetime.now(timezone.utc).isoformat(),
            'dependencies': os.environ.get('DEPS'),
            'chromium': os.environ.get('BROWSER'),
            'tests': os.environ.get('TESTS'),
            'live_research': os.environ.get('LIVE'),
            'klaus_checks': os.environ.get('KLAUS'),
          }
          p=Path('research-engine/output/test-status.json')
          p.write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(status)
          PY

      - name: Ergebnisse im Repo sichern
        if: always() && github.event_name != 'pull_request'
        run: |
          git config user.name "Akademie Research Engine"
          git config user.email "actions@github.com"
          git add research-engine/output/test-status.json
          if [ -f research-engine/output/kryptosavings-live.json ]; then
            git add research-engine/output/kryptosavings-live.json
          fi
          if git diff --cached --quiet; then
            echo "Keine Änderung am Testergebnis."
            exit 0
          fi
          git commit -m "Research Engine: Testdiagnose aktualisieren"
          git pull --rebase
          git push
