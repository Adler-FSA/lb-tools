name: Akademie Research Engine – KryptoSavings Test

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Projektname, Domain oder Referral-Link"
        required: false
        default: "KryptoSavings"
  push:
    paths:
      - "research-engine/engine.py"
      - "research-engine/requirements.txt"
      - "research-engine/tests/**"
      - ".github/workflows/research-engine-kryptosavings-test.yml"
  pull_request:
    paths:
      - "research-engine/engine.py"
      - "research-engine/requirements.txt"
      - "research-engine/tests/**"
      - ".github/workflows/research-engine-kryptosavings-test.yml"

permissions:
  contents: write

jobs:
  research-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python-Abhängigkeiten installieren
        id: deps
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install -r research-engine/requirements.txt pytest

      - name: Chromium für Browser-Fallback installieren
        id: browser
        continue-on-error: true
        run: python -m playwright install chromium

      - name: Regressionstests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p research-engine/output
          set -o pipefail
          python -m pytest -q research-engine/tests 2>&1 | tee research-engine/output/pytest-last.log

      - name: Live-Recherche ausführen
        id: live
        continue-on-error: true
        shell: bash
        env:
          INPUT_QUERY: ${{ github.event.inputs.query }}
        run: |
          QUERY="${INPUT_QUERY:-KryptoSavings}"
          echo "Recherche: $QUERY"
          python research-engine/engine.py "$QUERY" --output research-engine/output/kryptosavings-live.json

      - name: Klaus-Prüfpunkte – vollständiger Website-Rohresearch
        id: klaus
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          data = json.loads(Path('research-engine/output/kryptosavings-live.json').read_text(encoding='utf-8'))
          assert data.get('status') == 'ok', data.get('status')

          ctx = data['context']
          ana = data['analysis']
          detected = ana.get('detected', {})

          # Start wirklich nur über den Projektnamen.
          assert ctx.get('input_kind') == 'name', ctx
          assert ctx.get('input_url') == '', ctx
          assert ctx.get('project_name') == 'KryptoSavings', ctx
          assert ctx.get('domain') == 'kryptosavings.com', ctx

          # Rendite und Vertrieb fachlich getrennt.
          assert ana.get('max_yield_percentage') == 23.0, ana.get('max_yield_percentage')
          assert ana.get('max_commission_percentage') == 30.0, ana.get('max_commission_percentage')
          assert detected.get('referral') is True
          assert detected.get('guarantee') is False, detected.get('guarantee')

          # Die für den Website-Rohresearch vereinbarten Sachverhalte müssen erkennbar sein.
          for key in ('defi', 'trading', 'lockup', 'withdrawal', 'kyc', 'custody'):
              assert detected.get(key) is True, f'{key}: {detected.get(key)}'
          assert ana.get('legal_entities'), 'Kein Betreiber-/Rechtsträgerhinweis erkannt'

          urls = [p.get('url', '') for p in ana.get('pages', [])]
          paths = [(urlparse(u).path or '/').lower() for u in urls]
          assert any('affiliate' in p for p in paths), urls
          assert any('strategy' in p for p in paths), urls
          assert any('terms' in p or 'legal' in p for p in paths), urls
          assert any('risk' in p for p in paths), urls

          # Statische Assets sind keine recherchierten Seiten.
          forbidden = ('.jpg', '.jpeg', '.png', '.gif', '.webp', '.svg', '.css', '.js', '.mp4', '.webm')
          assert not any(p.endswith(forbidden) for p in paths), urls

          print('Klaus-Test OK: Name → kryptosavings.com | 23% APY | 30% Provision | Affiliate/Strategy/Terms/Risk | KYC/Custody/Withdrawal | Betreiberhinweis')
          PY

      - name: Diagnose schreiben
        if: always()
        env:
          DEPS: ${{ steps.deps.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          LIVE: ${{ steps.live.outcome }}
          KLAUS: ${{ steps.klaus.outcome }}
        run: |
          mkdir -p research-engine/output
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          pytest_log = Path('research-engine/output/pytest-last.log')
          pytest_tail = ''
          if pytest_log.is_file():
              pytest_tail = pytest_log.read_text(encoding='utf-8', errors='replace')[-12000:]

          status={
            'generated_at': datetime.now(timezone.utc).isoformat(),
            'dependencies': os.environ.get('DEPS'),
            'chromium': os.environ.get('BROWSER'),
            'tests': os.environ.get('TESTS'),
            'live_research': os.environ.get('LIVE'),
            'klaus_checks': os.environ.get('KLAUS'),
            'pytest_log_tail': pytest_tail,
          }
          p=Path('research-engine/output/test-status.json')
          p.write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(status)
          PY

      - name: Ergebnisse im Repo sichern
        if: always() && github.event_name != 'pull_request'
        run: |
          git config user.name "Akademie Research Engine"
          git config user.email "actions@github.com"
          git add research-engine/output/test-status.json
          if [ -f research-engine/output/pytest-last.log ]; then
            git add research-engine/output/pytest-last.log
          fi
          if [ -f research-engine/output/kryptosavings-live.json ]; then
            git add research-engine/output/kryptosavings-live.json
          fi
          if git diff --cached --quiet; then
            echo "Keine Änderung am Testergebnis."
            exit 0
          fi
          git commit -m "Research Engine: Testdiagnose aktualisieren"
          git pull --rebase
          git push
